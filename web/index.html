<!DOCTYPE html>
<html lang="zh" data-build-id="__BUILD_ID__">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link rel="icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="theme-color" content="#1e88e5">
    <!-- ⚠️★ 「这是 clip9 的网页版」的**身份标记**（桌面端嵌 iframe 之前要读它）。
         `content` 是**协议版本**，与 `src/services/hostBridge.ts` 的 `HOST_PROTOCOL` 一个数。
         ⚠️ 桌面端读的是**这个 HTML 源文件**（不是渲染后的 DOM），所以放在模板里就够。
         ⚠️★ 老版本的服务端没有这一行 → 桌面端探测不到 → 显示「这个站点不支持内嵌网页 ·
         请把服务器更新到 clip9」，而不是傻傻地把一个陌生页面嵌进去。改协议时要连
         `hostBridge.ts` 的 `HOST_PROTOCOL` 一起改。
         ⚠️ 这一行与 `<html data-build-id>` 都是**服务端外壳注入契约**的一部分
         （见 rust/crates/server/src/spa_shell.rs），重写前端时**形状不许改**。 -->
    <meta name="clip9-web" content="1">
    <title>clip9</title>
    <style>
        html, body { height: 100%; margin: 0; }
    </style>
</head>
<body>
    <!-- ⚠️ 挂载点 id 保持 `app` 不变：服务端外壳（spa_shell.rs）与 PWA 导航兜底都按
         现有产物形状工作，改 id 等于引入一处「改错不报错」的隐性契约破坏。 -->
    <div id="app"></div>
    <!-- ⚠️★ 部署时可改的运行时配置（`public/config.js`，产物根目录下的那一份）：
         「后端在哪」由部署方决定，所以它**不能**编进 bundle（编进去就得为每处部署重编一次）。
         ⚠️ 用**相对**地址（`./`）而不是 `/config.js`：这份前端要能部署在任意子路径下
         （服务端 `-prefix` / 静态托管的子目录），绝对路径会指到错的地方。
         ⚠️ 它在 PWA 的预缓存里被**排除**了（`vite.config.ts` 的 `globIgnores`）——
         否则托管方改了这个文件，回访用户拿到的仍然是缓存里那份旧的。
         ⚠️ 必须**排在** bundle 之前：`lib/base.ts` 在模块求值时就要读它。 -->
    <script src="./config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
