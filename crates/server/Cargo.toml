[package]
name = "clip9-server"
description = "clip9 服务端：axum HTTP + WS。lib 可被任何外壳内嵌，bin 可独立跑。"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "clip9_server"
path = "src/lib.rs"

[[bin]]
name = "clip9-server"
path = "src/bin/clip9-server.rs"

[dependencies]
clip9-protocol = { workspace = true }
clip9-core = { workspace = true }
clip9-store = { workspace = true }
clip9-actions = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
# `/text` 的 multipart 分支要它。⚠️ 别手搓 MIME 解析 —— boundary 的引号、CRLF、
# 嵌套部分都是有坑的，multer 是 axum 自己用的那个。
multer = "3.1"
# `DetermineResponseType` 要按扩展名猜 MIME（Go 用 mime.TypeByExtension）。
mime_guess = "2.0"
# 缩略图：解码 → 缩到 min(w,h)=64 → JPEG q70 → data URI。
# ⚠️ 它给二进制加几百 KB（各格式的解码器），是 OpenWrt 上体积的主要来源之一 ——
# 真要省体积时，第一刀就砍这里。默认 feature 关掉是为了不把 tiff/avif/hdr 那些冷门解码器也带上。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.23"

[dev-dependencies]
# 端到端测试要一个真实的 store 落在临时目录里（分享记录要跨请求存活）。
tempfile = "3"
