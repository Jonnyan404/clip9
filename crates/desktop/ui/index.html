<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>clip9</title>
<style>
/*
  设计令牌沿用 `docs/specs/desktop-client-mockup.html`（slate 色阶 + #4f8cff），
  不重新发明配色。

  ⚠️★ 这是**自己的**界面，不是 SPA 的产物（规格 §6：桌面端不打前端产物进安装包）。
  但**渲染规则要照抄 SPA 的约定**（规格 §3.6 末 + §8 审计清单那条硬要求）：
  markdown / 图片 / 文件 / 结构化内容 / 分类条 —— 那是手写 UI 唯一真实的漂移风险。

  现状：**静态骨架**（结构 + 样式），数据是占位、交互待 W3 接上。
*/
:root, :root[data-theme='light'] {
    --sidebar-bg: #eef1f6;
    --sidebar-fg: #334155;
    --sidebar-head: #0f172a;
    --sidebar-name: #1e293b;
    --sidebar-sub: #64748b;
    --sidebar-chip: #64748b;
    --sidebar-chip-border: rgba(100, 116, 139, 0.4);
    --sidebar-hover: rgba(15, 23, 42, 0.06);
    --sidebar-active: rgba(79, 140, 255, 0.14);
    --sidebar-active-border: rgba(79, 140, 255, 0.5);
    --accent: #4f8cff;
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --text: #1e293b;
    --text-2: #64748b;
    --border: rgba(148, 163, 184, 0.28);
    --danger: #e11d48;
    --ok: #10b981;
}
:root[data-theme='dark'] {
    --sidebar-bg: #0b1220;
    --sidebar-fg: #cbd5e1;
    --sidebar-head: #ffffff;
    --sidebar-name: #f1f5f9;
    --sidebar-sub: #7c8ea8;
    --sidebar-chip: #8aa0b8;
    --sidebar-chip-border: rgba(148, 163, 184, 0.28);
    --sidebar-hover: rgba(148, 163, 184, 0.12);
    --sidebar-active: rgba(79, 140, 255, 0.16);
    --sidebar-active-border: rgba(79, 140, 255, 0.45);
    --accent: #4f8cff;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #e2e8f0;
    --text-2: #94a3b8;
    --border: rgba(71, 85, 105, 0.7);
    --danger: #fb7185;
    --ok: #34d399;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--card-bg); color: var(--text);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    /* ⚠️ 桌面窗口里不该有整页滚动 —— 滚动只发生在时间线那块。 */
    overflow: hidden;
}

/* ── 标题栏 ───────────────────────────────────────────────── */
.titlebar {
    height: 38px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
}
.titlebar .t { font-size: 12px; color: var(--sidebar-sub); }
.titlebar .spacer { flex: 1; }
/* 同步开关：**桌面端独有** —— 手机上不需要「暂停剪贴板监听」这个动作 */
.sync {
    display: flex; align-items: center; gap: 7px;
    padding: 3px 9px 3px 7px; border-radius: 999px;
    border: 1px solid var(--sidebar-chip-border);
    background: color-mix(in srgb, var(--ok) 12%, transparent);
    font-size: 11.5px;
}
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
/* 「连接中」与「连不上」：状态点换色即可，别另做一套 UI。
   ⚠️ 连不上**必须看得见** —— 静默的「同步中」是这类客户端最坏的一种假象。 */
.sync.wait { background: color-mix(in srgb, var(--sidebar-sub) 14%, transparent); }
.sync.wait .dot { background: var(--sidebar-sub); }
.sync.off { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.sync.off .dot { background: var(--danger); }

.body { flex: 1; display: flex; min-height: 0; }

/* ── 侧栏 ─────────────────────────────────────────────────── */
.sidebar {
    width: 208px; flex: none; background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
}
.sidebar-head {
    padding: 12px 12px 8px; font-weight: 600; font-size: 12px;
    color: var(--sidebar-head); letter-spacing: .02em;
    display: flex; align-items: center; justify-content: space-between;
}
.sidebar-head .count { color: var(--sidebar-sub); font-weight: 400; }
.rooms { flex: 1; overflow-y: auto; padding: 2px 6px 8px; }
.room {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 7px; margin-bottom: 2px;
    border: 1px solid transparent;
}
.room:hover { background: var(--sidebar-hover); }
.room.on { background: var(--sidebar-active); border-color: var(--sidebar-active-border); }
.room .ico { font-size: 13px; opacity: .85; }
.room .nm { flex: 1; color: var(--sidebar-name); font-size: 12.5px; }
.room .ct {
    font-size: 10.5px; color: var(--sidebar-chip);
    border: 1px solid var(--sidebar-chip-border);
    border-radius: 999px; padding: 0 6px; line-height: 15px;
}
/* 方向开关：↑ 上传（可多选）/ ↓ 下载（**全局单选**）—— 见规格 §4.1 第 4 条。
   ⚠️ 下载做成单选是**有意的**：原设计靠 `find` 取第一个，用户开第二个点了没反应
   —— 那正是这个项目最忌讳的「配了不生效」。 */
.dir {
    width: 16px; text-align: center; font-size: 11px; font-weight: 700;
    color: var(--sidebar-sub); opacity: .35; cursor: default;
}
.dir.on { color: var(--accent); opacity: 1; }
.hint { padding: 2px 10px 8px; color: var(--sidebar-sub); font-size: 10.5px; line-height: 1.45; }
.sidebar-foot { padding: 8px; border-top: 1px solid var(--border); display: grid; gap: 4px; }
.sidebar-foot button {
    text-align: left; padding: 6px 8px; border-radius: 6px; cursor: default;
    border: 1px solid transparent; background: transparent;
    color: var(--sidebar-fg); font-size: 12px; font-family: inherit;
}
.sidebar-foot button:hover { background: var(--sidebar-hover); }
/* 连接诊断（服务端地址 + 上一次自检的结果）。
   ⚠️ 这是**产品界面**，不是脚手架：桌面端连的是哪台服务端、通没通，用户必须看得见
   —— 一屏「同步中」背后到底有没有在同步，是这类工具最容易骗人的地方。 */
.diag {
    padding: 0 10px 8px; color: var(--sidebar-sub); font-size: 10.5px;
    line-height: 1.45; word-break: break-all;
    /* 两行：第一行服务端地址，第二行「HTTP … · WS …」—— 两个结果**分别**显示，
       不是一个字符串谁后到谁留下（那样「看到哪一行」是随机的）。 */
    white-space: pre-line;
}

/* ── 主区 ─────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.main-head {
    height: 42px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; border-bottom: 1px solid var(--border);
}
.main-head .room-nm { font-weight: 600; }
.main-head .meta { color: var(--text-2); font-size: 12px; }
.main-head .spacer { flex: 1; }
.devices { display: flex; align-items: center; gap: 3px; color: var(--text-2); font-size: 11.5px; }
.devices .d { font-size: 13px; opacity: .75; }
.devices .d.me { opacity: 1; }

.tl { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card {
    max-width: 78%; align-self: flex-start;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 11px;
}
.card.me { align-self: flex-end; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.card .txt { white-space: pre-wrap; word-break: break-word; }
.card .ft {
    display: flex; align-items: center; gap: 5px;
    margin-top: 5px; color: var(--text-2); font-size: 10.5px;
}
.card .ft .spacer { flex: 1; }
.card .thumb {
    width: 132px; height: 88px; border-radius: 6px;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
}
.card .filerow { display: flex; align-items: center; gap: 9px; }
.card .fi { font-size: 20px; }
.card .fn { font-weight: 500; }
.card .fs { color: var(--text-2); font-size: 10.5px; }
.tag {
    border: 1px solid var(--sidebar-chip-border); border-radius: 999px;
    padding: 0 6px; font-size: 10px; color: var(--sidebar-chip);
}
.tag.auto { color: var(--accent); border-color: var(--sidebar-active-border); }

.composer { flex: none; padding: 10px 14px 12px; border-top: 1px solid var(--border); }
.composer .box { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; }
.composer .ph { color: var(--text-2); min-height: 22px; }
.composer .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.composer .spacer { flex: 1; }
.composer .lim { color: var(--text-2); font-size: 11px; }
.btn {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; font-family: inherit; cursor: default;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
    <div class="titlebar">
        <span class="t">clip9</span>
        <div class="spacer"></div>
        <!-- 同步开关：暂停 / 恢复剪贴板监听（桌面端独有）。
             ⚠️ 状态点由 `app.js` 改（连接中 / 已连接 / 连不上）—— 它现在反映**真的连接状态**。 -->
        <div class="sync wait" id="conn"><span class="dot"></span><span id="conn-text">连接中…</span></div>
    </div>

    <div class="body">
        <aside class="sidebar">
            <div class="sidebar-head"><span>房间</span><span class="count">3</span></div>
            <div class="rooms">
                <div class="room on">
                    <span class="ico">🏠</span><span class="nm">默认</span>
                    <span class="dir up on">↑</span><span class="dir dn on">↓</span><span class="ct">12</span>
                </div>
                <div class="room">
                    <span class="ico">💼</span><span class="nm">work</span>
                    <span class="dir up on">↑</span><span class="dir dn">↓</span><span class="ct">4</span>
                </div>
                <div class="room">
                    <span class="ico">🔒</span><span class="nm">家里</span>
                    <span class="dir up on">↑</span><span class="dir dn">↓</span><span class="ct">31</span>
                </div>
            </div>
            <div class="hint">↑ 上传（可多选）· ↓ 下载（<b>全局只能一个</b>）</div>
            <div class="diag" id="diag">正在自检…</div>
            <div class="sidebar-foot">
                <button>⚙ 全局设置</button>
                <button>🌐 网页版 ↗</button>
                <button>≡ 查看日志</button>
            </div>
        </aside>

        <main class="main">
            <div class="main-head">
                <span class="room-nm">默认</span>
                <span class="meta">· 12 条</span>
                <div class="spacer"></div>
                <div class="devices"><span class="d me">💻</span><span class="d">📱</span><span class="d">🖥</span>3 台在线</div>
            </div>

            <div class="tl">
                <div class="card">
                    <div class="txt">部署脚本我放在 /opt/deploy 了，先跑一遍 dry-run</div>
                    <div class="ft"><span>iPhone</span><span>·</span><span>20:41</span></div>
                </div>
                <div class="card me">
                    <div class="txt">收到，我这边也拉一下</div>
                    <div class="ft"><span class="spacer"></span><span>本机</span><span>·</span><span>20:42</span></div>
                </div>
                <div class="card">
                    <div class="thumb">🖼</div>
                    <div class="ft"><span>MacBook Pro</span><span>·</span><span>20:44</span><span class="spacer"></span><span class="tag">图片</span></div>
                </div>
                <div class="card">
                    <div class="filerow">
                        <div class="fi">📄</div>
                        <div><div class="fn">deploy.sh</div><div class="fs">3.2 KB</div></div>
                    </div>
                    <div class="ft"><span>MacBook Pro</span><span>·</span><span>20:45</span><span class="spacer"></span><span class="tag">文件</span></div>
                </div>
                <!-- 定时任务发出来的消息：服务端带 source / scheduledAt，界面要标出来
                     （那两个字段就是从 `GET /content` 的投影里来的 —— 见 specs/ws-live-only.md §0.6） -->
                <div class="card">
                    <div class="txt">今天是 2026-09-26，值班：阿岚</div>
                    <div class="ft"><span>定时任务</span><span>·</span><span>21:00</span><span class="spacer"></span><span class="tag auto">自动</span></div>
                </div>
            </div>

            <div class="composer">
                <div class="box">
                    <div class="ph">输入内容，或直接把文件拖进来…</div>
                    <div class="row">
                        <button class="btn">📎</button>
                        <button class="btn">🖼</button>
                        <span class="lim">粘贴即发送</span>
                        <div class="spacer"></div>
                        <span class="lim">0 / 4096</span>
                        <button class="btn primary">发送</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
<script src="./app.js" defer></script>
</body>
</html>
