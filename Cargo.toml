# clip9 —— 自托管的跨设备剪贴板 / 文件中转（服务端）。
#
# 依赖单向：protocol ← core ← store ← server ← { bin, client }
#            actions ← core / server / WASM
[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/actions",
    "crates/store",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["jonnyan404"]

[workspace.dependencies]
# ── 内部 crate ───────────────────────────────────────────────────────
clip9-protocol = { path = "crates/protocol" }
clip9-core = { path = "crates/core" }
clip9-actions = { path = "crates/actions" }
clip9-store = { path = "crates/store" }

# ── 外部 ─────────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── 分享 / 会话令牌的签名 ─────────────────────────────────────────────
# HMAC-SHA256 + base64url。**它是契约的一部分**：Go 侧 `share_token.go` 用的就是这一套，
# token 的字节形状（`base64url(json claims).base64url(hmac)`）与密钥派生规则都得逐字对上，
# 否则切换期间 Go 签的链接在 Rust 这边会全部失效。
# sha2 0.10 / hmac 0.12 都是 RustCrypto 的稳定线，仍在维护（选型纪律见 CONTRIBUTING §1）。
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"

axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "compression-br", "compression-zstd", "cors"] }
hyper = "1"

redb = "4.3"
# ⚠️ 用 postcard 而不是 bincode —— **bincode 已经停止维护**：
# 它的最后一个版本 3.0.0 里 `lib.rs` 全文只有 `compile_error!("https://xkcd.com/2347/")`，
# README 标题就是「Bincode is now unmaintained」（作者因被人肉骚扰而终止开发）。
# 直接写 `bincode = "3"` 会让整个 workspace 编不过，而且报错信息只有一行 xkcd 链接。
# postcard 是 bincode 官方 README 自己推荐的替代品之一，面向嵌入式/受限环境 ——
# 正好对得上 OpenWrt / Android 那两条约束。
postcard = { version = "1.1", features = ["alloc", "use-std"] }

uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
chrono = "0.4"
chrono-tz = "0.10"

thiserror = "2"
anyhow = "1"
# 动作库的提取/替换正则。选它而不是手写扫描器，是因为**模式本身是契约**：
# 同一串 source 要在 Go（RE2）、前端（JS）与这边三处逐字一致 ——
# 手写解析器一上来就把这条对不上了（细节见 crates/actions/src/actions/text.rs 的模块文档）。
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
futures-util = "0.3"

[profile.release]
# OpenWrt / Android 上体积是真约束，这里按「小」而不是「最快」调。
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
