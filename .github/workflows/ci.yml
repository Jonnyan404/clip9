name: CI

# 提交前那串门禁（`dev-docs/CONTRIBUTING.md` §2）在这之前全靠人记着跑 —— 这是它的唯一一份自动化。
#
# ⚠️★ 2026-10-13：前端产物（`rust/crates/server/static/`）**不再入库** —— 它的构建与同步
# 全部由线上执行（本机不再跑 `npm run build`）。`frontend` 作业构建 + 同步 + 上传产物，
# `rust` 作业下载它之后再编。所以两个作业**不再并行**，`rust` 需要 `frontend`。
#   · `frontend` 只管前端源码与那份产物；
#   · `rust` 只管 cargo 那套（⚠️ `cargo` 只能在 `rust/` 里跑）。
#
# ⚠️★ 「产物 vs 前端源码」**不能逐字节比构建产物**：
# `web/vite.config.ts` 每次构建都注入一个**随机** build id（故意的 —— 让 PWA 缓存失效、
# 并能核对线上跑的是哪次构建），入口 chunk 又与 SharePage chunk 互相引用对方带 hash 的文件名，
# 于是每次构建的文件名都不一样，逐字节比就是**每次必红**。所以那道判据比的是**源码指纹**
# （`tools/sync-web-assets.mjs --check`，外加产物自带的构建印章），Rust 侧那条测试守的是另一半
# （`static/` 与同步清单）。
#
# ⚠️★ 2026-10-04 起**生产前端是 `web/`（React 版）**：这个 job 编的是 `web/`，
# 入库的产物也由它同步。`web-vue3/`（Vue 版）只留作比对 —— **不再构建、不装依赖**
# （所以那个目录里 `node_modules` 是不存在的，任何 import 第三方包的脚本在那儿都跑不起来）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 前端：编得出来 + 产出一份「与当前源码一致」的产物交给 rust 作业 ──────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 装依赖（npm ci：按 lockfile 装）
        working-directory: web
        run: npm ci

      # ⚠️ `npm run build` 里已经串了 `check-contracts.mjs`（零依赖模块字节一致 / 外壳形状 /
      # PWA 放行表 / i18n 无死键 / 已删模式未复活）与 `tsc`，所以这里不用再单列一步。
      - name: 构建前端（sync-shortcuts + 契约守卫 + tsc + vite build + after-build）
        working-directory: web
        run: npm run build

      # ⚠️★ 界面上的几条跨文件约定（默认看原文还是渲染视图、动作图标那个开关的名字与
      # 四份语言文件、输入框粘文件要拦默认粘贴、快捷指令时间轴的日期清单…）**没有测试运行器**，
      # 改错一处都不报错，只会静默退化。
      #
      # ⚠️★ 2026-10-05：这一步原本跑的是 `web-vue3/scripts/check-display-semantics.mjs`，
      # 而它 `import ../src/util.js`（→ axios）—— CI 上 `web-vue3/node_modules` 不存在，
      # **那一步必挂**（本机有那个目录，所以本机一直是绿的：两边不一致的那种红）。
      # 更根本的问题是它盯的是**不再发货的源码**：判据已经搬到 `web/scripts/` 下、
      # 读 `web/src`（在跑的那份代码），Vue 那份脚本随之删除。
      - name: 界面语义静态自检
        working-directory: web
        run: node scripts/check-display-semantics.mjs

      # ⚠️★ 白板的布局映射器（`web/src/lib/whiteboard/markdown-plan.ts`）是**纯数字**逻辑：
      # 摆错了不会报错，只会让两个块叠在一起、或子树被摆到屏幕外 —— 而那在浏览器里
      # **看起来就像「用户自己拖的」**，没人会当成 bug 报上来。
      #
      # ⚠️ 这一步能直接跑 `.ts`，靠的是 Node ≥ 22.18 默认剥离类型。所以它顺带钉住一条
      # **代码约束**：`markdown-plan.ts` 只能用可擦除的语法（不许 enum / namespace /
      # 参数属性，类型导入一律 `import type`）—— 哪天有人加了，这一步会当场炸，
      # 而不是静默变成「测不了」。
      - name: 白板映射器自检
        working-directory: web
        run: node scripts/check-whiteboard-plan.mjs

      # ⚠️★ 2026-10-13：`rust/crates/server/static/` **不再入库** —— 前端产物的构建与同步
      # 全部搬到这里（本机不再跑 `npm run build`）。产物以 workflow artifact 交给下面的
      # `rust` 作业；`release.yml` / `openwrt.yml` 的编译作业用同一套命令各取一份。
      #
      # ⚠️ 先同步、再 `--check`：`--check` 在产物不存在时会直接报错，所以**顺序不能反**。
      # ⚠️ `--check` 在这里仍然有牙 —— 它比的是「dist 自带的构建印章 vs 当前源码指纹」，
      # 拦的是「构建被中途打断、同步却照做」那条路（2026-10-11 真踩过）。
      - name: 同步进服务端目录（同步 + 自查）
        run: |
          node tools/sync-web-assets.mjs
          node tools/sync-web-assets.mjs --check

      # ⚠️ 上传前**收拢成一个目录**：`upload-artifact` 是按所有 path 的最近公共祖先存相对路径的，
      #    直接把 `static/` 与 `static.sync-manifest` 两条路径传上去时那份结构容易和下载端对不上。
      - name: 收拢产物（上传用）
        run: |
          mkdir -p /tmp/web-assets
          cp -r rust/crates/server/static /tmp/web-assets/static
          cp rust/crates/server/static.sync-manifest /tmp/web-assets/static.sync-manifest

      # ⚠️★ 产物本身也要过一道：它必须是一份**真的前端**（外壳带 `data-build-id`、
      # 入口 bundle 在），而不是 `build.rs` 那个「没有内嵌前端」的占位页。
      # 这一步查的是**文件**；二进制那一侧由 release.yml / openwrt 的 `strings` 自检兜底。
      - name: 产物必须是一份真前端（不是占位页）
        run: |
          set -euo pipefail
          test -f rust/crates/server/static/index.html
          if ! grep -q 'data-build-id' rust/crates/server/static/index.html; then
            echo "::error::同步出来的 index.html 里没有 data-build-id —— 它不是一次真构建的产物"
            exit 1
          fi
          if grep -rq 'clip9-no-embedded-frontend' rust/crates/server/static/; then
            echo "::error::产物里出现了 build.rs 的占位标记 —— 前端构建没真的跑"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: web-static
          path: /tmp/web-assets/
          if-no-files-found: error

      # ⚠️★ 动作库拆成了四份文件（目录 / 零依赖实现 / 带库实现 / 桌面那份逐字节拷贝），
      # 它们之间靠**字符串名字**连着（`run: "runUpper"` 指的是另一份文件里的导出）。
      # 没有编译器看着这条线：名字写错在网页版是**装载时抛错**，在桌面侧是
      # 「动作菜单点了没反应」。判据 7 还会反过来盯「同步与本判据自己接进门禁没有」。
      - name: 动作目录与桌面那份拷贝是否一致
        run: node tools/sync-action-catalog.mjs --check

      - name: 动作库静态自检
        run: node tools/action-catalog-smoke.mjs

      # ⚠️★ `web-vue3` 与 `rust/crates/desktop/ui` **都没有测试运行器**：标识符打错一个字母的
      # 表现是「那一段功能静默失效」，走到那一行才抛 ReferenceError。
      # 2026-10-03 真发生过：`SHARE_MAX_USES_LIMIT` 只被用、从没声明 → 分享面板里
      # 填了次数点生成「什么都没发生」。判据 3 还盯着 `window.X` 的读取（属性名拼错，
      # 自由标识符扫描看不见）—— 桌面那一侧跨文件全靠 `window.I18N` / `window.ActionLibrary`。
      - name: 未声明标识符自检（两个没有测试运行器的界面）
        run: node tools/no-undef-smoke.mjs

      # ⚠️★ 分享的三个上限前后端各写一遍，不一致时服务端只是**安静地夹**一下 ——
      # 症状是「用户填了 30 分钟、实际生效 15 分钟」。这个判据把前端那两个 normalize
      # 抽出来真跑，用**服务端的数**断言行为（只比数字会漏掉「函数里没用那个常量」）。
      - name: 分享上限前后端一致自检
        run: node tools/share-limits-smoke.mjs

      # 桌面的手写界面没有测试运行器，全靠这个静态自检。它一直没接进任何门禁 —— 这里接上。
      - name: 桌面界面静态自检
        run: node tools/desktop-ui-smoke.mjs

      # ⚠️★ 「外壳 → SPA」那条缝的**两侧都没有测试运行器**：web-vue3 是手写前端，
      # android/ 那半边连编译器都没在本机跑过。而对不上的症状是**什么都没发生**
      # （注入过去的方法名是 undefined，reason 键对不上就只显示一句兜底话）。
      # 见 tools/share-bridge-smoke.mjs 抬头。
      - name: 分享桥（外壳 ↔ SPA）静态自检
        run: node tools/share-bridge-smoke.mjs

      # ⚠️★ shell / workflow 里的 `$var：`（变量后面紧跟全角标点）：bash 把那个全角字符
      # 算进变量名 —— 开了 `set -u` 就整条命令挂掉，没开就**静默**少一截消息。
      # 2026-09-28 全仓扫出 9 处。见 tools/shell-smoke.mjs 抬头。
      - name: shell 脚本静态自检
        run: node tools/shell-smoke.mjs

      # ⚠️★ Android 那两条跨文件契约（ABI 清单三处 / native 库名与 JNI 符号六处）
      # **散在 Cargo.toml / Kotlin / Gradle / proguard / jniLibs 里，没有任何编译器看着**。
      # 对不上的症状只有 `UnsatisfiedLinkError`，而它**不会说是哪一处**。
      # 见 tools/android-contract-smoke.mjs 抬头。
      - name: Android 契约静态自检
        run: node tools/android-contract-smoke.mjs

      # ⚠️★ `release.yml` ↔ `openwrt.yml` / `android.yml` 之间靠一串**字符串**连着
      # （artifact 名字、glob 前缀、矩阵条目数）。而那两个工作流**本机跑不起来**
      # （要 runner、Android SDK、Docker 里的 apk-tools），断了只有到发版那天才知道。
      # 见 tools/workflows-smoke.mjs 抬头。
      - name: 工作流跨文件约定静态自检
        run: node tools/workflows-smoke.mjs

      # ⚠️★ 发版那条链有个**没有东西强制**的约束：「先提交说明、再打 tag」。2026-10-03 的
      # `v0.1.1` 与 `v0.1.1-beta3` 就是漏在它上面（资产全传完、Release 页面空的）。
      # `tools/release.sh` 把「打 tag + 建 Release」合成一个动作并先核对说明；
      # 这条判据盯着**它那个核对还在、且真的会拦**。见 tools/release-smoke.mjs 抬头。
      - name: 发版脚本静态自检
        run: node tools/release-smoke.mjs

      # ⚠️ 文档改一半**不会让任何东西红** —— 直到有人照着它点到一个 404。
      # 这条判据只认 markdown 链接（相对路径按文件自己所在目录解析：2026-10-03 全仓 3 个
      # 死链全在 cloudflare/README.md，就是「住在子目录里却写根相对路径」这一点）。
      - name: 文档链接静态自检
        run: node tools/docs-links-smoke.mjs

      # ⚠️★ 「本机该跑哪几条」此前只活在这个文件里和人的记性里 —— 2026-10-04 因此
      # 推完才发现**前一天的 CI 一直是红的**（本机跑的那套少了 `sync-web-assets --check`
      # 与 `cargo fmt --check`，两处都真红在上面）。`tools/ci-local.mjs` 一条命令跑完这一整套，
      # 这条判据盯着**它的清单没漏**（漏了会红，见它抬头判据 A）。
      - name: 本机那条「照 ci.yml 跑一遍」的入口，清单没漏
        run: node tools/ci-local.mjs --check

  # ── Rust：fmt / clippy / test ──────────────────────────────────────
  #
  # ubuntu 上要装 Tauri 的系统库：缺 webkit2gtk 时 `tauri-build` 会直接失败，报错与「代码写错了」很像。
  rust:
    # ⚠️★ 2026-10-13：前端产物不再入库，编服务端前必须先从 `frontend` 作业把它取回来。
    # 代价是两个作业从**并行**变成**串行**（+3 分钟左右）—— 换来的是「本机不用 build 前端」。
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # ⚠️★ 这个变量让 static_files 那几条用例**不许跳过**：没有产物就 panic。
      # 不设的话，「前端作业漏了 / 产物没传到编译作业」会表现成**一片绿** ——
      # 而那正是这次改动最容易坏的地方。
      CLIP9_REQUIRE_WEB_ARTIFACT: 1
    steps:
      - uses: actions/checkout@v7

      # ⚠️★ 下载路径是 `rust/crates/server`（相对 `GITHUB_WORKSPACE`，**不受**上面那个
      # `defaults.run.working-directory` 影响）—— 产物解出来就是 `static/` 与
      # `static.sync-manifest` 两样，正好落在 `build.rs` 与那几条用例要找的地方。
      - uses: actions/download-artifact@v7
        with:
          name: web-static
          path: rust/crates/server

      - name: Tauri 的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      # 工具链与目标平台由 `rust/rust-toolchain.toml` 决定，rustup 会自动装齐。
      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # ⚠️ 别写成 `cargo test --workspace | tail -N`：管道退出码是 tail 的，前面的套件还会被截掉。
      - run: cargo test --workspace

      # 动作库是「一份 Rust 编两次」，不带默认特性的那次编的是 WASM 侧的形状，单独跑。
      - run: cargo clippy -p clip9-actions --no-default-features --all-targets -- -D warnings

      - run: cargo test -p clip9-actions --no-default-features

      # ⚠️★ 文档转换那条路（`POST /convert/{uuid}`）只在 `doc` feature 打开时才存在。
      # 不在这里跑一次的话，那个 feature **没有任何东西编译它** —— 它会慢慢长霉，
      # 而且长霉的方式最糟：**用户按文档打开它时才发现编不过**。
      #
      # 判据与上面那两条同一个道理：**两个方向都要编一次**（不带 / 带）。
      # 不带的那次由上面所有步骤覆盖（`doc` 不在 default 里）；带的那次就是这两条。
      #
      # ⚠️ 代价：这一步要编 `anydoc` 那一整棵解析器树（约 +5 分钟，二进制 +4.73 MiB）。
      # 值得 —— 它是这条能力**唯一**的编译期保证，而它在 OpenWrt 那条线上默认是关的，
      # 平时没人会碰到。
      - run: cargo clippy -p clip9-server --features doc --all-targets -- -D warnings

      - run: cargo test -p clip9-server --features doc

  # ── 提交信息：纯英文 conventional commit（`tools/check-commit-msg.mjs`）───────
  #
  # ⚠️★ 这条约定此前**不在任何门禁里**，全靠人记得手敲 `node tools/check-commit-msg.mjs`。
  # 它有过实际代价：P0 阶段有 11 条提交的正文是中文（其中一条连主题也是），
  # 还夹着两条「heredoc 没收干净」的（正文里留着 `EOF2`、标题出现两遍），
  # 直到一次专门审计才发现。**规则只是「不许做」的时候没人守得住。**
  #
  # ⚠️ 为什么单开一个 job 而不是塞进 `rust` / `frontend`：那两个都要装工具链、
  # 跑几分钟，而这一条只要 `checkout` + `node`。混在一起会让「信息写错了」这种
  # 一秒就能看出来的事，排在编译后面才报。
  #
  # ⚠️★ 事件相关的值全部先落进 `env:`，`run:` 里只出现 `$VAR` —— 这样那段 shell
  # 是**纯 shell**，可以原样抽到本机跑（`${{ }}` 模板语法在本机没法求值，
  # 混在 run 里就等于这一段永远没验过）。
  commit-msg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 要能回溯到 base 提交，浅克隆不够（`git rev-list A..B` 会算不出来）。
          fetch-depth: 0

      - name: 逐条检查本次带来的提交
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "${EVENT_NAME:-}" = "pull_request" ]; then
            range="${PR_BASE:?}..${PR_HEAD:?}"
          else
            before="${PUSH_BEFORE:-}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              # 初次推送 / 新建分支：before 是全 0，没有「上一个」可比。
              range="HEAD~1..HEAD"
            else
              range="${before}..${PUSH_SHA:?}"
            fi
          fi

          if ! git rev-list --no-merges "$range" >/dev/null 2>&1; then
            # force push 之后 before 可能已经不在历史里。退化成只查 HEAD 那一条，
            # 至少不是「全跳过」—— 而跳过会给出一个「查过了」的假信号。
            echo "::warning::算不出提交范围（${range}）—— 可能是 force push，退回只查 HEAD。"
            range="HEAD~1..HEAD"
          fi

          echo "要查的范围：${range}"
          fail=0
          # ⚠️ `--no-merges`：合并提交的信息是 git 自动生成的，不该按这条约定要求它。
          for sha in $(git rev-list --no-merges "$range"); do
            if ! git log -1 --format=%B "$sha" | node tools/check-commit-msg.mjs; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "本次带来的提交信息全部合规。"
