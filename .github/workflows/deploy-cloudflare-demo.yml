name: Deploy Cloudflare Worker (demo)

# 把一个**公开演示站**部署到 Cloudflare —— 同一份代码的第二次部署。纯手动。
#
# 为什么要单独一条（而不是给 `deploy-cloudflare.yml` 加参数）：演示站碰的是线上数据，
# 而生产那条流水线已经跑通过好几版了 —— 宁可多一份工作流，也不让「演示站的配置」
# 有可能污染生产。代价是**步骤有两份**，所以：
#   ⚠️★ 改构建 / 迁移 / 部署步骤时，`deploy-cloudflare.yml` 与这里**两处一起看**。
#   渲染配置那一段是共用的（`cloudflare/render-wrangler.mjs`），不是抄的。
#
# 和生产站的差别（全部是**配置**，代码一行不同）：
#
#   | | 生产 | 演示 |
#   |---|---|---|
#   | Worker | `clip9-worker` | `clip9-demo` |
#   | D1 / R2 | `clip9-db` / `clip9-files` | `clip9-db-demo` / `clip9-files-demo` |
#   | 单文件上限 | 大 | **3 MB**（`FILE_LIMIT=3145728`） |
#   | 访问 | 看 secret | **默认房间开放**，另有一个带密码的房间 `demo` 当示例 |
#   | 文件过期 | 看 secret | 1 小时 |
#
# ⚠️★ **为什么演示站要 3 MB**：它是公开的、谁都能往上传。3 MB 够演示（截图、小文档），
#    又不会让人把它当网盘；再配上 1 小时过期 + 每 5 分钟的定时清理，R2 用量是有上界的。
#    ⚠️ 这个上限**前端会自己显示**（Worker 通过 WS 的 `config` 事件下发 `file.limit`），
#    所以界面上会写「文件 3 MB」，超了在选文件那一步就被拦住 —— 不用改前端。
#
# ⚠️★ 需要的 secrets 与生产那条**故意不同名**（`CF_API_TOKEN_DEMO` / `CF_ACCOUNT_ID_DEMO`）：
#    演示站要部署到**另一个 Cloudflare 账号**。如果沿用生产那两个名字（或加一个
#    `|| secrets.CF_API_TOKEN` 的兜底），某天演示站的 secret 漏设了，它会**拿着生产账号的
#    令牌把演示站塞进生产账号** —— 表面一切正常，两个站从此共用一个账号。
#    所以这里没有兜底：少了就红，并且说清楚缺哪个。
#    （令牌权限：Workers Scripts:Edit、D1:Edit、Workers R2 Storage:Edit。）
#
#    演示站的其它配置写死在本文件里 —— 它们**不是秘密**（公开站的限额，人人可见），
#    藏进 secret 反而会让「演示站到底什么限额」变得查不到。

on:
  workflow_dispatch:

permissions:
  contents: read

# ⚠️ 名字集中在这里：改演示站的名字只动这三行 + 下面渲染那一处（它们是同一件事）。
env:
  WORKER_NAME: clip9-demo
  DB_NAME: clip9-db-demo
  BUCKET_NAME: clip9-files-demo
  # 3 MB。⚠️ 单位是字节，不是 MB —— 写成 3 会被当成 3 字节，谁都传不上来。
  FILE_LIMIT: '3145728'
  # ⚠️★ **总量**上限（字节）：所有未过期文件加起来不能超过它。这才是控 R2 账单的那一条 ——
  #    `FILE_LIMIT` 只管单个文件，反复传能把 10 GB-month 的免费额度填满，
  #    而填满之后不是报错，是**开始计费**。
  #    2 GiB ≈ 免费额度的 1/5，留足了「过期但还没被清理」的余量；顶满了也不用管，
  #    1 小时后自动释放（见下面 FILE_EXPIRE）。
  FILE_TOTAL_LIMIT: '2147483648'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_DEMO }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID_DEMO }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查 Cloudflare 凭据（演示账号）
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺 CF_API_TOKEN_DEMO —— 演示站要部署到**另一个** Cloudflare 账号，这个 secret 必须是那个账号的令牌（不是生产账号的）"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺 CF_ACCOUNT_ID_DEMO —— 令牌只够一个账号时 wrangler 能自己认出来，但多账号会直接失败；先补上这个更省事"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cloudflare/package-lock.json
            cloudflare/workers/package-lock.json

      # ⚠️ 与生产那条一样：用 `cloudflare/package-lock.json` 钉住的 wrangler，
      #    不用全局装的那一份（否则「本地跑什么版本」和「线上跑什么版本」是两件事）。
      - name: 装 wrangler（按 lockfile 钉住的版本）
        working-directory: cloudflare
        run: npm ci

      - name: 把 wrangler 放进 PATH
        run: echo "$GITHUB_WORKSPACE/cloudflare/node_modules/.bin" >> "$GITHUB_PATH"

      - name: 装 Worker 依赖
        working-directory: cloudflare/workers
        run: npm ci

      # ⚠️ 部署会动线上数据，红了就别往下走。它不联网：node:sqlite 当 D1、Map 当 R2。
      - name: Worker 的测试
        working-directory: cloudflare/workers
        run: bash test/run.sh

      - name: 构建前端（sync-shortcuts + 契约守卫 + tsc + vite build + after-build）
        working-directory: web
        run: |
          npm ci
          npm run build

      # ⚠️ 排除 `.gz` / `.br`：Workers Static Assets 自己会协商压缩。
      - name: 把构建产物拷成 Worker 的静态资源
        run: |
          set -euo pipefail
          rm -rf cloudflare/workers/assets
          mkdir -p cloudflare/workers/assets
          for item in web/dist/*; do
            case "$(basename "$item")" in
              *.gz|*.br) continue ;;
            esac
            cp -R "$item" cloudflare/workers/assets/
          done
          echo "assets 文件数: $(find cloudflare/workers/assets -type f | wc -l | tr -d ' ')"

      # ⚠️ R2 / D1 都按**演示站自己的名字**建 —— 与生产站完全隔离：
      #    演示站里谁也不该读得到生产房间的内容。
      - name: 准备 D1 与 R2（演示站专用）
        id: prepare
        working-directory: cloudflare/workers
        run: |
          set -euo pipefail

          # ── R2 ────────────────────────────────────────────────────────────
          # ⚠️★ 别用 `|| echo 已存在` 兜 —— 那会把**三种完全不同**的失败都说成「已存在」：
          #    ① 桶真的已经有了（正常，继续）；
          #    ② 这个账号**还没开通 R2**（去 Dashboard → R2 → Enable）；
          #    ③ 令牌没有 R2 权限。
          #    2026-10-26 第一次跑就栽在这里：日志只有一句「R2 桶已存在」，而下一句
          #    D1 的错误把人引向「D1 权限」，真正的原因被吞掉了。
          if r2_out=$(wrangler r2 bucket create "$BUCKET_NAME" 2>&1); then
            echo "R2 桶已创建：$BUCKET_NAME"
          else
            case "$r2_out" in
              *"already exists"*|*"already owned"*|*"code: 10004"*)
                echo "R2 桶已存在，继续" ;;
              *"enable R2"*|*"Enable R2"*|*"not enabled"*|*"code: 10042"*)
                echo "::error::这个账号还没开通 R2 —— 去 Dashboard → R2 → 点 Enable（免费额度够演示用），再重跑"
                printf '%s\n' "$r2_out"
                exit 1 ;;
              *)
                echo "::error::建 R2 桶失败（不是「已存在」，也不是「没开通 R2」）："
                printf '%s\n' "$r2_out"
                exit 1 ;;
            esac
          fi

          # ── D1 ────────────────────────────────────────────────────────────
          # ⚠️ 末尾 `|| true`：`d1 list` 报错或 `head` 提前关管道都会让赋值失败，
          #    而「库里还没有这个 db」正是要走创建分支的正常情况。
          d1_id=$(wrangler d1 list --json 2>/dev/null \
            | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid' \
            | head -1 || true)
          if [ -z "$d1_id" ] || [ "$d1_id" = "null" ]; then
            # ⚠️ `{}` 不能省：`$DB_NAME，` 里那个全角逗号会被 bash 当成变量名的一部分。
            echo "没有现成的 ${DB_NAME}，创建它"
            # ⚠️ 先拿到**退出码**再决定，别让 `set -e` 把我们直接甩出去（那样连 wrangler
            #    的原话都看不到，只留一句自己编的「检查权限」）。
            set +e
            d1_out=$(wrangler d1 create "$DB_NAME" 2>&1)
            create_status=$?
            set -e
            printf '%s\n' "$d1_out"
            if [ "$create_status" -ne 0 ]; then
              # ⚠️ 「已经存在」不是失败：可能是上一次跑到这里就失败了（库建好了、id 没取到，
              #    2026-10-26 正是这样），也可能是两个人同时点。这种情况继续往下走，从清单里取。
              case "$d1_out" in
                *"already exists"*|*"already owned"*|*"code: 10004"*|*"A database with that name"*)
                  echo "D1 库已经存在，从清单里取 id" ;;
                *)
                  echo "::error::建 D1 失败（退出码 ${create_status}）—— 上面是 wrangler 的原话"
                  exit 1 ;;
              esac
            fi
            # ⚠️★ **两种输出形状都要认**：老版本打 TOML 片段（`database_id = "…"`），
            #    wrangler 4.81.x 打 JSON 片段（`"database_id": "…"`）。只认 `=` 那一版在
            #    2026-10-26 第一次跑就空手而归 —— 而错误信息写的是「检查 D1: Edit 权限」，
            #    把人指去了完全错的地方（其实库已经建好了）。
            d1_id=$(printf '%s' "$d1_out" \
              | grep -oE '"database_id"[[:space:]]*:[[:space:]]*"[^"]+"|database_id[[:space:]]*=[[:space:]]*"[^"]+"' \
              | head -1 | sed -E 's/.*"([^"]+)"$/\1/' || true)
            # 再兜一层：万一输出格式又变了，按名字从清单里取（与「已存在」那条路同源）。
            if [ -z "$d1_id" ]; then
              d1_id=$(wrangler d1 list --json 2>/dev/null \
                | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid' \
                | head -1 || true)
            fi
          fi
          if [ -z "$d1_id" ] || [ "$d1_id" = "null" ]; then
            echo "::error::建完 D1 还是拿不到 id —— 看一眼上面 wrangler 的输出；必要时查令牌有没有 D1: Edit"
            wrangler d1 list --json 2>&1 | head -40 || true
            exit 1
          fi
          echo "D1 id: $d1_id"
          echo "d1_id=$d1_id" >> "$GITHUB_OUTPUT"

      # ⚠️ 渲染在**部署之前**、迁移**之后**都可以；这里放在迁移前，让配置文件先成型，
      #    万一渲染失败就什么都没动过。
      - name: 渲染 wrangler.toml（演示站的四个名字 + 限额）
        working-directory: cloudflare/workers
        env:
          D1_ID: ${{ steps.prepare.outputs.d1_id }}
        run: |
          set -euo pipefail
          node ../render-wrangler.mjs \
            --out wrangler.toml \
            --worker-name "$WORKER_NAME" \
            --db-name "$DB_NAME" \
            --db-id "$D1_ID" \
            --bucket-name "$BUCKET_NAME" \
            --set FILE_LIMIT="$FILE_LIMIT" \
            --set FILE_TOTAL_LIMIT="$FILE_TOTAL_LIMIT" \
            --set FILE_EXPIRE=3600 \
            --set HISTORY_LIMIT=50 \
            --set FILE_CLEANUP=300 \
            --set ROOM_LIST=true \
            --set AUTH_PASSWORD= \
            --set 'ROOM_AUTH_JSON={"demo":"demo123"}'

      - name: 跑 D1 迁移（远程）
        working-directory: cloudflare/workers
        run: wrangler d1 execute "$DB_NAME" --file=../d1/schema.sql --remote --yes

      # ⚠️ schema.sql 用的是 `CREATE TABLE IF NOT EXISTS`，给**已有的表**加不了列。
      #    所以这一步只对**老库**有意义（建表早于 `senderClientID` 这一列的那些）。
      - name: 补 senderClientID 列（幂等）
        working-directory: cloudflare/workers
        run: |
          set -euo pipefail
          # ⚠️★ 是 `.[0]` 不是 `[0]`：`[0]` 在 jq 里是**数组字面量**，结果永远是 `[0]`，
          #    于是「永远判定缺列」→ 对新建的库（schema.sql 里本来就有这一列）执行 ALTER
          #    → `duplicate column name` 红掉。2026-10-26 演示站第一次跑到这里就是这么红的。
          has_col=$(wrangler d1 execute "$DB_NAME" --remote --yes --json \
            --command "SELECT count(*) AS c FROM pragma_table_info('messages') WHERE name='senderClientID';" \
            | jq -r '[.. | objects | .c? // empty] | .[0] // 0')
          if [ "$has_col" = "1" ]; then
            echo "senderClientID 列已在，跳过"
            exit 0
          fi
          echo "messages 表缺 senderClientID 列，ALTER 补上"
          # ⚠️ 这一步**天生幂等**：判定与执行之间可能有人先加了列，那就撞「列已存在」——
          #    那不是失败。别让它把整条部署红掉（否则每次重跑都得人工看一眼）。
          set +e
          alter_out=$(wrangler d1 execute "$DB_NAME" --remote --yes \
            --command "ALTER TABLE messages ADD COLUMN senderClientID TEXT;" 2>&1)
          alter_status=$?
          set -e
          printf '%s\n' "$alter_out"
          if [ "$alter_status" -ne 0 ]; then
            case "$alter_out" in
              *"duplicate column name"*) echo "列其实已经在了，继续" ;;
              *) echo "::error::补列失败（退出码 ${alter_status}）—— 上面是 wrangler 的原话"; exit 1 ;;
            esac
          fi

      # ⚠️ 与生产同一条规矩：把「这个 Worker 现在开没开 *.workers.dev」照原样写回，
      #    否则每次部署都会把操作者在控制台关掉的域名重新打开。
      #    演示站**第一次**部署会拿不到状态 → 脚本按「首次」写 `true`，这正是我们要的
      #    （演示站就靠 `*.workers.dev` 那个地址访问）。
      - name: 写回 workers.dev 的当前状态（部署不表态）
        working-directory: cloudflare/workers
        run: node ../sync-workers-dev.mjs wrangler.toml

      - name: 部署 Worker
        id: deploy
        working-directory: cloudflare/workers
        run: |
          set -euo pipefail
          out="$(wrangler deploy 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          url="$(printf '%s' "$out" | grep -o 'https://[^ ]*\.workers\.dev' | head -1 || true)"
          # ⚠️ 拿不到 URL **不算失败**（自定义域、或输出格式变了都能导致），但要说出来 ——
          #    「部署成功、地址是空的」会让人以为没部署。
          if [ -z "$url" ]; then
            echo "::warning::没从 wrangler 输出里抓到 workers.dev 地址，去控制台看一眼"
          else
            echo "demo_url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: 结果
        if: always()
        env:
          DEMO_URL: ${{ steps.deploy.outputs.demo_url }}
        run: |
          set -euo pipefail
          {
            echo "### 公开演示站"
            echo ""
            if [ -n "${DEMO_URL:-}" ]; then
              echo "**地址**：[${DEMO_URL}](${DEMO_URL})"
            else
              echo "**地址**：见 Cloudflare 控制台 → Workers → \`$WORKER_NAME\`"
            fi
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| Worker | \`$WORKER_NAME\` |"
            echo "| D1 / R2 | \`$DB_NAME\` / \`$BUCKET_NAME\` |"
            echo "| 单文件上限 | 3 MB（$FILE_LIMIT 字节） |"
            echo "| 文件过期 | 1 小时（每 5 分钟清理一次） |"
            echo "| 默认房间 | 开放，无密码 |"
            echo "| 示例房间 | \`demo\` / 密码 \`demo123\` |"
          } >> "$GITHUB_STEP_SUMMARY"
