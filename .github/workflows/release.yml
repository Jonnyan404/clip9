name: Release

# 打 `v*` 标签时构建发布产物并附到 Release 上；也可以手动跑（默认只构建、不建 Release）。
#
# 产物命名（2026-09-28 定）：
#   clip9-cli-<target>.tar.gz        服务端二进制，**前端已编在里面**（一个文件丢过去就能跑）
#   clip9-desktop-<target>.<ext>     桌面端（⚠️ 还没接进来）
#   clip9-openwrt-…                  OpenWrt 包（⚠️ 还没接进来：clip9 里还没有 packaging/）
#   clip9-android-…                  Android 包（⚠️ 还没接进来：clip9 里还没有 android 工程）
#
# ⚠️★ 服务端**不需要系统库**：前端产物已编在二进制里，没有运行时要跟着走的资源 ——
# 「一个文件丢过去就能跑」是真的。所以这里只出 `-p clip9-server`：它不拉 `crates/client`
# 与 `crates/desktop`，那两条才要 GUI 库。
#
# ⚠️ 手动重跑同一个标签时，同名资产是**替换**而不是报「已存在」—— 见 `overwrite_files`。
#
# ⚠️ 包里的二进制**仍叫 `clip9-server`**，别跟着改成 clip9-cli：
# `crates/desktop/src/server_process.rs` 的 `default_binary()` 就按这个名字在
# **桌面可执行文件的同目录**里找它（那是「桌面端含服务端」的实现方式）。
# 改名的只有发布出去的**压缩包**。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建，不建 Release
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: clip9-server
  # 发布出去的包名。⚠️ 与 `BIN` 故意不同，见文件头。
  PACKAGE: clip9-cli

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # ⚠️ `cross` 走容器，目标由它自己管 —— 别在这里 `rustup target add`。
      - name: 构建（静态链接 musl）
        working-directory: rust
        run: cross build --release -p $BIN --target ${{ matrix.target }}

      - name: 打包
        working-directory: rust
        run: |
          set -euo pipefail
          name="$PACKAGE-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # ⚠️ 二进制本身不改名（见文件头）。
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.target }}
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.target }}
        working-directory: rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: 构建
        working-directory: rust
        run: cargo build --release -p $BIN --target ${{ matrix.target }}

      - name: 打包
        working-directory: rust
        run: |
          set -euo pipefail
          name="$PACKAGE-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.target }}
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.sha256
          if-no-files-found: error

  # 收口到一个 job 发 Release：并行 job 各自建 Release 会互相打架。
  publish:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # ⚠️ 手动重跑同一标签时**替换**同名资产（而不是失败在「已存在」上）。
          overwrite_files: true
