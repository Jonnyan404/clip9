name: Release

# **仅在发布 Release 时**构建并把产物传上去；也可以手动触发。
#
# on:
#   · `release: published` —— 你在 GitHub 上把 Release 发布出来的那一刻才是构建时机。
#     ⚠️★ 刻意**不挂 `push: tags`**：那样一打标签就先跑一遍，还会自己建一个 Release、
#     把自动生成的说明盖上去 —— 抢在发布动作前面动手。
#   · `workflow_dispatch` —— 手动跑。填 `tag` 就构建并传到那个 Release 上；
#     留空则只构建（当一次冒烟）。
#
# 覆盖：`overwrite_files: true`（重跑同一标签时**替换**同名资产，而不是失败在「已存在」上）。
# ⚠️ 刻意**不传 `generate_release_notes`**：那是你写的发布说明，不该被自动生成的盖掉。
#
# 产物（2026-09-28 定）：
#   clip9-cli-<target>.tar.gz                    服务端二进制，**前端已编在里面**（一个文件丢过去就能跑）
#   clip9-desktop-<target>.<dmg|deb|AppImage>    桌面端，**含服务端**（见 desktop job 的注释）
#   clip9-openwrt-… / clip9-android-…            ⚠️ 还没接（理由见 README 的「还没做」）
#
# ⚠️ 发 Release 只由最后那个 `publish` job 做：并行 job 各自建 Release 会互相打架。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建并把产物传上去的 Release 标签（例如 v0.1.0）。留空 = 只构建，不发布。
        required: false
        type: string
        default: v0.1.0-beta1

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 编译出来的那个二进制在 crate 里的名字。
  BIN: clip9-server
  # 发布出去的名字（Jonny 定的命名表：`clip9-cli` = 二进制程序）。
  PACKAGE: clip9-cli

jobs:
  # ── 命令行 / 服务端：一个静态二进制，五个平台 ────────────────────────────
  #
  # ⚠️★ 服务端**不需要系统库**：前端产物已编在二进制里，没有运行时要跟着走的资源 ——
  # 「一个文件丢过去就能跑」是真的。所以这里只出 `-p clip9-server`：它不拉 `crates/client`
  # 与 `crates/desktop`，那两条才要 GUI 库。
  #
  # ⚠️ armv7 是**硬浮点 musl**（`…musleabihf`）：armv7 的 Linux 设备实际上都是硬浮点
  # （树莓派 2/3/4 的 32 位系统、各种 ARM 路由 / NAS）；软浮点那个变体装上去跑不起来。
  # ⚠️ 这个三元组不是随手写的 —— 它和另外两个一样，**已在 `rust/rust-toolchain.toml` 的
  # `targets` 里声明**（那份清单就是这条的对照物：名字写错的话 rustup 会在构建前试图安装并失败）。
  #
  # ⚠️★ 但 armv7 这一格**有已知风险**：服务端依赖 `aws-lc-sys`（`axum-server` 的 rustls 用它做
  # TLS），而 AWS-LC 的「Platform Support」表里 armv7 **只列了 `armv7-unknown-linux-gnueabihf`
  # （glibc）**，没有 armv7 + musl 这一格（32 位 ARM 的 musl 只列到 `arm-…-musleabihf`）。
  # 也就是说第一次跑 Release 时，armv7 很可能挂在 `aws-lc-sys` 的构建上。
  #
  # 退路（代价从低到高）：
  #   ① 换成 `armv7-unknown-linux-gnueabihf` —— AWS-LC 明确支持，`cross` 也有镜像；
  #      代价是**动态链接**（设备上要有 glibc ≥ 2.31），「一个文件丢过去就能跑」这条就没了。
  #   ② 把 TLS provider 从 `aws-lc-rs` 换成 `ring` —— 那是**全平台**的改动，要单独验。
  # ⚠️ 真要动手时先**把失败信息读出来**再选，别照着这句话当成已经诊断好了。
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # ⚠️ `cross` 走容器，目标由它自己管 —— 别在这里 `rustup target add`。
      - name: 构建（静态链接 musl）
        working-directory: rust
        run: cross build --release -p $BIN --target ${{ matrix.target }}

      - name: 打包
        working-directory: rust
        run: |
          set -euo pipefail
          name="$PACKAGE-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # ⚠️ 落进包里的文件就叫 $PACKAGE（`clip9-cli`）—— 命名表说的是**程序**的名字。
          #    `$BIN` 那个名字是给桌面端的 bundle 用的（见 desktop job）。
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/$PACKAGE"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.target }}
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.target }}
        working-directory: rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: 构建
        working-directory: rust
        run: cargo build --release -p $BIN --target ${{ matrix.target }}

      - name: 打包
        working-directory: rust
        run: |
          set -euo pipefail
          name="$PACKAGE-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/$PACKAGE"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.target }}
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.sha256
          if-no-files-found: error

  # ── 桌面端：Tauri 安装包（macOS .app/.dmg、Linux .deb/AppImage）──────────
  #
  # ⚠️★ 桌面端「含服务端」靠的是把那个二进制放进包内**与主程序同一个目录、名字仍叫
  # `clip9-server`**：`crates/desktop/src/server_process.rs` 的 `default_binary()` 就在那儿
  # 按这个名字找它。落位由 `tauri.conf.json` 的 `bundle.macOS.files` /
  # `bundle.linux.{deb,appimage}.files` 写死。
  #
  # ⚠️★ 刻意**不用** `bundle.externalBin`：它会把文件名加上 `-<target-triple>` 后缀，
  # 那样 `default_binary()` 找的就是一个不存在的名字 —— 而且是**打包成功、运行时才报**。
  #
  # ⚠️ 所以这里是**两步**：先把服务端编出来、拷到配置里写死的那个暂存路径
  # （`rust/crates/desktop/binaries/clip9-server`，已 gitignore），再让 tauri 打包。
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 缺 webkit2gtk 时 `tauri-build` 会直接失败，报错与「代码写错了」很像。
      - name: Tauri 的系统依赖（Linux）
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: desktop-${{ matrix.target }}

      # ① 服务端 → 配置里写死的那个暂存路径。
      - name: 编服务端并暂存到 bundle 取件的位置
        working-directory: rust
        run: |
          set -euo pipefail
          cargo build --release -p clip9-server --target ${{ matrix.target }}
          mkdir -p crates/desktop/binaries
          cp "target/${{ matrix.target }}/release/clip9-server" crates/desktop/binaries/clip9-server

      # ② 桌面端打包。⚠️ 不传任何 release 参数：发 Release 归下面那个唯一的 publish job。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: rust/crates/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # ⚠️ 只收**能当 Release 资产的文件**：`.app` 是目录，当不了资产（它的内容在 dmg 里）。
      - name: 给产物带上 clip9-desktop 前缀
        run: |
          set -euo pipefail
          out="rust/target/desktop-release"
          mkdir -p "$out"
          base="rust/target/${{ matrix.target }}/release/bundle"
          for f in "$base"/dmg/*.dmg "$base"/deb/*.deb "$base"/appimage/*.AppImage; do
            [ -e "$f" ] || continue
            cp "$f" "$out/clip9-desktop-${{ matrix.target }}.${f##*.}"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: clip9-desktop-${{ matrix.target }}
          path: rust/target/desktop-release/*
          if-no-files-found: error

  # 收口到一个 job 传产物：并行 job 各自去动 Release 会互相打架。
  publish:
    needs: [linux, macos, desktop]
    # 发布事件当然要传；手动跑时**填了 tag 才传**（留空 = 只构建）。
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # 发布事件用它自己那个标签；手动跑用你填的那个。
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: artifacts/*
          # ⚠️ 重跑时**替换**同名资产，而不是失败在「已存在」上。
          overwrite_files: true
