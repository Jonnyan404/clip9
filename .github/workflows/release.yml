name: Release

# **仅在发布 Release 时**构建并把产物传上去；也可以手动触发。
#
# on:
#   · `release: published` —— 你在 GitHub 上把 Release 发布出来的那一刻才是构建时机。
#     ⚠️★ 刻意**不挂 `push: tags`**：那样一打标签就先跑一遍，还会自己建一个 Release、
#     把自动生成的说明盖上去 —— 抢在发布动作前面动手。
#   · `workflow_dispatch` —— 手动跑。填 `tag` 就构建并传到那个 Release 上；
#     留空则只构建（当一次冒烟）。
#
# 覆盖：`overwrite_files: true`（重跑同一标签时**替换**同名资产，而不是失败在「已存在」上）。
# ⚠️ 刻意**不传 `generate_release_notes`**：那是你写的发布说明，不该被自动生成的盖掉。
#
# 产物名（2026-09-29 定稿）：
#
#   ‼️★ **一条规则**：`v<版本>` **紧跟在 `clip9-<东西>` 之后**，其余限定词排在它后面。
#     Jonny 2026-09-29：「release 产物要么都带版本号要么都不」→ 那就**都带**（下载到本地
#     多版本分得清；而且没有任何地方依赖 `latest/download/<固定名>` 那种稳定链接）。
#     于是 `linux-x86_64` 这类词一律排在版本号**之后**。
#
#   服务端二进制（**前端已编在里面**，一个文件丢过去就能跑）：
#     `clip9-cli-v<版本>-<平台>-<架构>.tar.gz`（Windows 那份是 `.zip`）
#       `<平台>-<架构>` 只有这几种：
#         linux-x86_64 / linux-aarch64 / linux-armv7
#         macos-x86_64 / macos-aarch64
#         windows-x86_64 / windows-aarch64
#       ⚠️★ 写的是**这几个短名字**，不是 `x86_64-unknown-linux-musl` 那种三元组 ——
#       三元组只在 CI 内部给 cargo 用（矩阵里的 `target`），产物名用 `label`。
#       认这个名字的地方：`Dockerfile` 的 `wget`（**连包内那个目录名**）、homebrew 那步、
#       `docker.yml` 的预检。
#     ‼️ **不再发 `.sha256`**（Jonny 2026-09-29：「不要 sha256」）。所以那三个 job 只
#        `tar`/`zip` 一份产物，`upload-artifact` 的 path 里也不再带 `*.sha256`。
#        ⚠️ homebrew 那个 job **不受影响** —— 它一直是自己 `gh release download` 下来现算
#        sha256 的（formula/cask 里的 `sha256` 字段是**必填**，与「发不发校验文件」是两件事）。
#   桌面端（**含服务端**，见 desktop job 的注释）：
#     `clip9-desktop-v<版本>-<平台>-<架构>.<dmg|deb|AppImage|msi|exe>`
#   `clip9:…`（容器镜像）                          由 Release 里那份二进制做的，**镜像里不编译**
#   Formula/clip9.rb + Casks/clip9.rb            Homebrew tap（二进制与桌面端各一份）
#   OpenWrt 服务端包（7 个架构 / 8 个设备架构）：
#     `clip9-openwrt-v<版本>-<架构>.ipk`
#     `clip9-openwrt-apk-v<版本>-<设备架构>.apk`
#   LuCI 界面包（与架构无关）：
#     `clip9-luci-openwrt-v<版本>-all.ipk` / `clip9-luci-openwrt-apk-v<版本>-noarch.apk`
#   Android：
#     `clip9-android-v<版本>.apk`                 **合并包**（三个 ABI 都在）
#     `clip9-android-v<版本>-<abi>.apk`           **单 ABI 包**，3 个：
#                                                 arm64-v8a / armeabi-v7a / x86_64
#   ⚠️★ OpenWrt 那一组里**只有 ipk 与 apk 是资产** —— 裸二进制
#      （`clip9-server-v<版本>-<架构>`，中间产物，给 ipk/apk 两个 job 用）**不是**。
#      它**曾经真的被当资产传上去过**（v0.1.0-beta3 那次）：`publish` 的
#      `download-artifact` 原来不带 `pattern`，会把整次运行里**所有** artifact 都拖下来，
#      而 `openwrt.yml` 的 `binaries` job 正好在那一刻已经跑完了（时序问题）。
#      现在那里写死成 `clip9-*`（cli / desktop 那两套），中间产物进不来。
#   ⚠️ artifact 名（`upload-artifact` 的 `name:`）**不带版本号** —— 那是 CI 内部的通道，
#      **不是**用户看到的资产。改它要连 `download-artifact` 那边一起改，没必要。
#   ⚠️ 后面那几组由 `openwrt.yml` / `android.yml` 两个**可复用工作流**构建（它们也能单独
#      手动跑，那样会自己覆盖上传）。见下面那两个 `uses:` 与 `publish-openwrt` /
#      `publish-android`。
#
# ⚠️ 发 Release 只由 `publish` 那一个 job 做：并行 job 各自建 Release 会互相打架。
# ⚠️ 两个独立的 job **只由 `publish` 后面的 `publish-openwrt` / `publish-android` 上传** ——
#    这样它们红了也不会挡住 cli / desktop 的发布（与 `docker` / `homebrew` 同一个道理：
#    那两个也是 `needs: publish`）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建并把产物传上去的 Release 标签（例如 v0.1.0）。留空 = 只构建，不发布。
        required: false
        type: string
        default: v0.1.0-beta1

permissions:
  contents: write
  # ghcr.io 要这个；只推 Docker Hub 的话它用不上，但留着不碍事。
  packages: write

env:
  CARGO_TERM_COLOR: always
  # 编译出来的那个二进制在 crate 里的名字。
  BIN: clip9-server
  # 发布出去的名字（Jonny 定的命名表：`clip9-cli` = 二进制程序）。
  PACKAGE: clip9-cli
  # Homebrew tap 的仓库。
  TAP: ${{ github.repository_owner }}/homebrew-tap

jobs:
  # ── 先把「这次到底在给哪个 tag 干活」算出来 ──────────────────────────────
  #
  # ⚠️ 三处（publish / docker / homebrew）都要用它，而且**手动触发时没有 release 对象**
  # （那样 `github.event.release.*` 全是空）。预发布与否也要判 —— docker 的 `latest`
  # 只在正式发布时才推，手动跑时没有那个字段，只能去问 API。
  info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - id: r
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          pre="$EVENT_PRE"
          if [ -z "$pre" ] && [ -n "$tag" ]; then
            pre=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .prerelease 2>/dev/null || echo false)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=${pre:-false}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}  prerelease=${pre:-false}"

  # ── 命令行 / 服务端：一个静态二进制，五个平台 ────────────────────────────
  #
  # ⚠️★ 服务端**不需要系统库**：前端产物已编在二进制里，没有运行时要跟着走的资源 ——
  # 「一个文件丢过去就能跑」是真的。所以这里只出 `-p clip9-server`：它不拉 `crates/client`
  # 与 `crates/desktop`，那两条才要 GUI 库。
  #
  # ⚠️ armv7 是**硬浮点 musl**（`…musleabihf`）：armv7 的 Linux 设备实际上都是硬浮点
  # （树莓派 2/3/4 的 32 位系统、各种 ARM 路由 / NAS）；软浮点那个变体装上去跑不起来。
  # ⚠️ 三个三元组都**已在 `rust/rust-toolchain.toml` 的 `targets` 里声明**（那份清单就是
  # 这条的对照物：名字写错的话 rustup 会在构建前试图安装并失败）。
  #
  # ⚠️ armv7 曾担心的 `aws-lc-sys`（armv7 + musl 不在 AWS-LC 的平台表里）**实测是过的**
  # （2026-09-28，3m39s）—— 那张表是「跑没跑过他们的测试」，不是「编不编得过」。
  linux:
    # ⚠️★ 产物名里要带版本号（Jonny 2026-09-29：「release 产物要么都带版本号要么都不」）
    #    → 这一格需要 `info` 里的 tag。`info` 是秒级的（一次 `gh api`），不拖慢构建。
    needs: info
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `target` 是 cargo 要的那串；`label` 只用来拼**产物名**：`linux-x86_64` 比
        # `x86_64-unknown-linux-musl` 好念得多（Jonny 2026-09-28：「Linux 就显示 Linux」）。
        # ⚠️ 两者贴着写是为了能一眼对上；拼错了会在**用它的地方**当场炸
        #    （Dockerfile 的 `wget` 会 404、homebrew 那步会报「有产物没取到」），不会静默。
        include:
          - target: x86_64-unknown-linux-musl
            label: linux-x86_64
          - target: aarch64-unknown-linux-musl
            label: linux-aarch64
          - target: armv7-unknown-linux-musleabihf
            label: linux-armv7
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # ⚠️★ 这里必须盯一句「有没有真的进容器」：`cross` 拿不到 workspace metadata 时**不报错**，
      # 只打一行 note 就改成**在宿主机上**编。而宿主机是 ubuntu-latest，没有 musl 工具链 ——
      # 于是报出来的是 `cc-rs: failed to find tool "x86_64-linux-musl-gcc"` 这种
      # **看着像代码写错**的错。2026-09-28 撞过一次（第一次跑同一份配置却是好的，因为那次
      # metadata 那一步没失败）—— 所以那条 note 要变成硬失败。
      #
      # ⚠️ 那次 metadata 之所以会失败，是仓库里原来带着一份「把 crates.io 换成 USTC 镜像」的
      # `.cargo/config.toml`（给作者本机用的）：runner 在 Azure，连那个镜像很慢，同一次运行里
      # 宿主机那边的索引更新花了 3m55s。**那份配置已经从仓库里去掉了**（不该出现在线上），
      # 所以现在走的是 crates.io 直连；这条判据留着，防的是下次换个原因又来一遍。
      - name: 构建（静态链接 musl）
        working-directory: rust
        shell: bash
        run: |
          set -o pipefail
          cross build --release -p $BIN --target ${{ matrix.target }} 2>&1 | tee cross.log
          if grep -q 'Falling back to `cargo` on the host' cross.log; then
            echo "::error::cross 没有起容器（拿不到 workspace metadata，多半是 registry 连不上），\
          它改成在宿主机上编了 —— 宿主机上没有 musl 工具链，这一格的产物一定是错的"
            exit 1
          fi

      - name: 打包
        working-directory: rust
        run: |
          set -euo pipefail
          # ⚠️★ `v<版本>` **紧跟在 `clip9-<东西>` 之后** —— 全仓库一条规则（见文件头的
          #    产物清单）。这个名字会落进两处：tar 包的**文件名**，以及包内那个顶层目录
          #    —— `Dockerfile` 解包时认的就是后者，改这里要连它一起改。
          name="$PACKAGE-${{ needs.info.outputs.tag }}-${{ matrix.label }}"
          mkdir -p "dist/$name"
          # ⚠️ 落进包里的文件就叫 $PACKAGE（`clip9-cli`）—— 命名表说的是**程序**的名字。
          #    `$BIN` 那个名字是给桌面端的 bundle 用的（见 desktop job）。
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/$PACKAGE"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.label }}
          path: |
            rust/dist/*.tar.gz
          if-no-files-found: error

  macos:
    # ⚠️ 同 `linux`：产物名里带版本号，所以要 tag。
    needs: info
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: macos-aarch64
          - target: x86_64-apple-darwin
            label: macos-x86_64
    steps:
      - uses: actions/checkout@v7

      - run: rustup target add ${{ matrix.target }}
        working-directory: rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: 构建
        working-directory: rust
        run: cargo build --release -p $BIN --target ${{ matrix.target }}

      - name: 打包
        working-directory: rust
        run: |
          set -euo pipefail
          name="$PACKAGE-${{ needs.info.outputs.tag }}-${{ matrix.label }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/$PACKAGE"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.label }}
          path: |
            rust/dist/*.tar.gz
          if-no-files-found: error

  # ── Windows：与 macos 那个 job 同一个形状，只是产物是 `.zip` ──────────────
  #
  # ⚠️ Windows **本来就有**（Go 那边 goreleaser 的 `goos` 里一直有 `windows`），
  #    是这边写 release 时漏了。代码侧早就准备好了：`server_process.rs` 在 Windows 上找
  #    `clip9-server.exe`、`commands.rs` 有 `start` 那条分支、快捷键显示也不是 macOS 的写法。
  #
  # ⚠️★ `AWS_LC_SYS_PREBUILT_NASM=1` 在这里是**必须的**，不是优化：
  #    服务端的 TLS 走 `aws-lc-sys`（经 rustls），而它在 windows x86_64 上有 26 个 `.asm`
  #    要用 NASM 汇编。这个 crate **找不到 NASM 时是 `panic!`**（源码 `nasm_builder.rs`），
  #    不是回落 —— 而 windows runner 的镜像里**没有 NASM**。
  #    `=1` 让它改用 crate 自带的预编译 `.obj`，是官方 README 里认的两条通行路之一。
  #    ⚠️ aarch64 用不到它：那边的 21 个汇编是 `.S`，由 cl.exe 汇编。
  #    ⚠️ 别的平台这个变量不起作用（只在 `target_os == windows && target_arch == x86_64` 读）。
  windows:
    # ⚠️ 同 `linux`：产物名里带版本号，所以要 tag。
    needs: info
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ 与 Go 那边的 windows 覆盖面一致（amd64 + arm64）。
        # ⚠️★ 这两格是**推出来的、不是本机验过的**：本机是 macOS，编不了 MSVC 目标。
        #    依据是 x86_64 那 26 个 `.asm` 走 crate 自带的预编译对象（上面那个变量），
        #    aarch64 的 21 个汇编是 `.S`（由 cl.exe 汇编），而 runner 镜像里两套 MSVC
        #    工具链都在（`VC.Tools.x86.x64` / `VC.Tools.ARM64`）。
        #    **以 CI 第一次跑的结果为准** —— 挂了先看这一格，别先怀疑代码。
        include:
          - target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - target: aarch64-pc-windows-msvc
            label: windows-aarch64
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v7

      # ⚠️ 这一格与别的 job 一样用 `bash`（Windows runner 上有 Git Bash）：
      #    换成默认的 pwsh 就得把下面每一条都重写成 PowerShell，两份脚本迟早会漂。
      - run: rustup target add ${{ matrix.target }}
        working-directory: rust
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: 构建
        working-directory: rust
        shell: bash
        run: cargo build --release -p $BIN --target ${{ matrix.target }}

      # ⚠️ 打包这一步用 pwsh：`Compress-Archive` 是系统自带的，不用赌 runner 的 PATH 里
      #    有没有 `zip`（Git Bash 不带你；而 Windows 那个 `tar.exe` 是 bsdtar，Git Bash 里
      #    又会是 GNU tar —— GNU tar 不认得 `.zip`，会**静默**写出一个只是改了个名字的
      #    tar，那比报错难查）。
      - name: 打包（zip）
        working-directory: rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg  = $env:PACKAGE
          # ⚠️★ 与 linux / macos 同一形态：`v<版本>` 紧跟 `clip9-cli` 之后。
          $name = "$pkg-${{ needs.info.outputs.tag }}-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" "dist/$name/$pkg.exe"
          Copy-Item ../LICENSE, ../README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          # ⚠️ 这里原来还写一份 `$name.zip.sha256`（CRLF 那个坑写了一大段注释）——
          #    2026-09-29 起**不再发** `.sha256` 了，整段删掉。要用的话别直接抄回来：
          #    当时用 `WriteAllText` 而不是 `Out-File` 是因为后者在 PS 5.1 上写 CRLF，
          #    而另外三个平台那份是 `sha256sum` 写的 LF，带 `\r` 的校验文件在 Linux/macOS
          #    上 `sha256sum -c` 会直接对不上。
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}-${{ matrix.label }}
          path: |
            rust/dist/*.zip
          if-no-files-found: error

  # ── 桌面端：Tauri 安装包（macOS .app/.dmg、Linux .deb/AppImage、Windows .msi/.exe）──
  #
  # ⚠️★ 桌面端「含服务端」靠的是把那个二进制放进包内**与主程序同一个目录、名字仍叫
  # `clip9-server`**：`crates/desktop/src/server_process.rs` 的 `default_binary()` 就在那儿
  # 按这个名字找它。落位由 `tauri.conf.json` 的 `bundle.macOS.files` /
  # `bundle.linux.{deb,appimage}.files` 写死。
  #
  # ⚠️★ Windows 用**另一条路**：`bundle.windows` **没有 `files` 字段**（macOS/deb/AppImage 才有），
  # 所以那边写在 `tauri.windows.conf.json` 的 `bundle.resources` 里。`resources` 在 Windows 上
  # 落在 `$RESOURCE`，而 `$RESOURCE` 在 Windows 上**就是主程序所在目录**（tauri-utils
  # `platform.rs` 里那条 `if cfg!(target_os = "windows") { return exe_dir }`），WiX 模板里
  # `{{resources}}` 也确实注在 `<DirectoryRef Id="INSTALLDIR">` 内 —— 主程序旁边，正是要的位置。
  # ⚠️ 放 `tauri.windows.conf.json` 而不是主配置：`resources` 是**全平台**的键，写进主配置会让
  # macOS/Linux 的包里也躺一份用不到的 `clip9-server.exe`（平台专属配置按 JSON Merge Patch 合并）。
  #
  # ⚠️★ 刻意**不用** `bundle.externalBin`：它的**暂存文件名必须带** `-<target-triple>`
  # （不然 CLI 找不到那个侧车），而这里要的落位名字是干净的那个。
  #
  # ⚠️★ `files` / `resources` 映射是 **`{ 目标: 源 }`**，不是 `{ 源: 目标 }`（写反过一次：
  # 打包器会去「包内」找源，报 `Failed to copy "MacOS/clip9-server" to "binaries/clip9-server"`）。
  #
  # ⚠️ 所以这里是**两步**：先把服务端编出来、拷到配置里写死的那个暂存路径
  # （`rust/crates/desktop/binaries/clip9-server[.exe]`，已 gitignore），再让 tauri 打包。
  desktop:
    # ⚠️ 同 `linux`：产物名里带版本号，所以要 tag。
    needs: info
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            bundles: deb,appimage
          # ⚠️ 桌面端只出 x86_64：Windows 的 ARM64 机器能跑 x64 程序（系统自带模拟），
          #    而 `tauri build` 打 ARM64 的 `.msi` / NSIS 是另一条少人走的路 ——
          #    那是**单独一块**，不顺手加。（CLI 那边才两个架构都出，见上面那个 windows job。）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    env:
      # ⚠️★ Windows x86_64 上 `aws-lc-sys` 要 NASM，**找不到就 `panic!`**（不是回落），
      #    而 runner 镜像里没有 NASM。`=1` 是官方 README 认的开关（改用 crate 自带的
      #    预编译 `.obj`）。⚠️ 别的平台这个变量不起作用 —— 它只在
      #    `target_os == windows && target_arch == x86_64` 那条分支里被读，
      #    所以写在这里（一处）比给两条步骤各加一个条件更不容易漏。
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v7

      # ⚠️ 缺 webkit2gtk 时 `tauri-build` 会直接失败，报错与「代码写错了」很像。
      - name: Tauri 的系统依赖（Linux）
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: desktop-${{ matrix.target }}

      # ① 服务端 → 配置里写死的那个暂存路径。
      # ⚠️ 后缀按目标算：Windows 上 `default_binary()` 找的是 `clip9-server.exe`，
      #    而 `tauri.windows.conf.json` 的 `resources` 源路径也写的是带 `.exe` 的那个名字。
      # ⚠️ `shell: bash`：三个平台跑同一段（Windows runner 上也有 Git Bash）——
      #    用默认的 pwsh 就得把这段再写一份，两份迟早会漂。
      - name: 编服务端并暂存到 bundle 取件的位置
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *windows*) exe=".exe" ;;
            *)         exe="" ;;
          esac
          cargo build --release -p $BIN --target ${{ matrix.target }}
          mkdir -p crates/desktop/binaries
          cp "target/${{ matrix.target }}/release/$BIN$exe" "crates/desktop/binaries/$BIN$exe"

      # ★ 把 tag 里的版本号注进这次构建 —— **发布产物上唯一的版本真值**。
      #
      # ⚠️★ 为什么必须有这一步：版本号只住在 tag 里（`CHANGELOG.md` 开头那条纪律），
      #    而 `tauri.conf.json` 里原来那个 `version`（2026-09-30 已删）与
      #    `rust/Cargo.toml` 的 `[workspace.package] version` 都只是**本地兜底**。
      #    没有这一步，发出去的桌面端**每一个版本都自称 0.1.0**（当时最新 tag 已经是
      #    `v0.1.1-beta1`）—— 界面上那个「客户端版本」与用户手里那个包各说各话，
      #    而两份看起来都正常。Android 早就是这么做的（`android.yml` 用 `-PversionName`
      #    注入），这一步是给桌面端补上同一件事。
      # ⚠️★ 它同时是**任何更新检查的前置**：updater 比的是「当前版本 vs 线上清单」，
      #    当前版本恒为 0.1.0 的话，装了新版的人会永远被提示「有新版本」。
      #
      # ⚠️ 版本号与 versionCode 的换算**只在 `tools/release-version.mjs`** ——
      #    这里不许自己拼（那正是「两处会漂」的起点）。
      # ⚠️ 用 `--config <文件>` 而不是内联 JSON：内联那份要穿过 shell 与 tauri-action
      #    的参数拆分，引号少一个就变成非法 JSON，而报错发生在打包那一步，很难对上。
      #    路径放 `$RUNNER_TEMP`：三个平台都带不出空格（`D:\a\_temp`），也不进仓库。
      # ⚠️ `bundle.macOS.bundleVersion` 要**一起**给：它是 Info.plist 里的 `CFBundleVersion`，
      #    不给就取 `version` 那份，而预发布的 `0.1.1-beta1` **不是** Apple 认的点分数字形状。
      #    `version_code`（`MAJOR*100000+MINOR*1000+PATCH`）正好是个整数。
      # ⚠️★ `bundle.windows.wix.version` **同样必须**给 —— `v0.1.1-beta2`（2026-09-30）就是
      #    栽在这一条上：WiX（MSI）的 ProductVersion **只认数字**，注入真实 tag 之后版本
      #    第一次带上字母，Windows 那条打包在**最后一步**报
      #    `optional pre-release identifier in app version must be numeric-only
      #     and cannot be greater than 65535 for msi target`（另外三个平台全绿）。
      #    ⚠️ 只有 msi 需要它：NSIS 原生支持完整 semver（上游 tauri#5286 里说的）。
      #    ⚠️ 值取 `wix_version`（形状 `major.minor.patch.build`），**在脚本里算**、
      #    这里不许自己拼 —— 与 `version_code` 同一条理由：换算只许有一个定义处。
      - name: 把 tag 的版本号注进构建
        shell: bash
        run: |
          set -euo pipefail
          out="$(node tools/release-version.mjs --tag "${{ needs.info.outputs.tag }}")"
          version="$(printf '%s\n' "$out" | sed -n 's/^version=//p')"
          code="$(printf '%s\n' "$out" | sed -n 's/^version_code=//p')"
          wix="$(printf '%s\n' "$out" | sed -n 's/^wix_version=//p')"
          if [ -z "$version" ] || [ -z "$code" ] || [ -z "$wix" ]; then
            echo "::error::取不到版本号 —— tools/release-version.mjs 的输出是：$out"
            exit 1
          fi
          printf '{"version":"%s","bundle":{"macOS":{"bundleVersion":"%s"},"windows":{"wix":{"version":"%s"}}}}\n' \
            "$version" "$code" "$wix" > "$RUNNER_TEMP/tauri-version.json"
          cat "$RUNNER_TEMP/tauri-version.json"

      # ② 桌面端打包。⚠️ 不传任何 release 参数：发 Release 归下面那个唯一的 publish job。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: rust/crates/desktop
          # ⚠️ 末尾那份 `--config` 就是上面那一步写的文件（与 `tauri.windows.conf.json`
          #    是同一套 JSON Merge Patch 机制：只盖 `version`、macOS 的 `bundleVersion`
          #    与 Windows 的 `wix.version`，其余整份配置照旧）。
          #    ⚠️ 路径里**不能有空格** —— tauri-action 会按空格拆参数。
          args: >-
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            --config ${{ runner.temp }}/tauri-version.json

      # ⚠️ 只收**能当 Release 资产的文件**：`.app` 是目录，当不了资产（它的内容在 dmg 里）。
      # ⚠️ 扩展名从文件名上取（`${f##*.}`），所以这里不写死 dmg/deb/AppImage 之外的清单，
      #    加一个平台只要往上面那个 for 里添一格。
      # ⚠️ `shell: bash`：Windows runner 上默认是 pwsh，这段是 bash（Git Bash 在 runner 上有）。
      - name: 给产物带上 clip9-desktop 前缀
        shell: bash
        run: |
          set -euo pipefail
          out="rust/target/desktop-release"
          mkdir -p "$out"
          base="rust/target/${{ matrix.target }}/release/bundle"
          for f in "$base"/dmg/*.dmg "$base"/deb/*.deb "$base"/appimage/*.AppImage \
                   "$base"/msi/*.msi "$base"/nsis/*-setup.exe; do
            [ -e "$f" ] || continue
            # ⚠️★ `v<版本>` 紧跟 `clip9-desktop` 之后（与 cli / openwrt / android 同一条规则）。
            cp "$f" "$out/clip9-desktop-${{ needs.info.outputs.tag }}-${{ matrix.label }}.${f##*.}"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: clip9-desktop-${{ matrix.label }}
          path: rust/target/desktop-release/*
          if-no-files-found: error

  # ── OpenWrt 与 Android：各自一个**可复用工作流**，步骤不搬到这里 ────────────
  #
  # ⚠️★ 为什么不把它们展开成 job 写在这个文件里：这两套东西**各自还有一个「单独手动跑」
  #    的入口**（补一个架构的包、重打 APK、给老 tag 补产物）。抄进来就有两份会漂的构建
  #    步骤，而它们各自有十来步。两个文件里都判了 `github.event_name`，
  #    所以被这里调用时**不上传** —— 上传归下面那两个 `publish-*`。
  #    这是 Go 版 `release.yml` 调 `build-openwrt-ipk.yml` 的同一个形状。
  #
  # ⚠️★ 它们**不在 `assets` 的 needs 里**，这是故意的：`assets` 只核 cli/desktop 那七个
  #    名字，一旦它 needs 这两个，缺个签名 secret 就会把整次发布卡住（连发布说明都传不上去）。
  #    OpenWrt / Android 的资产名由各自文件自己核，上传由下面那两个 job 做。
  openwrt:
    needs: info
    uses: ./.github/workflows/openwrt.yml
    with:
      tag: ${{ needs.info.outputs.tag }}

  android:
    needs: info
    uses: ./.github/workflows/android.yml
    # ⚠️★ **少了这一行，这个 job 一定红。**
    #   可复用工作流**不会**自动拿到调用方的 secret —— 官方规则是「secrets are only passed
    #   to directly called workflow」：要么 `secrets:` 显式映射，要么 `secrets: inherit`。
    #   少了它，`android.yml` 里那四个 `secrets.SIGNING_*` 全是**空串**，于是它的存在性
    #   检查当场报「先给 clip9 这个仓库加上这几个 secret」——**看着像 secret 没设，其实设了**
    #   （`gh secret list` 里七个都在）。这一条 2026-09-28 真在 CI 上红过。
    #   ⚠️ 而**手动 dispatch 时是好好的**：那时它是顶层工作流、直接在仓库里跑，`secrets.*`
    #   读得到。所以「单独跑正常、被 release 一调就红」的全部原因就是这一行。
    #   ⚠️ `openwrt.yml` 一个 secret 都不用 → **故意不给它 inherit**：`inherit` 是把**全部**
    #   仓库 secret 都塞过去（含 `DOCKERHUB_*` / `HOMEBREW_TAP_GITHUB_TOKEN`），它用不上。
    #   哪天它要用 secret 了，`tools/workflows-smoke.mjs` 会先红在这里。
    secrets: inherit
    with:
      tag: ${{ needs.info.outputs.tag }}

  # 收口到一个 job 传产物：并行 job 各自去动 Release 会互相打架。
  # ── 资产名对不对 ──────────────────────────────────────────────────────
  #
  # ⚠️★ 这些名字是**跨文件**的约定：release.yml 各 job 矩阵里的 `label`、`Dockerfile`
  # 里那三条 `wget`、homebrew 那步的 `sha` 查找。改一处而没改另一处，症状**只在发布时**
  # 出现（docker job 的 wget 404、homebrew 报「有产物没取到」）—— 这一步把它挪到最前面。
  #
  # ⚠️ 刻意**不写 `if:`**：手动跑一次、tag 留空的那次冒烟也要走到这里（它不上传，但名字照样
  # 能验）。⚠️ 也正因为不写 `if:`，它是唯一一个在两种触发下都跑的「产物」job。
  assets:
    # ⚠️★ `info` 也在这里：下面那份「资产名对不对」的期望清单是拿 tag 拼出来的。
    needs: [info, linux, macos, windows, desktop]
    # ⚠️ 与 `publish` 同一个条件。手动跑且**没填 tag** 时产物名里没有版本号（tag 是空的），
    #    而那时也没有资产要发布 → 这份清单无从校验，别让它报一堆假错。
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 资产名对不对
        run: |
          set -euo pipefail
          # ⚠️★ 产物名里带版本号（`v<版本>` 紧跟 `clip9-<东西>` 之后）→ 期望名拿 tag 拼。
          #    别把 `v0.1.0` 写死在这儿：那正是这条判据要防的漂移。
          tag="${{ needs.info.outputs.tag }}"
          # 每行是 `<产物名>|<谁在用它>` —— 报错时能直接指到该改哪个文件。
          expected=(
            "clip9-cli-${tag}-linux-x86_64.tar.gz|Dockerfile 的 amd64 与 homebrew formula 的 Linux/intel"
            "clip9-cli-${tag}-linux-aarch64.tar.gz|Dockerfile 的 arm64 与 homebrew formula 的 Linux/arm"
            "clip9-cli-${tag}-linux-armv7.tar.gz|Dockerfile 的 arm/v7"
            "clip9-cli-${tag}-macos-aarch64.tar.gz|homebrew formula 的 macOS/arm"
            "clip9-cli-${tag}-macos-x86_64.tar.gz|homebrew formula 的 macOS/intel"
            "clip9-desktop-${tag}-macos-aarch64.dmg|homebrew cask 的 macOS/arm"
            "clip9-desktop-${tag}-macos-x86_64.dmg|homebrew cask 的 macOS/intel"
          )
          ok=1
          # ⚠️★ 变量后面跟非 ASCII 字符时**必须写 `${}`**：`$who）` 里的全角括号会被 bash
          # 当成变量名的一部分（`set -u` 下直接报 unbound variable）—— 实测踩过。
          for row in "${expected[@]}"; do
            f="${row%%|*}"
            who="${row##*|}"
            if [ -f "artifacts/$f" ]; then
              echo "  ✅ ${f}  （${who}）"
            else
              echo "::error::缺 ${f} —— ${who} 认的就是这个名字"
              ok=0
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "改了矩阵里的 label、却没改引用它的地方？"
            echo "--- artifacts 里实际有什么 ---"
            find artifacts -type f | sort
            exit 1
          fi
          echo "以上名字都对得上"

      # ⚠️★ 手动 docker 流程里还有第四处「平台串 → 标签」的映射，而它**不在产物里** ——
      # 所以这里把那一段 case **原样抽出来执行**，拿它的结果去对产物。
      # ⚠️ 不在这条判据里再抄一份映射：抄一份就是又一处会漂的地方（这条判据的意义就没了）。
      - name: 手动 docker 流程那份映射也对得上
        run: |
          set -euo pipefail
          block=$(awk '/case "\$p" in/,/^ *esac/' .github/workflows/docker.yml)
          if [ -z "$block" ]; then
            echo "::error::没能从 docker.yml 里抽出那段 case —— 它被改写过了，这条判据失效了"
            exit 1
          fi
          echo "抽出来的映射："
          echo "$block"
          tag="${{ needs.info.outputs.tag }}"
          for p in linux/amd64 linux/arm64 linux/arm/v7; do
            label=$(p="$p"; eval "$block"; printf '%s' "$label")
            if [ -f "artifacts/clip9-cli-${tag}-${label}.tar.gz" ]; then
              echo "  ✅ ${p} → clip9-cli-${tag}-${label}.tar.gz"
            else
              echo "::error::docker.yml 把 ${p} 映射成 ${label}，但资产里没有 clip9-cli-${tag}-${label}.tar.gz"
              exit 1
            fi
          done

  publish:
    needs: [info, assets]
    # 发布事件当然要传；手动跑时**填了 tag 才传**（留空 = 只构建）。
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # ⚠️★ `pattern` 是**必须的**：`download-artifact` **不带 `pattern` 时会拖下整次运行里
      #    所有 artifact** —— 包括 `openwrt-binaries`（裸二进制，中间产物）与 `android-apk`。
      #    v0.1.0-beta3 那次就真传上去了 7 个 `clip9-server-<版本>-<架构>`：它们本来只是
      #    给 ipk/apk 两个 job 用的，能不能被拖下来完全**取决于时序**（那两个 job 那会儿
      #    有没有跑完）。Jonny 2026-09-29：「去掉中间的 OpenWrt 中间产物，只要 ipk 和 apk」。
      #    ⚠️ 写 `clip9-*` 而不是逐个列举：cli（7 个 label）与 desktop（4 个 label）都在这
      #       个前缀下，而 `openwrt-*` / `android-apk` 都不在。
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: clip9-*

      - name: 待传清单（只该有 cli / desktop）
        run: |
          set -euo pipefail
          ls -l artifacts
          n="$(find artifacts -type f | wc -l)"
          # ⚠️ 空的 `files` 匹配是**静默**的（`action-gh-release` 会「成功地什么都没做」）。
          [ "$n" -gt 0 ] || { echo "::error::一个产物都没取到，别去动 Release"; exit 1; }
          # ⚠️★ 反向再判一次：`pattern` 要是被人删了（或写宽了），这里会红 ——
          #    而不是等它悄悄把中间产物传上去（那件事**没有别的症状**）。
          stray="$(find artifacts -type f ! -name 'clip9-cli-*' ! -name 'clip9-desktop-*')"
          if [ -n "$stray" ]; then
            echo "::error::这些不该出现在待传清单里（中间产物 / 别人的包）："
            echo "$stray"
            exit 1
          fi
          echo "共 ${n} 个产物"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.info.outputs.tag }}
          files: artifacts/*
          # ⚠️ 重跑时**替换**同名资产，而不是失败在「已存在」上。
          overwrite_files: true

      - name: 记一笔预发布
        if: needs.info.outputs.prerelease == 'true'
        run: |
          echo "::notice::这是预发布（prerelease）：容器镜像**只推 tag、不推 latest**。"

  # ── Release 正文：从 `CHANGELOG.md` 抽这一版的段落贴上去 ──────────────────
  #
  # ⚠️★ 为什么要有这一步（Jonny 2026-09-29：「以后发版 release 会是中文介绍吗」）：
  #    正文原先是「建 Release 时手贴」的纯人工动作，`v0.1.0` 那次就漏了。而**正文为空时
  #    GitHub 会把 tag 指向那条提交的提交信息整段顶上去** —— 提交信息又是英文的
  #    （`tools/check-commit-msg.mjs` 强制），于是页面上是一段英文的 commit message。
  #    「发布前先写好这一版说明」本来就有硬约束（`CHANGELOG.md` 抬头那三条），
  #    所以让正文从 CHANGELOG 抽 = 说明只维护一处，也少一个漏点。
  #
  # ⚠️★ 排在 `needs: publish` 的理由与 `docker` / `homebrew` 一样：**红在发布之后**。
  #    已经传上去的资产不会因为这里红了而回滚，而整个 run 是红的 → 一眼看得见要补。
  #    反过来（把它挪到 publish 之前当闸门）会让「文档没写完」把整次发布卡死，不划算。
  #
  # ⚠️ 它**不碰资产**：那三个 `action-gh-release` 只传 `tag_name` / `files` /
  #    `overwrite_files`，从头到尾没有一处设过正文 —— 所以这里改正文不会与它们打架。
  #
  # ⚠️ 也**不会**回头再触发一次本工作流（那会死循环）：`on.release.types` 钉死了
  #    `[published]`，而 `gh release edit` 发的是 `edited`；再叠上「用 `GITHUB_TOKEN`
  #    做出来的事件不会触发新 run」那条保护，两道都挡住了。
  #    ⚠️ 所以**别**把这里的 `GH_TOKEN` 换成 PAT —— 换掉就只剩 `types` 一道了。
  #
  # ⚠️ `ref:` 必须指到那个 tag：要读的是**那一版提交里**的 CHANGELOG（手动触发时
  #    `github.sha` 是默认分支的头，不是 tag）。
  release-notes:
    needs: [info, publish]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.info.outputs.tag }}

      - name: 从 CHANGELOG 抽出这一版
        env:
          TAG: ${{ needs.info.outputs.tag }}
        run: |
          set -euo pipefail
          # ⚠️★ 抽不到、或者抽到的还是占位（「变动留空」/「待发布」那种）→ 这个脚本会
          #    **报错退出**，一个字都不往 notes.md 写。宁可这里红，也不要让 Release
          #    页面上挂着一句「（变动留空）」。
          node tools/release-notes.mjs --tag "$TAG" > notes.md
          echo "--- 正文预览（前 24 行）---"
          head -24 notes.md

      - name: 贴到那个 Release 上
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.info.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "::notice::Release 正文已从 CHANGELOG 同步（${TAG}）。"

  # ── OpenWrt 包：**排在 publish 之后**，覆盖上传 ──────────────────────────
  #
  # ⚠️★ 为什么不是并进 `publish`（它那边是 `files: artifacts/*` 一把传）：
  #   ① OpenWrt 要编 3 次 `cross`、Android 要编三个 `.so` 再跑一遍 Gradle —— 并进去只能二选一：
  #      要么整次发布等它们（缺个 secret 就卡住，连 cli/desktop 都发不出去），
  #      要么传一份少了它们的资产。
  #   ② 它们自己也要能**手动**覆盖上传（见那两个文件）。「传哪些、从哪取」这套逻辑
  #      本来就该待在一个两边共用得上的地方 —— 这里就是发布那条路。
  #
  # ⚠️ 与 `docker` / `homebrew` 同一个道理：`needs: publish` 让它们**红在发布之后**，
  #    已经传上去的 cli/desktop 不会因此回滚（改动**只**发生在这里那几个资产上）。
  #
  # ⚠️★ OpenWrt 与 Android **分成两个 job**（而不是一个 job 传两类）：那样一个红会连累
  #    另一个的资产也传不上去（`needs` 里有一个失败，下游就整体 skip）。
  #    分成两个之后，OpenWrt 挂了 Android 照样传。
  # ⚠️ 两个 job 都**必须带 `pattern`**：不带的话会把 `assets` 收过的
  #    `clip9-cli-*` / `clip9-desktop-*` 也拖下来，于是「这次传了哪些」取决于时序。
  publish-openwrt:
    needs: [info, publish, openwrt]
    # 与 publish 同一个条件（手动跑、tag 留空的那次冒烟只构建、不上传）。
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: extra
          merge-multiple: true
          # ⚠️ `openwrt-binaries`（裸二进制）刻意不在这个前缀里 —— 它是中间产物，
          #    不是要发出去的资产。
          pattern: openwrt-pkg-*

      - name: 待传清单
        run: |
          set -euo pipefail
          ls -l extra
          # ⚠️ 空的 `files` 匹配是**静默**的（`action-gh-release` 会「成功地什么都没做」），
          #    而这里空着通常意味着「上游那两个工作流的 artifact 名字改了」。
          #
          # ⚠️★ 这三个数字是**跨文件**的：它们必须与 `openwrt.yml` 里那两个矩阵的条目数一致。
          #    改那边的矩阵而没改这里 → 这里红（这正是不想让它静默漂掉的那件事）。
          #    7 = ipk 矩阵的 7 个架构；8 = apk 矩阵的 8 个设备架构；2 = LuCI 的 ipk + apk。
          #    ⚠️ 只数个数、不重列名字：重列一遍就是**又一处会漂的地方**。
          #    ⚠️ 前缀是 `clip9-openwrt-*`（2026-09-29 从 `clip9-server-openwrt-*` 改的）——
          #       与打包脚本里那两个 `*_NAME=` 必须一致。
          n_ipk=$(find extra -maxdepth 1 -name 'clip9-openwrt-v*.ipk' | wc -l)
          n_apk=$(find extra -maxdepth 1 -name 'clip9-openwrt-apk-v*.apk' | wc -l)
          n_luci=$(find extra -maxdepth 1 \( -name 'clip9-luci-openwrt-v*.ipk' -o -name 'clip9-luci-openwrt-apk-v*.apk' \) | wc -l)
          n_all=$(find extra -type f | wc -l)
          echo "ipk=${n_ipk}（期望 7） apk=${n_apk}（期望 8） luci=${n_luci}（期望 2） 合计=${n_all}"
          bad=0
          [ "$n_ipk" = 7 ] || { echo "::error::ipk 有 ${n_ipk} 个，openwrt.yml 的 ipk 矩阵是 7 格"; bad=1; }
          [ "$n_apk" = 8 ] || { echo "::error::apk 有 ${n_apk} 个，openwrt.yml 的 apk 矩阵是 8 格"; bad=1; }
          [ "$n_luci" = 2 ] || { echo "::error::LuCI 包有 ${n_luci} 个，应该是 ipk + apk 两个"; bad=1; }
          [ "$bad" = 0 ] || exit 1
          echo "个数对得上"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.info.outputs.tag }}
          files: extra/*
          overwrite_files: true

  # ── Android 的 APK：同上（单独一个 job，OpenWrt 红了不影响它）──────────────
  publish-android:
    needs: [info, publish, android]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: extra

      - name: 待传清单
        run: |
          set -euo pipefail
          ls -l extra
          # ⚠️★ 期望 **4** 个：三个 ABI 各一个拆分包 + 一个合并包（`splits.abi` +
          #    `isUniversalApk`，见 `android.yml`）。这里写死个数是**故意的** ——
          #    个数对不上通常意味着「那边少了一个 ABI 的包」或「upload 的 name 改了」，
          #    而那些都是**没有别的症状**的错。
          n="$(find extra -type f -name '*.apk' | wc -l)"
          echo "共 ${n} 个 APK（期望 4：三个单 ABI + 一个合并包）"
          [ "$n" = 4 ] || { echo "::error::APK 有 ${n} 个，应当是 4 —— artifact 名字对不上？还是某个 ABI 没打出来？"; exit 1; }

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.info.outputs.tag }}
          files: extra/*.apk
          overwrite_files: true

  # ── 容器镜像：**不编译**，直接用 Release 里那份二进制 ─────────────────────
  #
  # ‼️ 所以这个 job 必须 `needs: publish` —— 镜像里是 `wget` Release 资产的，资产还没传完就
  #    build 的话会拿到 404。
  #
  # 标签规则（Jonny 定的）：**预发布时只保留对应标签的镜像，不推 latest**；正式发布才推 latest。
  docker:
    needs: [info, publish]
    runs-on: ubuntu-latest
    env:
      REGISTRY_GHCR: ghcr.io
      # ⚠️ ghcr 的镜像名**必须全小写**，而 `github.repository` 是 `Jonnyan404/clip9` ——
      # 直接用会出现 `invalid reference format`。在下面的步骤里 `tr` 一下。
      REPO: ${{ github.repository }}
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ needs.info.outputs.tag }}
      PRERELEASE: ${{ needs.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: 算镜像标签
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ 两个 secret 是按仓库算的，从 cloud-clipboard-go 那边**不会**跟过来。
          #    缺了就当场说清楚，别让 docker/login-action 报一句不认识的错。
          if [ -z "$DH_USER" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::要推 Docker Hub 就得先给 clip9 这个仓库加上 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN 两个 secret"
            exit 1
          fi
          ghcr="${REGISTRY_GHCR}/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          dh="${DH_USER}/clip9"
          {
            echo 'tags<<EOF'
            echo "${ghcr}:${TAG}"
            echo "${dh}:${TAG}"
            # ⚠️★ 预发布**不推 latest** —— 那会让 `docker pull clip9` 从某个 beta 悄悄变过去。
            if [ "$PRERELEASE" != "true" ]; then
              echo "${ghcr}:latest"
              echo "${dh}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ 这两个 secret 目前**只存在于 cloud-clipboard-go 仓库**（secrets 是按仓库存的），
      # 要用 Docker Hub 就得在 clip9 里也加一份。
      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DH_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ⚠️ context 是**仓库根**（`Dockerfile` 与 `entrypoint.sh` 都在根上，与 Go 那边一样）——
      #    根上那份 `.dockerignore` 已经把 `rust/target` 与各 `node_modules` 排掉了。
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ env.TAG }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  # ── Homebrew：把 formula 与 cask 推进 tap 仓库 ────────────────────────────
  #
  # 两份都是**生成的**（版本号 + sha256 从刚发出去的资产上现算），别在 tap 里手改 ——
  # 下一次发布就盖掉了。
  #
  # ⚠️★ 需要 clip9 仓库里的 `HOMEBREW_TAP_GITHUB_TOKEN`（对 `homebrew-tap` 有 contents: write
  # 的 PAT）。没有它这一步会**红**——刻意不写成「静默跳过」：默默不更新 tap 比红一次更难查。
  #
  # ⚠️ 预发布**也照常更新**（你说的是「release 增加 homebrew 支持」，没给预发布例外）。
  # 想让预发布不动 tap，就在这个 job 上加 `if: needs.info.outputs.prerelease != 'true'`。
  homebrew:
    needs: [info, publish]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.info.outputs.tag }}
    steps:
      - name: 取回刚发出去的产物并算 sha256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D dl \
            -p 'clip9-cli-*.tar.gz' -p 'clip9-desktop-*.dmg'
          ls -l dl
          (cd dl && sha256sum *.tar.gz *.dmg > sums.txt)
          cat dl/sums.txt

      - name: 生成 formula 与 cask
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sums="$(cat dl/sums.txt)"
          sha() { echo "$sums" | awk -v f="$1" '$2 == f { print $1 }'; }

          # ⚠️★ 产物名里带版本号 → 这里每一处都要拿 `${TAG}` 拼（`TAG` 形如 `v0.1.0`）。
          #    漏一处不会报错，只会静默拿到一个空 sha → 下面那道 `[ -n "$v" ]` 才会拦下。
          cli_arm=$(sha "clip9-cli-${TAG}-macos-aarch64.tar.gz")
          cli_intel=$(sha "clip9-cli-${TAG}-macos-x86_64.tar.gz")
          lx_arm=$(sha "clip9-cli-${TAG}-linux-aarch64.tar.gz")
          lx_intel=$(sha "clip9-cli-${TAG}-linux-x86_64.tar.gz")
          dmg_arm=$(sha "clip9-desktop-${TAG}-macos-aarch64.dmg")
          dmg_intel=$(sha "clip9-desktop-${TAG}-macos-x86_64.dmg")
          for v in "$cli_arm" "$cli_intel" "$lx_arm" "$lx_intel" "$dmg_arm" "$dmg_intel"; do
            [ -n "$v" ] || { echo "::error::有产物没取到，上面 ls 里看看少了哪个"; exit 1; }
          done

          mkdir -p out
          cat > out/clip9.rb <<EOF
          # 本文件由 clip9 的发布流程生成，别手改（下次发布会整份盖掉）。
          class Clip9 < Formula
            desc "自托管的跨设备剪贴板：单文件服务端，前端已编在二进制里"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/clip9-cli-${TAG}-macos-aarch64.tar.gz"
                sha256 "${cli_arm}"
              end
              on_intel do
                url "${base}/clip9-cli-${TAG}-macos-x86_64.tar.gz"
                sha256 "${cli_intel}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/clip9-cli-${TAG}-linux-aarch64.tar.gz"
                sha256 "${lx_arm}"
              end
              on_intel do
                url "${base}/clip9-cli-${TAG}-linux-x86_64.tar.gz"
                sha256 "${lx_intel}"
              end
            end

            def install
              bin.install "clip9-cli"
            end

            test do
              assert_match "clip9-server", shell_output("#{bin}/clip9-cli -v")
            end
          end
          EOF

          # ⚠️ 这个 .app **没有签名**：装得上，但第一次打开会被 Gatekeeper 拦
          #（「无法验证开发者」，要右键打开或在「隐私与安全性」里放行）。
          cat > out/clip9-desktop.rb <<EOF
          # 本文件由 clip9 的发布流程生成，别手改（下次发布会整份盖掉）。
          cask "clip9" do
            version "${version}"

            on_arm do
              sha256 "${dmg_arm}"
              url "${base}/clip9-desktop-${TAG}-macos-aarch64.dmg"
            end

            on_intel do
              sha256 "${dmg_intel}"
              url "${base}/clip9-desktop-${TAG}-macos-x86_64.dmg"
            end

            name "clip9"
            desc "自托管的跨设备剪贴板（桌面端，自带服务端）"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "clip9.app"
          end
          EOF

          head -6 out/clip9.rb out/clip9-desktop.rb

      - name: 推进 tap
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::缺 secret HOMEBREW_TAP_GITHUB_TOKEN（对 ${TAP} 有 contents: write 的 PAT）。\
          没有它就没法更新 Homebrew —— 刻意报错而不是静默跳过：跳过一次你会以为「brew 那边已经好了」。"
            exit 1
          fi
          git clone --depth=1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula tap/Casks
          cp out/clip9.rb tap/Formula/clip9.rb
          cp out/clip9-desktop.rb tap/Casks/clip9.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clip9.rb Casks/clip9.rb
          if git diff --cached --quiet; then
            echo "· 与 tap 里的现有内容一致，不用提交"
            exit 0
          fi
          git commit -m "clip9 ${TAG}"
          git push
          echo "· 已更新 ${TAP}"

  # ══════════════════════════════════════════════════════════════════════════
  # 在 main 上留一条「vX.Y.Z 发过了」的记录 —— **不动任何文件**
  #
  # ⚠️★ 为什么是**空提交**（`--allow-empty`），而不是「改一个版本号文件再提交」：
  #   本仓库刻意**不让版本号落进文件里**（`CHANGELOG.md` 抬头那条）——
  #   版本号的唯一权威是 **tag 本身**。要是再往仓库里写一份，就有了两个真值，
  #   而那种漂移**只在发布那天响**（平时两份数并排躺着、谁也不报错）。
  #   不改文件 ⇒ 没有第二份真值可漂移，同时 `git log` 里还是留得下一条
  #   `chore(release): vX.Y.Z`，一眼看出发过哪几版、各自在哪天。
  #
  # ⚠️★ 这条是照 Go 版（父仓库 `cloud-clipboard-go` 的 `record-version` job）抄的，
  #   那边从 v5.1.0 起就这么发。clip9 移植发布流程时**漏掉了这一个 job**（2026-09-30 补）
  #   —— 症状就是翻 `git log` 一条版本信息都找不到。
  #
  # ⚠️★ **判重**这件事踩过两个坑，两个都发生在 Go 版，两个都不报错（下面那段脚本里逐条写着）：
  #   ① 只用 `git log --grep` 是**子串**匹配 → `chore(release): v0.1.0` 撞上
  #      `chore(release): v0.1.0-beta4` → **正式版的记录被吞掉**（beta 先、正式版后是本仓库的
  #      常规顺序，所以这一撞是必然，不是偶然）；
  #   ② `| grep -q` 一命中就退出 → 上游 `git log` 吃 SIGPIPE → `set -euo pipefail` 下
  #      **匹配成功也判成失败** → 每次重跑多堆一条（Go 版 v5.1.0 因此出现**两条**，那边后来用
  #      `fix(release): stop the version marker duplicating on re-run` 修的）。
  #   结论：`git log --format=%s | grep -Fx -- "<整行>"` —— `-Fx` 是整行**字面**相等，
  #   不带 `-q`（读完全部输入，无 SIGPIPE）。两个坑一次绕开。
  #
  # ⚠️ 排在 `publish` 之后：先保证资产传完，记录是收尾动作，它失败也不影响已发布的产物。
  #
  # ⚠️★ 与 Go 版的一处**已知差异**（2026-09-30 核实过，别以为是照抄漏了）：
  #   那边只有 `pages.yml` 挂 `push → main`，且带 `paths: dev-docs/**` —— 空 diff 判定为
  #   **不匹配**，所以那条空提交**不触发任何 workflow**。clip9 的 `ci.yml` 是
  #   `push: branches: [main]`、**没有 paths 过滤** ⇒ 会多跑一次 CI（rust + frontend 全套）。
  #   那一次必然绿（一个文件都没动），代价是几分钟 runner 时间，换来「`git log` 里看得见版本」。
  #   ⚠️ **别**为了省这一次去给 `ci.yml` 加 `paths-ignore`：那会真的放走改动。
  # ══════════════════════════════════════════════════════════════════════════
  record-version:
    needs: [info, publish]
    # 与 `publish` 同一个条件：手动跑、tag 留空的那次冒烟**只构建、不记录**。
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Commit and push the version marker
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.info.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⚠️★ 判重**必须整行相等**（`grep -Fx`），不能只用 `git log --grep` ——
          #   那是**子串**匹配，而 `chore(release): v0.1.0` 正是
          #   `chore(release): v0.1.0-beta4` 的**前缀**：于是「先发 beta、再发正式版」
          #   （本仓库的常规顺序）时，正式版会被误判成「已经记过」→ **它的记录被吞掉**，
          #   而这件事**没有任何症状**（发布照样绿）。2026-09-30 在假仓库里实测到过：
          #   `--grep="chore(release): v0.1.0"` 命中的是 beta4 那条。
          #
          # ⚠️★ 这里也**不用 `grep -q`**：一命中就退出，上游的 `git log` 还在写就会吃到
          #   SIGPIPE；脚本开头是 `set -euo pipefail`，于是**匹配成功也被判成失败**
          #   （实测 `set -o pipefail; yes | grep -q y` 退出码非 0，去掉 pipefail 才是 0）。
          #   结果就是每次重跑都多堆一条记录 —— Go 版 v5.1.0 因此出现了两条。
          #   不带 `-q` 的 `grep` 会读完全部输入，从根上没有这个坑。
          if [ -n "$(git log --format=%s | grep -Fx -- "chore(release): ${TAG}" || true)" ]; then
            echo "main 上已有 ${TAG} 的记录，跳过"
            exit 0
          fi
          git pull --rebase origin main
          git commit --allow-empty -m "chore(release): ${TAG}"
          git push origin HEAD:main
          echo "已记录 ${TAG}"
