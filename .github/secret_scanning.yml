# 从 secret scanning 里排除的路径。
#
# 为什么 `rust/crates/server/static/` 要排除：**那是构建产物，不是源码**。
# 它由 `web/dist` 同步而来（`tools/sync-web-assets.mjs`），内容 =
# 我们的前端源码 + **第三方 npm 包原样打进去的字节**。
#
# 2026-10-12 触发的那条告警就是这么来的：Excalidraw 的包里带着它自己 Firebase 项目的
# 配置（`VITE_APP_FIREBASE_CONFIG`，`authDomain: excalidraw-room-persistence.firebaseapp.com`），
# 于是我们打包出来的 `whiteboard-*.js` 里就有了那个 `AIzaSy…`。
#
# ⚠️ **那不是我们的密钥，也不是「泄漏」**：Firebase 的 web `apiKey` 按设计就不是秘密
# （它只是项目标识，真正的门是 Security Rules），Excalidraw 把它公开在 npm 包和自家网站上。
#
# ⚠️ 排除**不会**让我们的密钥失去保护：真正的源码在 `web/src/`，那里**照常被扫**。
# 会漏掉的只有一种情况 —— **构建时注入**（环境变量塞进产物）。本项目没有这么做
# （`web/vite.config.ts` 里没有注入任何密钥），但**将来若引入，这条排除就会把它盖住**，
# 那时要改成只排除具体的第三方 chunk。
#
# 相关文档：https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
paths-ignore:
  - "rust/crates/server/static/**"
