# 项目本地的 cargo 源配置。
#
# ⚠️ 它**只影响这个目录**，不动 `~/.cargo/config.toml` ——
# 别的 Rust 项目要不要换源是别人的事。
#
# 为什么要它：本机直连 crates.io 拉包会大面积超时
# （实测首次构建撞了 40+ 次 `transfer too slow: failed to transfer more than 10 bytes in 30s`，
# 直接失败）。换 USTC 的 sparse 镜像之后，240KB 的包 0.3s 下完。
#
# `replace-with` 是**源替换**，不写进 Cargo.lock —— 所以别人不用这个配置也能构建，
# 只是会慢。要撤掉就把这个文件删了。
[source.crates-io]
replace-with = "ustc"

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[net]
# 镜像偶尔抽风，多试几次比整个构建失败强。
retry = 5
