              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide (`automation.enabled = false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyGetPost'
    post:
      tags:
      - Automation
      summary: 新建或整份替换一个定时任务
      description: 'Omit `id` to create; supply an existing `id` to replace that task wholesale. The room

        is taken from the credential — **a `room` field in the body is not read**.


        Times, templates and action ids are validated at save time

        (`invalid_task`), never silently ignored. Notably: an unknown template variable or a

        malformed offset fails here, and `freq: cron` with an expression that can never fire

        fails here too.


        `keepHistory` defaults to `false`: the message is broadcast live but does not consume

        the room''s history quota (otherwise a daily task would evict the entire room history

        within weeks).


        In a `single`-tier room the response also carries a **`taskToken`**, shown exactly

        once — it is the only credential that can later edit or delete that task.

        '
      operationId: upsertTask
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      - $ref: '#/components/parameters/TaskTokenQuery'
      security:
