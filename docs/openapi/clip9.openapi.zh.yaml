  /automation:
    get:
      tags:
      - Automation
      summary: 定时任务的管理页（HTML）
      description: 'A server-rendered page for creating and editing automations. It has its own HTML (it
        is

        registered ahead of the SPA fallback, otherwise it would resolve to a blank shell with

        no form).


        It performs **no authentication of its own** — whether a task can be created or changed

        is decided entirely by `/tasks`. The page exchanges a password for a session token and

        keeps it in `sessionStorage`, never storing the plaintext password.


        `?room=` and `?lang=` (one of `zh` / `zh-TW` / `en` / `ja`) are honoured.

        '
      operationId: automationPage
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum:
          - zh
          - zh-TW
          - en
          - ja
        example: zh
      security: []
      responses:
        '200':
          description: The management page.
          content:
            text/html:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/OnlyGet'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <credential>`, where the credential is the global password,
        a

        room password, or a session token from `POST /auth/token`.


        A header whose value is not two space-separated words starting with `Bearer` is used

        **verbatim** as the credential, so `Authorization: my-password` also works. Note that

        `Bearer a b` (three parts) is likewise taken whole, rather than as `a b`.

        '
    authQuery:
      type: apiKey
      in: query
      name: auth
      description: 'The same credential, as `?auth=`. Consulted only when the `Authorization` header is

        absent or empty. Kept for Apple Shortcuts. **Never put a password in a shareable URL** —

        query strings land in browser history and server access logs.

        '
    shareTokenQuery:
      type: apiKey
      in: query
      name: t
      description: 'A share token, which authorises **read** access to the one entry or file it was issued

        for. Read-only: write endpoints ignore it.

        '
    sharePassword:
      type: apiKey
      in: header
      name: X-Share-Password
      description: 'The password of a password-protected share. Never sent in the URL, because query strings

        are logged.

        '
    taskToken:
      type: apiKey
      in: header
      name: X-Task-Token
      description: 'The task token of a `single`-tier automation (also accepted as `?taskToken=`). Issued

        once, when the task is created.

        '
  parameters:
    RoomQuery:
      name: room
      in: query
      required: false
      description: 'Room name. Empty or absent (or the literal `default`) means the `default` room. Names
        are

        case-sensitive; only surrounding whitespace is trimmed.

        '
      schema:
        type: string
      example: home
    RoomQueryOptional:
      name: room
      in: query
      required: false
      description: 'Room name. On endpoints that also accept "no room at all" as a distinct case, omitting

        this parameter entirely may differ from sending it empty — `GET /content/latest` is the

        one to watch: `?room=` is the `default` room, `?all=1` is "newest anywhere".

        '
      schema:
        type: string
      example: home
    AuthQuery:
      name: auth
      in: query
      required: false
      description: Credential, used only when the `Authorization` header is absent or empty.
      schema:
        type: string
        writeOnly: true
      example: correct-horse-battery-staple
    NameQuery:
      name: name
      in: query
      required: false
      description: 'The **device display name** the sender claims. It is cleaned (control characters

        removed, trimmed) and truncated to 32 **characters**, then stored as

        `senderDevice.name`. When empty the server infers a name from the User-Agent. Not

        interchangeable with `client`.

        '
      schema:
        type: string
        maxLength: 32
      example: iPhone
    ClientQuery:
      name: client
      in: query
      required: false
      description: 'A **stable client id**, stored as `senderClientID` and used to decide which messages
        are

        the caller''s own. Set it once per installation.

        '
      schema:
        type: string
      example: web-1a2b
    FormatQuery:
      name: format
      in: query
      required: false
      description: 'Explicit representation selector. `raw` (aliases `text`, `plain`) forces raw bytes;

        `json` forces JSON. Any other non-empty value is a `400 unsupported_format` — it never

        falls back. Overrides `?json=` and `Accept`.

        '
      schema:
        type: string
        enum:
        - raw
        - text
        - plain
        - json
      example: json
    JsonQuery:
      name: json
      in: query
      required: false
      description: 'Legacy JSON switch. `1` or `true` selects JSON; anything else is ignored. Retained
        for

        existing clients — new code should use `?format=json`.

        '
      schema:
        type: string
        enum:
        - '1'
        - 'true'
      example: '1'
    ShareTokenQuery:
      name: t
      in: query
      required: false
      description: A share token. When present it is tried after the room credential.
      schema:
        type: string
      example: eyJ0eXAiOiJzaGFyZSJ9.9f2c
    ShareTokenQueryRequired:
      name: t
      in: query
      required: true
      description: The share token to describe.
      schema:
        type: string
      example: eyJ0eXAiOiJzaGFyZSJ9.9f2c
    SharePasswordHeader:
      name: X-Share-Password
      in: header
      required: false
      description: The password of a password-protected share. Never placed in the URL.
      schema:
        type: string
        writeOnly: true
      example: hunter2
    TaskTokenQuery:
      name: taskToken
      in: query
      required: false
      description: 'The task token of a `single`-tier automation, as an alternative to the `X-Task-Token`

        header (which takes precedence).

        '
      schema:
        type: string
        writeOnly: true
      example: f4a2c9e1b7d3450689abcdef01234567
  responses:
    OnlyGet:
      description: This endpoint only accepts GET.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyGet:
              value:
                code: method_not_allowed
                error: Only GET is allowed
                message: 仅允许 GET 请求
    RoomForbidden:
      description: The credential cannot open this room.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: room_forbidden
                error: Room forbidden
                message: 无权访问该房间
    OnlyPost:
      description: This endpoint only accepts POST.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyPost:
              value:
                code: method_not_allowed
                error: Only POST is allowed
                message: 仅允许 POST 请求
    OnlyGetPost:
      description: This endpoint accepts GET and POST.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyGetPost:
              value:
                code: method_not_allowed
                error: Only GET and POST are allowed
                message: 仅允许 GET / POST 请求
    MethodNotAllowed:
      description: 'The method is not one this path accepts. Note the wording differs per path family:
        the

        `/file/*` routes use the generic message below, while other paths name the allowed

        methods.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            generic:
              value:
                code: method_not_allowed
                error: Method not allowed
                message: 方法不允许
    UnsupportedTaskAction:
      description: 'The method or action is not supported on `/tasks/{id}*`. The message lists what is

        supported, which is more useful to a user than "POST only".

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported:
              value:
                code: method_not_allowed
                error: Unsupported method or action
                message: 仅支持 DELETE /tasks/:id、POST /tasks/:id/run、POST /tasks/:id/toggle
    InvalidRequestBody:
      description: The request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidBody:
              value:
                code: invalid_request_body
                error: Invalid request body
                message: 无效的请求体
    UnsupportedFormat:
      description: The `?format=` value is not one of raw/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported:
              value:
                code: unsupported_format
                error: Unsupported format
                message: 不支持的格式（只支持 raw / json）
  schemas:
    Error:
      type: object
      description: 'The single error envelope. Every error path returns exactly these three fields with

        `Content-Type: application/json; charset=utf-8`, never varying by `Accept`, and with a

        trailing newline.

        '
      required:
      - code
      - error
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          description: Machine code in snake_case. Stable once shipped — do not branch on anything else.
          examples:
          - text_too_long
        error:
          type: string
          description: Plain English, for logs and English-speaking users.
          examples:
          - Text too long
        message:
          type: string
          description: Plain Chinese, shown verbatim by clients. Limit errors embed live server config
            values.
          examples:
          - 文本内容超出限制 (最大 4096 字符)
      examples:
      - code: text_too_long
        error: Text too long
        message: 文本内容超出限制 (最大 4096 字符)
    Truthy:
      type: string
      description: 'A truthy switch. Truthy values are `1`, `true`, `yes` and `on` (case-insensitive,
        trimmed).

        Everything else is falsy.

        '
      enum:
      - '1'
      - 'true'
      - 'yes'
      - 'on'
      examples:
      - '1'
    BoardColumn:
      type: string
      description: 'Board column. `todo` is the default — a missing or empty value normalises to it. Names
        are

        matched case-insensitively and trimmed.

        '
      enum:
      - todo
      - doing
      - done
      examples:
      - doing
    ServerInfo:
      type: object
      description: The `GET /server` response. Note it carries **no** `version` and **no** size limits.
      required:
      - server
      - auth
      - authorized
      - roomProtected
      - config
      - automation
      properties:
        server:
          type: string
          description: The WebSocket URL, with the scheme already switched to `ws` / `wss`.
          examples:
          - ws://127.0.0.1:9501/push
        auth:
          type: boolean
          description: Whether the resolved context requires a password. Without `?room=` this reflects
            the global password only.
        authorized:
          type: boolean
          description: 'Whether the presented credential is good. Starts at `true` — with no `?room=`
            and no

            global password it is `true` even with no credential at all.

            '
        roomProtected:
          type: boolean
          description: Whether the room named by `?room=` requires a password. Always `false` when `?room=`
            was not supplied.
        config:
          type: object
          properties:
            server:
              type: object
              properties:
                history:
                  type: integer
                  format: int64
                  description: Entries retained per room. Also the default `GET /content` page size.
                roomList:
                  type: boolean
                  description: Whether `GET /rooms` is enabled.
        automation:
          $ref: '#/components/schemas/AutomationCapability'
    AutomationCapability:
      type: object
      description: 'Describes what the caller may do with `/tasks`. When automation is disabled server-wide
        the

        object is just `{"enabled": false}`.

        '
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        room:
          type: string
          description: The room the request resolves to.
        tier:
          type: string
          description: Policy tier. `admin` = global password; `none` = not allowed.
          enum:
          - admin
          - room
          - single
          - none
        allowed:
          type: boolean
        admin:
          type: boolean
        max:
          type: integer
          description: Maximum number of tasks; `0` means unlimited.
        defaultTZ:
          type: string
          examples:
          - Asia/Shanghai
        vars:
          type: array
          description: Template variable names the UI may offer.
          items:
            type: string
          examples:
          - - date
            - weekday
            - time
            - datetime
            - timestamp
            - uuid
            - task
            - room
        actions:
          type: array
          description: 'The action library, as metadata only. `key` / `groupKey` are i18n keys from the
            front

            end''s locale files — the server ships keys, never translations.

            '
          items:
            $ref: '#/components/schemas/AutomationAction'
    AutomationAction:
      type: object
      required:
      - id
      - group
      - groupKey
      - key
      properties:
        id:
          type: string
          examples:
          - text.trimLines
        group:
          type: string
          examples:
          - text
        groupKey:
          type: string
          examples:
          - actionGroupText
        key:
          type: string
          examples:
          - actionTrimLines
        params:
          type: array
          description: Empty (and omitted) for actions that take no parameters.
          items:
            $ref: '#/components/schemas/AutomationParam'
    AutomationParam:
      type: object
      required:
      - key
      - labelKey
      properties:
        key:
          type: string
          examples:
          - find
        labelKey:
          type: string
          examples:
          - actionParamFind
        type:
          type: string
          description: Omitted for a single-line text input; `select` for a choice.
          enum:
          - select
        options:
          type: array
          description: Omitted when empty.
          items:
            type: object
            required:
            - value
            - labelKey
            properties:
              value:
                type: string
              labelKey:
                type: string
        visibleWhen:
          type: object
          description: Omitted when absent. Shows the param only when another param equals a value.
          required:
          - key
          - equals
          properties:
            key:
              type: string
            equals:
              type: string
    TokenRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          description: The global password or a room password. An empty value is rejected with `password_required`.
          writeOnly: true
    SessionToken:
      type: object
      description: A session token. Valid for about one hour.
      required:
      - token
      - expiresAt
      - scope
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: Unix **seconds**.
        scope:
          type: string
          description: '`global` for a token minted from the global password, `""` for a room password.'
    TextSendResult:
      type: object
      description: Response of `POST /text` (both the create and overwrite paths).
      required:
      - url
      - id
      - type
      properties:
        url:
          type: string
          format: uri
          examples:
          - http://localhost:9501/content/7
        id:
          type: string
          description: The entry id, **as a string**.
          examples:
          - '7'
        type:
          type: string
          const: text
    ContentEntry:
      description: 'The JSON projection used by `GET /content` and `GET /content/{id}?format=json`.


        Branch on the presence of `content` (text) versus `name` (file). Do **not** branch on

        `type`: for a file it holds the detected media kind, not the word `file`.

        '
      oneOf:
      - $ref: '#/components/schemas/TextContentEntry'
      - $ref: '#/components/schemas/FileContentEntry'
    TextContentEntry:
      type: object
      required:
      - type
      - id
      - timestamp
      - room
      properties:
        type:
          type: string
          const: text
        content:
          type: string
          description: Omitted when empty (the empty string and "no content" are indistinguishable).
        id:
          type: string
          description: Entry id as a string.
        timestamp:
          type: integer
          format: int64
          description: Unix **seconds**. Second-granular, so it repeats within a second — never use it
            as a cursor.
        room:
          type: string
        senderIP:
          type: string
        senderClientID:
          type: string
          description: Omitted when empty.
        senderDevice:
          description: 'The sender''s device info — a free-form string map, **not** the stricter `DeviceMeta`

            used by WebSocket `connect` events. `null` when unknown, which is distinct from `{}`,

            so clients should handle all three states.

            '
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
          description: Omitted unless set. `automation` marks a message posted by a scheduled task.
        scheduledAt:
          type: integer
          format: int64
          description: Omitted unless set. The instant a task was scheduled for; differs from `timestamp`
            when backfilled.
        late:
          type: boolean
          description: Omitted unless true. The message was sent late, after missing its window.
    FileContentEntry:
      type: object
      required:
      - type
      - name
      - size
      - uuid
      - cache
      - url
      - id
      - timestamp
      - expire
      - room
      properties:
        type:
          type: string
          description: The media kind detected from the filename.
          enum:
          - image
          - audio
          - video
          - document
          - archive
          - file
        name:
          type: string
        size:
          type: integer
          format: int64
          description: Size on disk, in bytes. The entry itself carries no body — fetch the bytes from
            `url`.
        uuid:
          type: string
          description: Same value as `cache`.
        cache:
          type: string
        thumbnail:
          type: string
          description: 'A `data:image/jpeg;base64,…` thumbnail, or empty when none was generated (which
            is

            normal for archives, PDFs and videos).

            '
        url:
          type: string
          format: uri
          description: Absolute download URL **with the filename already appended**, so it can be used
            as-is.
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        expire:
          type: integer
          format: int64
          description: Unix seconds; `0` means it never expires.
        room:
          type: string
        senderIP:
          type: string
        senderClientID:
          type: string
        senderDevice:
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
    ContentList:
      type: object
      description: A page of history, ascending. An empty array means there is no more history.
      required:
      - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ContentEntry'
    LatestTextEntry:
      type: object
      description: '`GET /content/latest` for a text entry — a **compact** shape, not the rich projection
        used

        by `GET /content`.

        '
      required:
      - type
      - id
      - timestamp
      properties:
        type:
          type: string
          const: text
        content:
          type: string
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        column:
          $ref: '#/components/schemas/BoardColumn'
    LatestFileEntry:
      type: object
      description: '`GET /content/latest` for a file entry — a **compact** shape. Note it has no `cache`
        / `room`

        / `senderIP`, unlike the `GET /content` projection.

        '
      required:
      - type
      - name
      - size
      - uuid
      - url
      - id
      - timestamp
      - expire
      properties:
        type:
          type: string
          enum:
          - image
          - audio
          - video
          - document
          - archive
          - file
        name:
          type: string
        size:
          type: integer
          format: int64
        uuid:
          type: string
        url:
          type: string
          format: uri
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        expire:
          type: integer
          format: int64
        column:
          $ref: '#/components/schemas/BoardColumn'
    ColumnResult:
      type: object
      required:
      - id
      - type
      - column
      properties:
        id:
          type: string
        type:
          type: string
          description: The entry's own kind (`text` or `file`), not the media kind.
        column:
          $ref: '#/components/schemas/BoardColumn'
    RoomListResponse:
      type: object
      required:
      - rooms
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomInfo'
    RoomInfo:
      type: object
      required:
      - name
      - messageCount
      - deviceCount
      - lastActive
      - isActive
      - isProtected
      properties:
        name:
          type: string
          description: Room name. The `default` room is reported as an **empty string**.
        messageCount:
          type: integer
          format: int64
        deviceCount:
          type: integer
          format: int64
        lastActive:
          type: integer
          format: int64
          description: Unix seconds. Bumped to "now" while devices are connected.
        isActive:
          type: boolean
          description: True while at least one device is connected.
        isProtected:
          type: boolean
          description: 'Whether the room **actually** needs a password (an `{"open": true}` room reports
            `false`).'
    UploadedEntry:
      type: object
      description: Response of a completed upload (`/upload` with a file part, or `/upload/finish/{uuid}`).
      required:
      - url
      - id
      - type
      properties:
        url:
          type: string
          format: uri
          description: The entry URL (`/content/{id}`), not the raw file URL.
        id:
          type: string
        type:
          type: string
          description: The media kind detected from the filename.
          enum:
          - image
          - audio
          - video
          - document
          - archive
          - file
    ChunkInitResult:
      type: object
      description: Response of the chunked-upload initialiser (`/upload/chunk`, or `/upload` with a `text/plain`
        filename).
      required:
      - result
      properties:
        result:
          type: object
          required:
          - uuid
          properties:
            uuid:
              type: string
              format: uuid
    UploadResult:
      description: Either a completed upload, or (for the `text/plain` filename form) an initialisation
        result.
      oneOf:
      - $ref: '#/components/schemas/UploadedEntry'
      - $ref: '#/components/schemas/ChunkInitResult'
    ShareRequest:
      type: object
      description: 'Body of `POST /share`. Every field is optional (an empty body means all defaults),
        but

        **unknown fields are rejected** — a typo must not silently drop a limit.

        '
      additionalProperties: false
      properties:
        type:
          type: string
          description: '`content` or `file`. Omitted → `400 missing_type`.'
          enum:
          - content
          - file
        id:
          type: string
          description: 'For `type: content`, the entry id as a string. Also accepted for `type: file`
            in place of `uuid`.'
        uuid:
          type: string
          description: 'For `type: file`, the file uuid. Takes precedence over `id`.'
        ttl:
          type: integer
          format: int64
          description: Seconds until expiry. Default 900; clamped to 60 – 86400.
          minimum: 60
          maximum: 86400
        maxUses:
          type: integer
          format: int64
          description: Maximum number of reads. `0` (default) means unlimited.
          minimum: 0
        password:
          type: string
          description: Optional password, required from the recipient in `X-Share-Password`.
          writeOnly: true
    ShareCreatedContent:
      type: object
      required:
      - type
      - id
      - room
      - ttl
      - expiresAt
      - maxUses
      - token
      - jti
      - url
      - pageUrl
      - rawUrl
      - visits
      - scans
      properties:
        type:
          type: string
          const: content
        id:
          type: string
        room:
          type: string
        ttl:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        token:
          type: string
        jti:
          type: string
        url:
          type: string
          format: uri
          description: The share page. The same address serves crawlers and humans.
        pageUrl:
          type: string
          format: uri
          description: Kept for compatibility; currently the same value as `url`.
        rawUrl:
          type: string
          format: uri
          description: Reaches the content endpoint directly with the same token.
        visits:
          type: integer
        scans:
          type: integer
    ShareCreatedFile:
      type: object
      required:
      - type
      - uuid
      - room
      - ttl
      - expiresAt
      - maxUses
      - token
      - jti
      - url
      - pageUrl
      - rawUrl
      - visits
      - scans
      properties:
        type:
          type: string
          const: file
        uuid:
          type: string
        room:
          type: string
        ttl:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        token:
          type: string
        jti:
          type: string
        url:
          type: string
          format: uri
        pageUrl:
          type: string
          format: uri
        rawUrl:
          type: string
          format: uri
        visits:
          type: integer
        scans:
          type: integer
    ShareInfo:
      type: object
      description: '`GET /share?t=` — what the landing page needs before fetching anything. Does not consume
        a use.

        '
      required:
      - type
      - expiresAt
      - maxUses
      - needsPassword
      properties:
        type:
          type: string
          enum:
          - content
          - file
        kind:
          type: string
          description: The target's kind (`text` or `file`).
          enum:
          - text
          - file
        id:
          type: string
        room:
          type: string
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        used:
          type: integer
          description: Present only for a limited share that has a live record.
        needsPassword:
          type: boolean
        uuid:
          type: string
          description: Present for file targets.
        name:
          type: string
          description: Present for file targets.
        size:
          type: integer
          format: int64
          description: Present for file targets.
        previewToken:
          type: string
          description: 'Present **only** when the share is password-protected. Safe to embed in `<img
            src>` etc.

            '
        previewExpiresAt:
          type: integer
          format: int64
          description: Present alongside `previewToken`.
    ShareList:
      type: object
      required:
      - room
      - total
      - limit
      - records
      properties:
        room:
          type: string
        total:
          type: integer
          description: Total records for the room (not just this page).
        limit:
          type: integer
          description: The page size actually used.
        records:
          type: array
          items:
            $ref: '#/components/schemas/ShareRecord'
    ShareRecord:
      type: object
      required:
      - jti
      - type
      - kind
      - id
      - room
      - name
      - size
      - createdAt
      - expiresAt
      - maxUses
      - used
      - visits
      - scans
      - password
      - expired
      properties:
        jti:
          type: string
          description: Identifies the share in this list. The token itself is never included.
        type:
          type: string
          enum:
          - content
          - file
        kind:
          type: string
          enum:
          - text
          - file
        id:
          type: string
        room:
          type: string
        name:
          type: string
          description: Text shares carry a first-line summary; file shares carry the filename.
        size:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        used:
          type: integer
        visits:
          type: integer
        scans:
          type: integer
        password:
          type: boolean
          description: Whether a password is set — never the hash.
        expired:
          type: boolean
    ShareVisitRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: The share token. May also be supplied as `?t=`.
        qr:
          type: boolean
          description: Marks the visit as a QR scan in addition to an open.
    ShareVisitResult:
      type: object
      required:
      - ok
      - tracked
      - visits
      - scans
      properties:
        ok:
          type: boolean
          const: true
        tracked:
          type: boolean
          description: '`false` when the same visitor reported again within ten minutes.'
        visits:
          type: integer
        scans:
          type: integer
    SenderDevice:
      type: object
      description: 'The `senderDevice` map attached to a content entry. Unlike the WebSocket `connect`
        event''s

        `DeviceMeta`, this is a plain string map: there is no `id` or `device` key, and `type`

        holds the lowercase device class.


        A message with no User-Agent at all — a scheduled task — carries only

        `{name, type: "Automation"}`; the server deliberately does not parse a UA there, because

        that yields whitespace-only `os` / `browser` values that would render as a blank label.

        '
      additionalProperties:
        type: string
      properties:
        type:
          type: string
          description: Device class, or `Automation` for a message posted by a scheduled task.
          enum:
          - desktop
          - smartphone
          - tablet
          - Automation
        name:
          type: string
          description: The name the client declared via `?name=`. Absent when it declared none.
        os:
          type: string
          description: '`<family> <major>`, e.g. `iOS 17`. Trimmed, so an unknown family is just `Other`.'
        browser:
          type: string
          description: '`<family> <major>`, e.g. `Safari 17` or `curl 8`.'
      examples:
      - type: smartphone
        name: iPhone
        os: iOS 18
        browser: Safari 18
    DeviceMeta:
      type: object
      description: 'A connected device. Only `name` is omitted when empty; `id`, `type`, `device`, `os`
        and

        `browser` are always present, even as empty strings.

        '
      required:
      - id
      - type
      - device
      - os
      - browser
      properties:
        id:
          type: string
          description: A stable hash of the connection, used for de-duplication.
        type:
          type: string
          examples:
          - Desktop
          - mobile
          - Automation
        name:
          type: string
          description: The name the client declared, if any. Omitted when empty.
        device:
          type: string
          examples:
          - Apple Mac
        os:
          type: string
          examples:
          - macOS 14
        browser:
          type: string
          examples:
          - Chrome 120
    DisconnectData:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The device id whose last connection closed.
    RevokeData:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int32
          description: The id of the deleted entry. Note this is a **number** here, unlike the string
            ids in content payloads.
    ClearAllData:
      type: object
      required:
      - room
      properties:
        room:
          type: string
    WsConfig:
      type: object
      description: 'The `config` frame, sent once after connecting and before any realtime message. It
        is the

        **only** source of `version` and the size limits, and the only source of the front end''s

        `app.config`.

        '
      required:
      - version
      - server
      - text
      - file
      - auth
      - latestId
      - automation
      properties:
        version:
          type: string
          examples:
          - 0.1.0
        server:
          type: object
          properties:
            history:
              type: integer
              format: int64
            prefix:
              type: string
            roomList:
              type: boolean
        text:
          type: object
          properties:
            limit:
              type: integer
              format: int64
              description: Maximum text length in **bytes**. `0` means unlimited.
        file:
          type: object
          properties:
            expire:
              type: integer
              format: int64
              description: Default file lifetime in seconds; `0` means never expires.
            chunk:
              type: integer
              format: int64
            limit:
              type: integer
              format: int64
        auth:
          type: boolean
          description: Whether this room required a credential at handshake time.
        latestId:
          type: integer
          format: int32
          description: 'The largest message id in the room at connect time (`0` when empty). Use it as
            the

            history/realtime boundary. Absent on older servers — in that case a client must not

            write to the clipboard.

            '
        automation:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
    ReceiveEntry:
      description: 'The `receive` / `update` payload — the entry exactly as stored, which is also the
        shape

        `GET /content` projects to. Branch on `type`: `text` or `file`.

        '
      oneOf:
      - $ref: '#/components/schemas/ReceiveTextEntry'
      - $ref: '#/components/schemas/ReceiveFileEntry'
    ReceiveTextEntry:
      type: object
      required:
      - id
      - type
      - room
      - timestamp
      properties:
        id:
          type: integer
          format: int32
          description: Entry id — a **number** in the realtime payload.
        type:
          type: string
          const: text
        room:
          type: string
        timestamp:
          type: integer
          format: int64
        senderIP:
          type: string
        senderClientID:
          type: string
          description: Omitted when empty.
        senderDevice:
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
        content:
          type: string
          description: Omitted when empty.
        deviceConnection:
          $ref: '#/components/schemas/DeviceMeta'
        deviceID:
          type: string
    ReceiveFileEntry:
      type: object
      required:
      - id
      - type
      - room
      - timestamp
      - name
      - size
      - cache
      - expire
      properties:
        id:
          type: integer
          format: int32
        type:
          type: string
          const: file
        room:
          type: string
        timestamp:
          type: integer
          format: int64
        senderIP:
          type: string
        senderClientID:
          type: string
        senderDevice:
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
        name:
          type: string
        size:
          type: integer
          format: int64
        cache:
          type: string
          description: Usually the file uuid.
        expire:
          type: integer
          format: int64
        thumbnail:
          type: string
        url:
          type: string
          format: uri
          description: Omitted when empty.
    ChainStep:
      description: 'One step of an action chain. A step with no parameters is written as a bare string;
        a

        parameterised step is an object. Both forms are accepted, and parameterless steps are

        written back as strings so existing data is never reshaped.

        '
      oneOf:
      - type: string
        description: An action id, e.g. `text.trimLines`.
      - type: object
        required:
        - id
        properties:
          id:
            type: string
          params:
            type: object
            description: Parameters for this step only.
            additionalProperties:
              type: string
    TaskRequest:
      type: object
      description: 'Body of `POST /tasks` and `POST /tasks/preview`. There is **no `room` field** — the
        room

        comes from the credential.

        '
      properties:
        id:
          type: string
          description: Omitted to create; supplied to replace that task wholesale.
        name:
          type: string
          description: Falls back to the first line of the rendered body when empty.
        enabled:
          type: boolean
          description: Defaults to `true`.
        freq:
          type: string
          description: Schedule kind.
          enum:
          - once
          - daily
          - weekly
          - cron
        time:
          type: string
          description: '`HH:MM`, for `daily` / `weekly`.'
        cron:
          type: string
          description: 'Five-field expression, for `freq: cron` — `<min> <hour> <dom> <month> <dow>`.'
        byWeekday:
          type: array
          description: For `weekly`. `0` = Sunday … `6` = Saturday, matching `Date.getDay()`.
          items:
            type: integer
            minimum: 0
            maximum: 6
        runAt:
          type: string
          description: 'For `once`: RFC3339, or `2026-10-01T09:30` interpreted in `tz`. Normalised to
            RFC3339.

            '
        tz:
          type: string
          description: Omitted → filled from `automation.defaultTZ` and stored on the task.
        template:
          type: string
          description: 'The body template. `{{ }}` variables are evaluated at firing time; unknown variables

            and malformed offsets are rejected at save time.

            '
        chain:
          type: array
          description: Optional ordered list of steps applied to the rendered text. A failing step stops
            the chain.
          items:
            $ref: '#/components/schemas/ChainStep'
        keepHistory:
          type: boolean
          description: Defaults to `false` — the message is broadcast but does not consume room history
            quota.
        sender:
          type: string
          description: Display name. Defaults to `定时任务`.
    Task:
      type: object
      description: An automation as returned by the API. `ownerHash` is never exposed.
      required:
      - id
      - name
      - enabled
      - freq
      - room
      - template
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        freq:
          type: string
          enum:
          - once
          - daily
          - weekly
          - cron
        time:
          type: string
        cron:
          type: string
        byWeekday:
          type: array
          items:
            type: integer
        runAt:
          type: string
        tz:
          type: string
        room:
          type: string
        template:
          type: string
        chain:
          type: array
          items:
            $ref: '#/components/schemas/ChainStep'
        keepHistory:
          type: boolean
        sender:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        nextRunAt:
          type: integer
          format: int64
          description: Next fire time, Unix seconds; `0` when disabled or exhausted.
        lastRunAt:
          type: integer
          format: int64
        lastStatus:
          type: string
          description: Outcome of the last firing.
          enum:
          - ''
          - ok
          - error
          - skipped
        lastError:
          type: string
        lastOutput:
          type: string
        desc:
          $ref: '#/components/schemas/CronDesc'
    CronDesc:
      type: object
      description: 'A structured, prose-free summary of a cron expression. It describes only the shape;
        clients

        compose the sentence from their own message table. It never contains expression syntax

        (`*`, `/`, `?`).

        '
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - everyMinute
          - everyNMinutes
          - everyNHours
          - minutesEachHour
          - times
          - unknown
        n:
          type: integer
        minutes:
          type: string
        hours:
          type: string
        day:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          - monthlyOrWeekly
          - everyNDays
          - everyNDaysOrWeekly
        weekdays:
          type: array
          items:
            type: integer
        dom:
          type: string
        month:
          type: string
        dayN:
          type: integer
        times:
          type: array
          items:
            type: string
        more:
          type: boolean
          description: True when the summarised list was truncated.
    TaskList:
      type: object
      required:
      - room
      - tier
      - admin
      - tasks
      - max
      - now
      - actions
      - vars
      properties:
        room:
          type: string
        tier:
          type: string
          enum:
          - admin
          - room
          - single
          - none
        admin:
          type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        max:
          type: integer
          description: Task limit for this room; `0` means unlimited.
        now:
          type: integer
          format: int64
        foreignCount:
          type: integer
          description: Present only when some tasks in the room were hidden because they are not yours.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationAction'
        vars:
          type: array
          items:
            type: string
    TaskSaved:
      type: object
      required:
      - task
      properties:
        task:
          $ref: '#/components/schemas/Task'
        taskToken:
          type: string
          description: 'Present **only** when a `single`-tier room creates a task. It is shown exactly
            once and

            is the only way to later edit or delete that task.

            '
    TaskDeleted:
      type: object
      required:
      - deleted
      - id
      properties:
        deleted:
          type: boolean
          const: true
        id:
          type: string
    TaskRooms:
      type: object
      required:
      - room
      - admin
      - rooms
      properties:
        room:
          type: string
        admin:
          type: boolean
        rooms:
          type: array
          items:
            type: object
            required:
            - room
            - count
            properties:
              room:
                type: string
              count:
                type: integer
    CronCheck:
      type: object
      description: 'The result of validating a cron expression. An invalid expression is a **200** with

        `valid: false`; only an unusable time zone is a 400.

        '
      required:
      - expr
      - tz
      - valid
      - room
      properties:
        expr:
          type: string
          description: The normalised expression (identical to the input when valid).
        tz:
          type: string
        valid:
          type: boolean
        room:
          type: string
        error:
          type: string
          description: Present when `valid` is false.
        next:
          type: array
          description: Upcoming fire times, Unix seconds. Absent when `valid` is false.
          items:
            type: integer
            format: int64
        nextFormatted:
          type: array
          description: The same instants, formatted as `YYYY-MM-DD HH:MM Day`.
          items:
            type: string
        desc:
          $ref: '#/components/schemas/CronDesc'
    TaskPreview:
      type: object
      description: The rendered output of an unsaved task. Nothing was persisted or sent.
      required:
      - preview
      - output
      - room
      - keepHistory
      - referenceAt
      - nextRunAt
      - referenceAt2
      properties:
        preview:
          type: boolean
          const: true
        output:
          type: string
        room:
          type: string
        keepHistory:
          type: boolean
        referenceAt:
          type: integer
          format: int64
        nextRunAt:
          type: integer
          format: int64
        referenceAt2:
          type: string
          description: 'The reference instant as RFC3339. NOTE (code): this field is named `referenceAt2`
            on the

            preview endpoint, whereas the dry run of a saved task calls the same idea `scheduledAt`.

            '
    TaskRunDry:
      type: object
      required:
      - preview
      - output
      - taskId
      - room
      - keepHistory
      - referenceAt
      - nextRunAt
      - scheduledAt
      properties:
        preview:
          type: boolean
          const: true
        output:
          type: string
        taskId:
          type: string
        room:
          type: string
        keepHistory:
          type: boolean
        referenceAt:
          type: integer
          format: int64
        nextRunAt:
          type: integer
          format: int64
        scheduledAt:
          type: string
          description: The reference instant as RFC3339.
    TaskRunSent:
      type: object
      required:
      - sent
      - output
      - taskId
      - room
      - keepHistory
      - sentAt
      properties:
        sent:
          type: boolean
          const: true
        output:
          type: string
        taskId:
          type: string
        room:
          type: string
        keepHistory:
          type: boolean
        sentAt:
          type: integer
          format: int64
