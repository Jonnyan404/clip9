                      keepHistory: false
                      sender: 定时任务
                      createdAt: 1757900000
                      updatedAt: 1757900000
                    taskToken: f4a2c9e1b7d3450689abcdef01234567
        '400':
          description: Bad body, invalid task, room limit reached, or an unreadable source room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badBody:
