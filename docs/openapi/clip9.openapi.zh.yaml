  /content/{id}:
    get:
      tags:
      - Content
      summary: 按 id 取一条
      description: '取单独一条。你给的 `?room=` **必须**和该条目记录的房间一致，否则服务端回 `404 content_not_found`

        （它不会确认「你叫错的那个房间里」有没有这条）。


        鉴权可以是房间凭据，**或者**（仅限读）`?t=` 里的分享令牌。分享令牌**永远不能**授权写操作。


        文本条目默认返回原始文本（**总带一个换行**，免得 `curl` 的输出和提示符粘在一起），

        带 `?format=json` 则返回**丰富**的 JSON 投影。文件条目没有正文可返回：`?format=json` 给投影，

        而原始分支回 `404 file_expired`（字节在 `/file/{uuid}`）。

        '
      operationId: getContentById
      parameters:
      - name: id
        in: path
        required: true
        description: 条目 id。必须是整数 —— 非数字的 id 是 **400，不是 404**。
        schema:
          type: integer
          format: int32
        example: 7
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/FormatQuery'
      - $ref: '#/components/parameters/JsonQuery'
      - $ref: '#/components/parameters/ShareTokenQuery'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      - shareTokenQuery: []
      responses:
        '200':
          description: 该条目，原始内容或 JSON 投影。
          content:
            text/plain:
              schema:
                type: string
              examples:
                rawText:
                  value: 'hello world

                    '
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
              examples:
                text:
                  summary: 文本条目的投影
                  value:
                    type: text
                    content: hello world
                    id: '7'
                    timestamp: 1758000000
                    room: default
                    senderIP: 203.0.113.7
                    senderClientID: web-1a2b
                    senderDevice:
                      name: iPhone
                      type: smartphone
                      os: iOS 18
                      browser: Safari 18
                    column: todo
                file:
                  summary: 文件条目的投影
                  value:
                    type: image
                    name: photo.png
                    size: 20480
                    uuid: 11111111-2222-3333-4444-555555555555
                    cache: 11111111-2222-3333-4444-555555555555
                    thumbnail: data:image/jpeg;base64,/9j/4AAQSkZJRg==
                    url: http://localhost:9501/file/11111111-2222-3333-4444-555555555555/photo.png
                    id: '8'
                    timestamp: 1758000060
                    expire: 1758003600
                    room: default
                    senderIP: 203.0.113.7
                    senderDevice:
                      name: iPhone
                      type: smartphone
                      os: iOS 18
                      browser: Safari 18
                    column: todo
        '400':
          description: id 不是数字，或 `?format=` 不是 raw / json 之一。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badId:
                  value:
                    code: invalid_content_id
                    error: Invalid content id
                    message: 无效的内容 ID
                badFormat:
                  value:
                    code: unsupported_format
                    error: Unsupported format
                    message: 不支持的格式（只支持 raw / json）
        '401':
          description: 无权访问该条目所在的房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '404':
          description: 不存在、房间对不上，或（原始分支上）文件已过期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
        '405':
