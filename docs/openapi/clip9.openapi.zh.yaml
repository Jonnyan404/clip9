  /tasks/{id}:
    delete:
      tags:
      - Automation
      summary: 删掉一个定时任务
      description: Removes the task. The caller must own it (admin, or same room for `room` tier, or the
        matching task token for `single` tier).
      operationId: deleteTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      - $ref: '#/components/parameters/TaskTokenQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      - taskToken: []
      responses:
        '200':
          description: The task was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDeleted'
              examples:
                deleted:
                  value:
                    deleted: true
                    id: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
        '403':
          description: The task belongs to somebody else or another room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: task_forbidden
                    error: Task belongs to someone else
                    message: 这条任务不是你创建的
        '404':
          description: No such task (or automation is disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: task_not_found
                    error: Task not found
                    message: 任务不存在
        '405':
          description: 'Wrong method or unsupported action. NOTE (code): the task is resolved **before**
            the

            method is judged, so `GET /tasks/{id}` for a non-existent id returns

            `404 task_not_found`, not a 405.


            NOTE (code): the router also carries a catch-all route for `/tasks/{id}/{action}`,

            which answers exactly this 405 instead of falling through to the static-file

            fallback (which would return HTML with status 200). It is not modelled as its own

            OpenAPI path because it has no success case; the two real actions are

            `/tasks/{id}/run` and `/tasks/{id}/toggle`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupported:
                  value:
                    code: method_not_allowed
                    error: Unsupported method or action
                    message: 仅支持 DELETE /tasks/:id、POST /tasks/:id/run、POST /tasks/:id/toggle
  /tasks/{id}/run:
    post:
      tags:
      - Automation
      summary: 试跑一个任务，或者立刻发一次
      description: "Renders the saved task against its next scheduled instant and returns the output.\n\
        \n- Without `send`, nothing is sent — a pure dry run.\n- With `?send=1`, the message is actually\
        \ broadcast now.\n- `?at=` overrides the reference instant (RFC3339, or `2026-09-25` / `2026-09-25\
        \ 09:30`);\n  an unparseable value is a 400, never a silent fallback.\n- NOTE (code): the dry\
        \ run and the send branches share `output`, `taskId`, `room` and\n  `keepHistory`, but the dry\
        \ run adds `preview` / `referenceAt` / `nextRunAt` /\n  `scheduledAt` while the send branch adds\
        \ `sent` / `sentAt`.\n"
      operationId: runTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
      - name: send
        in: query
        required: false
        description: When truthy, send the message now instead of only rendering it.
        schema:
          $ref: '#/components/schemas/Truthy'
        example: 1
      - name: at
        in: query
        required: false
        description: Reference instant for a dry run.
        schema:
          type: string
        example: '2026-09-24T09:30:00+08:00'
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      - $ref: '#/components/parameters/TaskTokenQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      - taskToken: []
      responses:
        '200':
          description: The rendered output (dry run) or the send confirmation.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TaskRunDry'
                - $ref: '#/components/schemas/TaskRunSent'
              examples:
                dry:
                  summary: Dry run (no `send`)
                  value:
                    preview: true
                    output: Today is 2026-09-24
                    taskId: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                    room: home
                    keepHistory: false
                    referenceAt: 1758677400
                    nextRunAt: 1758677400
                    scheduledAt: '2026-09-24T09:30:00+08:00'
                sent:
                  summary: Sent with ?send=1
                  value:
                    sent: true
                    output: Today is 2026-09-24
                    taskId: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                    room: home
                    keepHistory: false
                    sentAt: 1758000000
        '400':
          description: A bad `?at=`, a rendering failure, or an invalid task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badReference:
                  value:
                    code: invalid_reference
                    error: Invalid reference time
                    message: 无法解析的时间：2026-13-45
                renderFailed:
                  value:
                    code: render_failed
                    error: Render failed
                    message: 房间 secret 需要密码，无法作为来源
        '403':
          description: The task belongs to somebody else or another room, or the room disallows automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: task_forbidden
                    error: Task belongs to someone else
                    message: 这条任务不是你创建的
        '404':
          description: No such task (or automation is disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: task_not_found
                    error: Task not found
                    message: 任务不存在
        '405':
          $ref: '#/components/responses/UnsupportedTaskAction'
  /tasks/{id}/toggle:
    post:
      tags:
      - Automation
      summary: 启用 / 停用一个定时任务
      description: 'Flips `enabled` by default; `?enabled=1` / `?enabled=0` sets it explicitly. Only the

        switch is touched — never the template, the chain or the idempotency key, so toggling

        off and on does not fire an extra message.

