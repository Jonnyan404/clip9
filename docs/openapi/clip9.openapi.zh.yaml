  /content/{id}:
    get:
      tags:
      - Content
      summary: 按 id 取一条
      description: '取单独一条。你给的 `?room=` **必须**和该条目记录的房间一致，否则服务端回 `404 content_not_found`

        （它不会确认「你叫错的那个房间里」有没有这条）。


        鉴权可以是房间凭据，**或者**（仅限读）`?t=` 里的分享令牌。分享令牌**永远不能**授权写操作。


        文本条目默认返回原始文本（**总带一个换行**，免得 `curl` 的输出和提示符粘在一起），

        带 `?format=json` 则返回**丰富**的 JSON 投影。文件条目没有正文可返回：`?format=json` 给投影，

        而原始分支回 `404 file_expired`（字节在 `/file/{uuid}`）。

        '
      operationId: getContentById
      parameters:
      - name: id
        in: path
        required: true
        description: 条目 id。必须是整数 —— 非数字的 id 是 **400，不是 404**。
        schema:
          type: integer
          format: int32
        example: 7
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/FormatQuery'
      - $ref: '#/components/parameters/JsonQuery'
      - $ref: '#/components/parameters/ShareTokenQuery'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      - shareTokenQuery: []
      responses:
        '200':
          description: 该条目，原始内容或 JSON 投影。
          content:
            text/plain:
              schema:
                type: string
              examples:
                rawText:
                  value: 'hello world

                    '
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
              examples:
                text:
                  summary: 文本条目的投影
                  value:
                    type: text
                    content: hello world
                    id: '7'
                    timestamp: 1758000000
                    room: default
                    senderIP: 203.0.113.7
                    senderClientID: web-1a2b
                    senderDevice:
                      name: iPhone
                      type: smartphone
                      os: iOS 18
                      browser: Safari 18
                    column: todo
                file:
                  summary: 文件条目的投影
                  value:
                    type: image
                    name: photo.png
                    size: 20480
                    uuid: 11111111-2222-3333-4444-555555555555
                    cache: 11111111-2222-3333-4444-555555555555
                    thumbnail: data:image/jpeg;base64,/9j/4AAQSkZJRg==
                    url: http://localhost:9501/file/11111111-2222-3333-4444-555555555555/photo.png
                    id: '8'
                    timestamp: 1758000060
                    expire: 1758003600
                    room: default
                    senderIP: 203.0.113.7
                    senderDevice:
                      name: iPhone
                      type: smartphone
                      os: iOS 18
                      browser: Safari 18
                    column: todo
        '400':
          description: id 不是数字，或 `?format=` 不是 raw / json 之一。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badId:
                  value:
                    code: invalid_content_id
                    error: Invalid content id
                    message: 无效的内容 ID
                badFormat:
                  value:
                    code: unsupported_format
                    error: Unsupported format
                    message: 不支持的格式（只支持 raw / json）
        '401':
          description: 无权访问该条目所在的房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '404':
          description: 不存在、房间对不上，或（原始分支上）文件已过期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
        '405':
          $ref: '#/components/responses/OnlyGet'
  /content/{id}/column:
    post:
      tags:
      - Content
      summary: 把一条挪到看板的某一列
      description: '看板是**同一批条目的一个视图**，不是第二份存储：这个接口只在条目上设**一个**字段，别的什么都不动，

        然后广播 `update`。


        - 三列是固定的：`todo`（默认；空或缺失的列都归一到它）、`doing`、`done`。列名**忽略大小写并去首尾空白**。

        - 文本与文件条目都适用。

        - **`timestamp` 刻意不动。** `POST /text?id=` 改写正文时会刷新它，但拖一张卡片**不该**把它顶到时间线最上面。

        - 鉴权要房间凭据。分享令牌**不接受** —— 它是只读的。

        - NOTE (code)：这里的失败码是 `room_auth_required`，与读接口用的 `room_forbidden` **不同**。客户端可以据此分支。

        '
      operationId: setContentColumn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: 7
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column:
                  $ref: '#/components/schemas/BoardColumn'
            examples:
              move:
                value:
                  column: doing
      responses:
        '200':
          description: 条目已挪动。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResult'
              examples:
                moved:
                  value:
                    id: '7'
                    type: text
                    column: doing
        '400':
          description: id 不对、JSON 体不对，或列名不认识。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badId:
                  value:
                    code: invalid_content_id
                    error: Invalid content id
                    message: 无效的内容 ID
                badBody:
                  value:
                    code: invalid_body
                    error: Invalid JSON body
                    message: 请求体不是合法的 JSON
                badColumn:
                  value:
                    code: invalid_column
                    error: Unknown board column
                    message: 未知的看板列（只支持 todo / doing / done）
        '401':
          description: 无权访问该条目所在的房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                required:
                  value:
                    code: room_auth_required
                    error: Room authentication required
                    message: 无权访问该房间
        '404':
          description: 没这条，或者它不在请求的那个房间里。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
        '405':
          $ref: '#/components/responses/OnlyPost'
  /rooms:
    get:
      tags:
      - Rooms
      summary: 房间列表
      description: "列出调用方看得见的房间。需要打开 `server.roomList`，否则回 `403 room_list_disabled`。\n\n- 凭据打不开的房间**整个不出现**，而不是列出来挂把锁。\n\
        - `default` 房间的 `name` 报成**空串**（前端把空名字当作默认房间）。\n- 数组顺序**不属于契约**（Go 版遍历的是 map）。这个服务端给的是确定顺序，但客户端不该依赖它。\n\
        - `isProtected` 的意思是「**确实**需要密码」，所以显式配了 `{\"open\": true}` 的房间即使存在全局密码也报 `false`。\n- 凭据可以给一个主的\
        \ + 若干个附加的，附加的走 `X-Room-Auth-Tokens`（JSON 数组或逗号分隔）——\n  手里有好几个房间密码的客户端靠它一次看全自己所有的房间。\n"
      operationId: listRooms
      parameters:
      - $ref: '#/components/parameters/AuthQuery'
      - name: X-Room-Auth-Tokens
        in: header
        required: false
        description: 附加凭据，JSON 数组（`["a","b"]`）或逗号分隔（`a, b`）。首尾空白会去掉、重复的丢掉、顺序保留，主凭据排在最前。
        schema:
          type: string
        example: '["home-pass","work-pass"]'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: 看得见的那些房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
              examples:
                list:
                  value:
                    rooms:
                    - name: ''
                      messageCount: 12
                      deviceCount: 2
                      lastActive: 1758000000
                      isActive: true
                      isProtected: false
                    - name: home
                      messageCount: 3
                      deviceCount: 0
                      lastActive: 1757990000
                      isActive: false
                      isProtected: true
        '403':
          description: 这个服务端关掉了房间列表功能。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: room_list_disabled
                    error: Room list disabled
                    message: 房间列表功能未启用
        '405':
          $ref: '#/components/responses/OnlyGet'
  /stats/daily:
    get:
      tags:
      - Stats
      summary: 房间每天的活跃度
      description: "活跃度热力图背后的数据：这个房间在最近 `days` 个**本地日**里各收到多少条。\n\n**时区是调用方的，不是服务端的。** `tz` 收 IANA 名字；服务端不知道看图的人在哪，\n\
        而「今天」必须是**他的**今天。按 UTC 分桶的话，东八区晚上 8 点之后的活跃会被算进第二天。\n认不出来的名字回落 `UTC`，响应里的 `tz` 报**实际用的**那个\n（`requestedTz`\
        \ 把请求的原样回显，调用方据此分辨有没有回落）。\n\n**`levels` 是这个房间自己那些非零天的分位数**，不是固定阈值。一个每天只收三条的房间，\n在固定阈值下会整张图都是最浅色\
        \ —— 而「哪几天更多」正是来看这张图的唯一理由。\n代价是同一个颜色在不同房间里代表不同的量，所以响应里带着那几道阈值，界面上印的是实际区间。\n\n- `days` 夹到 `371`（53\
        \ 周）。`0`、负数和非数字都表示「没给」而回落到默认值 ——\n  **不是**一张空图，那会被读成「这个房间从来没有过东西」。\n- **已过期的文件不算数。** 服务端在文件过期时会把时间线那条删掉，这里再算一遍会让房间\n\
        \  显得比时间线上看到的更活跃。\n- 窗口为空时 `busiest` 是 `null`；并列时取**最近**那天。\n"
      operationId: getRoomDailyActivity
      parameters:
      - name: room
        in: query
        required: false
        description: 要统计的房间。不传即 `default` 房间。
        schema:
          type: string
        example: work
      - name: days
        in: query
        required: false
        description: 窗口天数，截止到今天。夹到 `371`。`0`、负数和非数字都当作「没给」。
        schema:
          type: integer
          minimum: 0
          maximum: 371
        example: 371
      - name: tz
        in: query
        required: false
        description: 用来判断某个时间戳属于哪个本地日的 IANA 时区名。认不出来就回落 `UTC`。
        schema:
          type: string
        example: Asia/Shanghai
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: 所请求窗口内每天的条数。
          content:
            application/json:
              schema:
                type: object
                required:
                - room
                - tz
                - requestedTz
                - truncated
                - activity
                properties:
                  room:
                    type: string
                  tz:
                    type: string
                    description: '**实际用的**时区（回落之后）。'
                  requestedTz:
                    type: string
                    description: 调用方请求的那个，原样回显，这样回落就看得见。
                  truncated:
                    type: boolean
                    description: 为真表示扫描撞到了行数上限，窗口里最旧的那几天可能少算。
                  activity:
                    type: object
                    required:
                    - days
                    - total
                    - busiest
                    - streak
                    - levels
                    properties:
                      days:
                        type: array
                        description: 旧的在前；长度恰好等于生效的 `days`。
                        items:
                          type: object
                          required:
                          - date
                          - count
                          properties:
                            date:
                              type: string
                              description: 本地日期，`YYYY-MM-DD`。
                            count:
                              type: integer
                      total:
                        type: integer
                      busiest:
                        type: object
                        nullable: true
                        properties:
                          date:
                            type: string
                          count:
                            type: integer
                      streak:
                        type: object
                        required:
                        - current
                        - longest
                        properties:
                          current:
                            type: integer
                            description: 一直到今天的连续天数。今天还没内容时**跳过它**、从昨天往回数 —— 这样这个数不会每天早上都掉回 0。
                          longest:
                            type: integer
                      levels:
                        type: array
                        description: 配色用的四道递增阈值。窗口内活跃天不足四天时，这四个值相等。
                        items:
                          type: integer
              examples:
                week:
                  value:
                    room: work
                    tz: Asia/Shanghai
                    requestedTz: Asia/Shanghai
                    truncated: false
                    activity:
                      days:
                      - date: '2026-10-01'
                        count: 0
                      - date: '2026-10-02'
                        count: 3
                      - date: '2026-10-03'
                        count: 0
                      - date: '2026-10-04'
                        count: 12
                      - date: '2026-10-05'
                        count: 5
                      - date: '2026-10-06'
                        count: 0
                      - date: '2026-10-07'
                        count: 8
                      total: 28
                      busiest:
                        date: '2026-10-04'
                        count: 12
                      streak:
                        current: 2
                        longest: 3
                      levels:
                      - 3
                      - 5
                      - 8
                      - 12
                unknownTimezone:
                  summary: '`tz` 认不出来时回落 UTC'
                  value:
                    room: ''
                    tz: UTC
                    requestedTz: Not/AZone
                    truncated: false
                    activity:
                      days:
                      - date: '2026-10-06'
                        count: 0
                      - date: '2026-10-07'
                        count: 1
                      total: 1
                      busiest:
                        date: '2026-10-07'
                        count: 1
                      streak:
                        current: 1
                        longest: 1
                      levels:
                      - 1
                      - 1
                      - 1
                      - 1
        '403':
          $ref: '#/components/responses/RoomForbidden'
  /upload:
    post:
      tags:
      - Files
      summary: 整份上传（multipart）
      description: '一次请求传完一个小文件：写字节、登记文件、在房间里存一条文件条目、广播 `receive`，

        然后返回条目 id 与 URL。


        表单字段名**永远是 `file`**。


        特殊情况：当 `Content-Type` **逐字符**等于 `text/plain` 时（`text/plain; charset=utf-8` **不算**），

        请求体被当成一个**文件名**，这个接口就变成了分片上传的初始化 —— 与 `POST /upload/chunk` 完全一样。

        这是与 Go 实现共有的、刻意保留并且写进文档的怪癖。


        有 `Content-Length` 时，会先拿它跟 `file.limit` 比，**在把文件读进内存之前**就拒掉超大的。


        NOTE (code)：成功响应体是 `{url, id, type}` —— 与 `/text` 同样那三个字段。旧文档在这里还写了

        `name` / `size` / `uuid` / `expire`，这个服务端不返回它们。`type` 是按文件名探测出的媒体种类，

        **不是**字面量 `file`。

        '
      operationId: uploadFile
      parameters:
      - $ref: '#/components/parameters/RoomQuery'
      - $ref: '#/components/parameters/NameQuery'
      - $ref: '#/components/parameters/ClientQuery'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件字节。part 头里的文件名会成为条目的 `name`。
          text/plain:
            schema:
              type: string
            examples:
              initAsFilename:
                summary: 请求体是文件名 —— 这时它充当分片上传的初始化
                value: 'big-video.mp4

                  '
      responses:
        '200':
          description: 文件已存下并广播（`text/plain` 那种形式则是已初始化）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              examples:
                uploaded:
                  value:
                    url: http://localhost:9501/content/8
                    id: '8'
                    type: image
                initialised:
                  summary: 分片上传初始化的响应
                  value:
                    result:
                      uuid: 11111111-2222-3333-4444-555555555555
        '400':
          description: 表单解析不了，或者没有 `file` 字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badForm:
                  value:
                    code: form_parse_failed
                    error: Cannot parse form data
                    message: 无法解析表单数据
                noField:
                  value:
                    code: file_field_missing
                    error: Cannot read uploaded file
                    message: 无法获取文件
        '401':
          description: 无权访问目标房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '413':
          description: 文件超过 `file.limit`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: file_too_large
                    error: File too large
                    message: 文件大小超出限制 (最大 268435456 字节)
        '500':
          description: 写文件或登记失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                saveFailed:
                  value:
                    code: file_save_failed
                    error: Cannot save file
                    message: 无法保存文件
        '405':
          $ref: '#/components/responses/OnlyPost'
  /upload/chunk:
    post:
      tags:
      - Files
      summary: 分片上传 —— 初始化
      description: '分片上传的第一步。请求体是**文件名**（纯文本），这时还不写任何字节。

        响应里带着 `uuid`，后面追加分片与收尾都用它。


        ```text

        POST /upload/chunk          body = 文件名            → {"result":{"uuid":"..."}}

        POST /upload/chunk/{uuid}   body = 一片的字节        → {}

        POST /upload/finish/{uuid}  （无 body）              → {"url","id","type"}

        ```


        这条路由与 `POST /upload` **共用同一个处理器**，区别只在路径和那道 `Content-Type: text/plain` 的关卡。

        '
      operationId: initChunkedUpload
      parameters:
      - $ref: '#/components/parameters/RoomQuery'
      - $ref: '#/components/parameters/NameQuery'
      - $ref: '#/components/parameters/ClientQuery'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      requestBody:
        required: true
        description: 文件名，纯文本。
        content:
          text/plain:
            schema:
              type: string
            examples:
              init:
                value: 'big-video.mp4

                  '
      responses:
        '200':
          description: 一个新的上传 uuid。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkInitResult'
              examples:
                init:
                  value:
                    result:
                      uuid: 11111111-2222-3333-4444-555555555555
        '401':
          description: 无权访问目标房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '500':
          description: 登记这次上传失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                saveFailed:
                  value:
                    code: file_save_failed
                    error: Cannot save file
                    message: 无法保存文件
        '405':
          $ref: '#/components/responses/OnlyPost'
  /upload/chunk/{uuid}:
    post:
      tags:
      - Files
      summary: 分片上传 —— 追加一片
      description: '往一个先前用 `POST /upload/chunk` 初始化过的上传里追加原始字节。每次调用都会更新已记录的体积，

        累计值会拿去跟 `file.limit` 比。


        分片大小按 `file.chunk`（默认 1 MiB）左右发。**单个请求体上限 16 MiB**，由 HTTP 层管，

        与 `file.limit` 无关。


        NOTE (code)：鉴权用的是**初始化时记录在上传上的那个房间**，不是这次请求里带的 `?room=`。

        '
      operationId: appendChunk
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-2222-3333-4444-555555555555
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 分片已追加。
          content:
            application/json:
              schema:
                type: object
                description: 一个空对象（这个服务端在这里**不回 204**）。
                additionalProperties: false
              examples:
                ok:
                  value: {}
        '400':
          description: 那个 uuid 下没有登记过上传。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badUuid:
                  value:
                    code: invalid_uuid
                    error: Invalid UUID
                    message: 无效的 UUID
        '401':
          description: 无权访问这次上传所属的房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '413':
          description: 累计体积会超过 `file.limit`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: file_too_large
                    error: File too large
                    message: 文件大小已超过限制 (最大 268435456 字节)
        '500':
          description: 分片写不进去。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                writeFailed:
                  value:
                    code: file_write_failed
                    error: Cannot write file
                    message: 无法写入文件
        '405':
          $ref: '#/components/responses/OnlyPost'
  /upload/finish/{uuid}:
    post:
      tags:
      - Files
      summary: 分片上传 —— 封口并广播
      description: '收尾一次分片上传：生成文件条目（字节能解码成图片、且不超过 32 MiB 时**顺带生成缩略图**）、

        存下来、广播 `receive`。


        房间取自**这次上传自己的登记**；在这里带 `?room=default` **不能**把它挪出受保护的房间。


        NOTE (code)：成功响应体是 `{url, id, type}`，而 `type` 是按文件名探测出的媒体种类，

        不是字面量 `file`。

        '
      operationId: finishChunkedUpload
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-2222-3333-4444-555555555555
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/NameQuery'
      - $ref: '#/components/parameters/ClientQuery'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: 文件条目已存下并广播。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              examples:
                finished:
                  value:
                    url: http://localhost:9501/content/9
                    id: '9'
                    type: video
        '400':
          description: 那个 uuid 下没有登记过上传。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badUuid:
                  value:
                    code: invalid_uuid
                    error: Invalid UUID
                    message: 无效的 UUID
        '401':
          description: 无权访问这次上传所属的房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '500':
          description: 存消息失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                storeFailed:
                  value:
