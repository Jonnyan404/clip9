openapi: 3.1.0
info:
  title: clip9 API
  version: 0.1.0
  summary: clip9 Rust 服务端（crates/server）的 REST + WebSocket 契约
  description: '# clip9 API


    `clip9-server`（`rust/crates/server`）对外提供的 HTTP + WebSocket 接口。

    它是 Cloud Clipboard 项目的服务端一半：一个**按房间隔离**的剪贴板 ——

    客户端把文本或文件投进某个房间，房间里其他成员**实时**收到。


    这份文档是照着 Rust 的路由表（`crates/server/src/lib.rs::router`）和各处理器读出来的。

    ⚠️ 与代码不一致时**以代码为准**；与 Go 版 / Worker 版不一致的地方在正文里用 `NOTE (code)` 标出来。


    ## 路径索引


    | 方法 | 路径 | 干什么 |

    |---|---|---|

    | GET | `/server` | 服务能力与当前鉴权状态 |

    | GET | `/healthz` | 存活探针（**实现附赠**） |

    | POST | `/auth/token` | 用密码换一个 1 小时的会话令牌 |

    | POST | `/auth/token/refresh` | 续期会话令牌（不用再给密码） |

    | POST | `/text` | 发文本（带 `id` 是**原地改**） |

    | GET | `/content` | 历史分页（游标是 `id`） |

    | GET | `/content/latest` | 最新一条 |

    | GET | `/content/{id}` | 按 id 取一条 |

    | POST | `/content/{id}/column` | 改看板那一列 |

    | GET | `/rooms` | 房间列表 |

    | GET | `/stats/daily` | 每天活跃度（热力图数据源） |

    | POST | `/upload` | 小文件整份上传（multipart） |

    | POST | `/upload/chunk` · `/upload/chunk/{uuid}` · `/upload/finish/{uuid}` | 分片上传 |

    | GET/DELETE | `/file/{uuid}` · `/file/{uuid}/{name}` | 下载 / 删 |

    | POST | `/revoke/{id}` · `/revoke/all` | 撤回一条 / 清空 |

    | POST/GET | `/share` · `/share/list` · `/share/visit` · `/s/{token}` | 分享链接与落地页 |

    | GET | `/push` | **WebSocket** |

    | GET/POST | `/tasks*` | 定时自动化 |

    '
  license:
    name: MIT
    identifier: MIT
  contact:
    name: clip9
    url: https://github.com/Jonnyan404/clip9
externalDocs:
  description: 可切中英的规格页面（中文那份由 `zh.yaml` 生成）
  url: https://jonnyan404.github.io/clip9/spec.html
servers:
- url: http://localhost:9501
  description: 默认的本地服务端（不带前缀）
- url: https://clip.example.com
  description: 走 TLS 的部署示例（域名与协议由你自己定）
- url: https://clip.example.com/clip9
  description: 配了 server.prefix 的部署示例
tags:
- name: Service
  description: 服务能力、健康检查，以及这个部署**当前**的鉴权状态。
- name: Auth
  description: 会话令牌 —— 用密码换一次，之后拿着一枚短期令牌。
- name: Content
  description: 发文本、读历史、看板列、撤回。
- name: Files
  description: 上传、下载（支持 Range）与删除文件。
- name: Rooms
  description: 房间发现。
- name: Sharing
  description: 为单条内容签分享令牌，并跟踪链接被打开了几次。
- name: Automation
  description: 定时自动化（cron）、试跑，以及管理页。
- name: Realtime
  description: WebSocket 推送通道。
paths:
  /server:
    get:
      tags:
      - Service
      summary: 服务能力与当前鉴权状态
      description: "网页界面调它来决定：要不要弹密码框、WebSocket 在哪、要不要给出定时任务的入口。**不需要鉴权。**\n\n有三处语义很容易理解错，而它们**都不会报错**：\n\
        \n1. `auth`（「这个房间要不要密码」）与 `roomProtected` **不是一回事**：\n   `roomProtected` 只在给了 `?room=` 时才算，否则是\
        \ `false`。\n2. `authorized` 初值是 `true` —— 不给 `?room=`、也没有全局密码时，它**连凭据都没有也是 `true`**。\n   别默认把它读成\
        \ `false`。\n3. 不给 `?room=` 时，`auth` 反映的**只是全局密码**。\n\nNOTE (code)：这个接口**不返回** `version`，也**不返回**那几个限额\
        \ —— 它们在 WebSocket 握手的\n`config` 帧里。（`/server` 还带定时任务的能力位，而 `config` 帧里那个只是个布尔。）\n\n上面那个 `automation`\
        \ 对象是节选，完整形状见 `AutomationCapability`。\n"
      operationId: getServerInfo
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      security: []
      responses:
        '200':
          description: 按调用方当前上下文算出的服务端信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              examples:
                openServer:
                  summary: 开放部署，没给房间
                  value:
                    server: ws://127.0.0.1:9501/push
                    auth: false
                    authorized: true
                    roomProtected: false
                    config:
                      server:
                        history: 50
                        roomList: false
                    automation:
                      enabled: false
                protectedRoom:
                  summary: 房间 `home` 受保护，没带凭据
                  value:
                    server: wss://clip.example.com/push
                    auth: true
                    authorized: false
                    roomProtected: true
                    config:
                      server:
                        history: 50
                        roomList: true
                    automation:
                      enabled: true
                      room: home
                      tier: none
                      allowed: false
                      admin: false
                      max: 0
                      defaultTZ: Asia/Shanghai
                      vars:
                      - date
                      - weekday
                      - time
                      - datetime
                      - timestamp
                      - uuid
                      - task
                      - room
                      actions:
                      - id: text.trimLines
                        group: text
                        groupKey: actionGroupText
                        key: actionTrimLines
  /healthz:
    get:
      tags:
      - Service
      summary: 存活探针
      description: '返回字面量 `ok`。这是**实现附赠**（Go 版从来没有过），存在的理由是让验收脚本有一个便宜的

        存活探针 —— 它不像 `/server` 那样要算鉴权状态。


        ⚠️ Cloudflare Worker 也答这个路径（它自己那个 `/health` 也还在）—— 一个探针两个名字，

        会让每个健康检查都得按后端分叉。Go 版两个都没有。

        '
      operationId: healthz
      security: []
      responses:
        '200':
          description: 服务端活着。
          content:
            text/plain:
              schema:
                type: string
                const: ok
              examples:
                ok:
                  value: ok
  /auth/token:
    post:
      tags:
      - Auth
      summary: 用密码换会话令牌
      description: '这个密码会**同时**跟房间密码和全局密码比。匹配上**全局**密码的会拿到

        `scope: "global"` 的令牌（对所有房间有效，且在 `/tasks` 上是管理员）；房间密码则拿到 `scope: ""`。


        请求体必须是合法 JSON —— **空体会是 400，不是取默认值**（空密码没有意义）。


        NOTE (code)：这个接口**刻意不用**那个「房间访问」的公共助手 —— 它对本就开放的房间一律返回

        `true`，那等于**任何**密码都能给一个没设防的房间签出令牌。这里直接比明文。

        '
      operationId: issueSessionToken
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              roomPassword:
                summary: 房间密码
                value:
                  password: correct-horse-battery-staple
      responses:
        '200':
          description: 一枚会话令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
              examples:
                global:
                  summary: 全局密码 —— 到处都有效
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzY29wZSI6Imdsb2JhbCJ9.7mQ2
                    expiresAt: 1758003600
                    scope: global
                room:
                  summary: 房间密码 —— 只对该房间有效
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzY29wZSI6IiJ9.8xR4
                    expiresAt: 1758003600
                    scope: ''
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '401':
          description: 密码为空或不对。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                empty:
                  value:
                    code: password_required
                    error: Password required
                    message: 密码不能为空
                wrong:
                  value:
                    code: wrong_password
                    error: Wrong password
                    message: 密码不正确
        '405':
          $ref: '#/components/responses/OnlyPost'
  /auth/token/refresh:
    post:
      tags:
      - Auth
      summary: 不用密码续期会话令牌
      description: '拿旧令牌换一枚新的，**房间绑定与 `scope` 都不变** —— 全局会话**绝不会**被悄悄降级成只对单个房间

        （定时任务管理页不存明文密码，一降级它就再也进不去了）。

        '
      operationId: refreshSessionToken
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: 一枚新令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
              examples:
                renewed:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzY29wZSI6IiJ9.9pL1
                    expiresAt: 1758007200
                    scope: ''
        '401':
          description: 出示的令牌无效、已过期，或者绑定的是别的房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: session_token_invalid
                    error: Session token invalid or expired
                    message: 会话令牌无效或已过期
        '405':
          $ref: '#/components/responses/OnlyPost'
  /text:
    post:
      tags:
      - Content
      summary: 发文本，或原地改一条已存在的
      description: '存一条文本，并向房间里广播 `receive`。


        **请求体有三种被接受的形状**，由 `Content-Type` 决定：


        | `Content-Type` | 请求体 |

        |---|---|

        | `text/plain`、缺失、或不认识 | 整个请求体就是正文 |

        | `application/json` | `{"content": "..."}` |

        | `multipart/form-data` | 表单字段 `content` |


        后两种是给 Apple 快捷指令的：它把字符串变量当原始正文发时用的是 UTF-16，而发结构化正文时用 UTF-8。

        纯文本那条路也会嗅探并解码 UTF-16（看 BOM 或特征字节）；其余一律**逐字节原样存**，不转义、不改写。


        ⚠️ `application/x-www-form-urlencoded` 是**刻意不认**的 —— 它保留「整个正文就是文本」那条路，

        因为 `curl --data-binary` 默认发的就是它，当成表单会**悄悄存一条空的**。


        带 `?id=` 时，那个 id 的条目会被**原地改写**（id 不变），广播的是 `update`。改写会刷新

        `timestamp`（它是新内容了），并且要求该 id 是同房间的一条文本条目。


        长度按**字节**算，不按字符：4096 字节大约是 1365 个汉字。

        '
      operationId: sendText
      parameters:
      - $ref: '#/components/parameters/RoomQuery'
      - $ref: '#/components/parameters/NameQuery'
      - $ref: '#/components/parameters/ClientQuery'
      - name: id
        in: query
        required: false
        description: 给了且非空时，**改写**这个 id 的条目，而不是新建。该条目必须是同房间的文本条目，否则服务端回 `404 message_not_updatable`。
        schema:
          type: integer
          format: int32
        example: 7
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      requestBody:
        required: true
        description: 正文本身，按 `Content-Type` 包装（见上）。
        content:
          text/plain:
            schema:
              type: string
            examples:
              plain:
                summary: 整个请求体就是正文
                value: 'hello from curl

                  '
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
            examples:
              json:
                summary: 结构化请求体（快捷指令）
                value:
                  content: hello from Shortcuts
          multipart/form-data:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
            examples:
              form:
                value:
                  content: hello from a form
      responses:
        '200':
          description: 条目已存下（或被改写）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextSendResult'
              examples:
                created:
                  summary: 新建的条目
                  value:
                    url: http://localhost:9501/content/7
                    id: '7'
                    type: text
                overwritten:
                  summary: 改写已有条目 7
                  value:
                    url: http://localhost:9501/content/7
                    id: '7'
                    type: text
        '400':
          description: 请求体解析不了，或 `?id=` 不是数字。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badBody:
                  value:
                    code: invalid_body
                    error: Cannot parse request body
                    message: 请求体无法解析
                badId:
                  value:
                    code: invalid_id
                    error: Invalid id parameter
                    message: 无效的 ID 参数
        '401':
          description: 这个房间需要凭据，而没给（或给错了）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
                wrong:
                  value:
                    code: unauthorized_invalid_token
                    error: Invalid auth token
                    message: 无效的认证令牌
        '404':
          description: 带 `?id=` 时，目标条目不存在，或者它不是本房间里可改写的文本条目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notUpdatable:
                  value:
                    code: message_not_updatable
                    error: Message not found or not updatable
                    message: 消息未找到或无法更新
        '413':
          description: 文本超过了 `text.limit` 字节。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLong:
                  value:
                    code: text_too_long
                    error: Text too long
                    message: 文本内容超出限制 (最大 4096 字符)
        '405':
          $ref: '#/components/responses/OnlyPost'
  /content:
    get:
      tags:
      - Content
      summary: 房间历史（游标分页）
      description: "按**升序**（旧的在前）返回房间历史的一页，客户端直接 append 即可，下一页游标取 `messages[0].id`。\n\n- 游标是 **`id`**，不是时间戳：时间戳是秒级的、同一秒里会重复，拿它当游标会**漏条或重复**。\n\
        - `limit` 会被夹到 `min(server.history, 100)` —— 这个夹取正是为了不让 `?limit=999999`\n  把「一次推 2MB」从 WebSocket\
        \ 挪到 HTTP。\n- `before` 指向一条已被删掉的条目**不算错**：那一页退化成「最近的 `limit` 条」，\n  而这正是「从最新往回读」的意思。这里回 5xx 只会把客户端卡死。\n\
        - 一页如果超过 1 MiB 的字节预算，会丢**最旧**的几条（绝不整页丢），所以 `messages[0]` 永远是有效游标。\n- **空数组表示「没有更多历史了」。**\n"
      operationId: listContent
      parameters:
      - $ref: '#/components/parameters/RoomQuery'
      - name: before
        in: query
        required: false
        description: 只返回**严格早于**这个 id 的条目。不给或解析不了 = 「从最新开始」。
        schema:
          type: integer
          format: int32
        example: 120
      - name: limit
        in: query
        required: false
        description: 每页条数。夹到 `min(server.history, 100)`；非数字、0 或负数都**静默**回落到那个有效上限。
        schema:
          type: integer
          minimum: 1
        example: 50
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: 一页历史，旧的在前。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'
              examples:
                mixedPage:
                  summary: 一条文本 + 一条文件
                  value:
                    messages:
                    - type: text
                      content: hello world
                      id: '7'
                      timestamp: 1758000000
                      room: default
                      senderIP: 203.0.113.7
                      senderClientID: web-1a2b
                      senderDevice:
                        name: iPhone
                        type: smartphone
                        os: iOS 18
                        browser: Safari 18
                      column: todo
                    - type: image
                      name: photo.png
                      size: 20480
                      uuid: 11111111-2222-3333-4444-555555555555
                      cache: 11111111-2222-3333-4444-555555555555
                      thumbnail: data:image/jpeg;base64,/9j/4AAQSkZJRg==
                      url: http://localhost:9501/file/11111111-2222-3333-4444-555555555555/photo.png
                      id: '8'
                      timestamp: 1758000060
                      expire: 1758003600
                      room: default
                      senderIP: 203.0.113.7
                      senderDevice:
                        name: iPhone
                        type: smartphone
                        os: iOS 18
                        browser: Safari 18
                      column: todo
        '401':
          description: 无权访问该房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '405':
          $ref: '#/components/responses/OnlyGet'
  /content/latest:
    get:
      tags:
      - Content
      summary: 房间里最新的一条
      description: '默认把最新一条按**原始内容**返回；带 `?format=json`（文本条目也可以靠 `Accept: application/json`）

        则返回一个紧凑的 JSON 对象。


        **搜哪个房间：**


        | 请求 | 搜哪里 |

        |---|---|

        | `?room=R` | 房间 `R` |

        | `?all=1` | 凭据能读的**每个**房间，最新的赢 |

        | 都不给 | `default` 房间 |


        NOTE (code)：`?all=1` 是这个服务端表达「哪都行、取最新」的写法。旧文档写的是

        「不给 `room` → 全房间最新」；这里**把隐式变显式**了 —— 不给 `room` 就是 `default`，

        与其他所有接口一致，跨房间要显式 `?all=1`。`?all=1` 下**读不了的房间会被跳过**，而不是致命：

        一个受保护房间有新消息，不该把每次「全局最新」的请求都变成 401。


        NOTE (code)：这里的 JSON 形状**不是** `GET /content` 那个丰富形状，只返回下面列出的字段。

        文件条目的 `type` 是探测出的媒体种类（`image` / `video` / `audio` / `document` / `archive` / `file`）。


        ⚠️ 这里**不接受分享令牌**（分享绑定的是一个稳定的条目 id，而 `latest` 没有）；只有房间凭据管用。

        '
      operationId: getLatestContent
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - name: all
        in: query
        required: false
        description: 搜**每个**可读房间，而不是只搜 `default`。
        schema:
          $ref: '#/components/schemas/Truthy'
        example: 1
      - $ref: '#/components/parameters/FormatQuery'
      - $ref: '#/components/parameters/JsonQuery'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: 最新一条，原始内容或紧凑 JSON。
          content:
            text/plain:
              schema:
                type: string
              examples:
                rawText:
                  summary: 文本条目，原始内容
                  value: 'hello world

                    '
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LatestTextEntry'
                - $ref: '#/components/schemas/LatestFileEntry'
              examples:
                text:
                  summary: 文本条目（JSON）
                  value:
                    type: text
                    content: hello world
                    id: '7'
                    timestamp: 1758000000
                    column: todo
                file:
                  summary: 文件条目（JSON）
                  value:
                    type: image
                    name: photo.png
                    size: 20480
                    uuid: 11111111-2222-3333-4444-555555555555
                    url: http://localhost:9501/file/11111111-2222-3333-4444-555555555555/photo.png
                    id: '8'
