          format: int64
        token:
          type: string
        jti:
          type: string
        url:
          type: string
          format: uri
          description: 分享页。**爬虫和人看到的是同一个地址**。
        pageUrl:
          type: string
          format: uri
          description: 为兼容保留；目前与 `url` 同值。
        rawUrl:
          type: string
