  /tasks/preview:
    post:
      tags:
      - Automation
      summary: 渲染一个还没保存的定时任务
      description: 'Renders a draft task that is not persisted and sends nothing. The payload is the same

        shape as `POST /tasks` (minus `id`).


        The reference instant defaults to the task''s **next scheduled firing**, not "now" —

        otherwise a task configured at 15:00 as "daily 09:30, body `{{date:+1d}}`" would preview

        today+1, while tomorrow morning it actually sends tomorrow+1. `?at=` overrides it

        (RFC3339, or `2026-09-25` / `2026-09-25 09:30`).


        NOTE (code): this response uses `referenceAt2` for the RFC3339 spelling of the

        reference instant (the saved-task dry run uses `scheduledAt` for the same idea, and

        `referenceAt` is the Unix-seconds form in both). Clients should read `referenceAt` and

        the RFC3339 field that actually exists rather than assume symmetry.

        '
      operationId: previewTask
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - name: at
        in: query
        required: false
        description: Reference instant to render against. An unparseable value is a 400, never a silent
          fallback.
        schema:
          type: string
        example: '2026-09-24T09:30:00+08:00'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: The rendered output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPreview'
              examples:
                preview:
                  value:
                    preview: true
                    output: Tomorrow is 2026-09-25 (Friday)
                    room: home
                    keepHistory: false
                    referenceAt: 1758677400
                    nextRunAt: 1758677400
                    referenceAt2: '2026-09-24T09:30:00+08:00'
        '400':
          description: Invalid body/task, an unparseable `?at=`, or a rendering failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badReference:
                  value:
                    code: invalid_reference
                    error: Invalid reference time
                    message: 无法解析的时间：2026-13-45
                renderFailed:
                  value:
                    code: render_failed
                    error: Render failed
                    message: '{{latest:secret}} 读不了：房间 secret 需要密码'
                invalidTask:
                  value:
                    code: invalid_task
                    error: Invalid task
                    message: 未知的动作 text.nope
        '403':
          description: Automation is not allowed for this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyPost'
  /tasks/cron:
    get:
      tags:
      - Automation
      summary: 校验一条 cron 表达式
      description: 'Parses a 5-field expression and returns the next fire times, plus a structured `desc`

        the UI renders as a "means …" line.


        An invalid expression returns **200 with `valid: false`** (and `error`), not 400:

        validating is what this endpoint is *for*, so "invalid" is one of its normal outputs.

        Clients call it on every keystroke, and a 4xx would make the page look broken.


        Rule worth remembering: an expression that is syntactically valid but can never fire

        (`0 0 30 2 *`, February 30th) is reported with an `error` and no `next`.

        '
      operationId: checkCron
      parameters:
      - name: expr
        in: query
        required: true
        description: '`<min> <hour> <dom> <month> <dow>`. Five fields only; ranges, steps, lists and English
          names are supported.'
        schema:
          type: string
        example: '*/30 9-18 * * 1-5'
      - name: tz
        in: query
        required: false
        description: Time zone name for the returned instants. Defaults to `automation.defaultTZ`.
        schema:
          type: string
        example: Asia/Shanghai
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: 'The validation result — `valid: true` with upcoming instants, or `valid: false`
            with an explanation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronCheck'
              examples:
                valid:
                  value:
                    expr: '*/30 9-18 * * 1-5'
                    tz: Asia/Shanghai
                    valid: true
                    room: home
                    next:
                    - 1758675600
                    - 1758677400
                    - 1758679200
                    nextFormatted:
                    - 2026-09-24 09:00 Thu
                    - 2026-09-24 09:30 Thu
                    - 2026-09-24 10:00 Thu
                    desc:
                      mode: everyNMinutes
                      n: 30
                      hours: 9-18
                      day: weekly
                      weekdays:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                invalid:
                  value:
                    expr: 0 0 30 2 *
                    tz: Asia/Shanghai
                    valid: false
                    room: home
                    error: 这个表达式在未来算不出任何触发时刻（检查「日」和「月」是不是不可能的组合）
        '400':
          description: The time zone name is not recognised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badTz:
                  value:
                    code: invalid_timezone
                    error: Invalid time zone
                    message: 无法识别的时区 "Mars/Olympus"（写法如 Asia/Shanghai）
        '403':
          description: Automation is not allowed for this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyGetPost'
    post:
