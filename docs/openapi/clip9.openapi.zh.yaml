  /share/visit:
    post:
      tags:
      - Sharing
      summary: 上报「有人打开了分享」
      description: "Called once by the share page on mount. The server validates the token itself; an\n\
        invalid or expired token is rejected with 401 and **never counted**.\n\n- `tracked` is `false`\
        \ when the same visitor reports again within ten minutes —\n  repeated reports must not inflate\
        \ the number. The counts returned are still current.\n- `qr: true` (or `?q=1`) records one scan\
        \ in addition to the open. QR codes should\n  encode `/s/<token>?q=1`.\n- **No authentication**:\
        \ holding the link is what lets you report, and the response\n  only describes that one share.\n\
        - Serving `/s/{token}` never counts by itself, which is why chat-app crawlers (which\n  re-fetch\
        \ the address on their own schedule and do not execute JavaScript) cannot\n  inflate anything.\n"
      operationId: reportShareVisit
      parameters:
      - $ref: '#/components/parameters/ShareTokenQuery'
      - name: q
        in: query
        required: false
        description: '`1` marks the visit as coming from a scanned QR code.'
        schema:
          type: string
          enum:
          - '1'
        example: '1'
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareVisitRequest'
            examples:
              qr:
                value:
                  token: eyJ0eXAiOiJzaGFyZSJ9.9f2c
                  qr: true
      responses:
        '200':
          description: The report was processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareVisitResult'
              examples:
                tracked:
                  value:
                    ok: true
                    tracked: true
                    visits: 3
                    scans: 1
                debounced:
                  summary: Same visitor within ten minutes — not counted again
                  value:
                    ok: true
                    tracked: false
                    visits: 3
                    scans: 1
        '400':
          description: No token was supplied, or the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: missing_token
                    error: Missing token
                    message: 缺少 token
                badBody:
                  value:
                    code: invalid_request_body
                    error: Invalid request body
                    message: 无效的请求体
        '401':
          description: The token is bad or expired (expired links are not counted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: share_token_invalid
                    error: Share link is invalid or expired
                    message: 分享链接无效或已过期
        '405':
          $ref: '#/components/responses/OnlyPost'
  /s/{token}:
    get:
      tags:
      - Sharing
      summary: 分享落地页（HTML）
      description: "The share link's **single address**: an SPA shell with Open Graph tags injected into\
        \ its\n`<head>`. A chat app unfurling the URL sees a real preview card (it does not run\nJavaScript,\
        \ so the summary must be server-rendered); a human opening the very same URL\nlands in the share\
        \ page itself. No redirect, no second address, no second identity.\n\n- **Neither counts nor consumes**:\
        \ only `POST /share/visit` counts.\n- A password-protected share never leaks a content summary\
        \ into the card.\n- `og:image` is added only for images on **unlimited** shares — the crawler\
        \ fetching\n  that image consumes a use on the `/file` path, and a preview burning the quota would\n\
        \  hand the human an exhausted link.\n- Response headers: `X-Robots-Tag: noindex, nofollow`, `Cache-Control:\
        \ private,\n  max-age=0, must-revalidate`, `Referrer-Policy: no-referrer`,\n  `X-Content-Type-Options:\
        \ nosniff`.\n- Without a static source (API-only deployment) this returns a self-contained\n \
        \ fallback page carrying the same tags.\n"
      operationId: getShareLandingPage
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        example: eyJ0eXAiOiJzaGFyZSJ9.9f2c
      security: []
      responses:
        '200':
          description: The share page HTML.
          headers:
            X-Robots-Tag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
              examples:
                html:
                  summary: Abridged
                  value: '<!doctype html><html><head>

                    <title>photo.png</title>

                    <meta property="og:title" content="photo.png" />

                    <meta property="og:description" content="文件 · 20 KB · 15 分钟后过期" />

                    <meta property="og:url" content="https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c"
                    />

                    </head><body><div id="app"></div></body></html>

                    '
        '405':
          $ref: '#/components/responses/OnlyGet'
  /push:
    get:
      tags:
      - Realtime
      summary: WebSocket 推送通道
      description: "Upgrades to a WebSocket and streams that room's events. Registered as a `GET` because\n\
        that is what a WebSocket handshake is.\n\n**Handshake order (this order is the contract):**\n\n\
        1. If the room is protected: a missing credential returns `401\n   unauthorized_missing_token`,\
        \ a wrong one `401 unauthorized_invalid_token`. These are\n   distinct so the client can tell\
        \ \"ask for a password\" from \"that password is wrong\".\n   The rejection happens **before**\
        \ the upgrade, so it is an ordinary JSON response.\n2. `Sec-WebSocket-Protocol` is echoed back.\
        \ If the client offered a subprotocol the\n   server **must** select one or the browser fails\
        \ the handshake — clients use it to\n   pass the token without putting it in the URL.\n3. Upgrade.\n\
        4. Frames: one `connect` per device already in the room, a `connect` for this\n   connection to\
        \ the others, then `config`, then realtime events.\n\n**The handshake does not push history.**\
        \ Fetch it with `GET /content`, and use\n`config.latestId` — the largest message id in the room\
        \ at connect time (`0` when\nempty) — to align the history/realtime boundary. Treat `id <= latestId`\
        \ as history\n(record it, do **not** apply it to the clipboard) and `id > latestId` as realtime.\n\
        Never guess the boundary from a time window: a window that ends early silently floods\nthe clipboard.\
        \ If `latestId` is missing (an older server), refuse to write rather than\nguess.\n\nThe server\
        \ sends a protocol-level ping every 5 seconds (idle connections die silently\nbehind proxies otherwise)\
        \ and **disconnects** a client that falls behind the broadcast,\nso it reconnects and re-syncs\
        \ instead of quietly missing a `revoke`. Reconnection and\nbackoff are the client's job.\n"
      operationId: pushChannel
      parameters:
      - $ref: '#/components/parameters/RoomQuery'
      - $ref: '#/components/parameters/NameQuery'
      - $ref: '#/components/parameters/AuthQuery'
      - name: Sec-WebSocket-Protocol
        in: header
        required: false
        description: 'The credential is taken from `Authorization` / `?auth=` first, and from the first

          subprotocol only as a fallback. Prefer this carrier: it keeps the token out of the

          URL, hence out of access logs.

          '
        schema:
          type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9.abc
      - name: Sec-WebSocket-Version
        in: header
        required: true
        schema:
          type: integer
          enum:
          - 13
      - name: Upgrade
        in: header
        required: true
        schema:
          type: string
          enum:
          - websocket
      - name: Connection
        in: header
        required: true
        schema:
          type: string
          enum:
          - Upgrade
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '101':
          description: Switching protocols. Event frames then flow as documented below.
        '401':
          description: The room is protected and the credential is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized_missing_token
                    error: Missing auth token
                    message: 'Unauthorized: Missing token'
                invalid:
                  value:
                    code: unauthorized_invalid_token
                    error: Invalid auth token
                    message: 'Unauthorized: Invalid token'
      x-websocket-events:
        frameFormat: '{"event": "<name>", "data": <payload>}'
        clientToServer:
        - event: ping
          description: 'Application-level ping. The server echoes `data` back verbatim in a `pong`, so

            the client can compute RTT as `Date.now() - data`.

            '
          example:
            event: ping
            data: 1758000000123
        serverToClient:
        - event: connect
          description: A device in the room, or this connection announcing itself to the others.
          schemaRef: '#/components/schemas/DeviceMeta'
        - event: disconnect
          description: A device's **last** connection closed. Closing one tab of several does not report
            a disconnect.
          schemaRef: '#/components/schemas/DisconnectData'
        - event: config
          description: 'Sent once, right after connecting and before any realtime message. This is the

            only place `version` and the size limits are sent, and the only source of the

            front end''s `app.config`.

            '
          schemaRef: '#/components/schemas/WsConfig'
        - event: receive
          description: A new entry arrived in the room.
          schemaRef: '#/components/schemas/ReceiveEntry'
        - event: update
          description: An existing entry was edited in place (same `id`) — body rewrite or board move.
          schemaRef: '#/components/schemas/ReceiveEntry'
        - event: revoke
          description: One entry was deleted.
          schemaRef: '#/components/schemas/RevokeData'
        - event: clearAll
          description: The room was cleared.
          schemaRef: '#/components/schemas/ClearAllData'
        - event: pong
          description: Reply to a client `ping`, carrying the client's `data` unchanged.
        - event: ok
          description: Internal cross-component event; not sent to WebSocket clients.
  /tasks:
    get:
      tags:
