                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: 服务端整体关掉了定时任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyGetPost'
    post:
