                      name: On-call reminder
                      enabled: true
                      freq: cron
                      time: ''
                      cron: 30 9 * * *
                      byWeekday: []
                      runAt: ''
                      tz: Asia/Shanghai
                      room: home
                      template: Today is {{date}}
                      chain:
                      - text.trimLines
                      keepHistory: false
                      sender: 定时任务
                      createdAt: 1757900000
                      updatedAt: 1757900000
                      nextRunAt: 1758072600
                      lastRunAt: 1757986200
                      lastStatus: ok
                      lastError: ''
                      lastOutput: Today is 2026-09-16
                      desc:
                        mode: minutesEachHour
                        minutes: '30'
                        hours: '9'
                        day: daily
                    vars:
