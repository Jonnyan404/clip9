                      name: On-call reminder
                      enabled: true
                      freq: daily
                      time: 09:30
                      cron: ''
                      byWeekday: []
                      runAt: ''
                      tz: Asia/Shanghai
                      room: home
                      template: Today is {{date}}
                      chain: []
                      keepHistory: false
                      sender: 定时任务
                      createdAt: 1757900000
                      updatedAt: 1757900000
                      nextRunAt: 1758072600
                      lastRunAt: 0
                      lastStatus: ''
                      lastError: ''
                      lastOutput: ''
                singleTier:
                  summary: Single-tier room — the task token is issued once
                  value:
                    task:
