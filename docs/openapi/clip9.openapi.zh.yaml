                      name: On-call reminder
                      enabled: false
                      freq: daily
                      time: 09:30
                      cron: ''
                      byWeekday: []
                      runAt: ''
                      tz: Asia/Shanghai
                      room: home
                      template: Today is {{date}}
                      chain: []
                      keepHistory: false
                      sender: 定时任务
                      createdAt: 1757900000
                      updatedAt: 1758000000
                      nextRunAt: 0
                      lastRunAt: 0
                      lastStatus: ''
                      lastError: ''
                      lastOutput: ''
        '403':
          description: The task belongs to somebody else or another room.
          content:
            application/json:
              schema:
