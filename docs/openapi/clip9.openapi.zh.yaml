      summary: 列出这个房间的定时任务
      description: 'Lists the automations of the room derived from the credential. The list is always

        filtered by room, even for an admin.


        `tier` is `admin` / `room` / `single` / `none`; `max` is `0` for unlimited. In

        `single`-tier rooms only tasks matching the presented task token are returned, and

        `foreignCount` reports how many were hidden.


        Read-only per task: `nextRunAt`, `lastRunAt`, `lastStatus` (`ok` / `error` / `skipped`),

        `lastError`, `lastOutput`, and `desc` for cron tasks. `ownerHash` is never exposed.

        '
