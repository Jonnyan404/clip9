        \ private, max-age=0, must-revalidate`、\n  `Referrer-Policy: no-referrer`、`X-Content-Type-Options:\
        \ nosniff`。\n- 没有静态资源时（纯 API 部署）回一个自带的兜底页，标签一样。\n"
