      - type
      properties:
        url:
          type: string
          format: uri
          description: '**条目**地址（`/content/{id}`），不是文件的裸地址。'
        id:
          type: string
        type:
          type: string
          description: 按文件名探测出的媒体种类。
          enum:
          - image
          - audio
          - video
          - document
          - archive
          - file
    ChunkInitResult:
      type: object
      description: 分片上传初始化的响应（`/upload/chunk`，或 `/upload` 带一个 `text/plain` 的文件名）。
      required:
      - result
      properties:
        result:
          type: object
          required:
          - uuid
          properties:
            uuid:
              type: string
              format: uuid
    UploadResult:
      description: 要么是一次完成的上传，要么（`text/plain` 文件名那种形式）是一个初始化结果。
      oneOf:
      - $ref: '#/components/schemas/UploadedEntry'
      - $ref: '#/components/schemas/ChunkInitResult'
    ShareRequest:
      type: object
      description: '`POST /share` 的请求体。所有字段可选（空体即全部默认），

        但 ⚠️ **未知字段会被拒** —— 一个拼写错误绝不能**悄悄**丢掉用户配的限制。

        '
      additionalProperties: false
      properties:
        type:
          type: string
          description: '`content` 或 `file`。不传 → `400 missing_type`。'
          enum:
          - content
          - file
        id:
          type: string
          description: '`type: content` 时是条目 id（字符串）。`type: file` 时也可以用它代替 `uuid`。'
        uuid:
          type: string
          description: '`type: file` 时是文件 uuid。**优先于** `id`。'
        ttl:
          type: integer
          format: int64
          description: 过期秒数。默认 900；夹到 60 – 86400。
          minimum: 60
          maximum: 86400
        maxUses:
          type: integer
          format: int64
          description: 最多能被读几次。`0`（默认）表示不限。
          minimum: 0
        password:
          type: string
          description: 可选密码，之后收件方必须带 `X-Share-Password`。
          writeOnly: true
    ShareCreatedContent:
      type: object
