                    error: Failed to store message
                    message: 保存消息失败
        '405':
          $ref: '#/components/responses/OnlyPost'
  /file/{uuid}:
    get:
      tags:
      - Files
      summary: 下载或预览文件
      description: "把文件字节流出去。支持 `Range`（拖视频进度条、断点续传都能用），\n`If-Modified-Since` / `If-None-Match` 也原样透传。\n\
        \n- `Content-Type` 是按**原始文件名**猜的，不是按磁盘上的名字（磁盘上是不带扩展名的裸 uuid）。\n  文本类型会带上 `; charset=utf-8`，这样中文\
        \ `.txt` 不会被渲染成 Latin-1 乱码。\n- `?download=true` 会加上 `Content-Disposition: attachment`；否则是 `inline`，浏览器直接渲染。\n\
        - 鉴权用**文件上记录的那个房间** —— 客户端传的 `?room=` 被忽略，这正是「`?room=default`\n  读不到受保护房间的文件」的原因。\n- **分享令牌**（`?t=`）只对\
        \ `GET` 有效，而且必须指向**这个**文件。界面上那颗分享按钮签的是\n  `content` 类型的令牌、目标是文件 —— 那种也接受，但只在这个内容确实引用该 uuid 时。\n"
      operationId: downloadFile
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
        example: 11111111-2222-3333-4444-555555555555
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      - $ref: '#/components/parameters/ShareTokenQuery'
      - name: download
        in: query
        required: false
        description: 为 `true` 时强制下载，而不是内联渲染。
        schema:
          type: boolean
        example: true
      - name: Range
        in: header
        required: false
        description: 标准的 HTTP 字节区间；**不消耗**分享令牌的次数。
        schema:
          type: string
        example: bytes=0-1023
      - $ref: '#/components/parameters/SharePasswordHeader'
      security:
      - bearerAuth: []
      - authQuery: []
      - shareTokenQuery: []
      responses:
        '200':
          description: 文件字节。
          headers:
            Content-Type:
              description: 按原始文件名猜出来的。
              schema:
                type: string
            Content-Disposition:
              description: 默认 `inline`，带 `?download=true` 时是 `attachment`。
              schema:
                type: string
            Accept-Ranges:
              description: 有这一条是因为支持区间请求。
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 部分响应（Range 请求）。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: 未修改（条件请求）。
        '401':
          description: 无权访问该文件所在的房间，且没有可用的分享令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
                invalid:
                  value:
                    code: unauthorized_invalid_token
                    error: Invalid auth token
                    message: 无效的认证令牌
        '404':
          description: 没这个文件、它已过期，或者字节已从磁盘上消失。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
                missingOnDisk:
                  value:
                    code: file_missing_on_disk
                    error: File missing on disk
                    message: 文件在磁盘上未找到
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    delete:
      tags:
      - Files
      summary: 删文件
      description: 从磁盘删掉字节、从存储里删掉登记。删一个**本来就没了**的文件不算错（`NotFound` 被容忍）。分享令牌在这里**不管用**：它是只读的。
      operationId: deleteFile
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
        example: 11111111-2222-3333-4444-555555555555
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
