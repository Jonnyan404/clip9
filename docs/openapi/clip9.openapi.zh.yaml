                      lastError: ''
                      lastOutput: ''
        '403':
          description: 任务属于别人或别的房间。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: task_forbidden
                    error: Task belongs to someone else
                    message: 这条任务不是你创建的
        '404':
          description: 没这个任务（或者定时任务被关掉了）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: task_not_found
                    error: Task not found
                    message: 任务不存在
        '405':
          $ref: '#/components/responses/UnsupportedTaskAction'
  /automation:
    get:
      tags:
      - Automation
      summary: 定时任务的管理页（HTML）
      description: '一个**服务端渲染**的页面，用来新建和编辑定时任务。它有自己的 HTML

        （注册在 SPA 兜底**之前**，否则会解析成一个没有表单的空壳）。


        ⚠️ 它**自己不做任何鉴权** —— 能不能建、能不能改，完全由 `/tasks` 决定。

        页面拿密码换一枚会话令牌，存在 `sessionStorage` 里（关掉标签页就没了）。

        '
      operationId: automationPage
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - name: lang
        in: query
        required: false
        schema:
          type: string
          enum:
          - zh
          - zh-TW
          - en
          - ja
        example: zh
      security: []
      responses:
        '200':
          description: 管理页。
          content:
            text/html:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/OnlyGet'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <凭据>`，凭据可以是全局密码、房间密码，或 `POST /auth/token` 换来的会话令牌。

        头里的值如果不是「以 `Bearer` 开头的两个空格分隔的词」，就**原样**当凭据用 ——

        这样手写的 `Authorization: mypass` 也能用。

        '
    authQuery:
      type: apiKey
      in: query
      name: auth
      description: '同一份凭据，走 `?auth=`。**只在** `Authorization` 头缺失或为空时才看它。为 Apple 快捷指令保留的。

        ⚠️ **永远不要把密码放进可以分享的 URL** —— 查询串会进浏览器历史和访问日志。

        '
    shareTokenQuery:
      type: apiKey
      in: query
      name: t
      description: 分享令牌，授予对**它被签出来的那一条内容或文件**的**读**权限。只读：写接口一律忽略它。
    sharePassword:
      type: apiKey
      in: header
      name: X-Share-Password
      description: 受密码保护的分享的密码。**永远不进 URL**，因为查询串会被记日志。
    taskToken:
      type: apiKey
      in: header
      name: X-Task-Token
      description: '`single` 档定时任务的任务令牌（也接受 `?taskToken=`）。任务创建时**只发一次**。'
  parameters:
    RoomQuery:
      name: room
      in: query
      required: false
      description: 房间名。空、不传、或者字面量 `default` 都表示 `default` 房间。名字**区分大小写**，只去首尾空白。
      schema:
        type: string
      example: home
    RoomQueryOptional:
      name: room
      in: query
      required: false
      description: '房间名。在那些「完全不传」也是一种独立情形的接口上，不传与传空**可能不一样** ——

        `GET /content/latest` 就是要留神的那一个：`?room=` 是 `default` 房间，`?all=1` 才是「哪都行，取最新」。

        '
      schema:
        type: string
      example: home
    AuthQuery:
      name: auth
      in: query
      required: false
      description: 凭据，只在 `Authorization` 头缺失或为空时才用。
      schema:
        type: string
        writeOnly: true
      example: correct-horse-battery-staple
    NameQuery:
      name: name
      in: query
      required: false
      description: '发送方自称的**设备显示名**。会先清洗（去掉控制字符、去首尾空白）、截到 32 个**字符**，

        再存成 `senderDevice.name`。为空时服务端从 User-Agent 推一个名字。

        它和 `client` **不是一回事**，不能互换。

        '
      schema:
        type: string
        maxLength: 32
      example: iPhone
    ClientQuery:
      name: client
      in: query
      required: false
      description: 一个**稳定的客户端 id**，存成 `senderClientID`，用来判断哪些消息是调用方自己发的。**每台安装设一次**即可。
      schema:
        type: string
      example: web-1a2b
    FormatQuery:
      name: format
      in: query
      required: false
      description: '显式指定表示形式。`raw`（别名 `text` / `plain`）强制原始字节；`json` 强制 JSON。

        ⚠️ 其他任何非空值都是 `400 unsupported_format` —— **绝不回落**。它压过 `?json=` 与 `Accept`。

        '
      schema:
        type: string
        enum:
        - raw
        - text
        - plain
        - json
      example: json
    JsonQuery:
      name: json
      in: query
      required: false
      description: 早期的 JSON 开关。`1` 或 `true` 选 JSON，其他值忽略。为老客户端保留 —— 新代码请用 `?format=json`。
      schema:
        type: string
        enum:
        - '1'
        - 'true'
      example: '1'
    ShareTokenQuery:
      name: t
      in: query
      required: false
      description: 分享令牌。给了的话，它在房间凭据**之后**再试一次。
      schema:
        type: string
      example: eyJ0eXAiOiJzaGFyZSJ9.9f2c
    ShareTokenQueryRequired:
      name: t
      in: query
      required: true
      description: 要描述的分享令牌。
      schema:
        type: string
      example: eyJ0eXAiOiJzaGFyZSJ9.9f2c
    SharePasswordHeader:
      name: X-Share-Password
      in: header
      required: false
      description: 受密码保护的分享的密码。**绝不**放进 URL。
      schema:
        type: string
        writeOnly: true
      example: hunter2
    TaskTokenQuery:
      name: taskToken
      in: query
      required: false
      description: '`single` 档定时任务的任务令牌，作为 `X-Task-Token` 头的替代（头优先）。'
      schema:
        type: string
        writeOnly: true
      example: f4a2c9e1b7d3450689abcdef01234567
  responses:
    OnlyGet:
      description: 这个接口只接受 GET。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyGet:
              value:
                code: method_not_allowed
                error: Only GET is allowed
                message: 仅允许 GET 请求
    RoomForbidden:
      description: 这个凭据打不开该房间。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: room_forbidden
                error: Room forbidden
                message: 无权访问该房间
    OnlyPost:
      description: 这个接口只接受 POST。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyPost:
              value:
                code: method_not_allowed
                error: Only POST is allowed
                message: 仅允许 POST 请求
    OnlyGetPost:
      description: 这个接口接受 GET 与 POST。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyGetPost:
              value:
                code: method_not_allowed
                error: Only GET and POST are allowed
                message: 仅允许 GET / POST 请求
    MethodNotAllowed:
      description: '这个方法不是这条路径接受的。⚠️ 措辞**按路径族不同**：`/file/*` 用的是下面那句通用文案，

        其他路径会把允许的方法名点出来。

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            generic:
              value:
                code: method_not_allowed
                error: Method not allowed
                message: 方法不允许
    UnsupportedTaskAction:
      description: '`/tasks/{id}*` 上不支持这个方法或动作。文案里会把支持的列出来 —— 对用户来说比「只允许 POST」有用得多。'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported:
              value:
                code: method_not_allowed
                error: Unsupported method or action
                message: 仅支持 DELETE /tasks/:id、POST /tasks/:id/run、POST /tasks/:id/toggle
    InvalidRequestBody:
      description: 请求体不是合法 JSON。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidBody:
              value:
                code: invalid_request_body
                error: Invalid request body
                message: 无效的请求体
    UnsupportedFormat:
      description: '`?format=` 的值不是 raw / json 之一。'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported:
              value:
                code: unsupported_format
                error: Unsupported format
                message: 不支持的格式（只支持 raw / json）
  schemas:
    Error:
      type: object
      description: '**唯一**的错误信封。每条错误路径都只返回这三个字段，`Content-Type` 恒为

        `application/json; charset=utf-8`，**绝不**随 `Accept` 变化，并且**末尾带一个换行**。

        '
      required:
      - code
      - error
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          description: 机器码，蛇形命名。**一旦发布就稳定** —— 别拿别的字段做判断分支。
          examples:
          - text_too_long
        error:
          type: string
          description: 英文原句，给日志和英语用户看。
          examples:
          - Text too long
        message:
          type: string
          description: 中文原句，客户端**原样显示**。限额类错误里会嵌入服务端**当前**的配置值。
          examples:
          - 文本内容超出限制 (最大 4096 字符)
      examples:
      - code: text_too_long
        error: Text too long
        message: 文本内容超出限制 (最大 4096 字符)
    Truthy:
      type: string
      description: 一个「真值」开关。为真的值：`1`、`true`、`yes`、`on`（忽略大小写、去首尾空白）。其余一律为假。
      enum:
      - '1'
      - 'true'
      - 'yes'
      - 'on'
      examples:
      - '1'
    BoardColumn:
      type: string
      description: 看板列。`todo` 是默认 —— 缺失或空值都归一到它。列名**忽略大小写并去首尾空白**。
      enum:
      - todo
      - doing
      - done
      examples:
      - doing
    ServerInfo:
      type: object
      description: '`GET /server` 的响应。⚠️ 注意它**不带** `version`，也**不带**大小限额。'
      required:
      - server
      - auth
      - authorized
      - roomProtected
      - config
      - automation
      properties:
        server:
          type: string
          description: WebSocket 地址，协议头已经换成 `ws` / `wss`。
          examples:
          - ws://127.0.0.1:9501/push
        auth:
          type: boolean
          description: 解析出的上下文是否**需要**密码。不带 `?room=` 时它只反映全局密码。
        authorized:
          type: boolean
          description: '出示的凭据是否可用。⚠️ 初值是 `true` —— 不带 `?room=`、也没有全局密码时，

            **连凭据都没有也是 `true`**。

            '
        roomProtected:
          type: boolean
          description: '`?room=` 点名的房间是否要密码。**没传 `?room=` 时恒为 `false`**。'
        config:
          type: object
          properties:
            server:
              type: object
              properties:
                history:
                  type: integer
                  format: int64
                  description: 每个房间保留多少条。也是 `GET /content` 的默认每页条数。
                roomList:
                  type: boolean
                  description: '`GET /rooms` 有没有开。'
        automation:
          $ref: '#/components/schemas/AutomationCapability'
    AutomationCapability:
      type: object
      description: '描述调用方对 `/tasks` 能做什么。定时任务整体关掉时，这个对象就是 `{"enabled": false}`。'
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        room:
          type: string
          description: 这次请求解析到的房间。
        tier:
          type: string
          description: 策略档位。`admin` = 全局密码；`none` = 不允许。
          enum:
          - admin
          - room
          - single
          - none
        allowed:
          type: boolean
        admin:
          type: boolean
        max:
          type: integer
          description: 任务数上限；`0` 表示不限。
        defaultTZ:
          type: string
          examples:
          - Asia/Shanghai
        vars:
          type: array
          description: 界面可以提供哪些模板变量名。
          items:
            type: string
          examples:
          - - date
            - weekday
            - time
            - datetime
            - timestamp
            - uuid
            - task
            - room
        actions:
          type: array
          description: '动作库，只是元数据。`key` / `groupKey` 是前端语言文件里的 i18n **键** ——

            服务端只发键，从不发译文。

            '
          items:
            $ref: '#/components/schemas/AutomationAction'
    AutomationAction:
      type: object
      required:
      - id
      - group
      - groupKey
      - key
      properties:
        id:
          type: string
          examples:
          - text.trimLines
        group:
          type: string
          examples:
          - text
        groupKey:
          type: string
          examples:
          - actionGroupText
        key:
          type: string
          examples:
          - actionTrimLines
        params:
          type: array
          description: 不需要参数的动作这里是空的（并且省略）。
          items:
            $ref: '#/components/schemas/AutomationParam'
    AutomationParam:
      type: object
      required:
      - key
      - labelKey
      properties:
        key:
          type: string
          examples:
          - find
        labelKey:
          type: string
          examples:
          - actionParamFind
        type:
          type: string
          description: 单行文本输入时省略；`select` 表示下拉选择。
          enum:
          - select
        options:
          type: array
          description: 为空时省略。
          items:
            type: object
            required:
            - value
            - labelKey
            properties:
              value:
                type: string
              labelKey:
                type: string
        visibleWhen:
          type: object
          description: 没有时省略。用于「当另一个参数等于某值时，才显示这个参数」。
          required:
          - key
          - equals
          properties:
            key:
              type: string
            equals:
              type: string
    TokenRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          description: 全局密码或房间密码。空值会被拒，回 `password_required`。
          writeOnly: true
    SessionToken:
      type: object
      description: 一枚会话令牌。有效期约一小时。
      required:
      - token
      - expiresAt
      - scope
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: Unix **秒**。
        scope:
          type: string
          description: 由全局密码签出的令牌是 `global`；房间密码签出的是 `""`。
    TextSendResult:
      type: object
      description: '`POST /text` 的响应（新建与改写两条路都是它）。'
      required:
      - url
      - id
      - type
      properties:
        url:
          type: string
          format: uri
          examples:
          - http://localhost:9501/content/7
        id:
          type: string
          description: 条目 id，**是字符串**。
          examples:
          - '7'
        type:
          type: string
          const: text
    ContentEntry:
      description: '`GET /content` 与 `GET /content/{id}?format=json` 用的 JSON 投影。

        分支要看的是**有没有 `content`（文本）还是 `name`（文件）**。

        ⚠️ **不要**拿 `type` 分支：文件时它装的是探测出的媒体种类，不是 `file` 这个词。

        '
      oneOf:
      - $ref: '#/components/schemas/TextContentEntry'
      - $ref: '#/components/schemas/FileContentEntry'
    TextContentEntry:
      type: object
      required:
      - type
      - id
      - timestamp
      - room
      properties:
        type:
          type: string
          const: text
        content:
          type: string
          description: 为空时省略（空串与「没有正文」在这里分不出来）。
        id:
          type: string
          description: 条目 id，字符串。
        timestamp:
          type: integer
          format: int64
          description: Unix **秒**。秒级精度，同一秒里会重复 —— **绝不要**拿它当游标。
        room:
          type: string
        senderIP:
          type: string
        senderClientID:
          type: string
          description: 为空时省略。
        senderDevice:
          description: '发送方的设备信息 —— 一张自由形状的字符串表，**不是** WebSocket `connect` 事件用的那个更严格的

            `DeviceMeta`。未知时是 `null`，而它与 `{}` **不是一回事**，所以客户端三种状态都要处理。

            '
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
          description: 没设就省略。`automation` 表示这条是定时任务发的。
        scheduledAt:
          type: integer
          format: int64
          description: 没设就省略。任务**计划**触发的那一刻；补发时它与 `timestamp` 不同。
        late:
          type: boolean
          description: 不为真就省略。表示这条发晚了，错过了自己的窗口。
    FileContentEntry:
      type: object
      required:
      - type
      - name
      - size
      - uuid
      - cache
      - url
      - id
      - timestamp
      - expire
      - room
      properties:
        type:
          type: string
          description: 按文件名探测出的媒体种类。
          enum:
          - image
          - audio
          - video
          - document
          - archive
          - file
        name:
          type: string
        size:
          type: integer
          format: int64
          description: 磁盘上的字节数。条目本身不带正文 —— 字节从 `url` 取。
        uuid:
          type: string
          description: 与 `cache` 同一个值。
        cache:
          type: string
        thumbnail:
          type: string
          description: 一个 `data:image/jpeg;base64,…` 缩略图；没生成时是空串（压缩包、PDF、视频没生成是正常的）。
        url:
          type: string
          format: uri
          description: 绝对下载地址，**文件名已经拼好了**，可以直接用。
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        expire:
          type: integer
          format: int64
          description: Unix 秒；`0` 表示永不过期。
        room:
          type: string
        senderIP:
          type: string
        senderClientID:
          type: string
        senderDevice:
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
    ContentList:
      type: object
      description: 一页历史，升序。**空数组表示没有更多历史了**。
      required:
      - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ContentEntry'
    LatestTextEntry:
      type: object
      description: '`GET /content/latest` 返回文本条目时的形状 —— 是**紧凑**的，不是 `GET /content` 那个丰富投影。'
      required:
      - type
      - id
      - timestamp
      properties:
        type:
          type: string
          const: text
        content:
          type: string
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        column:
          $ref: '#/components/schemas/BoardColumn'
    LatestFileEntry:
      type: object
      description: '`GET /content/latest` 返回文件条目时的形状 —— 也是**紧凑**的。⚠️ 它没有 `cache` / `room` / `senderIP`，与
        `GET /content` 的投影不同。'
      required:
      - type
      - name
      - size
      - uuid
      - url
      - id
      - timestamp
      - expire
      properties:
        type:
          type: string
          enum:
          - image
          - audio
          - video
          - document
          - archive
          - file
        name:
          type: string
        size:
          type: integer
          format: int64
        uuid:
          type: string
        url:
          type: string
          format: uri
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        expire:
          type: integer
          format: int64
        column:
          $ref: '#/components/schemas/BoardColumn'
    ColumnResult:
      type: object
      required:
      - id
      - type
      - column
      properties:
        id:
          type: string
        type:
          type: string
          description: 条目自己的种类（`text` / `file`），**不是**媒体种类。
        column:
          $ref: '#/components/schemas/BoardColumn'
    RoomListResponse:
      type: object
      required:
      - rooms
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomInfo'
    RoomInfo:
      type: object
      required:
      - name
      - messageCount
      - deviceCount
      - lastActive
      - isActive
      - isProtected
      properties:
        name:
          type: string
          description: 房间名。`default` 房间报成**空串**。
        messageCount:
          type: integer
          format: int64
        deviceCount:
          type: integer
          format: int64
        lastActive:
          type: integer
          format: int64
