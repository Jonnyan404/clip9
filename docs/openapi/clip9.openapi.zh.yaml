                    error: Authentication required
                    message: 需要认证令牌
        '404':
          description: 没这个文件，或者它已过期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
