                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
        '500':
          description: 字节还在，但删不掉。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                deleteFailed:
                  value:
                    code: file_delete_failed
                    error: Failed to delete file
                    message: 删除文件失败
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
