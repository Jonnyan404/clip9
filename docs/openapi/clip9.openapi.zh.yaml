        visits:
          type: integer
        scans:
          type: integer
    SenderDevice:
      type: object
      description: '挂在内容条目上的 `senderDevice` 表。与 WebSocket `connect` 事件的 `DeviceMeta` 不同，

        这是**一张普通字符串表**：没有 `id` 也没有 `device` 键，`type` 装的是小写的设备类别。

        '
      additionalProperties:
        type: string
      properties:
        type:
          type: string
          description: 设备类别；定时任务发的消息是 `Automation`。
          enum:
          - desktop
          - smartphone
          - tablet
          - Automation
        name:
          type: string
          description: 客户端用 `?name=` 声明的名字。它没声明时**不出现**。
        os:
          type: string
          description: '`<家族> <主版本>`，如 `iOS 17`。会去首尾空白，所以认不出的家族就只是 `Other`。'
        browser:
          type: string
          description: '`<家族> <主版本>`，如 `Safari 17` 或 `curl 8`。'
      examples:
      - type: smartphone
        name: iPhone
        os: iOS 18
        browser: Safari 18
    DeviceMeta:
      type: object
      description: '一台连着的设备。**只有** `name` 在为空时省略；`id`、`type`、`device`、`os`、`browser`

        **永远都在**，哪怕是空串。

        '
      required:
      - id
      - type
      - device
      - os
      - browser
      properties:
        id:
          type: string
          description: 这条连接的稳定哈希，用来去重。
        type:
          type: string
          examples:
          - Desktop
          - mobile
          - Automation
        name:
          type: string
          description: 客户端声明的名字（如果有）。为空时省略。
        device:
          type: string
          examples:
          - Apple Mac
        os:
          type: string
          examples:
          - macOS 14
        browser:
          type: string
          examples:
          - Chrome 120
    DisconnectData:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: '**最后一条**连接断掉的那台设备的 id。'
    RevokeData:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int32
          description: 被删条目的 id。⚠️ 注意这里它是**数字**，而内容负载里的 id 是字符串。
    ClearAllData:
      type: object
      required:
      - room
      properties:
        room:
          type: string
    WsConfig:
      type: object
      description: '`config` 帧，连上之后、任何实时消息**之前**发一次。它是 `version` 与那几个大小限额的**唯一**来源，

        也是前端 `app.config` 的唯一来源。

        '
      required:
      - version
      - server
      - text
      - file
      - auth
      - latestId
      - automation
      properties:
        version:
          type: string
          examples:
          - 0.1.0
        server:
          type: object
          properties:
            history:
              type: integer
              format: int64
            prefix:
              type: string
            roomList:
              type: boolean
        text:
          type: object
          properties:
            limit:
              type: integer
              format: int64
              description: 文本长度上限，单位**字节**。`0` 表示不限。
        file:
          type: object
          properties:
            expire:
              type: integer
              format: int64
              description: 文件默认存活秒数；`0` 表示永不过期。
            chunk:
              type: integer
              format: int64
            limit:
              type: integer
              format: int64
        auth:
          type: boolean
          description: 握手那一刻这个房间要不要凭据。
        latestId:
          type: integer
          format: int32
          description: '连接那一刻房间里最大的消息 id（空房间为 `0`）。拿它当历史/实时的边界。

            ⚠️ 老服务端没有这个字段 —— 那种情况下客户端**必须不写剪贴板**。

            '
        automation:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
    ReceiveEntry:
      description: '`receive` / `update` 的负载 —— 条目**存进去时的原样**，也是 `GET /content` 投影出来的形状。

        分支看 `type`：`text` 或 `file`。

        '
      oneOf:
      - $ref: '#/components/schemas/ReceiveTextEntry'
      - $ref: '#/components/schemas/ReceiveFileEntry'
    ReceiveTextEntry:
      type: object
      required:
      - id
      - type
      - room
      - timestamp
      properties:
        id:
          type: integer
          format: int32
          description: 条目 id —— 在实时负载里是**数字**。
        type:
          type: string
          const: text
        room:
          type: string
        timestamp:
          type: integer
          format: int64
        senderIP:
          type: string
        senderClientID:
          type: string
          description: 为空时省略。
        senderDevice:
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
        content:
          type: string
          description: 为空时省略。
        deviceConnection:
          $ref: '#/components/schemas/DeviceMeta'
        deviceID:
          type: string
    ReceiveFileEntry:
      type: object
      required:
      - id
      - type
      - room
      - timestamp
      - name
      - size
      - cache
      - expire
      properties:
        id:
          type: integer
          format: int32
        type:
          type: string
          const: file
        room:
          type: string
        timestamp:
          type: integer
          format: int64
        senderIP:
          type: string
        senderClientID:
          type: string
        senderDevice:
          oneOf:
          - $ref: '#/components/schemas/SenderDevice'
          - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
        name:
          type: string
        size:
          type: integer
          format: int64
        cache:
          type: string
          description: 通常就是文件 uuid。
        expire:
          type: integer
          format: int64
        thumbnail:
          type: string
        url:
          type: string
          format: uri
          description: 为空时省略。
    ChainStep:
      description: '动作链里的一步。不带参数的一步写成**裸字符串**；带参数的写成对象。

        两种形式都接受，而**没有参数的一步在写回时仍然是字符串** —— 这样已有数据永远不会被改写形状。

        '
      oneOf:
      - type: string
        description: 一个动作 id，如 `text.trimLines`。
      - type: object
        required:
        - id
        properties:
          id:
            type: string
          params:
            type: object
            description: '**只**属于这一步的参数。'
            additionalProperties:
              type: string
    TaskRequest:
      type: object
      description: '`POST /tasks` 与 `POST /tasks/preview` 的请求体。

        ⚠️ **没有 `room` 字段** —— 房间取自凭据。

        '
      properties:
        id:
          type: string
          description: 不传即新建；传了即**整份替换**那个任务。
        name:
          type: string
          description: 为空时回落到渲染后正文的第一行。
        enabled:
          type: boolean
          description: 默认 `true`。
        freq:
          type: string
          description: 计划类型。
          enum:
          - once
          - daily
          - weekly
          - cron
        time:
          type: string
          description: '`HH:MM`，用于 `daily` / `weekly`。'
        cron:
          type: string
          description: '5 字段表达式，用于 `freq: cron` —— `<分> <时> <日> <月> <周>`。'
        byWeekday:
          type: array
          description: 用于 `weekly`。`0` = 周日 … `6` = 周六，与 `Date.getDay()` 一致。
          items:
            type: integer
            minimum: 0
            maximum: 6
        runAt:
          type: string
          description: 用于 `once`：RFC3339，或按 `tz` 解释的 `2026-10-01T09:30`。会归一成 RFC3339。
        tz:
          type: string
          description: 不传 → 从 `automation.defaultTZ` 填上，并**存进任务里**。
        template:
          type: string
          description: 正文模板。`{{ }}` 变量在**触发时**求值；不认识的变量和写坏的偏移量在**保存时**就被拒。
        chain:
          type: array
          description: 可选的有序步骤列表，作用在渲染后的文本上。某一步失败会**中断整条链**。
          items:
            $ref: '#/components/schemas/ChainStep'
        keepHistory:
          type: boolean
          description: 默认 `false` —— 消息照常广播，但**不占**房间的历史额度。
        sender:
          type: string
          description: 显示名。默认 `定时任务`。
    Task:
      type: object
      description: 接口返回的定时任务。`ownerHash` **从不**暴露。
      required:
      - id
      - name
      - enabled
      - freq
      - room
      - template
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        freq:
          type: string
          enum:
          - once
          - daily
          - weekly
          - cron
        time:
          type: string
        cron:
          type: string
        byWeekday:
          type: array
          items:
            type: integer
        runAt:
          type: string
        tz:
          type: string
        room:
          type: string
        template:
          type: string
        chain:
          type: array
          items:
            $ref: '#/components/schemas/ChainStep'
        keepHistory:
          type: boolean
        sender:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        nextRunAt:
          type: integer
          format: int64
          description: 下次触发时刻，Unix 秒；停用或已用尽时为 `0`。
        lastRunAt:
          type: integer
          format: int64
        lastStatus:
          type: string
          description: 上一次触发的结局。
          enum:
          - ''
          - ok
          - error
          - skipped
        lastError:
          type: string
        lastOutput:
          type: string
        desc:
          $ref: '#/components/schemas/CronDesc'
    CronDesc:
      type: object
      description: '对一条 cron 表达式的**结构化、不含散文**的概括。它只描述形状，

        句子由客户端用自己的文案表拼出来。⚠️ 里面**永远不含**表达式语法（`*`、`/`、`?`）。

        '
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - everyMinute
          - everyNMinutes
          - everyNHours
          - minutesEachHour
          - times
          - unknown
        n:
          type: integer
        minutes:
          type: string
        hours:
          type: string
        day:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          - monthlyOrWeekly
          - everyNDays
          - everyNDaysOrWeekly
        weekdays:
          type: array
          items:
            type: integer
        dom:
          type: string
        month:
          type: string
        dayN:
          type: integer
        times:
          type: array
          items:
            type: string
        more:
          type: boolean
          description: 概括用的列表被截断时为真。
    TaskList:
      type: object
      required:
      - room
      - tier
      - admin
      - tasks
      - max
      - now
      - actions
      - vars
      properties:
        room:
          type: string
        tier:
          type: string
          enum:
          - admin
          - room
          - single
          - none
        admin:
          type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        max:
          type: integer
          description: 该房间的任务数上限；`0` 表示不限。
        now:
          type: integer
          format: int64
        foreignCount:
          type: integer
          description: '**只**在房间里有些任务因为不是你的而被藏起来时出现。'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationAction'
        vars:
          type: array
          items:
            type: string
    TaskSaved:
      type: object
      required:
      - task
      properties:
        task:
          $ref: '#/components/schemas/Task'
        taskToken:
          type: string
          description: '**只**在 `single` 档房间创建任务时出现。它**只显示这一次**，而它是之后编辑或删除该任务的**唯一**办法。

            '
    TaskDeleted:
      type: object
      required:
      - deleted
      - id
      properties:
        deleted:
          type: boolean
          const: true
        id:
          type: string
    TaskRooms:
      type: object
      required:
      - room
      - admin
      - rooms
      properties:
        room:
          type: string
        admin:
          type: boolean
        rooms:
          type: array
          items:
            type: object
            required:
            - room
            - count
            properties:
              room:
                type: string
              count:
                type: integer
    CronCheck:
      type: object
      description: '校验 cron 表达式的结果。⚠️ 表达式非法时是 **200** 且 `valid: false`；

        **只有**时区名不可用才是 400。

        '
      required:
      - expr
      - tz
      - valid
      - room
      properties:
        expr:
          type: string
          description: 归一化之后的表达式（合法时与输入相同）。
        tz:
          type: string
        valid:
          type: boolean
        room:
          type: string
        error:
          type: string
          description: '`valid` 为假时才有。'
        next:
          type: array
          description: 接下来的触发时刻，Unix 秒。`valid` 为假时没有。
          items:
            type: integer
            format: int64
        nextFormatted:
          type: array
