  /push:
    get:
      tags:
      - Realtime
      summary: WebSocket 推送通道
      description: "升级成 WebSocket，流式推这个房间的事件。注册成 `GET` 是因为 WebSocket 握手本来就是 GET。\n\n**握手顺序（这个顺序就是契约）：**\n\
        \n1. 房间受保护时：没带凭据回 `401 unauthorized_missing_token`，带错了回\n   `401 unauthorized_invalid_token`。两者**分开**，客户端才能分辨「该去要密码」和「密码是错的」。\n\
        \   拒绝发生在升级**之前**，所以那是一个普通的 JSON 响应。\n2. `Sec-WebSocket-Protocol` 要**回显**。客户端给了子协议而服务端不选一个，浏览器就会判定握手失败\
        \ ——\n   客户端正是靠它把令牌传进来、又不放进 URL。\n3. 升级。\n4. 帧序：先给房间里已有的每台设备各来一条 `connect`，再给这条连接向其他人发一条 `connect`，\n\
        \   然后是 `config`，最后才是实时事件。\n\n⚠️★ **握手不推历史。** 历史用 `GET /content` 取，并用 `config.latestId`\n—— 连接那一刻房间里最大的消息\
        \ id（空房间为 `0`）—— 来对齐历史与实时的边界。\n`id <= latestId` 当历史（记下来，**不要**写剪贴板），`id > latestId` 才是实时。\n**绝不要**用时间窗口去猜边界：窗口早结束一点，就会**悄悄**把整段历史灌进剪贴板。\n\
        拿不到 `latestId`（服务端太旧）时，**宁可拒绝写入，也不要猜**。\n\n服务端每 5 秒发一次协议级 ping（否则空闲连接会在代理后面**悄无声息地**死掉），\n并且会把**跟不上广播**的客户端断开\
        \ —— 让它重连、重新同步，而不是安静地漏掉一条 `revoke`。\n重连与退避是客户端的事。\n"
      operationId: pushChannel
      parameters:
      - $ref: '#/components/parameters/RoomQuery'
      - $ref: '#/components/parameters/NameQuery'
      - $ref: '#/components/parameters/AuthQuery'
      - name: Sec-WebSocket-Protocol
        in: header
        required: false
        description: 凭据优先从 `Authorization` / `?auth=` 取，取不到才看第一个子协议。**优先用这个载体**：它让令牌不进 URL，也就不进访问日志。
        schema:
          type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9.abc
      - name: Sec-WebSocket-Version
        in: header
        required: true
        schema:
          type: integer
          enum:
          - 13
      - name: Upgrade
        in: header
        required: true
        schema:
          type: string
          enum:
          - websocket
      - name: Connection
        in: header
        required: true
        schema:
          type: string
          enum:
          - Upgrade
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '101':
          description: 正在切换协议。之后事件帧按下面写的流动。
        '401':
          description: 房间受保护，而凭据缺失或不对。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized_missing_token
                    error: Missing auth token
                    message: 'Unauthorized: Missing token'
                invalid:
                  value:
                    code: unauthorized_invalid_token
                    error: Invalid auth token
                    message: 'Unauthorized: Invalid token'
      x-websocket-events:
        frameFormat: '{"event": "<name>", "data": <payload>}'
        clientToServer:
        - event: ping
          description: 应用层 ping。服务端会把 `data` 原样放进 `pong` 回显，客户端据此用 `Date.now() - data` 算 RTT。
          example:
            event: ping
            data: 1758000000123
        serverToClient:
        - event: connect
          description: 房间里的一台设备，或者这条连接在向其他人宣告自己。
          schemaRef: '#/components/schemas/DeviceMeta'
        - event: disconnect
          description: 某台设备的**最后一条**连接断了。一台设备开多个标签页时，关掉其中一个**不**报断开。
          schemaRef: '#/components/schemas/DisconnectData'
        - event: config
          description: 连上之后发一次，排在任何实时消息**之前**。`version` 与那几个大小限额**只在这里**给，也是前端 `app.config` 的唯一来源。
          schemaRef: '#/components/schemas/WsConfig'
        - event: receive
          description: 房间里来了新内容。
          schemaRef: '#/components/schemas/ReceiveEntry'
        - event: update
          description: 已有条目被**原地**改了（同一个 `id`）—— 改写正文或挪看板列。
          schemaRef: '#/components/schemas/ReceiveEntry'
        - event: revoke
          description: 某一条被删了。
          schemaRef: '#/components/schemas/RevokeData'
        - event: clearAll
          description: 房间被清空了。
          schemaRef: '#/components/schemas/ClearAllData'
        - event: pong
          description: 对客户端 `ping` 的回复，`data` 原样带回。
        - event: ok
          description: 组件之间的内部事件；**不会**发给 WebSocket 客户端。
