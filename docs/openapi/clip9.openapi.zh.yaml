  /tasks/cron:
    get:
      tags:
      - Automation
      summary: 校验一条 cron 表达式
      description: '解析一条 5 字段表达式，返回接下来几次触发时刻，外加一个结构化的 `desc`，

        界面拿它渲染成一句「意思是……」。


        ⚠️ 表达式非法时返回的是 **200 且 `valid: false`**（带 `error`），**不是 400**：

        「校验」正是这个接口的**用途**，所以「不合法」是它的正常输出之一。

        客户端每次按键都会调它，回 4xx 会让页面看起来坏了。

        '
      operationId: checkCron
      parameters:
      - name: expr
        in: query
        required: true
        description: '''''''`<分> <时> <日> <月> <周>`。**只支持 5 个字段**；支持区间、步长、列表与英文名。'''''''
        schema:
          type: string
        example: '*/30 9-18 * * 1-5'
      - name: tz
        in: query
        required: false
        description: 返回的那些时刻用的时区名。默认取 `automation.defaultTZ`。
        schema:
          type: string
        example: Asia/Shanghai
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: '''校验结果 —— `valid: true` 带接下来的触发时刻，或 `valid: false` 带一句解释。'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronCheck'
              examples:
                valid:
                  value:
                    expr: '*/30 9-18 * * 1-5'
                    tz: Asia/Shanghai
                    valid: true
                    room: home
                    next:
                    - 1758675600
                    - 1758677400
                    - 1758679200
                    nextFormatted:
                    - 2026-09-24 09:00 Thu
                    - 2026-09-24 09:30 Thu
                    - 2026-09-24 10:00 Thu
                    desc:
                      mode: everyNMinutes
                      n: 30
                      hours: 9-18
                      day: weekly
                      weekdays:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                invalid:
                  value:
                    expr: 0 0 30 2 *
                    tz: Asia/Shanghai
                    valid: false
                    room: home
                    error: 这个表达式在未来算不出任何触发时刻（检查「日」和「月」是不是不可能的组合）
        '400':
          description: 时区名不认识。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badTz:
                  value:
                    code: invalid_timezone
                    error: Invalid time zone
                    message: 无法识别的时区 "Mars/Olympus"（写法如 Asia/Shanghai）
        '403':
          description: 这个房间不允许用定时任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
