  /share:
    post:
      tags:
      - Sharing
      summary: 签一个分享令牌
      description: '签一枚带签名、自描述的令牌，授予对**一条内容或一个文件**的**读**权限。有效期、次数上限、密码

        全都写在令牌里，所以**总是**签令牌 —— 包括对开放的房间，那里如果只回一个裸 URL，

        就等于把调用方要的那几道限制**悄悄丢掉**了。


        请求体（JSON，所有字段可选；**空体即全部用默认值**）：


        | 字段 | 说明 |

        |---|---|

        | `type` | `content` 或 `file`。缺失 → 400 `missing_type` |

        | `id` | `type: content` 时是条目 id（字符串） |

        | `uuid` | `type: file` 时是文件 uuid。也接受 `id`（老客户端） |

        | `ttl` | 秒；默认 900，夹到 60 – 86400 |

        | `maxUses` | `0`（默认）= 不限次 |

        | `password` | 可选；给了之后收件方必须带 `X-Share-Password` |


        ⚠️ **不认识的字段会被拒（400），而不是忽略** —— 这样把 `max_uses` 写成下划线的人

        不会**悄悄**丢掉他配的那道限制。


        响应里有两种寻址形式：`url` / `pageUrl`（落地页，**爬虫和人看到的是同一个地址**），

        以及 `rawUrl`（带同一枚令牌直达内容/文件接口）。

        '
      operationId: createShare
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            examples:
              content:
                summary: 分享一条文本，15 分钟
                value:
                  type: content
                  id: '7'
                  ttl: 900
                  maxUses: 0
                  password: ''
              file:
                summary: 分享一个文件，5 次，带密码
                value:
                  type: file
                  uuid: 11111111-2222-3333-4444-555555555555
                  ttl: 3600
                  maxUses: 5
                  password: hunter2
      responses:
        '200':
          description: 分享已创建。
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ShareCreatedContent'
                - $ref: '#/components/schemas/ShareCreatedFile'
              examples:
                content:
                  summary: 内容分享
                  value:
                    type: content
                    id: '7'
                    room: default
                    ttl: 900
                    expiresAt: 1750000000
                    maxUses: 0
                    token: eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    jti: 9f2c8b1e4d5a4f7d
                    url: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    pageUrl: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    rawUrl: https://clip.example.com/content/7?t=eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    visits: 0
                    scans: 0
                file:
                  summary: 文件分享
                  value:
                    type: file
                    uuid: 11111111-2222-3333-4444-555555555555
                    room: default
                    ttl: 3600
                    expiresAt: 1750003600
                    maxUses: 5
                    token: eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    jti: 1a2b3c4d5e6f7a8b
                    url: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    pageUrl: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    rawUrl: https://clip.example.com/file/11111111-2222-3333-4444-555555555555/photo.png?t=eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    visits: 0
                    scans: 0
        '400':
          description: JSON 体不合法（`invalid_request_body`）、有未知字段，或者 `type` / `id` / `uuid` 缺失或非法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingType:
                  value:
                    code: missing_type
                    error: Missing type
                    message: 缺少 type
                unsupportedType:
                  value:
                    code: unsupported_type
                    error: Unsupported type
                    message: 不支持的 type
                badId:
                  value:
                    code: invalid_id
                    error: Invalid id
