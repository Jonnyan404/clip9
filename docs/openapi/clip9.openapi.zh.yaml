  /share:
    post:
      tags:
      - Sharing
      summary: 签一个分享令牌
      description: 'Creates a signed, self-describing token that grants **read** access to one content

        entry or one file. TTL, usage limit and password all live inside the token, so a token

        is issued **always** — including for open rooms, where returning a bare URL would

        silently discard the limits the caller asked for.


        Request body (JSON, all fields optional; an **empty body means all defaults**):


        | Field | Notes |

        |---|---|

        | `type` | `content` or `file`. Missing → 400 `missing_type` |

        | `id` | For `type: content`, the entry id (as a string) |

        | `uuid` | For `type: file`, the file uuid. `id` is also accepted (older clients) |

        | `ttl` | Seconds; default 900, clamped to 60 – 86400 |

        | `maxUses` | `0` (default) = unlimited |

        | `password` | Optional; the recipient must then send `X-Share-Password` |


        Unknown fields are **rejected** (400) rather than ignored, so a typo like `max_uses`

        cannot silently drop the limit the user configured.


        The response carries two addressing forms: `url` / `pageUrl` (the landing page, which

        is the *same* address a crawler and a human see) and `rawUrl` (which reaches the

        content/file endpoint directly with the same token).

        '
      operationId: createShare
      parameters:
      - $ref: '#/components/parameters/RoomQueryOptional'
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            examples:
              content:
                summary: Share one text entry for 15 minutes
                value:
                  type: content
                  id: '7'
                  ttl: 900
                  maxUses: 0
                  password: ''
              file:
                summary: Share a file, 5 uses, password protected
                value:
                  type: file
                  uuid: 11111111-2222-3333-4444-555555555555
                  ttl: 3600
                  maxUses: 5
                  password: hunter2
      responses:
        '200':
          description: The share was created.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ShareCreatedContent'
                - $ref: '#/components/schemas/ShareCreatedFile'
              examples:
                content:
                  summary: Content share
                  value:
                    type: content
                    id: '7'
                    room: default
                    ttl: 900
                    expiresAt: 1750000000
                    maxUses: 0
                    token: eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    jti: 9f2c8b1e4d5a4f7d
                    url: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    pageUrl: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    rawUrl: https://clip.example.com/content/7?t=eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    visits: 0
                    scans: 0
                file:
                  summary: File share
                  value:
                    type: file
                    uuid: 11111111-2222-3333-4444-555555555555
                    room: default
                    ttl: 3600
                    expiresAt: 1750003600
                    maxUses: 5
                    token: eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    jti: 1a2b3c4d5e6f7a8b
                    url: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    pageUrl: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    rawUrl: https://clip.example.com/file/11111111-2222-3333-4444-555555555555/photo.png?t=eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    visits: 0
                    scans: 0
        '400':
          description: 'Bad JSON body (`invalid_request_body`), an unknown field, or a missing/invalid

            `type` / `id` / `uuid`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingType:
                  value:
                    code: missing_type
                    error: Missing type
                    message: 缺少 type
                unsupportedType:
                  value:
                    code: unsupported_type
                    error: Unsupported type
                    message: 不支持的 type
                badId:
                  value:
                    code: invalid_id
                    error: Invalid id
                    message: 无效的 id
                badBody:
                  value:
                    code: invalid_request_body
                    error: Invalid request body
                    message: 无效的请求体
        '401':
          description: No access to the room the target belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '404':
          description: The target entry or file does not exist (or has expired), or is not in the requested
            room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                contentMissing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                fileMissing:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
        '405':
          $ref: '#/components/responses/OnlyPost'
    get:
      tags:
      - Sharing
      summary: 分享的元信息（**不消耗次数**）
      description: "What the share landing page asks before fetching anything: the type, the file name\
        \ and\nsize, the remaining validity, the remaining uses, and whether a password is needed.\n\n\
        - **It does not consume a use** — merely opening the page must not burn one.\n- The password travels\
        \ in `X-Share-Password`, **never** in the URL.\n- When the share is password-protected the response\
        \ also carries a `previewToken`\n  (and `previewExpiresAt`). Browsers cannot attach custom headers\
        \ to `<img>` /\n  `<video>` / `<a download>`, so the page needs this token to render inline previews.\n\
        \  Unprotected shares deliberately get **no** preview token: it would be unlimited-use\n  and\
        \ would defeat `maxUses`.\n- The `used` field appears only for a limited share that has a live\
        \ record.\n"
      operationId: getShareInfo
      parameters:
      - $ref: '#/components/parameters/ShareTokenQueryRequired'
      - $ref: '#/components/parameters/SharePasswordHeader'
      security: []
      responses:
        '200':
          description: The share metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareInfo'
              examples:
                textNoPassword:
                  summary: Text share, no password, unlimited
                  value:
                    type: content
                    kind: text
                    id: '7'
                    room: default
                    expiresAt: 1750000000
                    maxUses: 0
                    needsPassword: false
                fileWithPassword:
                  summary: File share with a password and a use limit
                  value:
                    type: content
                    kind: file
                    id: '8'
                    room: default
                    expiresAt: 1750003600
                    maxUses: 5
                    used: 2
                    needsPassword: true
                    uuid: 11111111-2222-3333-4444-555555555555
                    name: photo.png
                    size: 20480
                    previewToken: eyJ0eXAiOiJwcmV2aWV3In0.zz99
                    previewExpiresAt: 1750003600
        '400':
          description: The token carries a share type this endpoint cannot describe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupported:
                  value:
                    code: unsupported_type
                    error: Unsupported type
                    message: 不支持的分享类型
        '401':
          description: The token is bad/expired, or a password is required/mismatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: share_token_invalid
                    error: Share link is invalid or expired
                    message: 分享链接无效或已过期
                password:
                  value:
                    code: share_password_required
                    error: Share password required
                    message: 需要分享密码
        '404':
          description: The share points at something that is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                contentMissing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                fileMissing:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
    head:
      tags:
      - Sharing
      summary: 分享的元信息（只要响应头）
      description: Same as `GET /share?t=` with the body omitted.
      operationId: headShareInfo
      parameters:
      - $ref: '#/components/parameters/ShareTokenQueryRequired'
      - $ref: '#/components/parameters/SharePasswordHeader'
      security: []
      responses:
        '200':
          description: The share exists and the token is usable.
        '401':
          description: The token is bad/expired, or a password is required/mismatched.
        '404':
          description: The share points at something that is gone.
  /share/list:
    get:
      tags:
      - Sharing
      summary: 这个房间最近的分享
      description: "Lists a room's recent share records together with how often each link was opened.\n\
        Authorisation is identical to creating a share in that room, so it is impossible to be\nable to\
        \ create a share but not see your own.\n\n- `limit` defaults to 50 and is capped at 200.\n- **The\
        \ list never contains tokens.** A token is a bearer credential; listing it would\n  let anyone\
        \ who can read the room reuse somebody else's share.\n- `password` reports only *whether* a password\
        \ is set, never its hash.\n- `expired` is computed against the current time.\n"
      operationId: listShares
      parameters:
      - $ref: '#/components/parameters/RoomQuery'
      - name: limit
        in: query
        required: false
        description: Page size, default 50, maximum 200. The value reported back is the value used.
        schema:
          type: integer
          minimum: 1
          maximum: 200
        example: 50
      - $ref: '#/components/parameters/AuthQuery'
      security:
      - bearerAuth: []
      - authQuery: []
      responses:
        '200':
          description: The room's share records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareList'
              examples:
                list:
                  value:
                    room: default
                    total: 3
                    limit: 50
                    records:
                    - jti: 9f2c8b1e4d5a4f7d
                      type: content
                      kind: text
                      id: '7'
                      room: default
                      name: first line of the text
                      size: 0
                      createdAt: 1749999000
                      expiresAt: 1750000000
                      maxUses: 0
                      used: 0
                      visits: 2
                      scans: 1
                      password: false
                      expired: false
        '401':
          description: No access to this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
