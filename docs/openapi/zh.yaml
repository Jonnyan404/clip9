# ── /server ───────────────────────────────────────────────────────────
paths./server.get.description: |
  网页界面调它来决定：要不要弹密码框、WebSocket 在哪、要不要给出定时任务的入口。**不需要鉴权。**

  有三处语义很容易理解错，而它们**都不会报错**：

  1. `auth`（「这个房间要不要密码」）与 `roomProtected` **不是一回事**：
     `roomProtected` 只在给了 `?room=` 时才算，否则是 `false`。
  2. `authorized` 初值是 `true` —— 不给 `?room=`、也没有全局密码时，它**连凭据都没有也是 `true`**。
     别默认把它读成 `false`。
  3. 不给 `?room=` 时，`auth` 反映的**只是全局密码**。

  NOTE (code)：这个接口**不返回** `version`，也**不返回**那几个限额 —— 它们在 WebSocket 握手的
  `config` 帧里。（`/server` 还带定时任务的能力位，而 `config` 帧里那个只是个布尔。）

  上面那个 `automation` 对象是节选，完整形状见 `AutomationCapability`。
paths./server.get.responses.200.description: 按调用方当前上下文算出的服务端信息。
paths./server.get.responses.200.content.application/json.examples.openServer.summary: 开放部署，没给房间
paths./server.get.responses.200.content.application/json.examples.protectedRoom.summary: 房间 `home` 受保护，没带凭据

# ── /healthz ──────────────────────────────────────────────────────────
paths./healthz.get.description: |
  返回字面量 `ok`。这是**实现附赠**（Go 版从来没有过），存在的理由是让验收脚本有一个便宜的
  存活探针 —— 它不像 `/server` 那样要算鉴权状态。

  ⚠️ Cloudflare Worker 也答这个路径（它自己那个 `/health` 也还在）—— 一个探针两个名字，
  会让每个健康检查都得按后端分叉。Go 版两个都没有。
paths./healthz.get.responses.200.description: 服务端活着。

# ── /auth/token ───────────────────────────────────────────────────────
paths./auth/token.post.description: |
  这个密码会**同时**跟房间密码和全局密码比。匹配上**全局**密码的会拿到
  `scope: "global"` 的令牌（对所有房间有效，且在 `/tasks` 上是管理员）；房间密码则拿到 `scope: ""`。

  请求体必须是合法 JSON —— **空体会是 400，不是取默认值**（空密码没有意义）。

  NOTE (code)：这个接口**刻意不用**那个「房间访问」的公共助手 —— 它对本就开放的房间一律返回
  `true`，那等于**任何**密码都能给一个没设防的房间签出令牌。这里直接比明文。
paths./auth/token.post.requestBody.content.application/json.examples.roomPassword.summary: 房间密码
paths./auth/token.post.responses.200.description: 一枚会话令牌。
paths./auth/token.post.responses.200.content.application/json.examples.global.summary: 全局密码 —— 到处都有效
paths./auth/token.post.responses.200.content.application/json.examples.room.summary: 房间密码 —— 只对该房间有效
paths./auth/token.post.responses.401.description: 密码为空或不对。

# ── /auth/token/refresh ───────────────────────────────────────────────
paths./auth/token/refresh.post.description: |
  拿旧令牌换一枚新的，**房间绑定与 `scope` 都不变** —— 全局会话**绝不会**被悄悄降级成只对单个房间
  （定时任务管理页不存明文密码，一降级它就再也进不去了）。
paths./auth/token/refresh.post.responses.200.description: 一枚新令牌。
paths./auth/token/refresh.post.responses.401.description: 出示的令牌无效、已过期，或者绑定的是别的房间。

# ── /text ─────────────────────────────────────────────────────────────
paths./text.post.description: |
  存一条文本，并向房间里广播 `receive`。

  **请求体有三种被接受的形状**，由 `Content-Type` 决定：

  | `Content-Type` | 请求体 |
  |---|---|
  | `text/plain`、缺失、或不认识 | 整个请求体就是正文 |
  | `application/json` | `{"content": "..."}` |
  | `multipart/form-data` | 表单字段 `content` |

  后两种是给 Apple 快捷指令的：它把字符串变量当原始正文发时用的是 UTF-16，而发结构化正文时用 UTF-8。
  纯文本那条路也会嗅探并解码 UTF-16（看 BOM 或特征字节）；其余一律**逐字节原样存**，不转义、不改写。

  ⚠️ `application/x-www-form-urlencoded` 是**刻意不认**的 —— 它保留「整个正文就是文本」那条路，
  因为 `curl --data-binary` 默认发的就是它，当成表单会**悄悄存一条空的**。

  带 `?id=` 时，那个 id 的条目会被**原地改写**（id 不变），广播的是 `update`。改写会刷新
  `timestamp`（它是新内容了），并且要求该 id 是同房间的一条文本条目。

  长度按**字节**算，不按字符：4096 字节大约是 1365 个汉字。
paths./text.post.parameters.3.description: 给了且非空时，**改写**这个 id 的条目，而不是新建。该条目必须是同房间的文本条目，否则服务端回 `404 message_not_updatable`。
paths./text.post.requestBody.description: 正文本身，按 `Content-Type` 包装（见上）。
paths./text.post.requestBody.content.text/plain.examples.plain.summary: 整个请求体就是正文
paths./text.post.requestBody.content.application/json.examples.json.summary: 结构化请求体（快捷指令）
paths./text.post.responses.200.description: 条目已存下（或被改写）。
paths./text.post.responses.200.content.application/json.examples.created.summary: 新建的条目
paths./text.post.responses.200.content.application/json.examples.overwritten.summary: 改写已有条目 7
paths./text.post.responses.400.description: 请求体解析不了，或 `?id=` 不是数字。
paths./text.post.responses.401.description: 这个房间需要凭据，而没给（或给错了）。
paths./text.post.responses.404.description: 带 `?id=` 时，目标条目不存在，或者它不是本房间里可改写的文本条目。
paths./text.post.responses.413.description: 文本超过了 `text.limit` 字节。

# ── /content ──────────────────────────────────────────────────────────
paths./content.get.description: |
  按**升序**（旧的在前）返回房间历史的一页，客户端直接 append 即可，下一页游标取 `messages[0].id`。

  - 游标是 **`id`**，不是时间戳：时间戳是秒级的、同一秒里会重复，拿它当游标会**漏条或重复**。
  - `limit` 会被夹到 `min(server.history, 100)` —— 这个夹取正是为了不让 `?limit=999999`
    把「一次推 2MB」从 WebSocket 挪到 HTTP。
  - `before` 指向一条已被删掉的条目**不算错**：那一页退化成「最近的 `limit` 条」，
    而这正是「从最新往回读」的意思。这里回 5xx 只会把客户端卡死。
  - 一页如果超过 1 MiB 的字节预算，会丢**最旧**的几条（绝不整页丢），所以 `messages[0]` 永远是有效游标。
  - **空数组表示「没有更多历史了」。**
paths./content.get.parameters.1.description: 只返回**严格早于**这个 id 的条目。不给或解析不了 = 「从最新开始」。
paths./content.get.parameters.2.description: 每页条数。夹到 `min(server.history, 100)`；非数字、0 或负数都**静默**回落到那个有效上限。
paths./content.get.responses.200.description: 一页历史，旧的在前。
paths./content.get.responses.200.content.application/json.examples.mixedPage.summary: 一条文本 + 一条文件
paths./content.get.responses.401.description: 无权访问该房间。

# ── /content/latest ───────────────────────────────────────────────────
paths./content/latest.get.description: |
  默认把最新一条按**原始内容**返回；带 `?format=json`（文本条目也可以靠 `Accept: application/json`）
  则返回一个紧凑的 JSON 对象。

  **搜哪个房间：**

  | 请求 | 搜哪里 |
  |---|---|
  | `?room=R` | 房间 `R` |
  | `?all=1` | 凭据能读的**每个**房间，最新的赢 |
  | 都不给 | `default` 房间 |

  NOTE (code)：`?all=1` 是这个服务端表达「哪都行、取最新」的写法。旧文档写的是
  「不给 `room` → 全房间最新」；这里**把隐式变显式**了 —— 不给 `room` 就是 `default`，
  与其他所有接口一致，跨房间要显式 `?all=1`。`?all=1` 下**读不了的房间会被跳过**，而不是致命：
  一个受保护房间有新消息，不该把每次「全局最新」的请求都变成 401。

  NOTE (code)：这里的 JSON 形状**不是** `GET /content` 那个丰富形状，只返回下面列出的字段。
  文件条目的 `type` 是探测出的媒体种类（`image` / `video` / `audio` / `document` / `archive` / `file`）。

  ⚠️ 这里**不接受分享令牌**（分享绑定的是一个稳定的条目 id，而 `latest` 没有）；只有房间凭据管用。
paths./content/latest.get.parameters.1.description: 搜**每个**可读房间，而不是只搜 `default`。
paths./content/latest.get.responses.200.description: 最新一条，原始内容或紧凑 JSON。
paths./content/latest.get.responses.200.content.text/plain.examples.rawText.summary: 文本条目，原始内容
paths./content/latest.get.responses.200.content.application/json.examples.text.summary: 文本条目（JSON）
paths./content/latest.get.responses.200.content.application/json.examples.file.summary: 文件条目（JSON）
paths./content/latest.get.responses.401.description: 无权访问解析出来的那个房间。
paths./content/latest.get.responses.404.description: 没东西可返回：房间是空的（`no_content`）、解析出的房间与请求的不一致（`content_not_found`），或者最新的那条文件已过期（`file_expired`，只在原始分支上）。

# ── /content/{id} ─────────────────────────────────────────────────────
paths./content/{id}.get.description: |
  取单独一条。你给的 `?room=` **必须**和该条目记录的房间一致，否则服务端回 `404 content_not_found`
  （它不会确认「你叫错的那个房间里」有没有这条）。

  鉴权可以是房间凭据，**或者**（仅限读）`?t=` 里的分享令牌。分享令牌**永远不能**授权写操作。

  文本条目默认返回原始文本（**总带一个换行**，免得 `curl` 的输出和提示符粘在一起），
  带 `?format=json` 则返回**丰富**的 JSON 投影。文件条目没有正文可返回：`?format=json` 给投影，
  而原始分支回 `404 file_expired`（字节在 `/file/{uuid}`）。
paths./content/{id}.get.parameters.0.description: 条目 id。必须是整数 —— 非数字的 id 是 **400，不是 404**。
paths./content/{id}.get.responses.200.description: 该条目，原始内容或 JSON 投影。
paths./content/{id}.get.responses.200.content.application/json.examples.text.summary: 文本条目的投影
paths./content/{id}.get.responses.200.content.application/json.examples.file.summary: 文件条目的投影
paths./content/{id}.get.responses.400.description: id 不是数字，或 `?format=` 不是 raw / json 之一。
paths./content/{id}.get.responses.401.description: 无权访问该条目所在的房间。
paths./content/{id}.get.responses.404.description: 不存在、房间对不上，或（原始分支上）文件已过期。

# ── /content/{id}/column ──────────────────────────────────────────────
paths./content/{id}/column.post.description: |
  看板是**同一批条目的一个视图**，不是第二份存储：这个接口只在条目上设**一个**字段，别的什么都不动，
  然后广播 `update`。

  - 三列是固定的：`todo`（默认；空或缺失的列都归一到它）、`doing`、`done`。列名**忽略大小写并去首尾空白**。
  - 文本与文件条目都适用。
  - **`timestamp` 刻意不动。** `POST /text?id=` 改写正文时会刷新它，但拖一张卡片**不该**把它顶到时间线最上面。
  - 鉴权要房间凭据。分享令牌**不接受** —— 它是只读的。
  - NOTE (code)：这里的失败码是 `room_auth_required`，与读接口用的 `room_forbidden` **不同**。客户端可以据此分支。
paths./content/{id}/column.post.responses.200.description: 条目已挪动。
paths./content/{id}/column.post.responses.400.description: id 不对、JSON 体不对，或列名不认识。
paths./content/{id}/column.post.responses.401.description: 无权访问该条目所在的房间。
paths./content/{id}/column.post.responses.404.description: 没这条，或者它不在请求的那个房间里。

# ── /rooms ────────────────────────────────────────────────────────────
paths./rooms.get.description: |
  列出调用方看得见的房间。需要打开 `server.roomList`，否则回 `403 room_list_disabled`。

  - 凭据打不开的房间**整个不出现**，而不是列出来挂把锁。
  - `default` 房间的 `name` 报成**空串**（前端把空名字当作默认房间）。
  - 数组顺序**不属于契约**（Go 版遍历的是 map）。这个服务端给的是确定顺序，但客户端不该依赖它。
  - `isProtected` 的意思是「**确实**需要密码」，所以显式配了 `{"open": true}` 的房间即使存在全局密码也报 `false`。
  - 凭据可以给一个主的 + 若干个附加的，附加的走 `X-Room-Auth-Tokens`（JSON 数组或逗号分隔）——
    手里有好几个房间密码的客户端靠它一次看全自己所有的房间。
paths./rooms.get.parameters.1.description: 附加凭据，JSON 数组（`["a","b"]`）或逗号分隔（`a, b`）。首尾空白会去掉、重复的丢掉、顺序保留，主凭据排在最前。
paths./rooms.get.responses.200.description: 看得见的那些房间。
paths./rooms.get.responses.403.description: 这个服务端关掉了房间列表功能。

# ── /stats/daily ──────────────────────────────────────────────────────
paths./stats/daily.get.description: |
  活跃度热力图背后的数据：这个房间在最近 `days` 个**本地日**里各收到多少条。

  **时区是调用方的，不是服务端的。** `tz` 收 IANA 名字；服务端不知道看图的人在哪，
  而「今天」必须是**他的**今天。按 UTC 分桶的话，东八区晚上 8 点之后的活跃会被算进第二天。
  认不出来的名字回落 `UTC`，响应里的 `tz` 报**实际用的**那个
  （`requestedTz` 把请求的原样回显，调用方据此分辨有没有回落）。

  **`levels` 是这个房间自己那些非零天的分位数**，不是固定阈值。一个每天只收三条的房间，
  在固定阈值下会整张图都是最浅色 —— 而「哪几天更多」正是来看这张图的唯一理由。
  代价是同一个颜色在不同房间里代表不同的量，所以响应里带着那几道阈值，界面上印的是实际区间。

  - `days` 夹到 `371`（53 周）。`0`、负数和非数字都表示「没给」而回落到默认值 ——
    **不是**一张空图，那会被读成「这个房间从来没有过东西」。
  - **已过期的文件不算数。** 服务端在文件过期时会把时间线那条删掉，这里再算一遍会让房间
    显得比时间线上看到的更活跃。
  - 窗口为空时 `busiest` 是 `null`；并列时取**最近**那天。
paths./stats/daily.get.parameters.0.description: 要统计的房间。不传即 `default` 房间。
paths./stats/daily.get.parameters.1.description: 窗口天数，截止到今天。夹到 `371`。`0`、负数和非数字都当作「没给」。
paths./stats/daily.get.parameters.2.description: 用来判断某个时间戳属于哪个本地日的 IANA 时区名。认不出来就回落 `UTC`。
paths./stats/daily.get.responses.200.description: 所请求窗口内每天的条数。
paths./stats/daily.get.responses.200.content.application/json.schema.properties.tz.description: '''**实际用的**时区（回落之后）。'''
paths./stats/daily.get.responses.200.content.application/json.schema.properties.requestedTz.description: 调用方请求的那个，原样回显，这样回落就看得见。
paths./stats/daily.get.responses.200.content.application/json.schema.properties.truncated.description: 为真表示扫描撞到了行数上限，窗口里最旧的那几天可能少算。
paths./stats/daily.get.responses.200.content.application/json.schema.properties.activity.properties.days.description: 旧的在前；长度恰好等于生效的 `days`。
paths./stats/daily.get.responses.200.content.application/json.schema.properties.activity.properties.days.items.properties.date.description: 本地日期，`YYYY-MM-DD`。
paths./stats/daily.get.responses.200.content.application/json.schema.properties.activity.properties.streak.properties.current.description: 一直到今天的连续天数。今天还没内容时**跳过它**、从昨天往回数 —— 这样这个数不会每天早上都掉回 0。
paths./stats/daily.get.responses.200.content.application/json.schema.properties.activity.properties.levels.description: 配色用的四道递增阈值。窗口内活跃天不足四天时，这四个值相等。
paths./stats/daily.get.responses.200.content.application/json.examples.unknownTimezone.summary: '''`tz` 认不出来时回落 UTC'''

# ── /upload ───────────────────────────────────────────────────────────
paths./upload.post.description: |
  一次请求传完一个小文件：写字节、登记文件、在房间里存一条文件条目、广播 `receive`，
  然后返回条目 id 与 URL。

  表单字段名**永远是 `file`**。

  特殊情况：当 `Content-Type` **逐字符**等于 `text/plain` 时（`text/plain; charset=utf-8` **不算**），
  请求体被当成一个**文件名**，这个接口就变成了分片上传的初始化 —— 与 `POST /upload/chunk` 完全一样。
  这是与 Go 实现共有的、刻意保留并且写进文档的怪癖。

  有 `Content-Length` 时，会先拿它跟 `file.limit` 比，**在把文件读进内存之前**就拒掉超大的。

  NOTE (code)：成功响应体是 `{url, id, type}` —— 与 `/text` 同样那三个字段。旧文档在这里还写了
  `name` / `size` / `uuid` / `expire`，这个服务端不返回它们。`type` 是按文件名探测出的媒体种类，
  **不是**字面量 `file`。
paths./upload.post.requestBody.content.multipart/form-data.schema.properties.file.description: 文件字节。part 头里的文件名会成为条目的 `name`。
paths./upload.post.requestBody.content.text/plain.examples.initAsFilename.summary: 请求体是文件名 —— 这时它充当分片上传的初始化
paths./upload.post.responses.200.description: 文件已存下并广播（`text/plain` 那种形式则是已初始化）。
paths./upload.post.responses.200.content.application/json.examples.initialised.summary: 分片上传初始化的响应
paths./upload.post.responses.400.description: 表单解析不了，或者没有 `file` 字段。
paths./upload.post.responses.401.description: 无权访问目标房间。
paths./upload.post.responses.413.description: 文件超过 `file.limit`。
paths./upload.post.responses.500.description: 写文件或登记失败。

# ── /upload/chunk ─────────────────────────────────────────────────────
paths./upload/chunk.post.description: |
  分片上传的第一步。请求体是**文件名**（纯文本），这时还不写任何字节。
  响应里带着 `uuid`，后面追加分片与收尾都用它。

  ```text
  POST /upload/chunk          body = 文件名            → {"result":{"uuid":"..."}}
  POST /upload/chunk/{uuid}   body = 一片的字节        → {}
  POST /upload/finish/{uuid}  （无 body）              → {"url","id","type"}
  ```

  这条路由与 `POST /upload` **共用同一个处理器**，区别只在路径和那道 `Content-Type: text/plain` 的关卡。
paths./upload/chunk.post.requestBody.description: 文件名，纯文本。
paths./upload/chunk.post.responses.200.description: 一个新的上传 uuid。
paths./upload/chunk.post.responses.401.description: 无权访问目标房间。
paths./upload/chunk.post.responses.500.description: 登记这次上传失败。

paths./upload/chunk/{uuid}.post.description: |
  往一个先前用 `POST /upload/chunk` 初始化过的上传里追加原始字节。每次调用都会更新已记录的体积，
  累计值会拿去跟 `file.limit` 比。

  分片大小按 `file.chunk`（默认 1 MiB）左右发。**单个请求体上限 16 MiB**，由 HTTP 层管，
  与 `file.limit` 无关。

  NOTE (code)：鉴权用的是**初始化时记录在上传上的那个房间**，不是这次请求里带的 `?room=`。
paths./upload/chunk/{uuid}.post.responses.200.description: 分片已追加。
paths./upload/chunk/{uuid}.post.responses.200.content.application/json.schema.description: 一个空对象（这个服务端在这里**不回 204**）。
paths./upload/chunk/{uuid}.post.responses.400.description: 那个 uuid 下没有登记过上传。
paths./upload/chunk/{uuid}.post.responses.401.description: 无权访问这次上传所属的房间。
paths./upload/chunk/{uuid}.post.responses.413.description: 累计体积会超过 `file.limit`。
paths./upload/chunk/{uuid}.post.responses.500.description: 分片写不进去。

# ── /upload/finish ────────────────────────────────────────────────────
paths./upload/finish/{uuid}.post.description: |
  收尾一次分片上传：生成文件条目（字节能解码成图片、且不超过 32 MiB 时**顺带生成缩略图**）、
  存下来、广播 `receive`。

  房间取自**这次上传自己的登记**；在这里带 `?room=default` **不能**把它挪出受保护的房间。

  NOTE (code)：成功响应体是 `{url, id, type}`，而 `type` 是按文件名探测出的媒体种类，
  不是字面量 `file`。
paths./upload/finish/{uuid}.post.responses.200.description: 文件条目已存下并广播。
paths./upload/finish/{uuid}.post.responses.400.description: 那个 uuid 下没有登记过上传。
paths./upload/finish/{uuid}.post.responses.401.description: 无权访问这次上传所属的房间。
paths./upload/finish/{uuid}.post.responses.500.description: 存消息失败。

# ── /file/{uuid} ──────────────────────────────────────────────────────
paths./file/{uuid}.get.description: |
  把文件字节流出去。支持 `Range`（拖视频进度条、断点续传都能用），
  `If-Modified-Since` / `If-None-Match` 也原样透传。

  - `Content-Type` 是按**原始文件名**猜的，不是按磁盘上的名字（磁盘上是不带扩展名的裸 uuid）。
    文本类型会带上 `; charset=utf-8`，这样中文 `.txt` 不会被渲染成 Latin-1 乱码。
  - `?download=true` 会加上 `Content-Disposition: attachment`；否则是 `inline`，浏览器直接渲染。
  - 鉴权用**文件上记录的那个房间** —— 客户端传的 `?room=` 被忽略，这正是「`?room=default`
    读不到受保护房间的文件」的原因。
  - **分享令牌**（`?t=`）只对 `GET` 有效，而且必须指向**这个**文件。界面上那颗分享按钮签的是
    `content` 类型的令牌、目标是文件 —— 那种也接受，但只在这个内容确实引用该 uuid 时。
paths./file/{uuid}.get.parameters.4.description: 为 `true` 时强制下载，而不是内联渲染。
paths./file/{uuid}.get.parameters.5.description: 标准的 HTTP 字节区间；**不消耗**分享令牌的次数。
paths./file/{uuid}.get.responses.200.description: 文件字节。
paths./file/{uuid}.get.responses.200.headers.Content-Type.description: 按原始文件名猜出来的。
paths./file/{uuid}.get.responses.200.headers.Content-Disposition.description: 默认 `inline`，带 `?download=true` 时是 `attachment`。
paths./file/{uuid}.get.responses.200.headers.Accept-Ranges.description: 有这一条是因为支持区间请求。
paths./file/{uuid}.get.responses.206.description: 部分响应（Range 请求）。
paths./file/{uuid}.get.responses.304.description: 未修改（条件请求）。
paths./file/{uuid}.get.responses.401.description: 无权访问该文件所在的房间，且没有可用的分享令牌。
paths./file/{uuid}.get.responses.404.description: 没这个文件、它已过期，或者字节已从磁盘上消失。
paths./file/{uuid}.delete.description: 从磁盘删掉字节、从存储里删掉登记。删一个**本来就没了**的文件不算错（`NotFound` 被容忍）。分享令牌在这里**不管用**：它是只读的。
paths./file/{uuid}.delete.responses.200.description: 文件已删除。
paths./file/{uuid}.delete.responses.401.description: 无权访问该文件所在的房间。
paths./file/{uuid}.delete.responses.404.description: 没这个文件，或者它已过期。
paths./file/{uuid}.delete.responses.500.description: 字节还在，但删不掉。

# ── /file/{uuid}/{name} ───────────────────────────────────────────────
paths./file/{uuid}/{name}.parameters.1.description: 只是给人看的 —— 服务端认的是 uuid。
paths./file/{uuid}/{name}.get.description: 与 `GET /file/{uuid}` 完全相同；末尾那段文件名是为了让 URL 看起来像个真文件名。
paths./file/{uuid}/{name}.get.responses.200.description: 文件字节。
paths./file/{uuid}/{name}.get.responses.206.description: 部分响应（Range 请求）。
paths./file/{uuid}/{name}.get.responses.304.description: 未修改（条件请求）。
paths./file/{uuid}/{name}.get.responses.401.description: 无权访问该文件所在的房间，且没有可用的分享令牌。
paths./file/{uuid}/{name}.get.responses.404.description: 没这个文件、它已过期，或者字节已从磁盘上消失。
paths./file/{uuid}/{name}.delete.description: 与 `DELETE /file/{uuid}` 完全相同。
paths./file/{uuid}/{name}.delete.responses.200.description: 文件已删除。
paths./file/{uuid}/{name}.delete.responses.401.description: 无权访问该文件所在的房间。
paths./file/{uuid}/{name}.delete.responses.404.description: 没这个文件，或者它已过期。

# ── /revoke ───────────────────────────────────────────────────────────
paths./revoke/{id}.post.description: |
  删掉这条，并广播 `revoke`（`{"id": <number>}`）。成功响应**没有 body**（光秃秃一个 200），
  与参考实现一致。

  NOTE (code)：这个服务端**只接受 POST**。其他任何方法（包括 GET）都回 `405`。
  更早的实现根本没有方法检查，于是**在浏览器里访问一下 `/revoke/5` 就真的删掉了第 5 条**；
  这个洞在这里堵上了。
paths./revoke/{id}.post.responses.200.description: 条目已删除。响应体为空。
paths./revoke/{id}.post.responses.400.description: id 不是数字。
paths./revoke/{id}.post.responses.401.description: 无权访问该条目所在的房间。
paths./revoke/{id}.post.responses.404.description: 没这条，或者它不在请求的那个房间里。
paths./revoke/{id}.post.responses.500.description: 删除失败。
paths./revoke/all.post.description: |
  删掉这个房间里的**每一条**，并广播 `clearAll`（`{"room": "..."}`）。只清被点名的那个房间 ——
  **刻意没有**「清空一切」这个能力。`?room=` 为空或不传即 `default` 房间。

  NOTE (code)：成功响应体是**纯文本**（`所有消息已清除\n`），不是 JSON，照参考实现来的。
  在这里硬编码 JSON 的客户端会挂。
paths./revoke/all.post.responses.200.description: 房间里的每条消息都已清除。
paths./revoke/all.post.responses.401.description: 无权访问该房间。

# ── /share ────────────────────────────────────────────────────────────
paths./share.post.description: |
  签一枚带签名、自描述的令牌，授予对**一条内容或一个文件**的**读**权限。有效期、次数上限、密码
  全都写在令牌里，所以**总是**签令牌 —— 包括对开放的房间，那里如果只回一个裸 URL，
  就等于把调用方要的那几道限制**悄悄丢掉**了。

  请求体（JSON，所有字段可选；**空体即全部用默认值**）：

  | 字段 | 说明 |
  |---|---|
  | `type` | `content` 或 `file`。缺失 → 400 `missing_type` |
  | `id` | `type: content` 时是条目 id（字符串） |
  | `uuid` | `type: file` 时是文件 uuid。也接受 `id`（老客户端） |
  | `ttl` | 秒；默认 900，夹到 60 – 86400 |
  | `maxUses` | `0`（默认）= 不限次 |
  | `password` | 可选；给了之后收件方必须带 `X-Share-Password` |

  ⚠️ **不认识的字段会被拒（400），而不是忽略** —— 这样把 `max_uses` 写成下划线的人
  不会**悄悄**丢掉他配的那道限制。

  响应里有两种寻址形式：`url` / `pageUrl`（落地页，**爬虫和人看到的是同一个地址**），
  以及 `rawUrl`（带同一枚令牌直达内容/文件接口）。
paths./share.post.requestBody.content.application/json.examples.content.summary: 分享一条文本，15 分钟
paths./share.post.requestBody.content.application/json.examples.file.summary: 分享一个文件，5 次，带密码
paths./share.post.responses.200.description: 分享已创建。
paths./share.post.responses.200.content.application/json.examples.content.summary: 内容分享
paths./share.post.responses.200.content.application/json.examples.file.summary: 文件分享
paths./share.post.responses.400.description: JSON 体不合法（`invalid_request_body`）、有未知字段，或者 `type` / `id` / `uuid` 缺失或非法。
paths./share.post.responses.401.description: 无权访问目标所属的那个房间。
paths./share.post.responses.404.description: 目标条目或文件不存在（或已过期），或者不在请求的那个房间里。

paths./share.get.description: |
  分享落地页在取任何东西**之前**先问这个：类型、文件名与大小、还剩多久、还剩几次、要不要密码。

  - **它不消耗次数** —— 光打开页面不该烧掉一次。
  - 密码走 `X-Share-Password`，**永远不**进 URL。
  - 受密码保护的分享还会多回一个 `previewToken`（以及 `previewExpiresAt`）。
    浏览器没法给 `<img>` / `<video>` / `<a download>` 加自定义头，所以页面需要这枚令牌来内联预览。
    ⚠️ 不受保护的分享**刻意不给**预览令牌：那会是个不限次的东西，等于把 `maxUses` 废掉。
  - `used` 只在「限次且还有活的记录」的分享上出现。
paths./share.get.responses.200.description: 分享的元信息。
paths./share.get.responses.200.content.application/json.examples.textNoPassword.summary: 文本分享，无密码，不限次
paths./share.get.responses.200.content.application/json.examples.fileWithPassword.summary: 文件分享，带密码与次数上限
paths./share.get.responses.400.description: 这枚令牌带的是本接口描述不了的分享类型。
paths./share.get.responses.401.description: 令牌不对/已过期，或者需要密码/密码不对。
paths./share.get.responses.404.description: 分享指向的东西已经不在了。
paths./share.head.description: 与 `GET /share?t=` 相同，只是不要响应体。
paths./share.head.responses.200.description: 分享存在，且令牌可用。
paths./share.head.responses.401.description: 令牌不对/已过期，或者需要密码/密码不对。
paths./share.head.responses.404.description: 分享指向的东西已经不在了。

paths./share/list.get.description: |
  列出某个房间最近的分享记录，以及每个链接被打开了几次。鉴权与「在该房间创建分享」完全一致 ——
  所以**不可能**出现「能创建分享却看不到自己的」。

  - `limit` 默认 50，上限 200。
  - ⚠️ **列表里永远不含令牌。** 令牌是持有即用的凭据；列出来的话，任何能读这个房间的人
    都能拿去复用别人的分享。
  - `password` 只报**有没有**设密码，绝不报它的哈希。
  - `expired` 是按当前时间算出来的。
paths./share/list.get.parameters.1.description: 每页条数，默认 50，最大 200。回给你的就是实际用的那个值。
paths./share/list.get.responses.200.description: 该房间的分享记录。
paths./share/list.get.responses.401.description: 无权访问该房间。

paths./share/visit.post.description: |
  分享页挂载时调一次。服务端自己校验令牌；无效或已过期的令牌回 401，**永远不计入**。

  - 同一个访客十分钟内再报一次时 `tracked` 是 `false` —— 重复上报不能把数字灌大。
    返回的计数仍然是最新的。
  - `qr: true`（或 `?q=1`）在「打开」之外**再记一次扫码**。二维码里应该编 `/s/<token>?q=1`。
  - **不需要鉴权**：拿着链接就是上报的资格，而响应也只描述这一个分享。
  - 光是请求 `/s/{token}` **本身从不计数** —— 这就是为什么聊天软件的爬虫
    （它们按自己的节奏反复抓那个地址、也不执行 JavaScript）灌不了水。
paths./share/visit.post.parameters.1.description: '`1` 表示这次访问来自扫二维码。'
paths./share/visit.post.responses.200.description: 上报已处理。
paths./share/visit.post.responses.200.content.application/json.examples.debounced.summary: 同一访客十分钟内 —— 不重复计数
paths./share/visit.post.responses.400.description: 没给令牌，或者请求体不是合法 JSON。
paths./share/visit.post.responses.401.description: 令牌不对或已过期（过期链接不计入）。

paths./s/{token}.get.description: |
  分享链接的**唯一地址**：一个 SPA 外壳，`<head>` 里注入了 Open Graph 标签。
  聊天软件展开这个 URL 时看到的是一张真的预览卡（它不执行 JavaScript，所以摘要必须服务端渲染好）；
  人点开**同一个** URL 则落到分享页本身。不跳转、没有第二个地址、没有第二个身份。

  - **它既不计数也不消耗次数**：只有 `POST /share/visit` 计。
  - 受密码保护的分享**绝不**把内容摘要泄进卡片里。
  - `og:image` 只给**不限次**分享里的图片加上 —— 爬虫去取那张图会在 `/file` 那条路上消耗一次，
    而预览把额度烧光，等于把一条已经用尽的链接递给真人。
  - 响应头：`X-Robots-Tag: noindex, nofollow`、`Cache-Control: private, max-age=0, must-revalidate`、
    `Referrer-Policy: no-referrer`、`X-Content-Type-Options: nosniff`。
  - 没有静态资源时（纯 API 部署）回一个自带的兜底页，标签一样。
paths./s/{token}.get.responses.200.description: 分享页的 HTML。
paths./s/{token}.get.responses.200.content.text/html.examples.html.summary: 节选

# ── /push ─────────────────────────────────────────────────────────────
paths./push.get.description: |
  升级成 WebSocket，流式推这个房间的事件。注册成 `GET` 是因为 WebSocket 握手本来就是 GET。

  **握手顺序（这个顺序就是契约）：**

  1. 房间受保护时：没带凭据回 `401 unauthorized_missing_token`，带错了回
     `401 unauthorized_invalid_token`。两者**分开**，客户端才能分辨「该去要密码」和「密码是错的」。
     拒绝发生在升级**之前**，所以那是一个普通的 JSON 响应。
  2. `Sec-WebSocket-Protocol` 要**回显**。客户端给了子协议而服务端不选一个，浏览器就会判定握手失败 ——
     客户端正是靠它把令牌传进来、又不放进 URL。
  3. 升级。
  4. 帧序：先给房间里已有的每台设备各来一条 `connect`，再给这条连接向其他人发一条 `connect`，
     然后是 `config`，最后才是实时事件。

  ⚠️★ **握手不推历史。** 历史用 `GET /content` 取，并用 `config.latestId`
  —— 连接那一刻房间里最大的消息 id（空房间为 `0`）—— 来对齐历史与实时的边界。
  `id <= latestId` 当历史（记下来，**不要**写剪贴板），`id > latestId` 才是实时。
  **绝不要**用时间窗口去猜边界：窗口早结束一点，就会**悄悄**把整段历史灌进剪贴板。
  拿不到 `latestId`（服务端太旧）时，**宁可拒绝写入，也不要猜**。

  服务端每 5 秒发一次协议级 ping（否则空闲连接会在代理后面**悄无声息地**死掉），
  并且会把**跟不上广播**的客户端断开 —— 让它重连、重新同步，而不是安静地漏掉一条 `revoke`。
  重连与退避是客户端的事。
paths./push.get.parameters.3.description: 凭据优先从 `Authorization` / `?auth=` 取，取不到才看第一个子协议。**优先用这个载体**：它让令牌不进 URL，也就不进访问日志。
paths./push.get.responses.101.description: 正在切换协议。之后事件帧按下面写的流动。
paths./push.get.responses.401.description: 房间受保护，而凭据缺失或不对。
paths./push.get.x-websocket-events.clientToServer.0.description: 应用层 ping。服务端会把 `data` 原样放进 `pong` 回显，客户端据此用 `Date.now() - data` 算 RTT。
paths./push.get.x-websocket-events.serverToClient.0.description: 房间里的一台设备，或者这条连接在向其他人宣告自己。
paths./push.get.x-websocket-events.serverToClient.1.description: 某台设备的**最后一条**连接断了。一台设备开多个标签页时，关掉其中一个**不**报断开。
paths./push.get.x-websocket-events.serverToClient.2.description: 连上之后发一次，排在任何实时消息**之前**。`version` 与那几个大小限额**只在这里**给，也是前端 `app.config` 的唯一来源。
paths./push.get.x-websocket-events.serverToClient.3.description: 房间里来了新内容。
paths./push.get.x-websocket-events.serverToClient.4.description: 已有条目被**原地**改了（同一个 `id`）—— 改写正文或挪看板列。
paths./push.get.x-websocket-events.serverToClient.5.description: 某一条被删了。
paths./push.get.x-websocket-events.serverToClient.6.description: 房间被清空了。
paths./push.get.x-websocket-events.serverToClient.7.description: 对客户端 `ping` 的回复，`data` 原样带回。
paths./push.get.x-websocket-events.serverToClient.8.description: 组件之间的内部事件；**不会**发给 WebSocket 客户端。
