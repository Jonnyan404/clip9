info.summary: clip9 Rust 服务端（crates/server）的 REST + WebSocket 契约

info.description: |
  # clip9 API

  `clip9-server`（`rust/crates/server`）对外提供的 HTTP + WebSocket 接口。
  它是 Cloud Clipboard 项目的服务端一半：一个**按房间隔离**的剪贴板 ——
  客户端把文本或文件投进某个房间，房间里其他成员**实时**收到。

  这份文档是照着 Rust 的路由表（`crates/server/src/lib.rs::router`）和各处理器读出来的。
  ⚠️ 与代码不一致时**以代码为准**；与 Go 版 / Worker 版不一致的地方在正文里用 `NOTE (code)` 标出来。

  ## 路径索引

  | 方法 | 路径 | 干什么 |
  |---|---|---|
  | GET | `/server` | 服务能力与当前鉴权状态 |
  | GET | `/healthz` | 存活探针（**实现附赠**） |
  | POST | `/auth/token` | 用密码换一个 1 小时的会话令牌 |
  | POST | `/auth/token/refresh` | 续期会话令牌（不用再给密码） |
  | POST | `/text` | 发文本（带 `id` 是**原地改**） |
  | GET | `/content` | 历史分页（游标是 `id`） |
  | GET | `/content/latest` | 最新一条 |
  | GET | `/content/{id}` | 按 id 取一条 |
  | POST | `/content/{id}/column` | 改看板那一列 |
  | GET | `/rooms` | 房间列表 |
  | GET | `/stats/daily` | 每天活跃度（热力图数据源） |
  | POST | `/upload` | 小文件整份上传（multipart） |
  | POST | `/upload/chunk` · `/upload/chunk/{uuid}` · `/upload/finish/{uuid}` | 分片上传 |
  | GET/DELETE | `/file/{uuid}` · `/file/{uuid}/{name}` | 下载 / 删 |
  | POST | `/revoke/{id}` · `/revoke/all` | 撤回一条 / 清空 |
  | POST/GET | `/share` · `/share/list` · `/share/visit` · `/s/{token}` | 分享链接与落地页 |
  | GET | `/push` | **WebSocket** |
  | GET/POST | `/tasks*` | 定时自动化 |

# ── 路径的 summary（列表里最先看到的那一层）────────────────────────────
