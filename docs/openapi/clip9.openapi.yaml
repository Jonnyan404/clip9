  # ── Sharing ───────────────────────────────────────────────────────────
  /share:
    post:
      tags: [Sharing]
      summary: Issue a share token
      description: |
        Creates a signed, self-describing token that grants **read** access to one content
        entry or one file. TTL, usage limit and password all live inside the token, so a token
        is issued **always** — including for open rooms, where returning a bare URL would
        silently discard the limits the caller asked for.

        Request body (JSON, all fields optional; an **empty body means all defaults**):

        | Field | Notes |
        |---|---|
        | `type` | `content` or `file`. Missing → 400 `missing_type` |
        | `id` | For `type: content`, the entry id (as a string) |
        | `uuid` | For `type: file`, the file uuid. `id` is also accepted (older clients) |
        | `ttl` | Seconds; default 900, clamped to 60 – 86400 |
        | `maxUses` | `0` (default) = unlimited |
        | `password` | Optional; the recipient must then send `X-Share-Password` |

        Unknown fields are **rejected** (400) rather than ignored, so a typo like `max_uses`
        cannot silently drop the limit the user configured.

        The response carries two addressing forms: `url` / `pageUrl` (the landing page, which
        is the *same* address a crawler and a human see) and `rawUrl` (which reaches the
        content/file endpoint directly with the same token).
      operationId: createShare
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            examples:
              content:
                summary: Share one text entry for 15 minutes
                value:
                  type: content
                  id: '7'
                  ttl: 900
                  maxUses: 0
                  password: ''
              file:
                summary: Share a file, 5 uses, password protected
                value:
                  type: file
                  uuid: 11111111-2222-3333-4444-555555555555
                  ttl: 3600
                  maxUses: 5
                  password: hunter2
      responses:
        '200':
          description: The share was created.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ShareCreatedContent'
                  - $ref: '#/components/schemas/ShareCreatedFile'
              examples:
                content:
                  summary: Content share
                  value:
                    type: content
                    id: '7'
                    room: default
                    ttl: 900
                    expiresAt: 1750000000
                    maxUses: 0
                    token: eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    jti: 9f2c8b1e4d5a4f7d
                    url: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    pageUrl: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    rawUrl: https://clip.example.com/content/7?t=eyJ0eXAiOiJzaGFyZSJ9.9f2c
                    visits: 0
                    scans: 0
                file:
                  summary: File share
                  value:
                    type: file
                    uuid: 11111111-2222-3333-4444-555555555555
                    room: default
                    ttl: 3600
                    expiresAt: 1750003600
                    maxUses: 5
                    token: eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    jti: 1a2b3c4d5e6f7a8b
                    url: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    pageUrl: https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    rawUrl: https://clip.example.com/file/11111111-2222-3333-4444-555555555555/photo.png?t=eyJ0eXAiOiJzaGFyZSJ9.a1b2
                    visits: 0
                    scans: 0
        '400':
          description: |
            Bad JSON body (`invalid_request_body`), an unknown field, or a missing/invalid
            `type` / `id` / `uuid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingType:
                  value:
                    code: missing_type
                    error: Missing type
                    message: 缺少 type
                unsupportedType:
                  value:
                    code: unsupported_type
                    error: Unsupported type
                    message: 不支持的 type
                badId:
                  value:
                    code: invalid_id
                    error: Invalid id
                    message: 无效的 id
                badBody:
                  value:
                    code: invalid_request_body
                    error: Invalid request body
                    message: 无效的请求体
        '401':
          description: No access to the room the target belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '404':
          description: The target entry or file does not exist (or has expired), or is not in the requested room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                contentMissing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                fileMissing:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
        '405':
          $ref: '#/components/responses/OnlyPost'

    get:
      tags: [Sharing]
      summary: Share metadata (does not consume a use)
      description: |
        What the share landing page asks before fetching anything: the type, the file name and
        size, the remaining validity, the remaining uses, and whether a password is needed.

        - **It does not consume a use** — merely opening the page must not burn one.
        - The password travels in `X-Share-Password`, **never** in the URL.
        - When the share is password-protected the response also carries a `previewToken`
          (and `previewExpiresAt`). Browsers cannot attach custom headers to `<img>` /
          `<video>` / `<a download>`, so the page needs this token to render inline previews.
          Unprotected shares deliberately get **no** preview token: it would be unlimited-use
          and would defeat `maxUses`.
        - The `used` field appears only for a limited share that has a live record.
      operationId: getShareInfo
      parameters:
        - $ref: '#/components/parameters/ShareTokenQueryRequired'
        - $ref: '#/components/parameters/SharePasswordHeader'
      security: []
      responses:
        '200':
          description: The share metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareInfo'
              examples:
                textNoPassword:
                  summary: Text share, no password, unlimited
                  value:
                    type: content
                    kind: text
                    id: '7'
                    room: default
                    expiresAt: 1750000000
                    maxUses: 0
                    needsPassword: false
                fileWithPassword:
                  summary: File share with a password and a use limit
                  value:
                    type: content
                    kind: file
                    id: '8'
                    room: default
                    expiresAt: 1750003600
                    maxUses: 5
                    used: 2
                    needsPassword: true
                    uuid: 11111111-2222-3333-4444-555555555555
                    name: photo.png
                    size: 20480
                    previewToken: eyJ0eXAiOiJwcmV2aWV3In0.zz99
                    previewExpiresAt: 1750003600
        '400':
          description: The token carries a share type this endpoint cannot describe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupported:
                  value:
                    code: unsupported_type
                    error: Unsupported type
                    message: 不支持的分享类型
        '401':
          description: The token is bad/expired, or a password is required/mismatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: share_token_invalid
                    error: Share link is invalid or expired
                    message: 分享链接无效或已过期
                password:
                  value:
                    code: share_password_required
                    error: Share password required
                    message: 需要分享密码
        '404':
          description: The share points at something that is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                contentMissing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                fileMissing:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期

    head:
      tags: [Sharing]
      summary: Share metadata (headers only)
      description: Same as `GET /share?t=` with the body omitted.
      operationId: headShareInfo
      parameters:
        - $ref: '#/components/parameters/ShareTokenQueryRequired'
        - $ref: '#/components/parameters/SharePasswordHeader'
      security: []
      responses:
        '200':
          description: The share exists and the token is usable.
        '401':
          description: The token is bad/expired, or a password is required/mismatched.
        '404':
          description: The share points at something that is gone.

  /share/list:
    get:
      tags: [Sharing]
      summary: Recent shares of a room
      description: |
        Lists a room's recent share records together with how often each link was opened.
        Authorisation is identical to creating a share in that room, so it is impossible to be
        able to create a share but not see your own.

        - `limit` defaults to 50 and is capped at 200.
        - **The list never contains tokens.** A token is a bearer credential; listing it would
          let anyone who can read the room reuse somebody else's share.
        - `password` reports only *whether* a password is set, never its hash.
        - `expired` is computed against the current time.
      operationId: listShares
      parameters:
        - $ref: '#/components/parameters/RoomQuery'
        - name: limit
          in: query
          required: false
          description: Page size, default 50, maximum 200. The value reported back is the value used.
          schema:
            type: integer
            minimum: 1
            maximum: 200
          example: 50
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The room's share records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareList'
              examples:
                list:
                  value:
                    room: default
                    total: 3
                    limit: 50
                    records:
                      - jti: 9f2c8b1e4d5a4f7d
                        type: content
                        kind: text
                        id: '7'
                        room: default
                        name: first line of the text
                        size: 0
                        createdAt: 1749999000
                        expiresAt: 1750000000
                        maxUses: 0
                        used: 0
                        visits: 2
                        scans: 1
                        password: false
                        expired: false
        '401':
          description: No access to this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '405':
          $ref: '#/components/responses/OnlyGet'

  /share/visit:
    post:
      tags: [Sharing]
      summary: Report that a human opened a share
      description: |
        Called once by the share page on mount. The server validates the token itself; an
        invalid or expired token is rejected with 401 and **never counted**.

        - `tracked` is `false` when the same visitor reports again within ten minutes —
          repeated reports must not inflate the number. The counts returned are still current.
        - `qr: true` (or `?q=1`) records one scan in addition to the open. QR codes should
          encode `/s/<token>?q=1`.
        - **No authentication**: holding the link is what lets you report, and the response
          only describes that one share.
        - Serving `/s/{token}` never counts by itself, which is why chat-app crawlers (which
          re-fetch the address on their own schedule and do not execute JavaScript) cannot
          inflate anything.
      operationId: reportShareVisit
      parameters:
        - $ref: '#/components/parameters/ShareTokenQuery'
        - name: q
          in: query
          required: false
          description: '`1` marks the visit as coming from a scanned QR code.'
          schema:
            type: string
            enum: ['1']
          example: '1'
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareVisitRequest'
            examples:
              qr:
                value:
                  token: eyJ0eXAiOiJzaGFyZSJ9.9f2c
                  qr: true
      responses:
        '200':
          description: The report was processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareVisitResult'
              examples:
                tracked:
                  value:
                    ok: true
                    tracked: true
                    visits: 3
                    scans: 1
                debounced:
                  summary: Same visitor within ten minutes — not counted again
                  value:
                    ok: true
                    tracked: false
                    visits: 3
                    scans: 1
        '400':
          description: No token was supplied, or the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: missing_token
                    error: Missing token
                    message: 缺少 token
                badBody:
                  value:
                    code: invalid_request_body
                    error: Invalid request body
                    message: 无效的请求体
        '401':
          description: The token is bad or expired (expired links are not counted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: share_token_invalid
                    error: Share link is invalid or expired
                    message: 分享链接无效或已过期
        '405':
          $ref: '#/components/responses/OnlyPost'

  /s/{token}:
    get:
      tags: [Sharing]
      summary: Share landing page (HTML)
      description: |
        The share link's **single address**: an SPA shell with Open Graph tags injected into its
        `<head>`. A chat app unfurling the URL sees a real preview card (it does not run
        JavaScript, so the summary must be server-rendered); a human opening the very same URL
        lands in the share page itself. No redirect, no second address, no second identity.

        - **Neither counts nor consumes**: only `POST /share/visit` counts.
        - A password-protected share never leaks a content summary into the card.
        - `og:image` is added only for images on **unlimited** shares — the crawler fetching
          that image consumes a use on the `/file` path, and a preview burning the quota would
          hand the human an exhausted link.
        - Response headers: `X-Robots-Tag: noindex, nofollow`, `Cache-Control: private,
          max-age=0, must-revalidate`, `Referrer-Policy: no-referrer`,
          `X-Content-Type-Options: nosniff`.
        - Without a static source (API-only deployment) this returns a self-contained
          fallback page carrying the same tags.
      operationId: getShareLandingPage
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          example: eyJ0eXAiOiJzaGFyZSJ9.9f2c
      security: []
      responses:
        '200':
          description: The share page HTML.
          headers:
            X-Robots-Tag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
              examples:
                html:
                  summary: Abridged
                  value: |
                    <!doctype html><html><head>
                    <title>photo.png</title>
                    <meta property="og:title" content="photo.png" />
                    <meta property="og:description" content="文件 · 20 KB · 15 分钟后过期" />
                    <meta property="og:url" content="https://clip.example.com/s/eyJ0eXAiOiJzaGFyZSJ9.9f2c" />
                    </head><body><div id="app"></div></body></html>
        '405':
          $ref: '#/components/responses/OnlyGet'

  # ── Realtime ──────────────────────────────────────────────────────────
  /push:
    get:
      tags: [Realtime]
      summary: WebSocket push channel
      description: |
        Upgrades to a WebSocket and streams that room's events. Registered as a `GET` because
        that is what a WebSocket handshake is.

        **Handshake order (this order is the contract):**

        1. If the room is protected: a missing credential returns `401
           unauthorized_missing_token`, a wrong one `401 unauthorized_invalid_token`. These are
           distinct so the client can tell "ask for a password" from "that password is wrong".
           The rejection happens **before** the upgrade, so it is an ordinary JSON response.
        2. `Sec-WebSocket-Protocol` is echoed back. If the client offered a subprotocol the
           server **must** select one or the browser fails the handshake — clients use it to
           pass the token without putting it in the URL.
        3. Upgrade.
        4. Frames: one `connect` per device already in the room, a `connect` for this
           connection to the others, then `config`, then realtime events.

        **The handshake does not push history.** Fetch it with `GET /content`, and use
        `config.latestId` — the largest message id in the room at connect time (`0` when
        empty) — to align the history/realtime boundary. Treat `id <= latestId` as history
        (record it, do **not** apply it to the clipboard) and `id > latestId` as realtime.
        Never guess the boundary from a time window: a window that ends early silently floods
        the clipboard. If `latestId` is missing (an older server), refuse to write rather than
        guess.

        The server sends a protocol-level ping every 5 seconds (idle connections die silently
        behind proxies otherwise) and **disconnects** a client that falls behind the broadcast,
        so it reconnects and re-syncs instead of quietly missing a `revoke`. Reconnection and
        backoff are the client's job.
      operationId: pushChannel
      parameters:
        - $ref: '#/components/parameters/RoomQuery'
        - $ref: '#/components/parameters/NameQuery'
        - $ref: '#/components/parameters/AuthQuery'
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          description: |
            The credential is taken from `Authorization` / `?auth=` first, and from the first
            subprotocol only as a fallback. Prefer this carrier: it keeps the token out of the
            URL, hence out of access logs.
          schema:
            type: string
          example: Bearer eyJhbGciOiJIUzI1NiJ9.abc
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: integer
            enum: [13]
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            enum: [websocket]
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            enum: [Upgrade]
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '101':
          description: Switching protocols. Event frames then flow as documented below.
        '401':
          description: The room is protected and the credential is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized_missing_token
                    error: Missing auth token
                    message: 'Unauthorized: Missing token'
                invalid:
                  value:
                    code: unauthorized_invalid_token
                    error: Invalid auth token
                    message: 'Unauthorized: Invalid token'
      x-websocket-events:
        frameFormat: '{"event": "<name>", "data": <payload>}'
        clientToServer:
          - event: ping
            description: |
              Application-level ping. The server echoes `data` back verbatim in a `pong`, so
              the client can compute RTT as `Date.now() - data`.
            example:
              event: ping
              data: 1758000000123
        serverToClient:
          - event: connect
            description: A device in the room, or this connection announcing itself to the others.
            schemaRef: '#/components/schemas/DeviceMeta'
          - event: disconnect
            description: A device's **last** connection closed. Closing one tab of several does not report a disconnect.
            schemaRef: '#/components/schemas/DisconnectData'
          - event: config
            description: |
              Sent once, right after connecting and before any realtime message. This is the
              only place `version` and the size limits are sent, and the only source of the
              front end's `app.config`.
            schemaRef: '#/components/schemas/WsConfig'
          - event: receive
            description: A new entry arrived in the room.
            schemaRef: '#/components/schemas/ReceiveEntry'
          - event: update
            description: An existing entry was edited in place (same `id`) — body rewrite or board move.
            schemaRef: '#/components/schemas/ReceiveEntry'
          - event: revoke
            description: One entry was deleted.
            schemaRef: '#/components/schemas/RevokeData'
          - event: clearAll
            description: The room was cleared.
            schemaRef: '#/components/schemas/ClearAllData'
          - event: pong
            description: Reply to a client `ping`, carrying the client's `data` unchanged.
          - event: ok
            description: Internal cross-component event; not sent to WebSocket clients.

  # ── Automation ────────────────────────────────────────────────────────
  /tasks:
    get:
      tags: [Automation]
      summary: List the room's automations
      description: |
        Lists the automations of the room derived from the credential. The list is always
        filtered by room, even for an admin.

        `tier` is `admin` / `room` / `single` / `none`; `max` is `0` for unlimited. In
        `single`-tier rooms only tasks matching the presented task token are returned, and
        `foreignCount` reports how many were hidden.

        Read-only per task: `nextRunAt`, `lastRunAt`, `lastStatus` (`ok` / `error` / `skipped`),
        `lastError`, `lastOutput`, and `desc` for cron tasks. `ownerHash` is never exposed.
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
        - $ref: '#/components/parameters/TaskTokenQuery'
      security:
        - bearerAuth: []
        - authQuery: []
        - taskToken: []
      responses:
        '200':
          description: The room's automations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              examples:
                list:
                  value:
                    room: home
                    tier: room
                    admin: false
                    max: 20
                    now: 1758000000
                    foreignCount: 0
                    tasks:
                      - id: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                        name: On-call reminder
                        enabled: true
                        freq: cron
                        time: ''
                        cron: 30 9 * * *
                        byWeekday: []
                        runAt: ''
                        tz: Asia/Shanghai
                        room: home
                        template: Today is {{date}}
                        chain:
                          - text.trimLines
                        keepHistory: false
                        sender: 定时任务
                        createdAt: 1757900000
                        updatedAt: 1757900000
                        nextRunAt: 1758072600
                        lastRunAt: 1757986200
                        lastStatus: ok
                        lastError: ''
                        lastOutput: Today is 2026-09-16
                        desc:
                          mode: minutesEachHour
                          minutes: '30'
                          hours: '9'
                          day: daily
                    vars: [date, weekday, time, datetime, timestamp, uuid, task, room]
                    actions:
                      - id: text.trimLines
                        group: text
                        groupKey: actionGroupText
                        key: actionTrimLines
        '403':
          description: Automation is not allowed for this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide (`automation.enabled = false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyGetPost'
    post:
      tags: [Automation]
      summary: Create or replace an automation
      description: |
        Omit `id` to create; supply an existing `id` to replace that task wholesale. The room
        is taken from the credential — **a `room` field in the body is not read**.

        Times, templates and action ids are validated at save time
        (`invalid_task`), never silently ignored. Notably: an unknown template variable or a
        malformed offset fails here, and `freq: cron` with an expression that can never fire
        fails here too.

        `keepHistory` defaults to `false`: the message is broadcast live but does not consume
        the room's history quota (otherwise a daily task would evict the entire room history
        within weeks).

        In a `single`-tier room the response also carries a **`taskToken`**, shown exactly
        once — it is the only credential that can later edit or delete that task.
      operationId: upsertTask
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
        - $ref: '#/components/parameters/TaskTokenQuery'
      security:
        - bearerAuth: []
        - authQuery: []
        - taskToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
            examples:
              create:
                summary: A daily reminder
                value:
                  name: On-call reminder
                  freq: daily
                  time: '09:30'
                  tz: Asia/Shanghai
                  template: 'Today is {{date}}, tomorrow is {{date:+1d}} ({{weekday:+1d}})'
                  chain: [text.trimLines]
                  keepHistory: false
              cron:
                summary: Every half hour on weekdays, 09:00-18:00
                value:
                  name: Weekday pinger
                  freq: cron
                  cron: '*/30 9-18 * * 1-5'
                  tz: Asia/Shanghai
                  template: 'Now: {{time}}'
      responses:
        '200':
          description: The task was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSaved'
              examples:
                roomTier:
                  value:
                    task:
                      id: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                      name: On-call reminder
                      enabled: true
                      freq: daily
                      time: '09:30'
                      cron: ''
                      byWeekday: []
                      runAt: ''
                      tz: Asia/Shanghai
                      room: home
                      template: Today is {{date}}
                      chain: []
                      keepHistory: false
                      sender: 定时任务
                      createdAt: 1757900000
                      updatedAt: 1757900000
                      nextRunAt: 1758072600
                      lastRunAt: 0
                      lastStatus: ''
                      lastError: ''
                      lastOutput: ''
                singleTier:
                  summary: Single-tier room — the task token is issued once
                  value:
                    task:
                      id: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                      name: One-off order
                      room: lobby
                      enabled: true
                      freq: once
                      runAt: '2026-10-01T09:30:00+08:00'
                      tz: Asia/Shanghai
                      template: 'Order: {{uuid}}'
                      chain: []
                      keepHistory: false
                      sender: 定时任务
                      createdAt: 1757900000
                      updatedAt: 1757900000
                    taskToken: f4a2c9e1b7d3450689abcdef01234567
        '400':
          description: Bad body, invalid task, room limit reached, or an unreadable source room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badBody:
                  value:
                    code: invalid_body
                    error: Cannot parse request body
                    message: 请求体无法解析
                invalidTask:
                  value:
                    code: invalid_task
                    error: Invalid task
                    message: 未知的模板变量 {{nope}}
                limitReached:
                  value:
                    code: task_limit_reached
                    error: Task limit reached
                    message: 房间 home 的定时任务已达到上限 20
                sourceForbidden:
                  value:
                    code: source_room_forbidden
                    error: Source room not readable
                    message: '正文里的 {{latest:secret}} 读不了：房间 secret 需要密码，而定时任务是无人值守的、没有密码可带。'
        '403':
          description: |
            The task belongs to somebody else or another room (`task_forbidden`), or the room
            does not allow automation (`automation_forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: task_forbidden
                    error: Task belongs to someone else
                    message: 这条任务不是你创建的，无法修改
        '404':
          description: Replacing a task that does not exist, or automation is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: task_not_found
                    error: Task not found
                    message: 任务不存在
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '413':
          description: The request body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: invalid_body
                    error: Cannot parse request body
                    message: 请求体过大
        '500':
          description: Storing the task failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                saveFailed:
                  value:
                    code: task_save_failed
                    error: Failed to save task
                    message: 保存任务失败
        '405':
          $ref: '#/components/responses/OnlyGetPost'

  /tasks/preview:
    post:
      tags: [Automation]
      summary: Render an unsaved automation
      description: |
        Renders a draft task that is not persisted and sends nothing. The payload is the same
        shape as `POST /tasks` (minus `id`).

        The reference instant defaults to the task's **next scheduled firing**, not "now" —
        otherwise a task configured at 15:00 as "daily 09:30, body `{{date:+1d}}`" would preview
        today+1, while tomorrow morning it actually sends tomorrow+1. `?at=` overrides it
        (RFC3339, or `2026-09-25` / `2026-09-25 09:30`).

        NOTE (code): this response uses `referenceAt2` for the RFC3339 spelling of the
        reference instant (the saved-task dry run uses `scheduledAt` for the same idea, and
        `referenceAt` is the Unix-seconds form in both). Clients should read `referenceAt` and
        the RFC3339 field that actually exists rather than assume symmetry.
      operationId: previewTask
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - name: at
          in: query
          required: false
          description: Reference instant to render against. An unparseable value is a 400, never a silent fallback.
          schema:
            type: string
          example: '2026-09-24T09:30:00+08:00'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The rendered output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPreview'
              examples:
                preview:
                  value:
                    preview: true
                    output: Tomorrow is 2026-09-25 (Friday)
                    room: home
                    keepHistory: false
                    referenceAt: 1758677400
                    nextRunAt: 1758677400
                    referenceAt2: '2026-09-24T09:30:00+08:00'
        '400':
          description: Invalid body/task, an unparseable `?at=`, or a rendering failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badReference:
                  value:
                    code: invalid_reference
                    error: Invalid reference time
                    message: '无法解析的时间：2026-13-45'
                renderFailed:
                  value:
                    code: render_failed
                    error: Render failed
                    message: '{{latest:secret}} 读不了：房间 secret 需要密码'
                invalidTask:
                  value:
                    code: invalid_task
                    error: Invalid task
                    message: 未知的动作 text.nope
        '403':
          description: Automation is not allowed for this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyPost'

  /tasks/cron:
    get:
      tags: [Automation]
      summary: Validate a cron expression
      description: |
        Parses a 5-field expression and returns the next fire times, plus a structured `desc`
        the UI renders as a "means …" line.

        An invalid expression returns **200 with `valid: false`** (and `error`), not 400:
        validating is what this endpoint is *for*, so "invalid" is one of its normal outputs.
        Clients call it on every keystroke, and a 4xx would make the page look broken.

        Rule worth remembering: an expression that is syntactically valid but can never fire
        (`0 0 30 2 *`, February 30th) is reported with an `error` and no `next`.
      operationId: checkCron
      parameters:
        - name: expr
          in: query
          required: true
          description: '`<min> <hour> <dom> <month> <dow>`. Five fields only; ranges, steps, lists and English names are supported.'
          schema:
            type: string
          example: '*/30 9-18 * * 1-5'
        - name: tz
          in: query
          required: false
          description: Time zone name for the returned instants. Defaults to `automation.defaultTZ`.
          schema:
            type: string
          example: Asia/Shanghai
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: 'The validation result — `valid: true` with upcoming instants, or `valid: false` with an explanation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronCheck'
              examples:
                valid:
                  value:
                    expr: '*/30 9-18 * * 1-5'
                    tz: Asia/Shanghai
                    valid: true
                    room: home
                    next:
                      - 1758675600
                      - 1758677400
                      - 1758679200
                    nextFormatted:
                      - '2026-09-24 09:00 Thu'
                      - '2026-09-24 09:30 Thu'
                      - '2026-09-24 10:00 Thu'
                    desc:
                      mode: everyNMinutes
                      n: 30
                      hours: '9-18'
                      day: weekly
                      weekdays: [1, 2, 3, 4, 5]
                invalid:
                  value:
                    expr: '0 0 30 2 *'
                    tz: Asia/Shanghai
                    valid: false
                    room: home
                    error: 这个表达式在未来算不出任何触发时刻（检查「日」和「月」是不是不可能的组合）
        '400':
          description: The time zone name is not recognised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badTz:
                  value:
                    code: invalid_timezone
                    error: Invalid time zone
                    message: 无法识别的时区 "Mars/Olympus"（写法如 Asia/Shanghai）
        '403':
          description: Automation is not allowed for this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyGetPost'
    post:
      tags: [Automation]
      summary: Validate a cron expression (POST form)
      description: |
        Identical to `GET /tasks/cron`; the expression is always taken from the query string,
        so the two methods are equivalent. Both are accepted so a client written against
        either style works.
      operationId: checkCronPost
      parameters:
        - name: expr
          in: query
          required: true
          schema:
            type: string
          example: '0 9 * * *'
        - name: tz
          in: query
          required: false
          schema:
            type: string
          example: Asia/Shanghai
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronCheck'
              examples:
                valid:
                  value:
                    expr: '0 9 * * *'
                    tz: Asia/Shanghai
                    valid: true
                    room: home
                    next: [1758675600]
                    nextFormatted: ['2026-09-24 09:00 Thu']
                    desc:
                      mode: minutesEachHour
                      minutes: '0'
                      hours: '9'
                      day: daily
        '400':
          description: The time zone name is not recognised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badTz:
                  value:
                    code: invalid_timezone
                    error: Invalid time zone
                    message: 无法识别的时区 "Mars/Olympus"（写法如 Asia/Shanghai）
        '403':
          description: Automation is not allowed for this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyGetPost'

  /tasks/rooms:
    get:
      tags: [Automation]
      summary: Rooms that have automations
      description: |
        Lists rooms that currently hold at least one automation, with a count each. An admin
        sees every room; anyone else sees only their own room's entry.
      operationId: listTaskRooms
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: Counts per room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRooms'
              examples:
                admin:
                  value:
                    room: home
                    admin: true
                    rooms:
                      - room: home
                        count: 3
                      - room: lobby
                        count: 1
        '403':
          description: Automation is not allowed for this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: automation_forbidden
                    error: Automation is not allowed in this room
                    message: 房间 home 未开放自动化（需要该房间的凭据，或由管理员在 roomAuth 里设置 automation）
        '404':
          description: Automation is disabled server-wide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: automation_disabled
                    error: Automation is disabled
                    message: 定时自动化未启用（automation.enabled = false）
        '405':
          $ref: '#/components/responses/OnlyGet'

  /tasks/{id}:
    delete:
      tags: [Automation]
      summary: Delete an automation
      description: Removes the task. The caller must own it (admin, or same room for `room` tier, or the matching task token for `single` tier).
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
        - $ref: '#/components/parameters/TaskTokenQuery'
      security:
        - bearerAuth: []
        - authQuery: []
        - taskToken: []
      responses:
        '200':
          description: The task was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDeleted'
              examples:
                deleted:
                  value:
                    deleted: true
                    id: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
        '403':
          description: The task belongs to somebody else or another room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: task_forbidden
                    error: Task belongs to someone else
                    message: 这条任务不是你创建的
        '404':
          description: No such task (or automation is disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: task_not_found
                    error: Task not found
                    message: 任务不存在
        '405':
          description: |
            Wrong method or unsupported action. NOTE (code): the task is resolved **before** the
            method is judged, so `GET /tasks/{id}` for a non-existent id returns
            `404 task_not_found`, not a 405.

            NOTE (code): the router also carries a catch-all route for `/tasks/{id}/{action}`,
            which answers exactly this 405 instead of falling through to the static-file
            fallback (which would return HTML with status 200). It is not modelled as its own
            OpenAPI path because it has no success case; the two real actions are
            `/tasks/{id}/run` and `/tasks/{id}/toggle`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupported:
                  value:
                    code: method_not_allowed
                    error: Unsupported method or action
                    message: 仅支持 DELETE /tasks/:id、POST /tasks/:id/run、POST /tasks/:id/toggle

  /tasks/{id}/run:
    post:
      tags: [Automation]
      summary: Dry run a task, or send it now
      description: |
        Renders the saved task against its next scheduled instant and returns the output.

        - Without `send`, nothing is sent — a pure dry run.
        - With `?send=1`, the message is actually broadcast now.
        - `?at=` overrides the reference instant (RFC3339, or `2026-09-25` / `2026-09-25 09:30`);
          an unparseable value is a 400, never a silent fallback.
        - NOTE (code): the dry run and the send branches share `output`, `taskId`, `room` and
          `keepHistory`, but the dry run adds `preview` / `referenceAt` / `nextRunAt` /
          `scheduledAt` while the send branch adds `sent` / `sentAt`.
      operationId: runTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
        - name: send
          in: query
          required: false
          description: When truthy, send the message now instead of only rendering it.
          schema:
            $ref: '#/components/schemas/Truthy'
          example: 1
        - name: at
          in: query
          required: false
          description: Reference instant for a dry run.
          schema:
            type: string
          example: '2026-09-24T09:30:00+08:00'
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
        - $ref: '#/components/parameters/TaskTokenQuery'
      security:
        - bearerAuth: []
        - authQuery: []
        - taskToken: []
      responses:
        '200':
          description: The rendered output (dry run) or the send confirmation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskRunDry'
                  - $ref: '#/components/schemas/TaskRunSent'
              examples:
                dry:
                  summary: Dry run (no `send`)
                  value:
                    preview: true
                    output: Today is 2026-09-24
                    taskId: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                    room: home
                    keepHistory: false
                    referenceAt: 1758677400
                    nextRunAt: 1758677400
                    scheduledAt: '2026-09-24T09:30:00+08:00'
                sent:
                  summary: 'Sent with ?send=1'
                  value:
                    sent: true
                    output: Today is 2026-09-24
                    taskId: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                    room: home
                    keepHistory: false
                    sentAt: 1758000000
        '400':
          description: A bad `?at=`, a rendering failure, or an invalid task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badReference:
                  value:
                    code: invalid_reference
                    error: Invalid reference time
                    message: '无法解析的时间：2026-13-45'
                renderFailed:
                  value:
                    code: render_failed
                    error: Render failed
                    message: 房间 secret 需要密码，无法作为来源
        '403':
          description: The task belongs to somebody else or another room, or the room disallows automation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: task_forbidden
                    error: Task belongs to someone else
                    message: 这条任务不是你创建的
        '404':
          description: No such task (or automation is disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: task_not_found
                    error: Task not found
                    message: 任务不存在
        '405':
          $ref: '#/components/responses/UnsupportedTaskAction'

  /tasks/{id}/toggle:
    post:
      tags: [Automation]
      summary: Enable or disable an automation
      description: |
        Flips `enabled` by default; `?enabled=1` / `?enabled=0` sets it explicitly. Only the
        switch is touched — never the template, the chain or the idempotency key, so toggling
        off and on does not fire an extra message.
      operationId: toggleTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
        - name: enabled
          in: query
          required: false
          description: Set the switch explicitly instead of flipping it. Truthy values are `1`, `true`, `yes`, `on`.
          schema:
            type: string
            enum: ['0', '1', 'true', 'false', 'yes', 'no', 'on', 'off']
          example: '0'
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
        - $ref: '#/components/parameters/TaskTokenQuery'
      security:
        - bearerAuth: []
        - authQuery: []
        - taskToken: []
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSaved'
              examples:
                toggled:
                  value:
                    task:
                      id: 5f3c1e2a-9b7d-4c6e-8a1f-2d3e4f5a6b7c
                      name: On-call reminder
                      enabled: false
                      freq: daily
                      time: '09:30'
                      cron: ''
                      byWeekday: []
                      runAt: ''
                      tz: Asia/Shanghai
                      room: home
                      template: Today is {{date}}
                      chain: []
                      keepHistory: false
                      sender: 定时任务
                      createdAt: 1757900000
                      updatedAt: 1758000000
                      nextRunAt: 0
                      lastRunAt: 0
                      lastStatus: ''
                      lastError: ''
                      lastOutput: ''
        '403':
          description: The task belongs to somebody else or another room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: task_forbidden
                    error: Task belongs to someone else
                    message: 这条任务不是你创建的
        '404':
          description: No such task (or automation is disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: task_not_found
                    error: Task not found
                    message: 任务不存在
        '405':
          $ref: '#/components/responses/UnsupportedTaskAction'

  /automation:
    get:
      tags: [Automation]
      summary: Automation management page (HTML)
      description: |
        A server-rendered page for creating and editing automations. It has its own HTML (it is
        registered ahead of the SPA fallback, otherwise it would resolve to a blank shell with
        no form).

        It performs **no authentication of its own** — whether a task can be created or changed
        is decided entirely by `/tasks`. The page exchanges a password for a session token and
        keeps it in `sessionStorage`, never storing the plaintext password.

        `?room=` and `?lang=` (one of `zh` / `zh-TW` / `en` / `ja`) are honoured.
      operationId: automationPage
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [zh, zh-TW, en, ja]
          example: zh
      security: []
      responses:
        '200':
          description: The management page.
          content:
            text/html:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/OnlyGet'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>`, where the credential is the global password, a
        room password, or a session token from `POST /auth/token`.

        A header whose value is not two space-separated words starting with `Bearer` is used
        **verbatim** as the credential, so `Authorization: my-password` also works. Note that
        `Bearer a b` (three parts) is likewise taken whole, rather than as `a b`.
    authQuery:
      type: apiKey
      in: query
      name: auth
      description: |
        The same credential, as `?auth=`. Consulted only when the `Authorization` header is
        absent or empty. Kept for Apple Shortcuts. **Never put a password in a shareable URL** —
        query strings land in browser history and server access logs.
    shareTokenQuery:
      type: apiKey
      in: query
      name: t
      description: |
        A share token, which authorises **read** access to the one entry or file it was issued
        for. Read-only: write endpoints ignore it.
    sharePassword:
      type: apiKey
      in: header
      name: X-Share-Password
      description: |
        The password of a password-protected share. Never sent in the URL, because query strings
        are logged.
    taskToken:
      type: apiKey
      in: header
      name: X-Task-Token
      description: |
        The task token of a `single`-tier automation (also accepted as `?taskToken=`). Issued
        once, when the task is created.

  parameters:
    RoomQuery:
      name: room
      in: query
      required: false
      description: |
        Room name. Empty or absent (or the literal `default`) means the `default` room. Names are
        case-sensitive; only surrounding whitespace is trimmed.
      schema:
        type: string
      example: home

    RoomQueryOptional:
      name: room
      in: query
      required: false
      description: |
        Room name. On endpoints that also accept "no room at all" as a distinct case, omitting
        this parameter entirely may differ from sending it empty — `GET /content/latest` is the
        one to watch: `?room=` is the `default` room, `?all=1` is "newest anywhere".
      schema:
        type: string
      example: home

    AuthQuery:
      name: auth
      in: query
      required: false
      description: Credential, used only when the `Authorization` header is absent or empty.
      schema:
        type: string
        writeOnly: true
      example: correct-horse-battery-staple

    NameQuery:
      name: name
      in: query
      required: false
      description: |
        The **device display name** the sender claims. It is cleaned (control characters
        removed, trimmed) and truncated to 32 **characters**, then stored as
        `senderDevice.name`. When empty the server infers a name from the User-Agent. Not
        interchangeable with `client`.
      schema:
        type: string
        maxLength: 32
      example: iPhone

    ClientQuery:
      name: client
      in: query
      required: false
      description: |
        A **stable client id**, stored as `senderClientID` and used to decide which messages are
        the caller's own. Set it once per installation.
      schema:
        type: string
      example: web-1a2b

    FormatQuery:
      name: format
      in: query
      required: false
      description: |
        Explicit representation selector. `raw` (aliases `text`, `plain`) forces raw bytes;
        `json` forces JSON. Any other non-empty value is a `400 unsupported_format` — it never
        falls back. Overrides `?json=` and `Accept`.
      schema:
        type: string
        enum: [raw, text, plain, json]
      example: json

    JsonQuery:
      name: json
      in: query
      required: false
      description: |
        Legacy JSON switch. `1` or `true` selects JSON; anything else is ignored. Retained for
        existing clients — new code should use `?format=json`.
      schema:
        type: string
        enum: ['1', 'true']
      example: '1'

    ShareTokenQuery:
      name: t
      in: query
      required: false
      description: A share token. When present it is tried after the room credential.
      schema:
        type: string
      example: eyJ0eXAiOiJzaGFyZSJ9.9f2c

    ShareTokenQueryRequired:
      name: t
      in: query
      required: true
      description: The share token to describe.
      schema:
        type: string
      example: eyJ0eXAiOiJzaGFyZSJ9.9f2c

    SharePasswordHeader:
      name: X-Share-Password
      in: header
      required: false
      description: The password of a password-protected share. Never placed in the URL.
      schema:
        type: string
        writeOnly: true
      example: hunter2

    TaskTokenQuery:
      name: taskToken
      in: query
      required: false
      description: |
        The task token of a `single`-tier automation, as an alternative to the `X-Task-Token`
        header (which takes precedence).
      schema:
        type: string
        writeOnly: true
      example: f4a2c9e1b7d3450689abcdef01234567

  responses:
    OnlyGet:
      description: This endpoint only accepts GET.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyGet:
              value:
                code: method_not_allowed
                error: Only GET is allowed
                message: 仅允许 GET 请求

    OnlyPost:
      description: This endpoint only accepts POST.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyPost:
              value:
                code: method_not_allowed
                error: Only POST is allowed
                message: 仅允许 POST 请求

    OnlyGetPost:
      description: This endpoint accepts GET and POST.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            onlyGetPost:
              value:
                code: method_not_allowed
                error: Only GET and POST are allowed
                message: 仅允许 GET / POST 请求

    MethodNotAllowed:
      description: |
        The method is not one this path accepts. Note the wording differs per path family: the
        `/file/*` routes use the generic message below, while other paths name the allowed
        methods.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            generic:
              value:
                code: method_not_allowed
                error: Method not allowed
                message: 方法不允许

    UnsupportedTaskAction:
      description: |
        The method or action is not supported on `/tasks/{id}*`. The message lists what is
        supported, which is more useful to a user than "POST only".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported:
              value:
                code: method_not_allowed
                error: Unsupported method or action
                message: 仅支持 DELETE /tasks/:id、POST /tasks/:id/run、POST /tasks/:id/toggle

    InvalidRequestBody:
      description: The request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidBody:
              value:
                code: invalid_request_body
                error: Invalid request body
                message: 无效的请求体

    UnsupportedFormat:
      description: The `?format=` value is not one of raw/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported:
              value:
                code: unsupported_format
                error: Unsupported format
                message: 不支持的格式（只支持 raw / json）

  schemas:

    # ── Envelopes and primitives ────────────────────────────────────────
    Error:
      type: object
      description: |
        The single error envelope. Every error path returns exactly these three fields with
        `Content-Type: application/json; charset=utf-8`, never varying by `Accept`, and with a
        trailing newline.
      required: [code, error, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Machine code in snake_case. Stable once shipped — do not branch on anything else.
          examples: [text_too_long]
        error:
          type: string
          description: Plain English, for logs and English-speaking users.
          examples: [Text too long]
        message:
          type: string
          description: Plain Chinese, shown verbatim by clients. Limit errors embed live server config values.
          examples: ['文本内容超出限制 (最大 4096 字符)']
      examples:
        - code: text_too_long
          error: Text too long
          message: 文本内容超出限制 (最大 4096 字符)

    Truthy:
      type: string
      description: |
        A truthy switch. Truthy values are `1`, `true`, `yes` and `on` (case-insensitive, trimmed).
        Everything else is falsy.
      enum: ['1', 'true', 'yes', 'on']
      examples: ['1']

    BoardColumn:
      type: string
      description: |
        Board column. `todo` is the default — a missing or empty value normalises to it. Names are
        matched case-insensitively and trimmed.
      enum: [todo, doing, done]
      examples: [doing]

    # ── Service ─────────────────────────────────────────────────────────
    ServerInfo:
      type: object
      description: The `GET /server` response. Note it carries **no** `version` and **no** size limits.
      required: [server, auth, authorized, roomProtected, config, automation]
      properties:
        server:
          type: string
          description: The WebSocket URL, with the scheme already switched to `ws` / `wss`.
          examples: [ws://127.0.0.1:9501/push]
        auth:
          type: boolean
          description: Whether the resolved context requires a password. Without `?room=` this reflects the global password only.
        authorized:
          type: boolean
          description: |
            Whether the presented credential is good. Starts at `true` — with no `?room=` and no
            global password it is `true` even with no credential at all.
        roomProtected:
          type: boolean
          description: Whether the room named by `?room=` requires a password. Always `false` when `?room=` was not supplied.
        config:
          type: object
          properties:
            server:
              type: object
              properties:
                history:
                  type: integer
                  format: int64
                  description: Entries retained per room. Also the default `GET /content` page size.
                roomList:
                  type: boolean
                  description: Whether `GET /rooms` is enabled.
        automation:
          $ref: '#/components/schemas/AutomationCapability'

    AutomationCapability:
      type: object
      description: |
        Describes what the caller may do with `/tasks`. When automation is disabled server-wide the
        object is just `{"enabled": false}`.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        room:
          type: string
          description: The room the request resolves to.
        tier:
          type: string
          description: Policy tier. `admin` = global password; `none` = not allowed.
          enum: [admin, room, single, none]
        allowed:
          type: boolean
        admin:
          type: boolean
        max:
          type: integer
          description: Maximum number of tasks; `0` means unlimited.
        defaultTZ:
          type: string
          examples: [Asia/Shanghai]
        vars:
          type: array
          description: Template variable names the UI may offer.
          items:
            type: string
          examples:
            - [date, weekday, time, datetime, timestamp, uuid, task, room]
        actions:
          type: array
          description: |
            The action library, as metadata only. `key` / `groupKey` are i18n keys from the front
            end's locale files — the server ships keys, never translations.
          items:
            $ref: '#/components/schemas/AutomationAction'

    AutomationAction:
      type: object
      required: [id, group, groupKey, key]
      properties:
        id:
          type: string
          examples: [text.trimLines]
        group:
          type: string
          examples: [text]
        groupKey:
          type: string
          examples: [actionGroupText]
        key:
          type: string
          examples: [actionTrimLines]
        params:
          type: array
          description: Empty (and omitted) for actions that take no parameters.
          items:
            $ref: '#/components/schemas/AutomationParam'

    AutomationParam:
      type: object
      required: [key, labelKey]
      properties:
        key:
          type: string
          examples: [find]
        labelKey:
          type: string
          examples: [actionParamFind]
        type:
          type: string
          description: Omitted for a single-line text input; `select` for a choice.
          enum: [select]
        options:
          type: array
          description: Omitted when empty.
          items:
            type: object
            required: [value, labelKey]
            properties:
              value:
                type: string
              labelKey:
                type: string
        visibleWhen:
          type: object
          description: Omitted when absent. Shows the param only when another param equals a value.
          required: [key, equals]
          properties:
            key:
              type: string
            equals:
              type: string

    # ── Auth ────────────────────────────────────────────────────────────
    TokenRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: The global password or a room password. An empty value is rejected with `password_required`.
          writeOnly: true

    SessionToken:
      type: object
      description: A session token. Valid for about one hour.
      required: [token, expiresAt, scope]
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: Unix **seconds**.
        scope:
          type: string
          description: '`global` for a token minted from the global password, `""` for a room password.'

    # ── Content ─────────────────────────────────────────────────────────
    TextSendResult:
      type: object
      description: Response of `POST /text` (both the create and overwrite paths).
      required: [url, id, type]
      properties:
        url:
          type: string
          format: uri
          examples: ['http://localhost:9501/content/7']
        id:
          type: string
          description: The entry id, **as a string**.
          examples: ['7']
        type:
          type: string
          const: text

    ContentEntry:
      description: |
        The JSON projection used by `GET /content` and `GET /content/{id}?format=json`.

        Branch on the presence of `content` (text) versus `name` (file). Do **not** branch on
        `type`: for a file it holds the detected media kind, not the word `file`.
      oneOf:
        - $ref: '#/components/schemas/TextContentEntry'
        - $ref: '#/components/schemas/FileContentEntry'

    TextContentEntry:
      type: object
      required: [type, id, timestamp, room]
      properties:
        type:
          type: string
          const: text
        content:
          type: string
          description: Omitted when empty (the empty string and "no content" are indistinguishable).
        id:
          type: string
          description: Entry id as a string.
        timestamp:
          type: integer
          format: int64
          description: Unix **seconds**. Second-granular, so it repeats within a second — never use it as a cursor.
        room:
          type: string
        senderIP:
          type: string
        senderClientID:
          type: string
          description: Omitted when empty.
        senderDevice:
          description: |
            The sender's device info — a free-form string map, **not** the stricter `DeviceMeta`
            used by WebSocket `connect` events. `null` when unknown, which is distinct from `{}`,
            so clients should handle all three states.
          oneOf:
            - $ref: '#/components/schemas/SenderDevice'
            - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
          description: Omitted unless set. `automation` marks a message posted by a scheduled task.
        scheduledAt:
          type: integer
          format: int64
          description: Omitted unless set. The instant a task was scheduled for; differs from `timestamp` when backfilled.
        late:
          type: boolean
          description: Omitted unless true. The message was sent late, after missing its window.

    FileContentEntry:
      type: object
      required: [type, name, size, uuid, cache, url, id, timestamp, expire, room]
      properties:
        type:
          type: string
          description: The media kind detected from the filename.
          enum: [image, audio, video, document, archive, file]
        name:
          type: string
        size:
          type: integer
          format: int64
          description: Size on disk, in bytes. The entry itself carries no body — fetch the bytes from `url`.
        uuid:
          type: string
          description: Same value as `cache`.
        cache:
          type: string
        thumbnail:
          type: string
          description: |
            A `data:image/jpeg;base64,…` thumbnail, or empty when none was generated (which is
            normal for archives, PDFs and videos).
        url:
          type: string
          format: uri
          description: Absolute download URL **with the filename already appended**, so it can be used as-is.
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        expire:
          type: integer
          format: int64
          description: Unix seconds; `0` means it never expires.
        room:
          type: string
        senderIP:
          type: string
        senderClientID:
          type: string
        senderDevice:
          oneOf:
            - $ref: '#/components/schemas/SenderDevice'
            - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean

    ContentList:
      type: object
      description: A page of history, ascending. An empty array means there is no more history.
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ContentEntry'

    LatestTextEntry:
      type: object
      description: |
        `GET /content/latest` for a text entry — a **compact** shape, not the rich projection used
        by `GET /content`.
      required: [type, id, timestamp]
      properties:
        type:
          type: string
          const: text
        content:
          type: string
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        column:
          $ref: '#/components/schemas/BoardColumn'

    LatestFileEntry:
      type: object
      description: |
        `GET /content/latest` for a file entry — a **compact** shape. Note it has no `cache` / `room`
        / `senderIP`, unlike the `GET /content` projection.
      required: [type, name, size, uuid, url, id, timestamp, expire]
      properties:
        type:
          type: string
          enum: [image, audio, video, document, archive, file]
        name:
          type: string
        size:
          type: integer
          format: int64
        uuid:
          type: string
        url:
          type: string
          format: uri
        id:
          type: string
        timestamp:
          type: integer
          format: int64
        expire:
          type: integer
          format: int64
        column:
          $ref: '#/components/schemas/BoardColumn'

    ColumnResult:
      type: object
      required: [id, type, column]
      properties:
        id:
          type: string
        type:
          type: string
          description: The entry's own kind (`text` or `file`), not the media kind.
        column:
          $ref: '#/components/schemas/BoardColumn'

    # ── Rooms ───────────────────────────────────────────────────────────
    RoomListResponse:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomInfo'

    RoomInfo:
      type: object
      required: [name, messageCount, deviceCount, lastActive, isActive, isProtected]
      properties:
        name:
          type: string
          description: Room name. The `default` room is reported as an **empty string**.
        messageCount:
          type: integer
          format: int64
        deviceCount:
          type: integer
          format: int64
        lastActive:
          type: integer
          format: int64
          description: Unix seconds. Bumped to "now" while devices are connected.
        isActive:
          type: boolean
          description: True while at least one device is connected.
        isProtected:
          type: boolean
          description: 'Whether the room **actually** needs a password (an `{"open": true}` room reports `false`).'

    # ── Files ───────────────────────────────────────────────────────────
    UploadedEntry:
      type: object
      description: Response of a completed upload (`/upload` with a file part, or `/upload/finish/{uuid}`).
      required: [url, id, type]
      properties:
        url:
          type: string
          format: uri
          description: The entry URL (`/content/{id}`), not the raw file URL.
        id:
          type: string
        type:
          type: string
          description: The media kind detected from the filename.
          enum: [image, audio, video, document, archive, file]

    ChunkInitResult:
      type: object
      description: Response of the chunked-upload initialiser (`/upload/chunk`, or `/upload` with a `text/plain` filename).
      required: [result]
      properties:
        result:
          type: object
          required: [uuid]
          properties:
            uuid:
              type: string
              format: uuid

    UploadResult:
      description: Either a completed upload, or (for the `text/plain` filename form) an initialisation result.
      oneOf:
        - $ref: '#/components/schemas/UploadedEntry'
        - $ref: '#/components/schemas/ChunkInitResult'

    # ── Sharing ─────────────────────────────────────────────────────────
    ShareRequest:
      type: object
      description: |
        Body of `POST /share`. Every field is optional (an empty body means all defaults), but
        **unknown fields are rejected** — a typo must not silently drop a limit.
      additionalProperties: false
      properties:
        type:
          type: string
          description: '`content` or `file`. Omitted → `400 missing_type`.'
          enum: [content, file]
        id:
          type: string
          description: 'For `type: content`, the entry id as a string. Also accepted for `type: file` in place of `uuid`.'
        uuid:
          type: string
          description: 'For `type: file`, the file uuid. Takes precedence over `id`.'
        ttl:
          type: integer
          format: int64
          description: Seconds until expiry. Default 900; clamped to 60 – 86400.
          minimum: 60
          maximum: 86400
        maxUses:
          type: integer
          format: int64
          description: Maximum number of reads. `0` (default) means unlimited.
          minimum: 0
        password:
          type: string
          description: Optional password, required from the recipient in `X-Share-Password`.
          writeOnly: true

    ShareCreatedContent:
      type: object
      required: [type, id, room, ttl, expiresAt, maxUses, token, jti, url, pageUrl, rawUrl, visits, scans]
      properties:
        type:
          type: string
          const: content
        id:
          type: string
        room:
          type: string
        ttl:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        token:
          type: string
        jti:
          type: string
        url:
          type: string
          format: uri
          description: The share page. The same address serves crawlers and humans.
        pageUrl:
          type: string
          format: uri
          description: Kept for compatibility; currently the same value as `url`.
        rawUrl:
          type: string
          format: uri
          description: Reaches the content endpoint directly with the same token.
        visits:
          type: integer
        scans:
          type: integer

    ShareCreatedFile:
      type: object
      required: [type, uuid, room, ttl, expiresAt, maxUses, token, jti, url, pageUrl, rawUrl, visits, scans]
      properties:
        type:
          type: string
          const: file
        uuid:
          type: string
        room:
          type: string
        ttl:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        token:
          type: string
        jti:
          type: string
        url:
          type: string
          format: uri
        pageUrl:
          type: string
          format: uri
        rawUrl:
          type: string
          format: uri
        visits:
          type: integer
        scans:
          type: integer

    ShareInfo:
      type: object
      description: |
        `GET /share?t=` — what the landing page needs before fetching anything. Does not consume a use.
      required: [type, expiresAt, maxUses, needsPassword]
      properties:
        type:
          type: string
          enum: [content, file]
        kind:
          type: string
          description: The target's kind (`text` or `file`).
          enum: [text, file]
        id:
          type: string
        room:
          type: string
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        used:
          type: integer
          description: Present only for a limited share that has a live record.
        needsPassword:
          type: boolean
        uuid:
          type: string
          description: Present for file targets.
        name:
          type: string
          description: Present for file targets.
        size:
          type: integer
          format: int64
          description: Present for file targets.
        previewToken:
          type: string
          description: |
            Present **only** when the share is password-protected. Safe to embed in `<img src>` etc.
        previewExpiresAt:
          type: integer
          format: int64
          description: Present alongside `previewToken`.

    ShareList:
      type: object
      required: [room, total, limit, records]
      properties:
        room:
          type: string
        total:
          type: integer
          description: Total records for the room (not just this page).
        limit:
          type: integer
          description: The page size actually used.
        records:
          type: array
          items:
            $ref: '#/components/schemas/ShareRecord'

    ShareRecord:
      type: object
      required: [jti, type, kind, id, room, name, size, createdAt, expiresAt, maxUses, used, visits, scans, password, expired]
      properties:
        jti:
          type: string
          description: Identifies the share in this list. The token itself is never included.
        type:
          type: string
          enum: [content, file]
        kind:
          type: string
          enum: [text, file]
        id:
          type: string
        room:
          type: string
        name:
          type: string
          description: Text shares carry a first-line summary; file shares carry the filename.
        size:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
        maxUses:
          type: integer
          format: int64
        used:
          type: integer
        visits:
          type: integer
        scans:
          type: integer
        password:
          type: boolean
          description: Whether a password is set — never the hash.
        expired:
          type: boolean

    ShareVisitRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: The share token. May also be supplied as `?t=`.
        qr:
          type: boolean
          description: Marks the visit as a QR scan in addition to an open.

    ShareVisitResult:
      type: object
      required: [ok, tracked, visits, scans]
      properties:
        ok:
          type: boolean
          const: true
        tracked:
          type: boolean
          description: '`false` when the same visitor reported again within ten minutes.'
        visits:
          type: integer
        scans:
          type: integer

    # ── Realtime ────────────────────────────────────────────────────────
    SenderDevice:
      type: object
      description: |
        The `senderDevice` map attached to a content entry. Unlike the WebSocket `connect` event's
        `DeviceMeta`, this is a plain string map: there is no `id` or `device` key, and `type`
        holds the lowercase device class.

        A message with no User-Agent at all — a scheduled task — carries only
        `{name, type: "Automation"}`; the server deliberately does not parse a UA there, because
        that yields whitespace-only `os` / `browser` values that would render as a blank label.
      additionalProperties:
        type: string
      properties:
        type:
          type: string
          description: Device class, or `Automation` for a message posted by a scheduled task.
          enum: [desktop, smartphone, tablet, Automation]
        name:
          type: string
          description: The name the client declared via `?name=`. Absent when it declared none.
        os:
          type: string
          description: '`<family> <major>`, e.g. `iOS 17`. Trimmed, so an unknown family is just `Other`.'
        browser:
          type: string
          description: '`<family> <major>`, e.g. `Safari 17` or `curl 8`.'
      examples:
        - type: smartphone
          name: iPhone
          os: iOS 18
          browser: Safari 18

    DeviceMeta:
      type: object
      description: |
        A connected device. Only `name` is omitted when empty; `id`, `type`, `device`, `os` and
        `browser` are always present, even as empty strings.
      required: [id, type, device, os, browser]
      properties:
        id:
          type: string
          description: A stable hash of the connection, used for de-duplication.
        type:
          type: string
          examples: [Desktop, mobile, Automation]
        name:
          type: string
          description: The name the client declared, if any. Omitted when empty.
        device:
          type: string
          examples: [Apple Mac]
        os:
          type: string
          examples: [macOS 14]
        browser:
          type: string
          examples: [Chrome 120]

    DisconnectData:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The device id whose last connection closed.

    RevokeData:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int32
          description: The id of the deleted entry. Note this is a **number** here, unlike the string ids in content payloads.

    ClearAllData:
      type: object
      required: [room]
      properties:
        room:
          type: string

    WsConfig:
      type: object
      description: |
        The `config` frame, sent once after connecting and before any realtime message. It is the
        **only** source of `version` and the size limits, and the only source of the front end's
        `app.config`.
      required: [version, server, text, file, auth, latestId, automation]
      properties:
        version:
          type: string
          examples: [0.1.0]
        server:
          type: object
          properties:
            history:
              type: integer
              format: int64
            prefix:
              type: string
            roomList:
              type: boolean
        text:
          type: object
          properties:
            limit:
              type: integer
              format: int64
              description: Maximum text length in **bytes**. `0` means unlimited.
        file:
          type: object
          properties:
            expire:
              type: integer
              format: int64
              description: Default file lifetime in seconds; `0` means never expires.
            chunk:
              type: integer
              format: int64
            limit:
              type: integer
              format: int64
        auth:
          type: boolean
          description: Whether this room required a credential at handshake time.
        latestId:
          type: integer
          format: int32
          description: |
            The largest message id in the room at connect time (`0` when empty). Use it as the
            history/realtime boundary. Absent on older servers — in that case a client must not
            write to the clipboard.
        automation:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean

    ReceiveEntry:
      description: |
        The `receive` / `update` payload — the entry exactly as stored, which is also the shape
        `GET /content` projects to. Branch on `type`: `text` or `file`.
      oneOf:
        - $ref: '#/components/schemas/ReceiveTextEntry'
        - $ref: '#/components/schemas/ReceiveFileEntry'

    ReceiveTextEntry:
      type: object
      required: [id, type, room, timestamp]
      properties:
        id:
          type: integer
          format: int32
          description: Entry id — a **number** in the realtime payload.
        type:
          type: string
          const: text
        room:
          type: string
        timestamp:
          type: integer
          format: int64
        senderIP:
          type: string
        senderClientID:
          type: string
          description: Omitted when empty.
        senderDevice:
          oneOf:
            - $ref: '#/components/schemas/SenderDevice'
            - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
        content:
          type: string
          description: Omitted when empty.
        deviceConnection:
          $ref: '#/components/schemas/DeviceMeta'
        deviceID:
          type: string

    ReceiveFileEntry:
      type: object
      required: [id, type, room, timestamp, name, size, cache, expire]
      properties:
        id:
          type: integer
          format: int32
        type:
          type: string
          const: file
        room:
          type: string
        timestamp:
          type: integer
          format: int64
        senderIP:
          type: string
        senderClientID:
          type: string
        senderDevice:
          oneOf:
            - $ref: '#/components/schemas/SenderDevice'
            - type: 'null'
        column:
          $ref: '#/components/schemas/BoardColumn'
        source:
          type: string
        scheduledAt:
          type: integer
          format: int64
        late:
          type: boolean
        name:
          type: string
        size:
          type: integer
          format: int64
        cache:
          type: string
          description: Usually the file uuid.
        expire:
          type: integer
          format: int64
        thumbnail:
          type: string
        url:
          type: string
          format: uri
          description: Omitted when empty.

    # ── Automation ──────────────────────────────────────────────────────
    ChainStep:
      description: |
        One step of an action chain. A step with no parameters is written as a bare string; a
        parameterised step is an object. Both forms are accepted, and parameterless steps are
        written back as strings so existing data is never reshaped.
      oneOf:
        - type: string
          description: An action id, e.g. `text.trimLines`.
        - type: object
          required: [id]
          properties:
            id:
              type: string
            params:
              type: object
              description: Parameters for this step only.
              additionalProperties:
                type: string

    TaskRequest:
      type: object
      description: |
        Body of `POST /tasks` and `POST /tasks/preview`. There is **no `room` field** — the room
        comes from the credential.
      properties:
        id:
          type: string
          description: Omitted to create; supplied to replace that task wholesale.
        name:
          type: string
          description: Falls back to the first line of the rendered body when empty.
        enabled:
          type: boolean
          description: Defaults to `true`.
        freq:
          type: string
          description: Schedule kind.
          enum: [once, daily, weekly, cron]
        time:
          type: string
          description: '`HH:MM`, for `daily` / `weekly`.'
        cron:
          type: string
          description: 'Five-field expression, for `freq: cron` — `<min> <hour> <dom> <month> <dow>`.'
        byWeekday:
          type: array
          description: For `weekly`. `0` = Sunday … `6` = Saturday, matching `Date.getDay()`.
          items:
            type: integer
            minimum: 0
            maximum: 6
        runAt:
          type: string
          description: |
            For `once`: RFC3339, or `2026-10-01T09:30` interpreted in `tz`. Normalised to RFC3339.
        tz:
          type: string
          description: Omitted → filled from `automation.defaultTZ` and stored on the task.
        template:
          type: string
          description: |
            The body template. `{{ }}` variables are evaluated at firing time; unknown variables
            and malformed offsets are rejected at save time.
        chain:
          type: array
          description: Optional ordered list of steps applied to the rendered text. A failing step stops the chain.
          items:
            $ref: '#/components/schemas/ChainStep'
        keepHistory:
          type: boolean
          description: Defaults to `false` — the message is broadcast but does not consume room history quota.
        sender:
          type: string
          description: Display name. Defaults to `定时任务`.

    Task:
      type: object
      description: An automation as returned by the API. `ownerHash` is never exposed.
      required: [id, name, enabled, freq, room, template, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        freq:
          type: string
          enum: [once, daily, weekly, cron]
        time:
          type: string
        cron:
          type: string
        byWeekday:
          type: array
          items:
            type: integer
        runAt:
          type: string
        tz:
          type: string
        room:
          type: string
        template:
          type: string
        chain:
          type: array
          items:
            $ref: '#/components/schemas/ChainStep'
        keepHistory:
          type: boolean
        sender:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        nextRunAt:
          type: integer
          format: int64
          description: Next fire time, Unix seconds; `0` when disabled or exhausted.
        lastRunAt:
          type: integer
          format: int64
        lastStatus:
          type: string
          description: Outcome of the last firing.
          enum: ['', ok, error, skipped]
        lastError:
          type: string
        lastOutput:
          type: string
        desc:
          $ref: '#/components/schemas/CronDesc'

    CronDesc:
      type: object
      description: |
        A structured, prose-free summary of a cron expression. It describes only the shape; clients
        compose the sentence from their own message table. It never contains expression syntax
        (`*`, `/`, `?`).
      required: [mode]
      properties:
        mode:
          type: string
          enum: [everyMinute, everyNMinutes, everyNHours, minutesEachHour, times, unknown]
        n:
          type: integer
        minutes:
          type: string
        hours:
          type: string
        day:
          type: string
          enum: [daily, weekly, monthly, monthlyOrWeekly, everyNDays, everyNDaysOrWeekly]
        weekdays:
          type: array
          items:
            type: integer
        dom:
          type: string
        month:
          type: string
        dayN:
          type: integer
        times:
          type: array
          items:
            type: string
        more:
          type: boolean
          description: True when the summarised list was truncated.

    TaskList:
      type: object
      required: [room, tier, admin, tasks, max, now, actions, vars]
      properties:
        room:
          type: string
        tier:
          type: string
          enum: [admin, room, single, none]
        admin:
          type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        max:
          type: integer
          description: Task limit for this room; `0` means unlimited.
        now:
          type: integer
          format: int64
        foreignCount:
          type: integer
          description: Present only when some tasks in the room were hidden because they are not yours.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationAction'
        vars:
          type: array
          items:
            type: string

    TaskSaved:
      type: object
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        taskToken:
          type: string
          description: |
            Present **only** when a `single`-tier room creates a task. It is shown exactly once and
            is the only way to later edit or delete that task.

    TaskDeleted:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
          const: true
        id:
          type: string

    TaskRooms:
      type: object
      required: [room, admin, rooms]
      properties:
        room:
          type: string
        admin:
          type: boolean
        rooms:
          type: array
          items:
            type: object
            required: [room, count]
            properties:
              room:
                type: string
              count:
                type: integer

    CronCheck:
      type: object
      description: |
        The result of validating a cron expression. An invalid expression is a **200** with
        `valid: false`; only an unusable time zone is a 400.
      required: [expr, tz, valid, room]
      properties:
        expr:
          type: string
          description: The normalised expression (identical to the input when valid).
        tz:
          type: string
        valid:
          type: boolean
        room:
          type: string
        error:
          type: string
          description: Present when `valid` is false.
        next:
          type: array
          description: Upcoming fire times, Unix seconds. Absent when `valid` is false.
          items:
            type: integer
            format: int64
        nextFormatted:
          type: array
          description: The same instants, formatted as `YYYY-MM-DD HH:MM Day`.
          items:
            type: string
        desc:
          $ref: '#/components/schemas/CronDesc'

    TaskPreview:
      type: object
      description: The rendered output of an unsaved task. Nothing was persisted or sent.
      required: [preview, output, room, keepHistory, referenceAt, nextRunAt, referenceAt2]
      properties:
        preview:
          type: boolean
          const: true
        output:
          type: string
        room:
          type: string
        keepHistory:
          type: boolean
        referenceAt:
          type: integer
          format: int64
        nextRunAt:
          type: integer
          format: int64
        referenceAt2:
          type: string
          description: |
            The reference instant as RFC3339. NOTE (code): this field is named `referenceAt2` on the
            preview endpoint, whereas the dry run of a saved task calls the same idea `scheduledAt`.

    TaskRunDry:
      type: object
      required: [preview, output, taskId, room, keepHistory, referenceAt, nextRunAt, scheduledAt]
      properties:
        preview:
          type: boolean
          const: true
        output:
          type: string
        taskId:
          type: string
        room:
          type: string
        keepHistory:
          type: boolean
        referenceAt:
          type: integer
          format: int64
        nextRunAt:
          type: integer
          format: int64
        scheduledAt:
          type: string
          description: The reference instant as RFC3339.

    TaskRunSent:
      type: object
      required: [sent, output, taskId, room, keepHistory, sentAt]
      properties:
        sent:
          type: boolean
          const: true
        output:
          type: string
        taskId:
          type: string
        room:
          type: string
        keepHistory:
          type: boolean
        sentAt:
          type: integer
          format: int64
