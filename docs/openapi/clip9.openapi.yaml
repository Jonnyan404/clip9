externalDocs:
  description: Human-readable contract notes (Go / Worker / Rust compared)
  url: ../api.md

servers:
  - url: http://localhost:9501
    description: Default local server (no prefix)
  - url: https://clip.example.com
    description: Example deployment behind TLS (scheme and host are yours)
  - url: https://clip.example.com/clip9
    description: Example deployment under server.prefix

tags:
  - name: Service
    description: Capabilities, health and the deployment's current auth state.
  - name: Auth
    description: Session tokens — exchange a password once, then hold a short-lived token.
  - name: Content
    description: Sending text, reading history, board columns and revocation.
  - name: Files
    description: Uploading, downloading (with Range) and deleting files.
  - name: Rooms
    description: Room discovery.
  - name: Sharing
    description: Issue share tokens for one entry and track how often the link is opened.
  - name: Automation
    description: Scheduled automations (cron), dry runs and the admin page.
  - name: Realtime
    description: The WebSocket push channel.

paths:

  # ── Service ───────────────────────────────────────────────────────────
  /server:
    get:
      tags: [Service]
      summary: Service capabilities and current auth state
      description: |
        The web UI calls this to decide whether to show a password prompt, where the
        WebSocket lives, and whether to offer an automation entry point. No auth is required.

        Three semantics are easy to get wrong and none of them errors:

        1. `auth` ("does this room need a password") and `roomProtected` are **not** the
           same thing: `roomProtected` is only computed when `?room=` is supplied, and is
           `false` otherwise.
        2. `authorized` starts at `true` — with no `?room=` and no global password it is
           `true` even with no credential at all. Do not read it as `false` by default.
        3. Without `?room=`, `auth` reflects the **global** password only.

        NOTE (code): this endpoint does **not** return `version` and does **not** return the
        size limits. Those arrive in the WebSocket handshake's `config` frame. (`/server`
        also carries the automation capability, which the WebSocket `config` frame carries
        only as a boolean.)

        The embedded `automation` object is abridged above; see `AutomationCapability`.
      operationId: getServerInfo
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
      security: []
      responses:
        '200':
          description: Server info for the caller's current context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              examples:
                openServer:
                  summary: Open deployment, no room supplied
                  value:
                    server: ws://127.0.0.1:9501/push
                    auth: false
                    authorized: true
                    roomProtected: false
                    config:
                      server:
                        history: 50
                        roomList: false
                    automation:
                      enabled: false
                protectedRoom:
                  summary: Room `home` is protected, credential absent
                  value:
                    server: wss://clip.example.com/push
                    auth: true
                    authorized: false
                    roomProtected: true
                    config:
                      server:
                        history: 50
                        roomList: true
                    automation:
                      enabled: true
                      room: home
                      tier: none
                      allowed: false
                      admin: false
                      max: 0
                      defaultTZ: Asia/Shanghai
                      vars: [date, weekday, time, datetime, timestamp, uuid, task, room]
                      actions:
                        - id: text.trimLines
                          group: text
                          groupKey: actionGroupText
                          key: actionTrimLines

  /healthz:
    get:
      tags: [Service]
      summary: Liveness probe
      description: |
        Returns the literal text `ok`. This is an **implementation extra** of the Rust
        server (the Go build has no such endpoint); it exists so acceptance scripts have a
        cheap liveness probe that does not compute auth state the way `/server` does.
      operationId: healthz
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok
              examples:
                ok:
                  value: ok

  # ── Auth ──────────────────────────────────────────────────────────────
  /auth/token:
    post:
      tags: [Auth]
      summary: Exchange a password for a session token
      description: |
        The password is compared against the room's password and the global password.
        A password that matches the **global** password yields a token with
        `scope: "global"` (valid for every room, and admin for `/tasks`); a room password
        yields `scope: ""`.

        The request body must be valid JSON — an empty body is a **400**, not a default
        (an empty password is meaningless).

        NOTE (code): this endpoint deliberately does *not* use the room-access helper,
        because that helper returns `true` for open rooms — which would let *any* password
        mint a token for an unprotected room. It compares plaintext directly.
      operationId: issueSessionToken
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              roomPassword:
                summary: Room password
                value:
                  password: correct-horse-battery-staple
      responses:
        '200':
          description: A session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
              examples:
                global:
                  summary: Global password — valid everywhere
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzY29wZSI6Imdsb2JhbCJ9.7mQ2
                    expiresAt: 1758003600
                    scope: global
                room:
                  summary: Room password — valid for that room only
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzY29wZSI6IiJ9.8xR4
                    expiresAt: 1758003600
                    scope: ''
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '401':
          description: The password was empty or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                empty:
                  value:
                    code: password_required
                    error: Password required
                    message: 密码不能为空
                wrong:
                  value:
                    code: wrong_password
                    error: Wrong password
                    message: 密码不正确
        '405':
          $ref: '#/components/responses/OnlyPost'

  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: Renew a session token without a password
      description: |
        Presents the old token and receives a fresh one with the same room binding and the
        same `scope` — a global session is **never** silently downgraded to a room-only one
        (the automation admin page stores no plaintext password, so that downgrade would
        lock it out).
      operationId: refreshSessionToken
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: A fresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
              examples:
                renewed:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzY29wZSI6IiJ9.9pL1
                    expiresAt: 1758007200
                    scope: ''
        '401':
          description: The presented token is invalid, expired, or bound to another room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: session_token_invalid
                    error: Session token invalid or expired
                    message: 会话令牌无效或已过期
        '405':
          $ref: '#/components/responses/OnlyPost'

  # ── Content ───────────────────────────────────────────────────────────
  /text:
    post:
      tags: [Content]
      summary: Send text, or overwrite an existing entry
      description: |
        Stores a text entry and broadcasts a `receive` event to the room.

        **The body has three accepted shapes**, chosen by `Content-Type`:

        | `Content-Type` | Body |
        |---|---|
        | `text/plain`, absent, or anything unrecognised | the whole request body is the text |
        | `application/json` | `{"content": "..."}` |
        | `multipart/form-data` | the form field `content` |

        The last two exist for Apple Shortcuts, which emits UTF-16 when it sends a string
        variable as the raw body but UTF-8 for a structured body. The plain-text path also
        sniffs and decodes UTF-16 (BOM or tell-tale byte pattern); everything else is stored
        byte-for-byte with nothing escaped or rewritten.

        `application/x-www-form-urlencoded` is **deliberately not recognised** — it keeps the
        "whole body is the text" path, because that is what `curl --data-binary` sends by
        default, and treating it as a form would silently store an empty entry.

        With `?id=` the entry identified by that id is **overwritten in place** (same id) and
        an `update` event is broadcast instead. Overwriting refreshes `timestamp` — the entry
        is new content — and requires the id to be a text entry living in the same room.

        The length check counts **bytes**, not characters: 4096 bytes is roughly 1365 Chinese
        characters.
      operationId: sendText
      parameters:
        - $ref: '#/components/parameters/RoomQuery'
        - $ref: '#/components/parameters/NameQuery'
        - $ref: '#/components/parameters/ClientQuery'
        - name: id
          in: query
          required: false
          description: |
            If present and non-empty, overwrite the entry with this id instead of creating a
            new one. The entry must be a text entry in the same room, or the server answers
            `404 message_not_updatable`.
          schema:
            type: integer
            format: int32
          example: 7
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      requestBody:
        required: true
        description: |
          The text itself, wrapped according to `Content-Type` (see above).
        content:
          text/plain:
            schema:
              type: string
            examples:
              plain:
                summary: The whole body is the text
                value: |
                  hello from curl
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
            examples:
              json:
                summary: Structured body (Shortcuts)
                value:
                  content: hello from Shortcuts
          multipart/form-data:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
            examples:
              form:
                value:
                  content: hello from a form
      responses:
        '200':
          description: The entry was stored (or overwritten).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextSendResult'
              examples:
                created:
                  summary: New entry
                  value:
                    url: http://localhost:9501/content/7
                    id: '7'
                    type: text
                overwritten:
                  summary: Existing entry 7 overwritten
                  value:
                    url: http://localhost:9501/content/7
                    id: '7'
                    type: text
        '400':
          description: The body could not be parsed, or `?id=` was not a number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badBody:
                  value:
                    code: invalid_body
                    error: Cannot parse request body
                    message: 请求体无法解析
                badId:
                  value:
                    code: invalid_id
                    error: Invalid id parameter
                    message: 无效的 ID 参数
        '401':
          description: The room needs a credential and none (or a wrong one) was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
                wrong:
                  value:
                    code: unauthorized_invalid_token
                    error: Invalid auth token
                    message: 无效的认证令牌
        '404':
          description: With `?id=`, the target entry was not found or is not an updatable text entry in this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notUpdatable:
                  value:
                    code: message_not_updatable
                    error: Message not found or not updatable
                    message: 消息未找到或无法更新
        '413':
          description: The text is longer than `text.limit` bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLong:
                  value:
                    code: text_too_long
                    error: Text too long
                    message: 文本内容超出限制 (最大 4096 字符)
        '405':
          $ref: '#/components/responses/OnlyPost'

  /content:
    get:
      tags: [Content]
      summary: Room history, cursor-paginated
      description: |
        Returns a page of a room's history in **ascending** order (oldest first), so a client
        can simply append and use `messages[0].id` as the next `before` cursor.

        - The cursor is the **id**, not the timestamp: timestamps are second-granular and
          repeat within a second, so a timestamp cursor would skip or duplicate entries.
        - `limit` is clamped to `min(server.history, 100)` — the clamp is what stops
          `?limit=999999` from turning a 2 MB WebSocket push into a 2 MB HTTP response.
        - `before` that names a deleted entry is **not** an error; the page degrades to "the
          newest `limit` entries", which is exactly what "read backwards from the newest"
          means. A 5xx there would only wedge the client.
        - A page that would exceed the 1 MiB byte budget drops its **oldest** entries (never
          all of them), so `messages[0]` is always a valid cursor.
        - An **empty array means "no more history"**.
      operationId: listContent
      parameters:
        - $ref: '#/components/parameters/RoomQuery'
        - name: before
          in: query
          required: false
          description: |
            Return entries strictly older than this id. Omitted or unparseable means "start
            from the newest".
          schema:
            type: integer
            format: int32
          example: 120
        - name: limit
          in: query
          required: false
          description: |
            Page size. Clamped to `min(server.history, 100)`; non-numeric, zero or negative
            values silently fall back to that effective maximum.
          schema:
            type: integer
            minimum: 1
          example: 50
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: A page of history, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'
              examples:
                mixedPage:
                  summary: A text entry and a file entry
                  value:
                    messages:
                      - type: text
                        content: hello world
                        id: '7'
                        timestamp: 1758000000
                        room: default
                        senderIP: 203.0.113.7
                        senderClientID: web-1a2b
                        senderDevice:
                          name: iPhone
                          type: smartphone
                          os: iOS 18
                          browser: Safari 18
                        column: todo
                      - type: image
                        name: photo.png
                        size: 20480
                        uuid: 11111111-2222-3333-4444-555555555555
                        cache: 11111111-2222-3333-4444-555555555555
                        thumbnail: data:image/jpeg;base64,/9j/4AAQSkZJRg==
                        url: http://localhost:9501/file/11111111-2222-3333-4444-555555555555/photo.png
                        id: '8'
                        timestamp: 1758000060
                        expire: 1758003600
                        room: default
                        senderIP: 203.0.113.7
                        senderDevice:
                          name: iPhone
                          type: smartphone
                          os: iOS 18
                          browser: Safari 18
                        column: todo
        '401':
          description: No access to this room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '405':
          $ref: '#/components/responses/OnlyGet'

  /content/latest:
    get:
      tags: [Content]
      summary: Newest entry of a room
      description: |
        Returns the newest entry as raw content by default, or as a compact JSON object with
        `?format=json` (or `Accept: application/json` for text entries).

        **Which room is searched:**

        | Request | Searches |
        |---|---|
        | `?room=R` | room `R` |
        | `?all=1` | every room the credential can read, newest wins |
        | neither | the `default` room |

        NOTE (code): `?all=1` is how this server spells "the newest anywhere". An older
        document described "omit `room` → newest across all rooms"; this server instead makes
        the implicit explicit — omitting `room` means `default`, matching every other
        endpoint, and cross-room needs `?all=1`. Under `?all=1` a room the credential cannot
        read is **skipped**, not fatal: one protected room having a new message must not turn
        every global-latest request into a 401.

        NOTE (code): the JSON shape here is **not** the rich shape used by `GET /content`.
        Only the fields below are returned. The `type` of a file entry is the detected media
        kind (`image`, `video`, `audio`, `document`, `archive`, `file`).

        Share tokens are **not** accepted here (a share is bound to a stable entry id and
        `latest` has none); only a room credential works.
      operationId: getLatestContent
      parameters:
        - $ref: '#/components/parameters/RoomQueryOptional'
        - name: all
          in: query
          required: false
          description: Search every readable room instead of the `default` room.
          schema:
            $ref: '#/components/schemas/Truthy'
          example: 1
        - $ref: '#/components/parameters/FormatQuery'
        - $ref: '#/components/parameters/JsonQuery'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The newest entry, raw or as compact JSON.
          content:
            text/plain:
              schema:
                type: string
              examples:
                rawText:
                  summary: Text entry, raw
                  value: |
                    hello world
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LatestTextEntry'
                  - $ref: '#/components/schemas/LatestFileEntry'
              examples:
                text:
                  summary: Text entry as JSON
                  value:
                    type: text
                    content: hello world
                    id: '7'
                    timestamp: 1758000000
                    column: todo
                file:
                  summary: File entry as JSON
                  value:
                    type: image
                    name: photo.png
                    size: 20480
                    uuid: 11111111-2222-3333-4444-555555555555
                    url: http://localhost:9501/file/11111111-2222-3333-4444-555555555555/photo.png
                    id: '8'
                    timestamp: 1758000060
                    expire: 1758003600
                    column: todo
        '400':
          $ref: '#/components/responses/UnsupportedFormat'
        '401':
          description: No access to the resolved room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '404':
          description: |
            Nothing to return: the room is empty (`no_content`), the resolved room does not
            match the requested one (`content_not_found`), or the newest file has expired
            (`file_expired`, only on the raw branch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                empty:
                  value:
                    code: no_content
                    error: No content available
                    message: 没有可用的内容
                mismatch:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期

  /content/{id}:
    get:
      tags: [Content]
      summary: One entry by id
      description: |
        Fetches a single entry. The `?room=` you pass must match the room recorded on the
        entry, otherwise the server answers `404 content_not_found` (it will not confirm that
        an entry exists in a room you named wrongly).

        Authorization is a room credential **or**, for reads only, a share token in `?t=`.
        Share tokens never authorise a write.

        A text entry returns raw text by default (always terminated with a newline so `curl`
        output does not glue to the prompt) or the _rich_ JSON projection with `?format=json`.
        A file entry has no body to return; `?format=json` yields the projection, and the raw
        branch returns `404 file_expired` (the bytes live at `/file/{uuid}`).
      operationId: getContentById
      parameters:
        - name: id
          in: path
          required: true
          description: Entry id. Must parse as an integer — a non-numeric id is a 400, not a 404.
          schema:
            type: integer
            format: int32
          example: 7
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/FormatQuery'
        - $ref: '#/components/parameters/JsonQuery'
        - $ref: '#/components/parameters/ShareTokenQuery'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
        - shareTokenQuery: []
      responses:
        '200':
          description: The entry, raw or as the JSON projection.
          content:
            text/plain:
              schema:
                type: string
              examples:
                rawText:
                  value: |
                    hello world
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
              examples:
                text:
                  summary: Text entry projection
                  value:
                    type: text
                    content: hello world
                    id: '7'
                    timestamp: 1758000000
                    room: default
                    senderIP: 203.0.113.7
                    senderClientID: web-1a2b
                    senderDevice:
                      name: iPhone
                      type: smartphone
                      os: iOS 18
                      browser: Safari 18
                    column: todo
                file:
                  summary: File entry projection
                  value:
                    type: image
                    name: photo.png
                    size: 20480
                    uuid: 11111111-2222-3333-4444-555555555555
                    cache: 11111111-2222-3333-4444-555555555555
                    thumbnail: data:image/jpeg;base64,/9j/4AAQSkZJRg==
                    url: http://localhost:9501/file/11111111-2222-3333-4444-555555555555/photo.png
                    id: '8'
                    timestamp: 1758000060
                    expire: 1758003600
                    room: default
                    senderIP: 203.0.113.7
                    senderDevice:
                      name: iPhone
                      type: smartphone
                      os: iOS 18
                      browser: Safari 18
                    column: todo
        '400':
          description: The id is not numeric, or `?format=` is not one of raw/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badId:
                  value:
                    code: invalid_content_id
                    error: Invalid content id
                    message: 无效的内容 ID
                badFormat:
                  value:
                    code: unsupported_format
                    error: Unsupported format
                    message: 不支持的格式（只支持 raw / json）
        '401':
          description: No access to the entry's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '404':
          description: Not found, room mismatch, or an expired file on the raw branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
        '405':
          $ref: '#/components/responses/OnlyGet'

  /content/{id}/column:
    post:
      tags: [Content]
      summary: Move an entry to a board column
      description: |
        The board is a **view over the same entries**, not a second store: this endpoint sets
        one field on the entry and nothing else, then broadcasts an `update` event.

        - The three columns are fixed: `todo` (default; an empty or absent column normalises
          to it), `doing`, `done`. Column names are matched case-insensitively and trimmed.
        - Works for text and file entries alike.
        - **`timestamp` is deliberately not touched.** `POST /text?id=` bumps it when it
          rewrites the body, but dragging a card must not jump it to the top of the timeline.
        - Auth is a room credential. A share token is **not** accepted — it is read-only.
        - NOTE (code): the failure code here is `room_auth_required`, which differs from the
          `room_forbidden` used by the read endpoints. Clients may branch on it.
      operationId: setContentColumn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          example: 7
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column:
                  $ref: '#/components/schemas/BoardColumn'
            examples:
              move:
                value:
                  column: doing
      responses:
        '200':
          description: The entry was moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnResult'
              examples:
                moved:
                  value:
                    id: '7'
                    type: text
                    column: doing
        '400':
          description: Bad id, bad JSON body, or an unknown column.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badId:
                  value:
                    code: invalid_content_id
                    error: Invalid content id
                    message: 无效的内容 ID
                badBody:
                  value:
                    code: invalid_body
                    error: Invalid JSON body
                    message: 请求体不是合法的 JSON
                badColumn:
                  value:
                    code: invalid_column
                    error: Unknown board column
                    message: 未知的看板列（只支持 todo / doing / done）
        '401':
          description: No access to the entry's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                required:
                  value:
                    code: room_auth_required
                    error: Room authentication required
                    message: 无权访问该房间
        '404':
          description: No such entry, or it is not in the requested room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: content_not_found
                    error: Content not found
                    message: 内容未找到
        '405':
          $ref: '#/components/responses/OnlyPost'

  # ── Rooms ─────────────────────────────────────────────────────────────
  /rooms:
    get:
      tags: [Rooms]
      summary: Room list
      description: |
        Lists the rooms the caller may see. Requires `server.roomList` to be enabled,
        otherwise `403 room_list_disabled`.

        - Rooms the credential cannot open are **omitted entirely**, not listed with a lock.
        - The `default` room is reported with an **empty** `name` (the front end treats an
          empty name as the default room).
        - The array order is **not** part of the contract (Go iterated a map). This server
          returns a deterministic order, but no client should depend on it.
        - `isProtected` means "actually needs a password", so a room explicitly configured
          `{"open": true}` reports `false` even when a global password exists.
        - A credential can be supplied as the primary one plus extra ones via
          `X-Room-Auth-Tokens` (JSON array or comma-separated), which is how a client with
          several room passwords sees all of its rooms at once.
      operationId: listRooms
      parameters:
        - $ref: '#/components/parameters/AuthQuery'
        - name: X-Room-Auth-Tokens
          in: header
          required: false
          description: |
            Additional credentials, as a JSON array (`["a","b"]`) or comma-separated
            (`a, b`). Whitespace is trimmed, duplicates dropped, order preserved, and the
            primary credential comes first.
          schema:
            type: string
          example: '["home-pass","work-pass"]'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The accessible rooms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
              examples:
                list:
                  value:
                    rooms:
                      - name: ''
                        messageCount: 12
                        deviceCount: 2
                        lastActive: 1758000000
                        isActive: true
                        isProtected: false
                      - name: home
                        messageCount: 3
                        deviceCount: 0
                        lastActive: 1757990000
                        isActive: false
                        isProtected: true
        '403':
          description: The room list feature is disabled on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                disabled:
                  value:
                    code: room_list_disabled
                    error: Room list disabled
                    message: 房间列表功能未启用
        '405':
          $ref: '#/components/responses/OnlyGet'

  # ── Files ─────────────────────────────────────────────────────────────
  /upload:
    post:
      tags: [Files]
      summary: Whole-file upload (multipart)
      description: |
        Uploads a small file in one request: writes the bytes, registers the file, stores a
        file entry in the room, broadcasts `receive`, and returns the entry id and URL.

        The form field name is always **`file`**.

        Special case: when `Content-Type` is exactly `text/plain` (character for character —
        `text/plain; charset=utf-8` does **not** count), the body is treated as a **filename**
        and this becomes the chunked-upload initialiser, exactly like `POST /upload/chunk`.
        That is a deliberate, documented quirk shared with the Go implementation.

        `Content-Length`, when present, is checked against `file.limit` up front so an
        oversized file is rejected before it is read into memory.

        NOTE (code): the success body is `{url, id, type}` — the same three fields as
        `/text`. An older document showed `name` / `size` / `uuid` / `expire` here too; this
        server does not return them. `type` is the detected media kind of the filename, not
        the literal string `file`.
      operationId: uploadFile
      parameters:
        - $ref: '#/components/parameters/RoomQuery'
        - $ref: '#/components/parameters/NameQuery'
        - $ref: '#/components/parameters/ClientQuery'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file bytes. The filename in the part header is the entry's `name`.
          text/plain:
            schema:
              type: string
            examples:
              initAsFilename:
                summary: Body is a filename — acts as the chunked-upload initialiser
                value: |
                  big-video.mp4
      responses:
        '200':
          description: The file was stored and announced (or, for the `text/plain` form, initialised).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              examples:
                uploaded:
                  value:
                    url: http://localhost:9501/content/8
                    id: '8'
                    type: image
                initialised:
                  summary: Response of the chunked-upload initialiser
                  value:
                    result:
                      uuid: 11111111-2222-3333-4444-555555555555
        '400':
          description: The form could not be parsed or carried no `file` field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badForm:
                  value:
                    code: form_parse_failed
                    error: Cannot parse form data
                    message: 无法解析表单数据
                noField:
                  value:
                    code: file_field_missing
                    error: Cannot read uploaded file
                    message: 无法获取文件
        '401':
          description: No access to the target room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '413':
          description: The file exceeds `file.limit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: file_too_large
                    error: File too large
                    message: 文件大小超出限制 (最大 268435456 字节)
        '500':
          description: Writing or registering the file failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                saveFailed:
                  value:
                    code: file_save_failed
                    error: Cannot save file
                    message: 无法保存文件
        '405':
          $ref: '#/components/responses/OnlyPost'

  /upload/chunk:
    post:
      tags: [Files]
      summary: Chunked upload — initialise
      description: |
        Step 1 of a chunked upload. The request body is the **filename** as plain text; no
        bytes are written yet. The response contains the `uuid` that the following chunk and
        finish calls address.

        ```text
        POST /upload/chunk          body = filename            → {"result":{"uuid":"..."}}
        POST /upload/chunk/{uuid}   body = bytes of a chunk     → {}
        POST /upload/finish/{uuid}  (no body)                   → {"url","id","type"}
        ```

        This route and `POST /upload` share one handler; the difference is the path plus the
        `Content-Type: text/plain` guard.
      operationId: initChunkedUpload
      parameters:
        - $ref: '#/components/parameters/RoomQuery'
        - $ref: '#/components/parameters/NameQuery'
        - $ref: '#/components/parameters/ClientQuery'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      requestBody:
        required: true
        description: The filename, as plain text.
        content:
          text/plain:
            schema:
              type: string
            examples:
              init:
                value: |
                  big-video.mp4
      responses:
        '200':
          description: A fresh upload uuid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkInitResult'
              examples:
                init:
                  value:
                    result:
                      uuid: 11111111-2222-3333-4444-555555555555
        '401':
          description: No access to the target room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '500':
          description: Registering the upload failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                saveFailed:
                  value:
                    code: file_save_failed
                    error: Cannot save file
                    message: 无法保存文件
        '405':
          $ref: '#/components/responses/OnlyPost'

  /upload/chunk/{uuid}:
    post:
      tags: [Files]
      summary: Chunked upload — append a chunk
      description: |
        Appends raw bytes to an upload previously initialised with `POST /upload/chunk`. Each
        call updates the recorded size; the running total is checked against `file.limit`.

        Send chunks of about `file.chunk` bytes (default 1 MiB). A single request body is
        capped at 16 MiB by the HTTP layer regardless of `file.limit`.

        NOTE (code): the room used for authorisation is the one recorded on the upload when it
        was initialised, not the `?room=` sent here.
      operationId: appendChunk
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-2222-3333-4444-555555555555
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The chunk was appended.
          content:
            application/json:
              schema:
                type: object
                description: An empty object (this server does not answer 204 here).
                additionalProperties: false
              examples:
                ok:
                  value: {}
        '400':
          description: No upload is registered under that uuid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badUuid:
                  value:
                    code: invalid_uuid
                    error: Invalid UUID
                    message: 无效的 UUID
        '401':
          description: No access to the upload's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '413':
          description: The accumulated size would exceed `file.limit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: file_too_large
                    error: File too large
                    message: 文件大小已超过限制 (最大 268435456 字节)
        '500':
          description: The chunk could not be written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                writeFailed:
                  value:
                    code: file_write_failed
                    error: Cannot write file
                    message: 无法写入文件
        '405':
          $ref: '#/components/responses/OnlyPost'

  /upload/finish/{uuid}:
    post:
      tags: [Files]
      summary: Chunked upload — seal and broadcast
      description: |
        Finalises a chunked upload: generates the file entry (including a thumbnail when the
        bytes decode as an image and are at most 32 MiB), stores it, and broadcasts `receive`.

        The room is taken from the upload's own registration; a `?room=default` here does not
        move it out of a protected room.

        NOTE (code): the success body is `{url, id, type}`, and `type` is the detected media
        kind of the filename rather than the literal string `file`.
      operationId: finishChunkedUpload
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-2222-3333-4444-555555555555
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/NameQuery'
        - $ref: '#/components/parameters/ClientQuery'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The file entry was stored and announced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              examples:
                finished:
                  value:
                    url: http://localhost:9501/content/9
                    id: '9'
                    type: video
        '400':
          description: No upload is registered under that uuid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badUuid:
                  value:
                    code: invalid_uuid
                    error: Invalid UUID
                    message: 无效的 UUID
        '401':
          description: No access to the upload's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '500':
          description: Storing the message failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                storeFailed:
                  value:
                    code: store_failed
                    error: Failed to store message
                    message: 保存消息失败
        '405':
          $ref: '#/components/responses/OnlyPost'

  /file/{uuid}:
    get:
      tags: [Files]
      summary: Download or preview a file
      description: |
        Streams the file bytes. `Range` is honoured (video scrubbing and resumable downloads
        work), and `If-Modified-Since` / `If-None-Match` are passed through.

        - The `Content-Type` is guessed from the **original filename**, not the on-disk name
          (which is the bare uuid with no extension). Text types get `; charset=utf-8` so a
          Chinese `.txt` is not rendered as Latin-1 mojibake.
        - `?download=true` adds `Content-Disposition: attachment`; otherwise the file is
          `inline` so browsers render it directly.
        - Authorisation uses the room recorded on the file — a client-supplied `?room=` is
          ignored, which is what stops `?room=default` from reading a protected room's file.
        - A **share token** (`?t=`) works for `GET` only, and it must point at this very file.
          The UI's share button issues a `content`-typed token whose target is a file; that is
          accepted too, but only when the content really references this uuid.
      operationId: downloadFile
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          example: 11111111-2222-3333-4444-555555555555
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
        - $ref: '#/components/parameters/ShareTokenQuery'
        - name: download
          in: query
          required: false
          description: When `true`, forces a download instead of inline rendering.
          schema:
            type: boolean
          example: true
        - name: Range
          in: header
          required: false
          description: Standard HTTP byte range; does **not** consume a share-token use.
          schema:
            type: string
          example: bytes=0-1023
        - $ref: '#/components/parameters/SharePasswordHeader'
      security:
        - bearerAuth: []
        - authQuery: []
        - shareTokenQuery: []
      responses:
        '200':
          description: The file bytes.
          headers:
            Content-Type:
              description: Guessed from the original filename.
              schema:
                type: string
            Content-Disposition:
              description: '`inline` by default, `attachment` with `?download=true`.'
              schema:
                type: string
            Accept-Ranges:
              description: Present because ranges are supported.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: A partial response (Range request).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (conditional request).
        '401':
          description: No access to the file's room, and no usable share token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
                invalid:
                  value:
                    code: unauthorized_invalid_token
                    error: Invalid auth token
                    message: 无效的认证令牌
        '404':
          description: No such file, it expired, or its bytes are gone from disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
                missingOnDisk:
                  value:
                    code: file_missing_on_disk
                    error: File missing on disk
                    message: 文件在磁盘上未找到
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

    delete:
      tags: [Files]
      summary: Delete a file
      description: |
        Removes the bytes from disk and the registration from the store. Deleting an
        already-missing file is not an error (`NotFound` is tolerated).

        A share token does **not** work here: it is read-only.
      operationId: deleteFile
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          example: 11111111-2222-3333-4444-555555555555
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The file was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              examples:
                deleted:
                  value:
                    status: 文件删除成功
        '401':
          description: No access to the file's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: unauthorized
                    error: Authentication required
                    message: 需要认证令牌
        '404':
          description: No such file, or it expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: file_not_found
                    error: File not found or expired
                    message: 文件未找到或已过期
                expired:
                  value:
                    code: file_expired
                    error: File expired
                    message: 文件已过期
        '500':
          description: The bytes exist but could not be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                deleteFailed:
                  value:
                    code: file_delete_failed
                    error: Failed to delete file
                    message: 删除文件失败
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

