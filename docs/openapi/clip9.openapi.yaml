  # ── Revocation ────────────────────────────────────────────────────────
  /revoke/{id}:
    post:
      tags: [Content]
      summary: Delete one entry
      description: |
        Removes the entry and broadcasts `revoke` with `{"id": <number>}`. The success
        response has **no body** (a bare 200), matching the reference implementation.

        NOTE (code): this server accepts **POST only**. Any other method (including GET)
        returns `405`. Earlier implementations had no method check at all, so simply visiting
        `/revoke/5` in a browser deleted entry 5; that hole is closed here.
      operationId: revokeEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          example: 7
        - $ref: '#/components/parameters/RoomQueryOptional'
        - $ref: '#/components/parameters/AuthQuery'
      security:
        - bearerAuth: []
        - authQuery: []
      responses:
        '200':
          description: The entry was deleted. Empty body.
        '400':
          description: The id is not numeric.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badId:
                  value:
                    code: invalid_revoke_id
                    error: Invalid revoke id
                    message: 无效的撤销 ID
        '401':
          description: No access to the entry's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: room_forbidden
                    error: No access to this room
                    message: 无权访问该房间
        '404':
          description: No such entry, or it is not in the requested room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: message_not_found
                    error: Message not found
                    message: 消息未找到
        '500':
          description: Removing the entry failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                storeFailed:
                  value:
                    code: store_failed
                    error: Failed to revoke message
                    message: 撤销消息失败
        '405':
          $ref: '#/components/responses/OnlyPost'

  /revoke/all:
    post:
      tags: [Content]
      summary: Clear a room
      description: |
        Deletes every entry in the room and broadcasts `clearAll` with `{"room": "..."}`.

        Only the named room is cleared — there is deliberately **no** "clear everything"
        capability. `?room=` empty or absent means the `default` room.

        NOTE (code): the success body is **plain text** (`所有消息已清除\n`), not JSON,
        mirroring the reference implementation. Clients that hard-code JSON here will break.
      operationId: clearRoom
