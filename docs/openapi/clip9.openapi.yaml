openapi: 3.1.0

info:
  title: clip9 API
  version: 0.1.0
  summary: REST + WebSocket contract of the clip9 Rust server (crates/server).
  description: |
    # clip9 API

    The HTTP + WebSocket surface implemented by `clip9-server` (`rust/crates/server`).
    It is the server half of the *Cloud Clipboard* project: a room-scoped clipboard
    where clients send text or files into a room and every other member of that room
    receives them, live, over a WebSocket.

    This document was derived by reading the Rust routing table
    (`crates/server/src/lib.rs::router`) and each handler. Where the prose in
    `docs/api.md` and the code disagree, **the code wins** — a handful of those
    divergences are called out inline with a `NOTE (code)` marker.

    ## Endpoint index

    | Method | Path | Purpose |
    |---|---|---|
    | GET | `/server` | Service capabilities and current auth state |
    | GET | `/healthz` | Liveness probe (implementation extra) |
    | POST | `/auth/token` | Exchange a password for a 1-hour session token |
    | POST | `/auth/token/refresh` | Renew a session token (no password) |
    | POST | `/text` | Send (or overwrite) a text entry |
    | GET | `/content` | Room history, cursor-paginated, oldest first |
    | GET | `/content/latest` | Newest entry in a room |
    | GET | `/content/{id}` | One entry by id |
    | POST | `/content/{id}/column` | Move an entry to a board column |
    | GET | `/rooms` | Room list |
    | POST | `/upload` | Whole-file multipart upload |
    | POST | `/upload/chunk` | Chunked upload: initialise (body = filename) |
    | POST | `/upload/chunk/{uuid}` | Chunked upload: append a chunk |
    | POST | `/upload/finish/{uuid}` | Chunked upload: seal and broadcast |
    | GET | `/file/{uuid}` `/{uuid}/{name}` | Download / preview (Range supported) |
    | DELETE | `/file/{uuid}` `/{uuid}/{name}` | Delete a file |
    | POST | `/revoke/{id}` | Delete one entry |
    | POST | `/revoke/all` | Clear a room |
    | POST | `/share` | Issue a share token |
    | GET | `/share?t=` | Share metadata (does not consume a use) |
    | GET | `/share/list` | Recent shares of a room |
    | POST | `/share/visit` | Report that a human opened a share |
    | GET | `/s/{token}` | Share landing page (HTML with Open Graph tags) |
    | GET | `/tasks` | List automations of the room |
    | POST | `/tasks` | Create or replace an automation |
    | GET/POST | `/tasks/cron` | Validate a cron expression, list next fire times |
    | GET | `/tasks/rooms` | Rooms that have automations |
    | POST | `/tasks/preview` | Render an unsaved automation (no side effects) |
    | DELETE | `/tasks/{id}` | Delete an automation |
    | POST | `/tasks/{id}/run` | Dry run, or send now with `?send=1` |
    | POST | `/tasks/{id}/toggle` | Enable / disable one automation |
    | GET | `/automation` | Automation management page (HTML; no auth) |
    | WS | `/push` | Real-time room push |

    Static front-end assets are served as a **fallback** for any unmatched path when a
    static source is configured (`-static` directory or the embedded build); API routes
    always win. When no static source exists (API-only deployment, e.g. the Android
    client talking to somebody else's server) unmatched paths return a bare 404.

    ## Base URL and prefix

    The server listens on port **9501** by default. When deployed under a sub-path
    (`server.prefix`, e.g. `/clip9`), **every** endpoint above carries that prefix.
    With a prefix configured the unprefixed paths keep working too, because reverse
    proxies commonly strip the prefix before forwarding.

    ## Authentication

    A credential is one of: the **global password**, a **room password**, or a
    **session token** obtained from `POST /auth/token`. It is carried in one of three ways:

    | Carrier | How | Notes |
    |---|---|---|
    | `Authorization` header | `Authorization: Bearer <credential>` | Preferred. A non-`Bearer` header value is used verbatim (kept so clients can put a bare password there) |
    | `?auth=` query | `?auth=<credential>` | Kept for Apple Shortcuts. **Never put a password in a shareable URL** — it lands in history and access logs |
    | `Sec-WebSocket-Protocol` | WebSocket handshake only | Lets the token stay out of the URL. Preferred for `/push` |

    `?auth=` is only consulted when the `Authorization` header is absent or empty.

    ### Rooms

    - `?room=` empty or `default` normalises to the `default` room; **omitting `room`
      entirely** is a distinct case that some endpoints treat as "any room"
      (it is why `/content/latest` has an explicit `?all=1` instead — see below).
    - Whether a room needs a password comes from the **global** `auth` plus that room's
      `roomAuth` entry: not configured → follows the global `auth`; empty string → also
      follows the global `auth` (**not** "open"); `{"open": true}` → open even when a
      global `auth` is set; a non-empty password → required, and the global password still works.
    - Authorization always uses **the room recorded on the content itself**, never the
      `?room=` the client claims. This matters most for `/file/{uuid}` — otherwise
      `?room=default` would let anyone read a protected room's files.
    - Room names are case-sensitive; only surrounding whitespace is trimmed.

    ### Session tokens

    `POST /auth/token` trades a password for a token (~1 hour, `ROOM_SESSION_TTL_SECONDS`).
    A token minted from the **global** password has `scope: "global"`, is valid for every
    room, and counts as **admin** for `/tasks`; a token minted from a room password has
    `scope: ""` and only opens that room. `POST /auth/token/refresh` renews it without a
    password and **preserves the scope**.

    ### Share tokens

    A share token is a signed, self-describing, short-lived grant that opens **one
    content entry** (or one file) and is carried in `?t=`. It is **read-only**: `/text`,
    `/upload`, `/revoke/*` and `/content/{id}/column` do **not** accept it. A share token
    may carry a password, which must be sent in the `X-Share-Password` header — never in
    the URL. When a share is password-protected the server also returns a `previewToken`
    that is safe to put in an `<img src>` (browsers cannot attach custom headers to those).

    ### Task tokens

    In `single`-tier rooms the caller has no password to reuse, so creating an automation
    returns a `taskToken` **once**. It identifies the task on later calls via the
    `X-Task-Token` header or `?taskToken=`.

    ## Error contract

    **Every** error path returns the same three-field JSON object with
    `Content-Type: application/json; charset=utf-8`, regardless of `Accept`:

    ```json
    {"code": "text_too_long", "error": "Text too long", "message": "文本内容超出限制 (最大 4096 字符)"}
    ```

    - `code` — machine code, snake_case. Stable once shipped.
    - `error` — plain English, for logs and English-speaking users.
    - `message` — plain Chinese, shown verbatim by clients. Do not compose your own
      sentence for limit errors; the numbers in it come from live server config.

    Responses end with a trailing newline (it mirrors Go's `json.NewEncoder`). Clients
    should read `message`/`error` rather than branching on `Accept`: Apple Shortcuts do
    not expose the status code and do not send `Accept`.

    ## Content format (`/content/*`)

    `GET /content/{id}` and `GET /content/latest` pick their representation with `?format=`:

    | Priority | Signal | Effect |
    |---|---|---|
    | 1 | `?format=raw` / `?format=text` / `?format=plain` | Raw bytes |
    | 2 | `?format=json` | JSON |
    | 3 | `?json=1` / `?json=true` | JSON (legacy, retained) |
    | 4 | `Accept: application/json` | JSON — **text responses only**, never files |
    | 5 | default | Raw |

    An unrecognised `?format=` returns **400 `unsupported_format`** rather than falling
    back. The `.json` path suffix was removed — `/content/7.json` is now parsed as
    `id = "7.json"` and fails with `400 invalid_content_id`.

    Files never look at `Accept`: the download path sees every variety of `Accept` the
    wild produces, so clicking a file link in a browser must not return a blob of JSON.

    ## Limits

    Limits are dynamic and must not be hard-coded; read them from the WS handshake
    `config` event (`/server` does **not** carry them).

    - `text.limit` — default **4096 bytes** (not characters; a Chinese character is 3 bytes),
      configurable up to 8 MiB. `0` means unlimited.
    - `file.limit` — default **256 MiB** per file.
    - `file.chunk` — default **1 MiB** suggested chunk size.
    - `file.expire` — default **3600 s**; a room's `roomAuth[x].fileExpire` overrides it,
      and `0` means "never expires".
    - `server.history` — default **50** entries retained per room (also the default page size).

    On top of those, there are **absolute per-request body ceilings** that are deliberately
    independent of `text.limit` / `file.limit`: `POST /text` accepts at most **8 MiB** and a
    single upload request at most **16 MiB**. They exist so the HTTP framework never rejects
    a body with its own (non-contract) error shape. Exceeding them is an HTTP-layer
    rejection, not an API error. Send anything larger as a chunked file upload.

    `GET /content` additionally caps a page twice over: at most
    `min(server.history, 100)` entries, and at most **1 MiB** of payload — when a page
    would exceed the byte budget the **oldest** entries are dropped, and never *all* of
    them (an empty array means "no more history", so a page is never emptied).

    ## Real-time push (WebSocket)

    `GET /push` upgrades to a WebSocket. The handshake **does not push history**; it sends
    the room's already-connected devices, then a `config` frame. Fetch history yourself with
    `GET /content`, and use `config.latestId` as the boundary between history and realtime:
    `id <= latestId` is history (record it, do not apply), `id > latestId` is realtime.
    Reading a limit or a capability from `/server` instead of this `config` frame is a known
    trap — `app.config` has exactly one source and it is this frame.

    Every frame is `{"event": "...", "data": ...}`. The server sends
    `connect`, `disconnect`, `config`, `receive`, `update`, `revoke`, `clearAll`, `pong`;
    the client may send `{"event": "ping", "data": <anything>}` and gets it echoed back in a
    `pong`. The server sends protocol-level pings every 5 seconds and drops a client that
    falls behind the broadcast (so it reconnects and re-syncs rather than silently missing a
    `revoke`). Reconnection is the client's job.

    ## Scheduled automations

    An automation posts rendered text into a room at a fixed time with nobody watching, which
    makes it a proxy for write access. Access is therefore scoped per room through
    `roomAuth[x].automation`: `none` (0 tasks), `single` (1 task, identified by a task token),
    `room` (up to 20, room credential), or admin (global password — unlimited, any room).
    The room an automation writes to comes from the credential, never from the request body.
