<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip9 — API 参考</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", system-ui, sans-serif; }
  /* ⚠️ 加载失败时这块会露出来 —— Redoc 是从 CDN 拉的，断网 / 被墙时它到不了，
     而**空白页看起来像「文档没写」**。所以先给一句话，Redoc 起来之后会盖掉它。 */
  #fallback {
    max-width: 720px; margin: 80px auto; padding: 0 24px; color: #667085; line-height: 1.8;
  }
  #fallback h1 { color: #101828; font-size: 22px; }
  #fallback code { background: #f6f8fb; padding: 2px 6px; border-radius: 5px; }
</style>
</head>
<body>

<!-- ⚠️★ 这个页面**没有构建步骤**：它直接读同目录下的 `openapi/clip9.openapi.yaml`。
     所以改规格不用改这里，Pages 一发布就是新的。
     ⚠️ Redoc 走 CDN：站点本身仍是纯静态，但**离线打不开**。
     真要离线，把 `redoc.standalone.js` 下下来放进 `docs/vendor/` 即可。 -->
<div id="fallback">
  <h1>API 参考正在加载…</h1>
  <p>这一页用 Redoc 渲染 <code>openapi/clip9.openapi.yaml</code>。如果这句话一直不消失，
  说明渲染器没能从 CDN 加载（离线或被拦截）。</p>
  <p>直接看规格文件：<a href="openapi/clip9.openapi.yaml">openapi/clip9.openapi.yaml</a>；
  或看 <a href="openapi/">说明与校验方法</a>。</p>
</div>

<script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
<script>
  // ⚠️ 用 `onload` 里的判断而不是「有没有 Redoc」：脚本被拦时 `Redoc` 是 undefined，
  // 直接调它会抛一个看不懂的错，而页面上什么都不显示。
  window.addEventListener('load', () => {
    if (typeof Redoc === 'undefined') {
      return; // 保留上面的兜底说明
    }
    document.getElementById('fallback').remove();
    Redoc.init('openapi/clip9.openapi.yaml', {
      // ⚠️ 展开到二级（tag + operation），而不是全展开：31 个路径全展开要滚很久。
      expandResponses: '200,201',
      hideDownloadButton: false,
      // 主题跟着产品走（与落地页同一支主色）。
      theme: { colors: { primary: { main: '#1e88e5' } } },
    }, document.body);
  });
</script>
</body>
</html>
