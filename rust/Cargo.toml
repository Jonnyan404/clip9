# clip9 —— 自托管的跨设备剪贴板 / 文件中转（服务端）。
#
# 依赖单向：protocol ← core ← store ← server ← { bin, client }
#            actions ← core / server / WASM
[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/actions",
    "crates/store",
    "crates/server",
    "crates/client",
    # 桌面端（Tauri 壳）—— 骨架阶段：窗口 + 本地手写界面（`ui/`）已立起来，
    # 业务逻辑在 `crates/client`。见 `dev-docs/specs/desktop-client.md` §0.1 的切片表。
    # ⚠️ 第一次编译要几分钟（Tauri 的依赖树是几百个 crate）。
    "crates/desktop",
    # Android 外壳的 JNI 桥（`cdylib`）。⚠️ 与 `desktop` 平级、同属**末端** crate ——
    # 它只被 Kotlin 调用，宿主上编出来的 `.dylib` 没人用；留着是为了让它的代码
    # 也进 `cargo clippy` / `cargo test`（见 `crates/android/src/lib.rs` 的模块文档）。
    "crates/android",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["jonnyan404"]

[workspace.dependencies]
# ── 内部 crate ───────────────────────────────────────────────────────
clip9-protocol = { path = "crates/protocol" }
clip9-core = { path = "crates/core" }
clip9-actions = { path = "crates/actions" }
clip9-store = { path = "crates/store" }

# ── 外部 ─────────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── 分享 / 会话令牌的签名 ─────────────────────────────────────────────
# HMAC-SHA256 + base64url。**它是契约的一部分**：Go 侧 `share_token.go` 用的就是这一套，
# token 的字节形状（`base64url(json claims).base64url(hmac)`）与密钥派生规则都得逐字对上，
# 否则切换期间 Go 签的链接在 Rust 这边会全部失效。
# sha2 0.10 / hmac 0.12 都是 RustCrypto 的稳定线，仍在维护（选型纪律见 CONTRIBUTING §1）。
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"

axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "compression-br", "compression-zstd", "cors"] }
hyper = "1"

redb = "4.3"
# 「关于」页里那两个进程的 CPU / 内存，以及数据目录所在盘的剩余空间。
# ⚠️ 自己写要三套（macOS `task_info` / Linux 读 `/proc` / Windows `GetProcessMemoryInfo`）——
# 与 `tauri-plugin-*` 那几条同一个判据：跨平台且细节会变，用现成的是划算的。
# ⚠️ **裁掉默认特性**：只要 `system` 与 `disk`，`component` / `network` / `user` 用不上，
# 而它们各自会拉进平台相关的代码。
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
# ⚠️ 用 postcard 而不是 bincode —— **bincode 已经停止维护**：
# 它的最后一个版本 3.0.0 里 `lib.rs` 全文只有 `compile_error!("https://xkcd.com/2347/")`，
# README 标题就是「Bincode is now unmaintained」（作者因被人肉骚扰而终止开发）。
# 直接写 `bincode = "3"` 会让整个 workspace 编不过，而且报错信息只有一行 xkcd 链接。
# postcard 是 bincode 官方 README 自己推荐的替代品之一，面向嵌入式/受限环境 ——
# 正好对得上 OpenWrt / Android 那两条约束。
postcard = { version = "1.1", features = ["alloc", "use-std"] }

uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
chrono = "0.4"
chrono-tz = "0.10"

thiserror = "2"
anyhow = "1"
# 动作库的提取/替换正则。选它而不是手写扫描器，是因为**模式本身是契约**：
# 同一串 source 要在 Go（RE2）、前端（JS）与这边三处逐字一致 ——
# 手写解析器一上来就把这条对不上了（细节见 crates/actions/src/actions/text.rs 的模块文档）。
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
futures-util = "0.3"

# ── 客户端（`crates/client`）─────────────────────────────────────────
# 剪贴板读写 + 监听。**只给客户端用**（服务端不碰剪贴板）。
#
# ⚠️ 选它的理由（`dev-docs/specs/desktop-client.md` §1）：它对**文件**与**富文本/HTML**
# 是原生支持，而 Go 侧的 `golang.design/x/clipboard` 这两项分别是「仅桌面端」与
# 「自定义 MIME 透传」—— 而剪贴板同步里这两类恰好是高频内容。
# 而且 `clip-sync/src-tauri`（同父仓库的 Tauri 客户端）**已经在生产用它跑通**了
# 「监听 + 去重防抖 + 三类处理 + 异步上传」整条链路 —— 不是「没得选」，是「已经验证过」。
clipboard-rs = "0.3"

# ── 客户端的网络层（`crates/client`）─────────────────────────────────
# ⚠️ 选型纪律见 `dev-docs/CONTRIBUTING.md` §1：**先查它还活着吗，再比参数**。
# 这两个都查过：reqwest 0.13（2026 年在发版）、tokio-tungstenite 0.29。
#
# · `reqwest` —— 上行（`POST /text`、`POST /upload` 的 multipart）与
#   取历史（`GET /content`）。**multipart 内置**是选它的关键：自己拼 multipart
#   边界字符串是另一处「能过但会漂」的地方，而 `dev-docs/api.md` §5 对
#   `Content-Type` 的形状是有要求的。
#   ⚠️ 它的 `default-tls` 在 0.13 里**已经是 rustls**（不再是 openssl）——
#   对 OpenWrt / Android 这两条目标平台很重要（没有系统 OpenSSL 可依赖）。
# · `tokio-tungstenite` —— 下行（`/push` 的 WebSocket）。
#   ⚠️ TLS 用 `rustls-tls-native-roots`（跟系统信任库），不是 webpki-roots：
#   这个客户端连的是**用户自己的**服务端，很可能是自签 / 内网 CA ——
#   自带的那套根证书认不了它。理由与 `crates/store` 那张「否决表」同一个规矩（§1 第 3 条）。
# ⚠️ `stream` 是 2026-10-04 加的，两处都要它：
#   · 下行：存一个条目时**边下边写**（`Runtime::download_entry`）—— 整份读进来是老毛病；
#   · 上行：发大文件时给进度条一个**真信号**（按已发出的字节数）。
#   没有它，`Response::bytes_stream` 与 `Body::wrap_stream` 这两个方法根本不存在。
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "url", "rustls-tls-native-roots"] }
url = "2.5"

# · `rustls` —— ⚠️ **直接依赖一个 TLS 实现，只为一件事**：在启动时装进程级默认 provider。
#
#   为什么要这么麻烦（2026-10-07 实测）：这个依赖图里 rustls 的**两个** provider feature
#   都被拉了起来，而且**两处都调不掉** ——
#     · `aws-lc-rs`：来自 `reqwest` 的 `default-tls`（0.13 起默认就是 rustls，见上面那条）；
#     · `ring`：来自 `tauri-plugin-updater`，它自己写死 `rustls = { features = ["ring"] }`。
#   两个同时在 ⇒ rustls **拒绝自动选择**，第一次做 TLS 时当场 panic（那句报错自己就写着
#   「Call CryptoProvider::install_default() before this point」）。症状只在 `wss://` 上出现，
#   本地 `http://127.0.0.1:9501` 那条明文一行 TLS 都不走 —— 所以「本地房间好好的、
#   只有 Cloudflare 那个死掉」正是它的指纹。装 provider 的地方见 `crates/desktop/src/tls.rs`。
#
#   ⚠️ 这里的 feature 是**照抄当前已经解析出来的那一组**（`std` + `tls12` + `aws-lc-rs`），
#   不是顺手打开 default：default 会额外带一个 `log`，而这次修 bug 不该改构建的依赖集合。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }

[profile.release]
# OpenWrt / Android 上体积是真约束，这里按「小」而不是「最快」调。
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
