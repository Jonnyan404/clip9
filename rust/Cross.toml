# `cross build`（musl 那几档）要用的配置。
#
# ⚠️★ 为什么必须有这个文件（2026-10-09，`v0.1.4` 那次）：
#
# `release.yml` 在**宿主机**上 `export CLIP9_VERSION=<tag 去掉 v>`，二进制靠它报版本号。
# 但那几档是 `cross build` 编的 —— cross 会**起一个容器**在里面编，
# 而它**默认不把宿主机的环境变量带进去**。于是容器里那个 build 看不到 `CLIP9_VERSION`，
# 安静地回落到 `rust/Cargo.toml` 里那个常量（`0.1.0`，两次发布之间不变）。
#
# ⚠️ 后果不是「构建失败」，而是**构建成功但产物是错的**：`clip9-cli -v` 报 0.1.0，
# 而 LuCI 的「检查更新」正是拿它跟 GitHub 的 latest 比 —— 用户升级到新正式版之后
# 会被**永远提示有新版本，而且怎么升级都修不掉**。
#
# `v0.1.4` 那次是工作流里那条 `strings` 校验当场把它拦下来的
# （否则这批 musl 产物会带着错的版本号发出去）。那条校验留着 ——
# 它是最后一道，而这里是**第一道**：让变量真的进得去。
#
# ⚠️ 注意这是 `rust/` 下的配置（job 的 `working-directory: rust`），不是仓库根。
[build.env]
passthrough = ["CLIP9_VERSION"]
