[package]
name = "clip9-actions"
description = "clip9 单一动作库：纯函数、无 IO、无浏览器依赖。原生与 wasm32 编同一份代码。"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# 动作本身要用的三样。都是纯 Rust，都能编到 wasm32。
base64 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }

# ── 文档 → Markdown（`doc`，见 src/doc.rs）────────────────────────────
# doc/docx/odt/rtf/epub/pdf/pptx/xlsx/csv → GitHub-Flavored Markdown，纯 Rust、无 IO。
#
# ⚠️ **可选依赖 + 非默认 feature**（判据同 `[features]` 里那组分组 feature）：它连带的是一整套解析器
# （zip / flate2 / quick-xml / cfb / pdf-inspector / encoding_rs），
# 是 OpenWrt（flash 几十 MB）上仅次于 `image` 的体积来源。
#
# ⚠️ 它**不是**「动作」：不注册进 `registry`，也就没有对应的 `group`。
# 完整理由写在 src/doc.rs 的模块文档里（一句话：注册表的 id 是与 Go 冻结的契约，
# 而这条能力的输入是**字节**、不是 `&str`，塞不进那条 `&str → &str` 的链）。
anydoc = { version = "0.2", optional = true }
# ⚠️★ 直接依赖它（而不是只让 anydoc 内部用）是为了拿 `PdfProcessResult::layout` ——
# 它带着 `pages_with_columns`（**哪些页是多栏排版**）。anydoc 的 PDF 那条路只回
# Markdown 字符串，把这份布局分析**吞掉了**，于是「双栏被交错拼接」这件事
# 到不了用户面前（2026-10-12 实测：一份双栏简历转出来左右栏完全交错，而且**不报错**）。
# ⚠️ 版本跟着 anydoc 走（它本来就依赖 pdf-inspector），不引入新的依赖树。
pdf-inspector = { version = "1", optional = true }

[dev-dependencies]
# ⚠️ **只给测试用**，而且只在 `doc` feature 下真的被用到（见 src/doc.rs 的中文用例）。
#
# 为什么需要它：那份用例要一份**中文 docx**，而 docx 就是一个装着 XML 的 zip。
# 两条路都不好 —— 往仓库里塞一个二进制 fixture（没法 review、没法看出里面写了什么），
# 或者干脆不测中文（而 CJK 正是这个项目最不能出错的地方）。
# 所以第三条路：**在测试里现造一个**（几行 XML 打进 zip），既没有二进制 fixture，
# 又能一眼看出里面写了什么。
#
# ⚠️ 版本跟着 `anydoc` 走（它本来就依赖 `zip`，这里是同一个 4.x）——
# 不引入新的依赖树。
zip = "4"

[features]
# ⚠️ feature 只用来**按部署裁剪体积**，不是「哪些动作能下沉」——Rust 侧两端都能跑。
# OpenWrt（flash 几十 MB）只带 default；桌面 / Docker 全带。
#
# ⚠️ 名字与动作的 `group` **一一对应**（`format` / `text` / `date` / `encode` / `zh` / `inspect`）——
# 注册表判断「这个动作在这一版里有没有」靠 `registry::group_enabled()` 读这些开关。
# 名字对不上就会出现「feature 关了、动作却还在」这种静默不一致，所以这条要守住。
#
# ⚠️ `zh` 从「默认不带」改成了默认带：**这四件事的代价不一样**。
# 已经接进来的 `zh.fullwidth/halfwidth/punctuation/number` 是纯码点运算与查表，
# 加起来几 KB；真正几 MB 的是**词典**（`zh.pinyin*` 的 pinyin-pro、`zh.simplified` 的 opencc）。
# 把整个 `zh` 关掉等于为了词典把四件零成本的事也关掉 —— 而那四件恰恰是中国用户最常用的。
# 等 pinyin / opencc 接进来时，**给词典单开一个 feature**（比如 `zh-dict`），
# 别反过来把整个 `zh` 关掉。
default = ["format", "text", "encode", "date", "inspect", "zh"]
format = []
text = []
encode = []
date = []
inspect = []
# 纯码点运算那四个（词典类动作接进来时再拆 `zh-dict`）
zh = []
# 文档 → Markdown。⚠️ 几 MB 的解析器，默认不带。
# ⚠️ 与上面那组不同，它**没有对应的动作分组**（见 src/doc.rs 的模块文档），
# 所以 `registry::group_enabled()` 里**不该**出现 `doc` —— 那两处一一对应的规矩只
# 管注册表里的分组，这条是注册表之外的能力。
doc = ["dep:anydoc", "dep:pdf-inspector"]
