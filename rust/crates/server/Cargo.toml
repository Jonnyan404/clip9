[package]
name = "clip9-server"
description = "clip9 服务端：axum HTTP + WS。lib 可被任何外壳内嵌，bin 可独立跑。"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "clip9_server"
path = "src/lib.rs"

[[bin]]
name = "clip9-server"
path = "src/bin/clip9-server.rs"

[dependencies]
clip9-protocol = { workspace = true }
clip9-core = { workspace = true }
clip9-store = { workspace = true }
clip9-actions = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
# `/text` 的 multipart 分支要它。⚠️ 别手搓 MIME 解析 —— boundary 的引号、CRLF、
# 嵌套部分都是有坑的，multer 是 axum 自己用的那个。
multer = "3.1"
# `DetermineResponseType` 要按扩展名猜 MIME（Go 用 mime.TypeByExtension）。
mime_guess = "2.0"
# 缩略图：解码 → 缩到 min(w,h)=64 → JPEG q70 → data URI。
# ⚠️ 它给二进制加几百 KB（各格式的解码器），是 OpenWrt 上体积的主要来源之一 ——
# 真要省体积时，第一刀就砍这里。默认 feature 关掉是为了不把 tiff/avif/hdr 那些冷门解码器也带上。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.23"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }

[features]
# ── 文档 → Markdown（`POST /convert/{uuid}`，见 src/convert.rs）────────────
#
# ⚠️ **非默认**：anydoc 连带的是一整套解析器（zip / flate2 / quick-xml / cfb /
# pdf-inspector / encoding_rs），是 OpenWrt（flash 几十 MB）上仅次于 `image` 的体积来源。
# ⚠️ 它与 `clip9-actions` 的 `doc` 是**同一条判据的两半**：桌面 / Docker / Android 带，OpenWrt 不带
#    （发货路径的清单与静态判据见 `tools/workflows-smoke.mjs` 的判据 13）。
# ⚠️ 别拿它跟 `clip9-actions` 里那些**分组 feature** 类比 —— 那些是「哪些动作注册」，
#    关掉是少几个动作；这里的 `doc` 是一条**路由**，关掉是那条路由不存在（404）。
#
# ⚠️ 关着时那条路由**压根不注册**（落到静态资源兜底 = 404），不是「注册了但永远回 500」。
# 前端据此显隐入口，判据从 `GET /server` 的 `convert.enabled` 读。
#
# ⚠️ 它**只是把 `clip9-actions` 的 `doc` feature 转发出来**，不额外开依赖 ——
# 转换实现只有一份，就在 `clip9-actions` 里（理由见那个 crate 的 src/doc.rs）。
doc = ["clip9-actions/doc"]

[dev-dependencies]
# 端到端测试要一个真实的 store 落在临时目录里（分享记录要跨请求存活）。
tempfile = "3"
