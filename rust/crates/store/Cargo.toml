[package]
name = "clip9-store"
description = "clip9 存储层：只有这里知道存储长什么样（redb）。"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clip9-protocol = { workspace = true }
# 定时任务的模型（AutomationTask）在 core。持久化它需要 core —— 依赖方向是
# `protocol ← core ← store`（ARCHITECTURE §4 的依赖单向），所以这里加 core 是顺着走的。
clip9-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
redb = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
clip9-protocol = { workspace = true }
# 集成测试要自己开一次库去篡改 meta（测 schema 版本拒绝）。
redb = { workspace = true }
# ⚠️ postcard 只在 `codec_constraint` 那个**反向**回归测试里用：它证明
# `#[serde(flatten)]` 的类型跑不了非自描述格式，所以 store 的值编码只能用 JSON。
# 运行时**不用**它 —— 别把它挪回 [dependencies]。
postcard = { workspace = true }
